apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: espocrm-mariadb-data
  namespace: espocrm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path        # → /srv/dev-disk-by-uuid-a9a5a108-…/k3s/storage = sda1 (120 Gi SSD)
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: espocrm-app-data
  namespace: espocrm
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: espocrm-mariadb
  namespace: espocrm
  labels:
    app: espocrm
    component: mariadb
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: espocrm
      component: mariadb
  template:
    metadata:
      labels:
        app: espocrm
        component: mariadb
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv         # k3s node label is `omv` (not `omv-main`); both PVCs are local-path so pod must stay here
      containers:
      - name: mariadb
        image: mariadb:11
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --innodb-buffer-pool-size=128M
        - --max-connections=50
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: espocrm-secrets, key: 
                mariadb-root-password}}
        - name: MARIADB_DATABASE
          value: espocrm
        - name: MARIADB_USER
          value: espocrm
        - name: MARIADB_PASSWORD
          valueFrom: {secretKeyRef: {name: espocrm-secrets, key: 
                mariadb-password}}
        ports:
        - {containerPort: 3306, name: mysql}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        livenessProbe:
          exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec: {command: [healthcheck.sh, --connect, --innodb_initialized]}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - {name: data, mountPath: /var/lib/mysql}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: espocrm-mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: espocrm-mariadb
  namespace: espocrm
spec:
  type: ClusterIP
  selector:
    app: espocrm
    component: mariadb
  ports:
  - {port: 3306, targetPort: 3306, name: mysql}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: espocrm
  namespace: espocrm
  labels:
    app: espocrm
    component: web
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: espocrm
      component: web
  template:
    metadata:
      labels:
        app: espocrm
        component: web
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      containers:
      - name: espocrm
        image: espocrm/espocrm:9
        env:
        - {name: ESPOCRM_DATABASE_PLATFORM, value: Mysql}
        - {name: ESPOCRM_DATABASE_HOST, value: espocrm-mariadb}
        - {name: ESPOCRM_DATABASE_PORT, value: '3306'}
        - {name: ESPOCRM_DATABASE_NAME, value: espocrm}
        - {name: ESPOCRM_DATABASE_USER, value: espocrm}
        - name: ESPOCRM_DATABASE_PASSWORD
          valueFrom: {secretKeyRef: {name: espocrm-secrets, key: 
                mariadb-password}}
        - name: ESPOCRM_ADMIN_USERNAME
          valueFrom: {secretKeyRef: {name: espocrm-secrets, key: admin-username}}
        - name: ESPOCRM_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: espocrm-secrets, key: admin-password}}
        - {name: ESPOCRM_SITE_URL, value: https://espocrm.cloudless.gr}
        - {name: ESPOCRM_CONFIG_USE_WEBSOCKET, value: 'false'}
        - {name: ESPOCRM_CONFIG_DEFAULT_TIMEZONE, value: Europe/Athens}
        - {name: ESPOCRM_CONFIG_DEFAULT_LANGUAGE, value: en_US}
        - {name: ESPOCRM_CRON_ENABLED, value: 'true'}
        ports:
        - {containerPort: 80, name: http}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 1000m, memory: 768Mi}
        livenessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - {name: data, mountPath: /var/www/html}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: espocrm-app-data
---
apiVersion: v1
kind: Service
metadata:
  name: espocrm
  namespace: espocrm
spec:
  type: NodePort
  selector:
    app: espocrm
    component: web
  ports:
  - {port: 80, targetPort: 80, nodePort: 30700, name: http}
