# Baseline NetworkPolicies — exported from live cluster 2026-09-20
# Applied imperatively by PR #1861; this file is now the source of truth.
# Ingress allows: same-namespace pods, kube-system, tailscale, monitoring
# namespaces + LAN 192.168.1.0/24 (added for cloudflared connector on omv-ha
# and other trusted LAN infrastructure reaching NodePort services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline
  namespace: alert-manager
spec:
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.42.0.0/16
        - 10.43.0.0/16
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tailscale
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - from:
    - ipBlock:
        cidr: 192.168.1.0/24
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
