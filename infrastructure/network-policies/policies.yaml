# NetworkPolicies — namespace-level traffic isolation
#
# Pattern:
#   1. Default-deny all ingress per namespace
#   2. Allow Traefik (kube-system) → service port
#   3. Allow Prometheus (monitoring) → metrics scrape
#   4. Allow intra-namespace pods (app ↔ DB in the same namespace)
#   5. Allow kube-system DNS/health probes
#
# NOTE: Enforcement requires a CNI with NetworkPolicy support (Calico, Cilium,
# or k3s flannel ≥ v0.25 with the built-in network-policy controller).
# Policies are safe to apply regardless — they are silently no-ops on CNIs
# that don't enforce them and become active once policy enforcement is enabled.
#
# n8n NodePort 30900 and EspoCRM NodePort 30700 are intentionally still
# accessible; Tailscale ACL (tag:ci → tag:pi) is the access gate for ETL.
#
# Apply:
#   kubectl apply -f infrastructure/network-policies/policies.yaml

# ── Shared label selector for Traefik ─────────────────────────────────────────
# Traefik pods in kube-system carry:  app.kubernetes.io/name=traefik
# Prometheus pods in monitoring carry: app.kubernetes.io/name=prometheus

# ═══════════════════════════════════════════════════════════════════════════════
# ntfy namespace
# ═══════════════════════════════════════════════════════════════════════════════
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ntfy
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: ntfy
spec:
  podSelector:
    matchLabels:
      app: ntfy
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: ntfy
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

# ═══════════════════════════════════════════════════════════════════════════════
# meilisearch namespace
# ═══════════════════════════════════════════════════════════════════════════════
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: meilisearch
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: meilisearch
spec:
  podSelector:
    matchLabels:
      app: meilisearch
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 7700
  # Allow cloudless-app in cloudless namespace to query search
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cloudless
    ports:
    - port: 7700
  # Allow n8n workflows to call Meilisearch directly (reindex triggers, ETL)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: n8n
    ports:
    - port: 7700
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: meilisearch
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

