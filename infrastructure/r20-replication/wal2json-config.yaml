# wal2json configuration for AppFlowy/Postiz postgres pods
# Add to postgres config to enable logical replication

postgresql:
  postgresqlConf:
    # Enable logical replication
    wal_level: logical
    max_replication_slots: 10
    max_wal_senders: 10
    # wal2json plugin for JSON-formatted changes
    shared_preload_libraries: "wal2json"