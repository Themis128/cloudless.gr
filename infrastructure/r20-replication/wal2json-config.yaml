apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-logical-decoding
  namespace: appflowy
  labels:
    app.kubernetes.io/component: r20-replication
    app.kubernetes.io/part-of: appflowy
data:
  # Appended via postgres -c flags or included in custom postgresql.conf.
  # wal_level=logical is required for wal2json / pgoutput slots.
  postgresql-r20.conf: |
    wal_level = logical
    max_replication_slots = 4
    max_wal_senders = 4
---
# One-shot Job: ensure publication + slot exist (idempotent SQL).
apiVersion: batch/v1
kind: Job
metadata:
  name: appflowy-r20-create-publication
  namespace: appflowy
  labels:
    app.kubernetes.io/component: r20-replication
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      restartPolicy: OnFailure
      containers:
      - name: psql
        image: pgvector/pgvector:pg16
        command: [/bin/sh, -c]
        args:
        - |
          set -euo pipefail
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql -h postgres.appflowy.svc.cluster.local -U postgres -d postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'cloudless_appflowy') THEN
              CREATE PUBLICATION cloudless_appflowy FOR ALL TABLES;
            END IF;
          END $$;
          SELECT CASE
            WHEN EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'cloudless_appflowy')
            THEN 'slot-exists'
            ELSE (
              SELECT 'slot-created' FROM pg_create_logical_replication_slot('cloudless_appflowy', 'pgoutput')
            )
          END AS slot_status;
          SQL
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: appflowy-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
