# Cloudflare Tunnel Routes Registry
# Single source of truth for all tunnel routes
# This file is used by tunnel:sync to configure cloudflared

routes:
  # Main application - Cloudflare Workers ( migrated from k3s)
  - hostname: cloudless.gr
    service: cloudflare-workers
    port: 443
    healthPath: /api/health
    node: cloudflare
    status: active
    description: Main cloudless.gr application (Cloudflare Workers)

  - hostname: manage.cloudless.gr
    service: cloudflare-workers
    port: 443
    healthPath: /api/health
    node: cloudflare
    status: active
    description: Management interface (same as main app, Cloudflare Workers)

  - hostname: *.cloudless.gr
    service: cloudflare-workers
    port: 443
    healthPath: /api/health
    node: cloudflare
    status: active
    description: Wildcard catch-all for all subdomains (Cloudflare Workers)

  # Infrastructure services
  - hostname: omv.cloudless.gr
    service: omv-webui
    port: 80
    healthPath: /
    node: omv
    status: active
    description: OpenMediaVault admin panel

  - hostname: ftp.cloudless.gr
    service: omv-ftp
    port: 21
    healthPath: null
    node: omv
    status: active
    description: FTP server (TCP, no HTTP health)

  # Documentation
  - hostname: docs.cloudless.gr
    service: docs-server
    port: 30901
    healthPath: /
    node: omv
    status: pending
    description: Documentation portal (NodePort)

  # Search
  - hostname: meili.cloudless.gr
    service: meilisearch
    port: 30902
    healthPath: /health
    node: omv
    status: pending
    description: Meilisearch search engine (NodePort)

  # CRM
  - hostname: espocrm.cloudless.gr
    service: espocrm
    port: 30700
    healthPath: /
    node: omv
    status: pending
    description: EspoCRM customer relationship management

  # Notifications
  - hostname: ntfy.cloudless.gr
    service: ntfy
    port: 30080
    healthPath: /
    node: omv
    status: pending
    description: ntfy notification service

  # Monitoring
  - hostname: grafana.cloudless.gr
    service: grafana
    port: 30850
    healthPath: /api/health
    node: omv
    status: active
    description: Grafana monitoring dashboard

  - hostname: kuma.cloudless.gr
    service: uptime-kuma
    port: 32501
    healthPath: /
    node: omv
    status: pending
    description: Uptime Kuma monitoring

  # Workflow
  - hostname: n8n.cloudless.gr
    service: n8n
    port: 30900
    healthPath: /
    node: omv
    status: active
    description: n8n workflow automation

  # Postiz
  - hostname: postiz.cloudless.gr
    service: postiz
    port: 30500
    healthPath: /
    node: omv
    status: active
    description: Postiz social publishing engine

  # AppFlowy
  - hostname: appflowy.cloudless.gr
    service: appflowy
    port: 30810
    healthPath: /
    node: omv
    status: active
    description: AppFlowy CMS (NodePort)

  # HA Failover - Workers fallback for edge delivery
  - hostname: cloudless-failover.baltzakis-themis.workers.dev
    service: cloudflare-workers
    port: 443
    healthPath: /api/health
    node: cloudflare
    status: active
    description: Workers fallback (static assets + auth endpoints) - activated when Pi primary fails

# Tunnel configuration
tunnel:
  id: e977a490-58c5-4fdb-9155-86832e3e636a
  name: omv-main-tunnel
  account: fb7dc7b69b662480cd5961a4d1913c78

# Node information
nodes:
  omv:
    ip: 192.168.1.128
    tailscaleIp: 100.113.41.119
    role: primary
    storage: ssd
  # Note: omv-ha is a k3s agent only (not control-plane)
  # Traffic to omv-ha.tail8eb71.ts.net is served via Tailscale Funnel on the standby
  omv-ha:
    ip: 192.168.1.130
    tailscaleIp: 100.125.175.60  # From CLUSTER-MAP (tailscale IP for monitoring)
    role: standby-agent
    storage: null