# Cloudflare Tunnel Configuration for omv (192.168.1.128)
# Tunnel ID: e977a490-58c5-4fdb-9155-86832e3e636a
#
# Traffic path (k8s services):
#   Cloudflare Edge → Tunnel → per-service NodePort on omv
#
# NOTE: the "single Traefik ingress on :30850" migration (commit 99d352a4) was
# never completed on the cluster — :30850 is still kube-prom-grafana and every
# app keeps its own NodePort (the tunnels doctor enforces them). The IngressRoute
# manifests under infrastructure/traefik/ are applied by the doctor but inert
# until Traefik actually fronts 30850.
#
# Exceptions:
#   webmail.cloudless.gr → omv-ha:80 (mail server, not k8s)
#   omv.cloudless.gr     → localhost:80 (OMV admin panel)
#   ftp.cloudless.gr     → localhost:21 (FTP, not HTTP)

tunnel: e977a490-58c5-4fdb-9155-86832e3e636a
credentials-file: /etc/cloudflared/e977a490-58c5-4fdb-9155-86832e3e636a.json
no-autoupdate: true
metrics: 0.0.0.0:20241

ingress:
  # ── Non-k8s hosts ─────────────────────────────────────────────────────────────
  - hostname: webmail.cloudless.gr
    service: http://192.168.1.130:80
    originRequest:
      connectTimeout: 15s

  - hostname: omv.cloudless.gr
    service: http://localhost:80
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      httpHostHeader: omv.cloudless.gr

  - hostname: ftp.cloudless.gr
    service: http://localhost:21
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 60s

  # ── Main app ──────────────────────────────────────────────────────────────────
  - hostname: cloudless.gr
    service: http://192.168.1.128:30300
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  - hostname: manage.cloudless.gr
    service: http://192.168.1.128:30300
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  - hostname: pi-origin.cloudless.gr
    service: http://192.168.1.128:30300
    originRequest:
      connectTimeout: 30s
      httpHostHeader: pi-origin.cloudless.gr

  # ── k8s app services → per-service NodePorts ─────────────────────────────────
  - hostname: grafana.cloudless.gr
    service: http://192.168.1.128:30850
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s

  - hostname: n8n.cloudless.gr
    service: http://192.168.1.128:30900
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      httpHostHeader: n8n.cloudless.gr

  - hostname: espocrm.cloudless.gr
    service: http://192.168.1.128:30700
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      httpHostHeader: espocrm.cloudless.gr

  - hostname: ntfy.cloudless.gr
    service: http://192.168.1.128:30080
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      httpHostHeader: ntfy.cloudless.gr

  - hostname: meili.cloudless.gr
    service: http://192.168.1.128:30902
    originRequest:
      connectTimeout: 10s
      tcpKeepAlive: 30s

  - hostname: docs.cloudless.gr
    service: http://192.168.1.128:30901
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s

  - hostname: appflowy.cloudless.gr
    service: http://192.168.1.128:30810
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      httpHostHeader: appflowy.cloudless.gr

  - hostname: kuma.cloudless.gr
    service: http://192.168.1.128:32501
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      httpHostHeader: kuma.cloudless.gr

  - hostname: postiz.cloudless.gr
    service: http://192.168.1.128:30500
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s

  - hostname: logs.cloudless.gr
    service: http://192.168.1.128:30820
    originRequest:
      connectTimeout: 10s
      tcpKeepAlive: 30s

  - service: http_status:404
