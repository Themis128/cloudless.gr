# Cloudflare Tunnel Configuration Updates for omv-main
# 
# Tunnel ID: e977a490-58c5-4fdb-9155-86832e3e636a
# DNS: *.cloudless.gr CNAME → e977a490-58c5-4fdb-9155-86832e3e636a.cfargotunnel.com
#
# These ingress rules are applied to /etc/cloudflared/config.yml on omv-main (192.168.1.128)
# Insert BEFORE the catch-all "http_status:404" rule.
# Last Updated: 2026-07-20 - All endpoints verified working

# grafana.cloudless.gr - Monitoring dashboard
# Runs on omv-main NodePort 30850 (fixed from 18443 which was internal container port)
- hostname: grafana.cloudless.gr
  service: http://192.168.1.128:30850
  originRequest:
    connectTimeout: 15s
    tcpKeepAlive: 30s

# kuma.cloudless.gr - Uptime Kuma monitoring
# Runs on omv-main NodePort 32501 in the uptime-kuma namespace
- hostname: kuma.cloudless.gr
