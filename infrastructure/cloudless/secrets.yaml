# Cloudless application secrets for k3s deployment
# Used when SSM_DISABLED=1 (local secrets instead of AWS SSM)
#
# Apply: kubectl apply -f infrastructure/cloudless/secrets.yaml
# Verify: kubectl -n cloudless get secret cloudless-secrets
#
# IMPORTANT: Set SSM_DISABLED=1 in your deployment environment
# so the app reads from process.env instead of SSM.

apiVersion: v1
kind: Secret
metadata:
  name: cloudless-secrets
  namespace: cloudless
type: Opaque
stringData:
  # Admin alert webhook authentication
  ADMIN_ALERT_SECRET: 
    463953c7f9183ee69c0c4fc18495e72543398d79bdcf9702478dd59d920fc7b6

  # Add other secrets as needed (matching SSM parameter names):
  # STRIPE_SECRET_KEY: "..."
  # STRIPE_WEBHOOK_SECRET: "..."
  # AUTH_SECRET: "..."
  # POSTGRES_PASSWORD: "..."
  # JWT_SECRET: "..."
