# Meilisearch — open-source, fast, hyper-relevant search engine
# Service: NodePort 30902 on omv-main — required by cloudflared (host process).
# Tunnel: meili.cloudless.gr → http://192.168.1.128:30902 (cloudflare-tunnels/ingress-rules.yaml)
#
# Storage: local-path PVC on 120GB SSD (sda1).
# RAM: requests 256Mi / limit 1Gi. Meilisearch v1.48 uses ~200-400Mi at
#      steady state with a small product catalog (<10k docs).
#      Indexing bursts up to ~600Mi during initial product catalog import.
# Image: pinned to getmeili/meilisearch:v1.48.3 — multi-arch image with
#        native arm64 support (avoids QEMU/emulation overhead on Pi 5).
# Auth: Master key in meilisearch-secret. App uses scope-limited keys:
#       MEILI_SEARCH_KEY (search only) and MEILI_ADMIN_KEY (index/settings).
#       Run fix-meili-search-key.yml once to generate and store them.
# Metrics: MEILI_ENABLE_METRICS=true — scraped by Prometheus via
#          infrastructure/monitoring/meilisearch-servicemonitor.yaml.

apiVersion: v1
kind: Namespace
metadata:
  name: meilisearch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-data
  namespace: meilisearch
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: meilisearch-secret
  namespace: meilisearch
type: Opaque
stringData:
  # MEILI_MASTER_KEY for Meilisearch authentication
  # Generated 2026-07-19 via: openssl rand -hex 32
  # Apply secret before deployment: kubectl apply -f infrastructure/meilisearch/k8s.yaml
  MEILI_MASTER_KEY:
    21a2f74ace52d154f75ae8b2008126196b19486eef187e4df7e08fc23004a5a9
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: meilisearch
  labels:
    app: meilisearch
spec:
  replicas: 1
  strategy:
    type: Recreate      # Single writer — no rolling update needed
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.48.3
        ports:
        - containerPort: 7700
        env:
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch-secret
              key: MEILI_MASTER_KEY
        - name: MEILI_ENV
          value: production
        - name: MEILI_HTTP_ADDR
          value: 0.0.0.0:7700
        - name: MEILI_DB_PATH
          value: /meili_data
        - name: MEILI_NO_ANALYTICS
          value: 'true'
        - name: MEILI_ENABLE_METRICS
          value: 'true'
        - name: TZ
          value: Europe/Athens
        volumeMounts:
        - name: data
          mountPath: /meili_data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 7700
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7700
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: meilisearch-data
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: meilisearch
  labels:
    app: meilisearch
spec:
  type: NodePort
  selector:
    app: meilisearch
  ports:
  - name: http
    port: 7700
    targetPort: 7700
    nodePort: 30902
---
# ResourceQuota: 1.5Gi limits total (Meilisearch 1Gi + any helper pods).
# Meilisearch alone requests 256Mi / limits 1Gi; the quota allows room
# for backup/utility pods without hitting the cap.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: meilisearch-quota
  namespace: meilisearch
spec:
  hard:
    pods: '5'
    requests.memory: 768Mi
    limits.memory: 1536Mi
