# Scrape Tailscale client metrics from host exporters on :9102.
# Install exporters: bash infrastructure/monitoring/host-fabric-metrics/install.sh
apiVersion: v1
kind: Service
metadata:
  name: tailscale-metrics
  namespace: monitoring
  labels:
    app: tailscale
    component: metrics
    release: kube-prom
spec:
  clusterIP: None
  ports:
  - name: metrics
    port: 9102
    targetPort: 9102
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tailscale-metrics
  namespace: monitoring
  labels:
    app: tailscale
    component: metrics
subsets:
- addresses:
  - ip: 192.168.1.128
    hostname: omv
  - ip: 192.168.1.130
    hostname: omv-ha
  ports:
  - name: metrics
    port: 9102
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tailscale
  namespace: monitoring
  labels:
    release: kube-prom
    cluster-protection.io/health: 'true'
    app: tailscale
spec:
  selector:
    matchLabels:
      app: tailscale
      component: metrics
  namespaceSelector:
    matchNames: [monitoring]
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true
    relabelings:
    - sourceLabels: [__meta_kubernetes_endpoint_hostname]
      targetLabel: host
    - sourceLabels: [__meta_kubernetes_endpoint_hostname]
      targetLabel: instance
    - targetLabel: job
      replacement: tailscale
---apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tailscale-health
  namespace: monitoring
  labels:
    release: kube-prom
spec:
  groups:
  - name: tailscale.rules
    rules:
    - alert: TailscaleMetricsAbsent
      expr: absent(tailscaled_health_messages) == 1
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: Tailscale metrics not scraped
        description: Install host-fabric-metrics on omv/omv-ha and check ServiceMonitor.
    - alert: TailscaleHealthWarnings
      expr: tailscaled_health_messages{type="warning"} > 0
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: Tailscale health warnings on {{ $labels.instance }}
        description: tailscaled reports warning health messages.
