[Service]
# Expose Prometheus metrics on all interfaces so kube-prometheus can scrape
# via LAN Endpoints (192.168.1.128/130:20241). Default is 127.0.0.1 only.
ExecStart=
# --protocol http2: QUIC connections were dropping with "timeout: no recent
# network activity" several times a day (UDP NAT timeouts on this network),
# causing 15s 502 windows on every reconnect. http2 runs over TCP.
ExecStart=/usr/local/bin/cloudflared --metrics 0.0.0.0:20241 --protocol http2 tunnel run
