apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-drift
  namespace: monitoring
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflared-drift-check
  namespace: monitoring
  labels: {app: cloudflared-drift}
spec:
  # Every 6 hours; staggered :17 to avoid colliding with other watchdogs
  # (omv-disk-watchdog runs at :00/:15/:30/:45).
  schedule: 17 */6 * * *
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: {app: cloudflared-drift}
        spec:
          serviceAccountName: cloudflared-drift
          restartPolicy: Never
          # Run on omv so we can read both omv's and omv-ha's configs.
          # omv-ha's config comes in via SCP from the canonical sidecar
          # pod (kept side-by-side in this manifest as initContainer).
          nodeSelector: {kubernetes.io/hostname: omv}
          hostPID: true
          containers:
          - name: drift
            image: alpine:3.20
            securityContext: {privileged: true}
            env:
            - name: SLACK_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: cluster-alerts-secret, key: SLACK_BOT_TOKEN}}
            - name: SLACK_CHANNEL_ID
              value: C09AF5W3X16                   # proven working per CLAUDE.md
            command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache util-linux curl openssh-client jq >/dev/null 2>&1

              # Read omv's config via nsenter. NOTE: the ingress entries are
              # indented ("  - hostname:"), so anchor on the dash, not col 0.
              # `grep -c` prints the count AND exits 1 on zero matches, so
              # `|| echo` appends a second line and breaks the comparison —
              # head -n1 keeps the first value, defaults handle empties.
              OMV_COUNT=$(nsenter --target 1 --mount --uts --ipc --net --pid -- \
                grep -cE '[[:space:]]+- hostname:' /etc/cloudflared/config.yml 2>/dev/null | head -n1)
              OMV_COUNT=${OMV_COUNT:-0}

              # Read omv-ha's config over SSH. Path: LAN, not tailnet —
              # omv-ha's tailnet session is unreliable (its IP re-mapped on
              # re-auth, breaking the old root@100.111.222.92 hop). omv's root
              # has an ed25519 key authorized for tbaltzakis@omv-ha; the file
              # is root-owned there so read via passwordless sudo.
              HA_COUNT=$(nsenter --target 1 --mount --uts --ipc --net --pid -- \
                ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
                    -o ConnectTimeout=10 tbaltzakis@192.168.1.130 \
                    "sudo -n grep -cE '[[:space:]]+- hostname:' /etc/cloudflared/config.yml 2>/dev/null || echo 0" \
                    2>/dev/null | head -n1)
              HA_COUNT=${HA_COUNT:-unreachable}

              echo "omv=$OMV_COUNT omv-ha=$HA_COUNT"

              if [ "$HA_COUNT" = "unreachable" ]; then
                MSG=":warning: cloudflared-drift-check could not reach omv-ha over SSH (LAN 192.168.1.130). omv has $OMV_COUNT ingress hostnames; omv-ha unknown. Check omv-ha LAN + SSH config."
              elif [ "$OMV_COUNT" != "$HA_COUNT" ]; then
                MSG=":rotating_light: cloudflared CONFIG DRIFT detected. omv has $OMV_COUNT ingress hostnames, omv-ha has $HA_COUNT. Public hostnames missing from one node will 404 ~50% of the time. Remediate: skills/cloudflare-tunnel-ops/SKILL.md \"Sync omv-ha to match omv\"."
              else
                echo "OK: omv=$OMV_COUNT omv-ha=$HA_COUNT — in sync; no alert."
                exit 0
              fi

              curl -fsS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
                -H "Content-Type: application/json; charset=utf-8" \
                --data "$(jq -nc --arg ch "$SLACK_CHANNEL_ID" --arg msg "$MSG" '{channel: $ch, text: $msg}')" \
                | jq '{ok, error}'
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 200m, memory: 64Mi}
