apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: watchdog-reader
  namespace: monitoring
rules:
- apiGroups: [batch]
  resources: [cronjobs, jobs]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: watchdog-reader-for-cloudless-app
  namespace: monitoring
subjects:
- kind: ServiceAccount
  name: default
  namespace: cloudless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watchdog-reader
