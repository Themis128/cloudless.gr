apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: monitoring
data:
  mosquitto.conf: |
    listener 1883
    # AUTH-ONLY (Phase 3 cutover complete 2026-06-21).
    # alert-api v3.4 publishes with MQTT_USERNAME/PASSWORD env from the
    # alert-api-mqtt-creds Secret. Display ESP32 was offline at cutover
    # — when it comes back online it MUST be OTA-reflashed with creds
    # per skills/esphome-ota-flash/SKILL.md before it can subscribe.
    # To roll back (forgotten anonymous client surfaces):
    #   kubectl -n monitoring edit cm mosquitto-config → allow_anonymous true
    #   kubectl -n monitoring rollout restart deploy/mosquitto
    allow_anonymous false
    password_file /mosquitto/secret/passwords
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: monitoring
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: omv
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          name: mqtt
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
        - name: data
          mountPath: /mosquitto/data
        - name: secret
          mountPath: /mosquitto/secret
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
            ephemeral-storage: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 128Mi
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
      - name: data
        emptyDir: {}
      - name: secret
          # defaultMode 0644 (420 decimal) — mosquitto runs as uid 1883
          # but reads /mosquitto/secret/passwords; 0600 made it root-only
          # and the broker crashlooped with "Error opening password file"
          # (2026-06-21).
        secret:
          secretName: mosquitto-passwords
          defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: monitoring
  labels:
    app: mosquitto
spec:
  selector:
    app: mosquitto
  type: NodePort
  ports:
  - port: 1883
    targetPort: 1883
    nodePort: 31883
    name: mqtt
