apiVersion: v1
kind: Service
metadata:
  name: ntfy-nodeport
  namespace: ntfy
  labels:
    app: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy           # adjust if your ntfy Pod label differs
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080       # → http://192.168.1.128:30080/<topic>
