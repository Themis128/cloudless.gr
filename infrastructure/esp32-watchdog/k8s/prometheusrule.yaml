# PrometheusRule — fires alerts when the ESP32 watchdog detects outages
# These are truly independent of k3s: the ESP32 reports its own observations
# from outside the cluster, so these fire even if k3s itself is down.
#
# Metric notes:
#   esphome_binary_sensor_value — exported by ESPHome Prometheus component
#   Label "name" matches the ESPHome sensor `name:` field, lowercased with
#   spaces → underscores. Examples:
#     "omv_(192.168.1.128)_reachable"
#     "omv-ha_(192.168.1.130)_reachable"
#     "cloudless.gr_(aws)_reachable"
# ---------------------------------------------------------------------------
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name:      esp32-watchdog-alerts
  namespace: monitoring
  labels:
    release: kube-prom          # must match kube-prometheus-stack ruleSelector
spec:
  groups:
    - name: esp32-watchdog
      interval: 30s
      rules:

        # ── ESP32 itself is unreachable (scrape failing) ──────────────────────
        - alert: ESP32WatchdogDown
          expr:  up{job="esp32-watchdog-metrics"} == 0
          for:   2m
          labels:
            severity: warning
          annotations:
            summary:     "ESP32 watchdog is unreachable"
            description: "Prometheus cannot scrape the ESP32 at 192.168.1.201:9101. Check Wi-Fi / power."

        # ── omv unreachable as seen from ESP32 ────────────────────────────────
        - alert: OmvUnreachableFromESP32
          expr: >
            esphome_binary_sensor_value{
              name="omv_(192.168.1.128)_reachable",
              job="esp32-watchdog-metrics"
            } == 0
          for:   1m
          labels:
            severity: critical
            node:     omv
          annotations:
            summary:     "omv (192.168.1.128) unreachable from ESP32 watchdog"
            description: "The ESP32 external probe cannot ping omv. Likely a hard crash or power loss — independent of k3s."

        # ── omv-ha unreachable as seen from ESP32 ─────────────────────────────
        - alert: OmvHaUnreachableFromESP32
          expr: >
            esphome_binary_sensor_value{
              name="omv-ha_(192.168.1.130)_reachable",
              job="esp32-watchdog-metrics"
            } == 0
          for:   1m
          labels:
            severity: critical
            node:     omv-ha
          annotations:
            summary:     "omv-ha (192.168.1.130) unreachable from ESP32 watchdog"
            description: "The ESP32 external probe cannot ping omv-ha."

        # ── Both Pi nodes down — cluster-level emergency ──────────────────────
        - alert: BothNodesUnreachableFromESP32
          expr: >
            (
              esphome_binary_sensor_value{name="omv_(192.168.1.128)_reachable",job="esp32-watchdog-metrics"} == 0
            )
            and
            (
              esphome_binary_sensor_value{name="omv-ha_(192.168.1.130)_reachable",job="esp32-watchdog-metrics"} == 0
            )
          for:   1m
          labels:
            severity: critical
          annotations:
            summary:     "BOTH cluster nodes unreachable from ESP32"
            description: "Neither omv nor omv-ha responds to ping. Full cluster outage. Check power and network."

        # ── AWS app unreachable as seen from ESP32 ────────────────────────────
        - alert: AWSAppUnreachableFromESP32
          expr: >
            esphome_binary_sensor_value{
              name="cloudless.gr_(aws)_reachable",
              job="esp32-watchdog-metrics"
            } == 0
          for:   2m
          labels:
            severity: critical
          annotations:
            summary:     "cloudless.gr AWS app unreachable from ESP32 watchdog"
            description: "The ESP32 HTTP probe to cloudless.gr returned non-2xx or timed out for 2+ minutes."

        # ── ESP32 Wi-Fi signal degraded (early warning) ───────────────────────
        - alert: ESP32WifiWeak
          expr: >
            esphome_sensor_value{
              name="wi-fi_signal",
              job="esp32-watchdog-metrics"
            } < -80
          for:   5m
          labels:
            severity: warning
          annotations:
            summary:     "ESP32 watchdog Wi-Fi signal weak"
            description: "RSSI below -80 dBm. The watchdog may lose connectivity soon. Move it closer to the AP."
