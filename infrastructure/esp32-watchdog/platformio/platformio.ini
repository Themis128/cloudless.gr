; PlatformIO project — Cloudless Cluster Watchdog
; Board : ESP32-S3-DevKitC-1 v1.1 (VID_303A / PID_4001, COM3)
; Framework: Arduino (via espressif32 @ 55.3.x, same as ESPHome generates)
;
; This project exists so the PlatformIO VS Code extension can:
;   • resolve all #include paths and suppress IntelliSense errors
;   • compile & flash directly without the ESPHome CLI
;   • run static analysis (pio check)
;
; The canonical build path is still: esphome compile cloudless-watchdog.yaml
; Use PlatformIO's "Build" button only for bare Arduino sketches in src/.
; Use "Upload" to flash a compiled .bin over USB (COM5).

[platformio]
default_envs = esp32s3
; PlatformIO core dir on Windows — packages are installed here by the VS Code
; extension.  The WSL-accessible path is /mnt/c/Users/baltz/.platformio.
; PlatformIO running on the Windows side resolves this as C:\Users\baltz\.platformio.
; `core_dir` replaces the deprecated `home_dir` option (removed in PlatformIO 7+).
core_dir = C:\Users\baltz\.platformio

; ── Build environment ─────────────────────────────────────────────────────────

[env:esp32s3]
; Point directly at the locally-installed platform directory — avoids a
; registry lookup for a version that isn't published to the public registry.
; WSL2 path: /mnt/c/Users/baltz/.platformio/platforms/espressif32
platform  = file://C:\Users\baltz\.platformio\platforms\espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Serial port — ESP32-S3-DevKitC-1 v1.1 currently enumerates on COM3.
; If it changes (different USB port / Windows reassignment) check:
;   powershell: Get-WmiObject Win32_PnPEntity | Where Caption -match COM
; Override with: pio run -e esp32s3 --target upload --upload-port /dev/ttyUSB0
upload_port    = COM3
monitor_port   = COM3
monitor_speed  = 115200
monitor_filters =
    esp32_exception_decoder
    default

; Build flags mirror the ESPHome-generated sdkconfig_options in cloudless-watchdog.yaml.
; -DCORE_DEBUG_LEVEL=3 matches ESPHome logger level: INFO (suppress VERBOSE/DEBUG).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10

; Disable reproducible builds (same reason as in cloudless-watchdog.yaml):
; the -fdebug-prefix-map flag crashes cc1plus.exe on paths with spaces.
board_build.cmake_extra_args =
    -DCONFIG_APP_REPRODUCIBLE_BUILD=n

; Extra libraries used by the Arduino sketch in src/ (NOT needed for ESPHome builds).
; Uncomment as needed:
; lib_deps =
;     esphome/ESPHome@^2026.5.0

; ── OTA upload environment (WiFi OTA via espota.py) ──────────────────────────

[env:esp32s3-ota]
extends           = env:esp32s3
upload_protocol   = espota
upload_port       = 192.168.1.201
upload_flags      =
    --port=3232
    --auth=${sysenv.ESPHOME_OTA_PASSWORD}
