# Headlamp — modern Kubernetes web UI (CNCF sandbox).
#
# Serves as the "Cluster Manager" behind manage.cloudless.gr (previously
# a dead alias). Access model:
#
#   Internet
#     │  https://manage.cloudless.gr
#     ▼
#   Cloudflare Tunnel      ← authenticated by CF Access (Admin allowlist,
#     │  http://…:30460      3-email allowlist including
#     ▼                     tbaltzakis@cloudless.gr — verified 2026-08-08)
#   Headlamp pod (this)
#     │  kubeconfig w/ tokenFile (auto-rotated SA token)
#     ▼
#   k8s apiserver via ServiceAccount `headlamp-admin`
#     (ClusterRoleBinding → cluster-admin — solo operator, no multi-tenant)
#
# Runs with `-kubeconfig=/etc/headlamp/kubeconfig/config`, a pod-mounted
# kubeconfig that authenticates via the auto-mounted SA token file
# (/var/run/secrets/kubernetes.io/serviceaccount/token). tokenFile is
# re-read by client-go on every request, so no login prompt and no restart
# needed when kubelet rotates the token (~1h default). Safe because the
# front-door is CF Access (3-email allowlist); inside the tunnel the
# operator gets full cluster-admin without pasting tokens.
#
# Resource footprint on omv: ~100Mi RAM, negligible CPU.
---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: headlamp-admin
  namespace: headlamp
---
# Kubeconfig that uses the pod's auto-mounted SA token file. Passed to
# Headlamp via -kubeconfig so it authenticates as headlamp-admin without
# ever prompting for a token. tokenFile is re-read as k8s rotates the SA
# token (default ~1h validity, refreshed by kubelet).
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-kubeconfig
  namespace: headlamp
data:
  config: |
    apiVersion: v1
    kind: Config
    # Context named "main" to match Headlamp's default cluster name
    # (the -in-cluster flag registers the cluster as "main"). Without
    # this, Headlamp's backend logs periodic "failed to get context"
    # / "key not found" errors looking for a cluster named "main".
    clusters:
    - name: main
      cluster:
        server: https://kubernetes.default.svc.cluster.local
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
    - name: headlamp-admin
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
    - name: main
      context:
        cluster: main
        user: headlamp-admin
        namespace: default
    current-context: main
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels: {app: headlamp}
spec:
  replicas: 1
  selector: {matchLabels: {app: headlamp}}
  strategy: {type: Recreate}   # 1 replica; simpler than RollingUpdate
  template:
    metadata: {labels: {app: headlamp}}
    spec:
      serviceAccountName: headlamp-admin
      nodeSelector: {kubernetes.io/hostname: omv}
      containers:
      - name: headlamp
        image: ghcr.io/headlamp-k8s/headlamp:v0.36.0
        # Use the pod-mounted kubeconfig (ConfigMap headlamp-kubeconfig),
        # which authenticates via the auto-rotated SA token file
        # (/var/run/secrets/kubernetes.io/serviceaccount/token).
        # tokenFile is re-read by client-go on every API request, so no
        # restart is needed when kubelet rotates the token (~1h default).
        args: ["-kubeconfig=/etc/headlamp/kubeconfig/config"]
        ports:
        - {containerPort: 4466, name: http}
        env:
        - {name: TZ, value: Europe/Athens}
        resources:
          requests: {cpu: 30m, memory: 96Mi}
          limits:   {cpu: 500m, memory: 384Mi}
        readinessProbe:
          httpGet: {path: /, port: 4466}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 4466}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        # Headlamp needs a writable /tmp and $HOME/.config (plugins dir).
        # Keep readOnlyRootFilesystem=true; give it emptyDirs at just those
        # paths — smaller attack surface than a fully writable rootfs.
        - {name: tmp, mountPath: /tmp}
        - {name: home-config, mountPath: /home/headlamp/.config}
        - {name: headlamp-kubeconfig, mountPath: /etc/headlamp/kubeconfig, readOnly: true}
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
      volumes:
      - {name: tmp, emptyDir: {}}
      - {name: home-config, emptyDir: {}}
      # 0444: container runs as non-root (UID 100); the kubeconfig itself
      # contains no secrets — it merely points at the auto-mounted SA token
      # file path. The token file's own perms (0440, root:root) are fine
      # because it's mounted by kubelet, not via this ConfigMap.
      - name: headlamp-kubeconfig
        configMap:
          name: headlamp-kubeconfig
          defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
spec:
  type: NodePort
  selector: {app: headlamp}
  ports:
  - {name: http, port: 4466, targetPort: 4466, nodePort: 30460}