---
# n8n — workflow automation
# NodePort 30900 on omv-main (Pi 5, 8 GB).
# Tunnel: n8n.cloudless.gr → http://192.168.1.128:30900
#
# Storage: local-path PVC on sda1 (the dedicated k3s SSD).
# RAM: requests 200Mi / limit 768Mi. n8n 1.x peaks ~350-450Mi at boot
#      during migrations (Task Broker), then settles ~200Mi steady-state.
# Auth: n8n basic-auth is disabled; rely on Cloudflare Tunnel + admin
#       session for access control. Set N8N_BASIC_AUTH_ACTIVE=false.

apiVersion: v1
kind: Namespace
metadata:
  name: n8n

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate      # SQLite — single writer only
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: n8n.cloudless.gr
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: WEBHOOK_URL
              value: https://n8n.cloudless.gr/
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "false"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "168"       # 7 days
            - name: GENERIC_TIMEZONE
              value: Europe/Athens
            - name: TZ
              value: Europe/Athens
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data

---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      nodePort: 30900
