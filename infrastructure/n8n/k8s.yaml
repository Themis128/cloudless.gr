# n8n — workflow automation
# NodePort 30900 on omv-main (Pi 5, 8 GB).
# Tunnel: n8n.cloudless.gr → http://192.168.1.128:30900
#
# Storage: local-path PVC on sda1 (the dedicated k3s SSD).
# RAM: requests 256Mi / limit 1Gi. n8n 2.x peaks ~500-700Mi at boot
#      during DB migrations (especially on first run after upgrade).
#      N8N_RUNNERS_ENABLED=false disables the Task Runner sub-process
#      to keep steady-state RSS under 400Mi.
# Auth: n8n basic-auth is disabled; rely on Cloudflare Tunnel + admin
#       session for access control. Set N8N_BASIC_AUTH_ACTIVE=false.
# Image: pinned to n8nio/n8n:2.28.2-arm64 (native arm64 build — avoids
#        QEMU/emulation overhead on the Pi 5). Update by changing this tag.

apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate      # SQLite — single writer only
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      securityContext:
        fsGroup: 1000
      containers:
      - name: n8n
        image: n8nio/n8n:2.28.2-arm64
        ports:
        - containerPort: 5678
        env:
        - name: N8N_HOST
          value: n8n.cloudless.gr
        - name: N8N_PORT
          value: '5678'
        - name: N8N_PROTOCOL
          value: https
        - name: WEBHOOK_URL
          value: https://n8n.cloudless.gr/
        - name: N8N_BASIC_AUTH_ACTIVE
          value: 'false'
        - name: N8N_RUNNERS_ENABLED
          value: 'false'
        - name: EXECUTIONS_DATA_PRUNE
          value: 'true'
        - name: EXECUTIONS_DATA_MAX_AGE
          value: '168'               # 7 days
        - name: GENERIC_TIMEZONE
          value: Europe/Athens
        - name: TZ
          value: Europe/Athens
        # Allow Settings → Community Nodes (e.g. n8n-nodes-postiz).
        - name: N8N_COMMUNITY_PACKAGES_ENABLED
          value: 'true'
        # In-cluster Postiz Public API (RSS / cron workflows). Override in UI Variables if needed.
        - name: POSTIZ_API_BASE
          value: http://postiz.postiz.svc.cluster.local:5000
        - name: POSTIZ_RSS_FEED_URL
          value: https://cloudless.gr/en/blog/rss.xml
        - name: POSTIZ_CHANNEL_IDENTIFIERS
          value: linkedin,linkedin-page,x,bluesky
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
  - name: http
    port: 5678
    targetPort: 5678
    nodePort: 30900
---
# ResourceQuota: raised from 1Gi to 1536Mi 2026-06-27.
# n8n Deployment uses limits.memory=1Gi; the daily backup CronJob
# (cronjob-n8n.yaml) adds 256Mi, totalling 1.25Gi — this exceeded the
# original 1Gi cap and caused FailedCreate events every night.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: n8n-quota
  namespace: n8n
spec:
  hard:
    pods: '5'
    requests.memory: 768Mi
    limits.memory: 1536Mi
