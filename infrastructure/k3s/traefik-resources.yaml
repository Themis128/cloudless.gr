# k3s HelmChartConfig — overlays resource limits on the built-in traefik
# HelmChart. Applied live 2026-08-08 (previous state: no limits at all,
# actual usage 26Mi). k3s watches this file if placed under
# /var/lib/rancher/k3s/server/manifests/, but here we keep it in the repo
# for GitOps and apply manually with `kubectl apply -f`.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Claim NodePort 30850 for the HTTP entry point so the Cloudflare Tunnel
    # can route all app hostnames to a single Traefik endpoint instead of one
    # NodePort per service.  Grafana's kube-prom-stack service.type moves to
    # ClusterIP (see kube-prom-stack-values.yaml) so this port is free.
    ports:
      web:
        nodePort: 30850
      # Keep websecure available for future in-cluster TLS if needed.
      websecure:
        expose:
          default: false
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 128Mi
