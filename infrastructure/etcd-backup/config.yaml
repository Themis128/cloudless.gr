# Source-of-truth for /etc/rancher/k3s/config.yaml on omv (Pi 5 control plane).
#
# History:
#   2026-06-25 — restored hourly etcd snapshots after stripped config incident.
#   2026-07-03 — added etcd-snapshot-schedule-cron + retention.
#   2026-09-15 — off-site etcd S3 target moved from AWS to Cloudflare R2 (Free).
#     Do NOT use AWS bucket cloudless-etcd-snapshots or SSM /k3s/etcd-s3/*.
#
# Off-site credentials (NOT in this file):
#   Set on the host via environment / k3s secret files before restart:
#     ETCD_S3_ACCESS_KEY / ETCD_S3_SECRET_KEY
#   or k3s flags etcd-s3-access-key / etcd-s3-secret-key in a root-only overlay.
#   Use the same Cloudflare R2 API token as other Free-tier backups (CF_R2_*).
#
# Do NOT add `data-dir` here. /var/lib/rancher/k3s/server is a symlink
# to /srv/dev-disk-by-uuid-a9a5a108-*/k3s/server.

tls-san:
- 192.168.1.128
- 192.168.1.130
- 100.74.191.58
- 100.74.191.58

secrets-encryption: true

# k3s etcd snapshot schedule — CLAUDE.md "k3s Tuning" requires hourly.
# Snapshots land in /var/lib/rancher/k3s/server/db/snapshots/
# (symlinked -> /srv/.../k3s/server/db/snapshots/). The
# k3s-snapshot-mirror.timer (every 30 min) rsyncs them to
# /srv/.../Backups/k3s-db/snapshots/ for the omv-backup-verify watchdog.
etcd-snapshot-schedule-cron: 0 */1 * * *
etcd-snapshot-retention: 24

# Off-site etcd snapshots → Cloudflare R2 (S3-compatible, Free tier).
# Folder etcd/ under existing datalake-bucket (no Workers Paid).
etcd-s3: true
etcd-s3-endpoint: fb7dc7b69b662480cd5961a4d1913c78.r2.cloudflarestorage.com
etcd-s3-bucket: datalake-bucket
etcd-s3-region: auto
etcd-s3-folder: etcd
etcd-s3-skip-ssl-verify: false

etcd-arg:
- --auto-compaction-mode=periodic
- --auto-compaction-retention=30m
- --snapshot-count=5000
- --quota-backend-bytes=1073741824

kube-apiserver-arg:
- --max-requests-inflight=100
- --max-mutating-requests-inflight=50
- --encryption-provider-config=/srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/server/cred/encryption-config.json
