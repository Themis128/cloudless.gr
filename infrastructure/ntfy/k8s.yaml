# ntfy - Notification service for Cloudless
# Runs on omv-main with NodePort 30080 for Cloudflare Tunnel access
# Tunnel config: https://ntfy.cloudless.gr → http://192.168.1.128:30080

---
apiVersion: v1
kind: Namespace
metadata:
  name: ntfy

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: ntfy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv  # Must run on omv-main for tunnel
      containers:
      - name: ntfy
        image: binwiederhier/ntfy:v2.13.0
        args:
        - serve
        - --listen-http
        - :80
        - --attachment-cache-dir=/var/cache/ntfy
        - --base-url=https://ntfy.cloudless.gr
        ports:
        - containerPort: 80
        env:
        - name: NTFY_FILES_BASE_URL
          value: "https://ntfy.cloudless.gr/files"
        volumeMounts:
        - name: data
          mountPath: /var/cache/ntfy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ntfy-data

---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: ntfy
spec:
  type: NodePort
  selector:
    app: ntfy
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: ntfy
data:
  ntfy.yml: |
    # ntfy configuration
    base_url: "https://ntfy.cloudless.gr"
    
    # Listen on port 80
    listen_http: ":80"
    
    # Cache directory
    attachment_cache_dir: "/var/cache/ntfy"
    
    # Enable attachments
    attachment_cache_max_size: "5GiB"
    attachment_total_max_size: "10GiB"
    
    # Keep messages for 14 days
    message_cache_duration: "168h"
    
    # Disable auth for public access (restricted via Cloudflare Access)
    auth_file: "/app/data/accounts.db"