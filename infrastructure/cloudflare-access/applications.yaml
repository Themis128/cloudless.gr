# Cloudflare Access Applications Configuration
# Replaces Tailscale for secure remote access
# Use with Terraform or manual creation in Cloudflare Zero Trust Dashboard

# ==============================================================================
# Application Configurations
# ==============================================================================

# --- Grafana Monitoring Dashboard ---
grafana:
  name: Grafana Monitoring
  domain: grafana.cloudless.gr
  type: self_hosted
  session_duration: 24h
  auto_redirect_https: true
  http_only: false
  logo_url: https://grafana.com/static/assets/logo.png
  policies:
  - name: Admin Access Only
    decision: allow
    include:
    - email:
      - themisbaltzakis@gmail.com
    - email_domain:
      - baltzakis-themis.workers.dev
    exclude: []
    require: []

