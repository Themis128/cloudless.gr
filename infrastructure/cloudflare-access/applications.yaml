# ==============================================================================
# Terraform Configuration Template
# ==============================================================================

terraform:
  cloudflare_zone_id: ${CLOUDFLARE_ZONE_ID}    # Get from Cloudflare dashboard

  # Access Groups
  access_groups:
  - name: admins
    description: Admin users with full access
    include:
    - email:
      - themisbaltzakis@gmail.com

  - name: authenticated
    description: All authenticated users
    include:
    - email_domain:
      - baltzakis-themis.workers.dev

# ==============================================================================
# Setup Instructions
# ==============================================================================

# Manual Setup:
# 1. Go to https://dash.teams.cloudflare.com
# 2. Navigate to Access → Applications → Add an application
# 3. For each service above:
#    - Select "Self-hosted" application type
#    - Enter the domain (e.g., grafana.cloudless.gr)
#    - Choose Identity Provider (GitHub recommended)
#    - Configure session duration
#    - Add policy with appropriate access group

# GitHub OIDC Setup:
# 1. In Cloudflare Zero Trust → Settings → Identity Providers
# 2. Add GitHub as identity provider
# 3. Configure OAuth app in GitHub with callback URL:
#    - https://cloudflareaccess.com/cdn-cgi/access/callback

# Test Access:
# curl -I https://grafana.cloudless.gr  # Should return 403 before login
