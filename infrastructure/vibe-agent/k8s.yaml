# VIBE Agent — always-on k3s pod at agent.cloudless.gr
# Graph server (port 2024) + project-picker UI (port 3001)
# vLLM is NOT bundled here — it runs locally on the dev machine.
# The k3s pod uses a small OpenAI-compatible proxy model (or points
# back to the local vLLM via Tailscale) configured via SECRET vibe-env.

apiVersion: v1
kind: Namespace
metadata:
  name: vibe
--- null
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vibe-projects-pvc
  namespace: vibe
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-agent
  namespace: vibe
  labels:
    app: vibe-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-agent
  template:
    metadata:
      labels:
        app: vibe-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      containers:
      - name: vibe
        image: ghcr.io/themis128/vibe-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 2024
          name: langgraph
        - containerPort: 3001
          name: ui
        envFrom:
        - secretRef:
            name: vibe-env
        env:
        - name: LANGSMITH_TRACING
          value: 'true'
        - name: VIBE_PROJECT_PATH
          value: /home/tbaltzakis/cloudless.gr
        - name: VIBE_PROJECT_NAME
          value: cloudless.gr
        - name: LANGGRAPH_PORT
          value: '2024'
        volumeMounts:
        - name: projects
          mountPath: /home/tbaltzakis
        resources:
          requests:
            memory: 768Mi
            cpu: 250m
          limits:
            memory: 1536Mi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /ok
            port: 2024
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ok
            port: 2024
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: projects
        hostPath:
          path: /home/tbaltzakis
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: vibe-agent
  namespace: vibe
spec:
  type: NodePort
  selector:
    app: vibe-agent
  ports:
  - name: langgraph
    port: 2024
    targetPort: 2024
    nodePort: 30924
  - name: ui
    port: 3001
    targetPort: 3001
    nodePort: 30301
--- null
...
