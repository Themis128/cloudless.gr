apiVersion: v1
data:
  config.yaml: |
    model_list:
      # Postiz Copilot — routes to local Ollama (qwen2.5-coder via Tailscale)
      - model_name: gpt-4.1
        litellm_params:
          model: ollama/qwen2.5-coder
          api_base: http://100.121.191.7:11434
          max_tokens: 8192

      # Postiz built-in image gen — no image model on Ollama currently
      - model_name: chatgpt-image-latest
        litellm_params:
          model: ollama/qwen2.5-coder
          api_base: http://100.121.191.7:11434

    litellm_settings:
      drop_params: true
      modify_params: true
      request_timeout: 120
      set_verbose: false

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_spend_logs: true
      disable_master_key_return: true
kind: ConfigMap
metadata:
  name: postiz-litellm-config
  namespace: postiz
