apiVersion: v2
name: postiz
description: |
  Postiz social media scheduling app, packaged as a Helm chart for the
  cloudless.gr k3s cluster on omv-main.

  Faithful conversion of infrastructure/postiz/k8s/postiz.yaml — pinned to
  Postiz v2.11.2 (the last release before Temporal became mandatory in
  v2.12+, which is too heavy for the Pi cluster — see the migration note in
  the manifest comments). Exposed as a NodePort behind the existing
  Cloudflare Tunnel, no in-cluster ingress controller required.

  Replaces the broken upstream gitroomhq/postiz-helmchart, which is stuck at
  appVersion 1.3.0 and has no Temporal templates.
type: application
version: 0.1.0
appVersion: "2.11.2"
maintainers:
  - name: cloudless.gr
    email: baltzakis.themis@gmail.com
sources:
  - https://github.com/gitroomhq/postiz-app
  - https://docs.postiz.com
keywords:
  - postiz
  - social-media
  - scheduling
home: https://postiz.cloudless.gr
