apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-redis
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
    app: postiz-redis
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postiz-redis
  template:
    metadata:
      labels:
        app: postiz-redis
        {{- include "postiz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: "{{ .Values.image.redis.repository }}:{{ .Values.image.redis.tag }}"
          imagePullPolicy: {{ .Values.image.redis.pullPolicy }}
          args: ["--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postiz-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-redis
  labels:
    {{- include "postiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    app: postiz-redis
  ports:
    - port: 6379
      targetPort: 6379
