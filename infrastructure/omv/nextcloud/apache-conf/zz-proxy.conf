# Managed: infrastructure/omv (Nextcloud behind Cloudflare tunnel, TLS terminated at Cloudflare)
# HTTPS comes from occ config (overwriteprotocol=https + overwrite.cli.url), not from trusting a
# client-supplied X-Forwarded-Proto header here - keep no SetEnvIf on that header.
ServerTokens Prod
ServerSignature Off
# Optional belt-and-braces: .htaccess R=301 for caldav/carddav builds an http:// URL behind the
# tunnel; answer it first with an explicit https redirect (harmless once overwriteprotocol is set)
RedirectMatch 301 "^/\.well-known/(caldav|carddav)" "https://cloud.cloudless.gr/remote.php/dav/"
