# Managed: infrastructure/omv (Nextcloud behind Cloudflare tunnel, TLS terminated at Cloudflare)
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
ServerTokens Prod
ServerSignature Off
# .htaccess R=301 for caldav/carddav builds an http:// URL behind the tunnel; answer it first with an explicit https redirect
RedirectMatch 301 "^/\.well-known/(caldav|carddav)" "https://cloud.cloudless.gr/remote.php/dav/"
