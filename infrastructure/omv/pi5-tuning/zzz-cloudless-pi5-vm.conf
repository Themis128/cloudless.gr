# cloudless.gr — Pi 5 (8 GB) VM / USB-SSD sysctl
# Lexicographic zzz-* wins over 60-cloudless-swap / 99-cloudless / 99-k3s-pi
# conflicting vm.* knobs.
#
# Goals: leave headroom for k3s + etcd, avoid dirty-page flush storms on
# USB SATA, swap only under real pressure (11G swap exists on sdb).

# Keep ~64 MiB free for reclaim under pressure (Pi 5 8 GB).
vm.min_free_kbytes = 65536

# Prefer reclaim over thrashing; swap is available but expensive on USB.
vm.swappiness = 10
vm.vfs_cache_pressure = 80

# Smaller dirty cache → smoother writes on USB-SATA bridges.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 1500

# k3s / container overcommit (already in 99-k3s-pi; restate for clarity).
vm.overcommit_memory = 1
