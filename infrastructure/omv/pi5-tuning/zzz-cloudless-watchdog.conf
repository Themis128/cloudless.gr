# cloudless.gr — Pi 5 (omv) hardware watchdog
#
# OMV ships RuntimeWatchdogSec=15 (openmediavault-watchdog.conf). On a Pi 5
# running k3s + USB-SATA SSD + mailcow + GHA runners, a brief I/O stall or
# boot-storm load spike can miss a 15–60s pet window → hard reset loop
# (seen 2026-08-26: ~4 min reboot cycle, cloudless-app Unknown ×39).
#
# Filename zzz-* sorts after openmediavault-watchdog.conf and
# zz-cloudless-watchdog.conf so this always wins.
[Manager]
RuntimeWatchdogSec=3min
RebootWatchdogSec=10min
