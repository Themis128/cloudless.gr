# 50-restart-budget.conf — give dockerd a longer self-heal window at boot.
#
# 2026-10-24 incident: dockerd lost the boot-time iptables race with k3s
# (DOCKER-FORWARD chain not yet present) and exited once. The stock unit's
# StartLimitBurst=3 / StartLimitIntervalSec=60 marks the unit failed after a
# few rapid retries; it only recovered because docker.socket re-triggered it
# 16s later. Meanwhile cloudless-cleanup (Persistent timer, fired at boot)
# pruned every not-yet-started container. Widen the budget so Restart=always
# retries through the ~30s iptables settle window on its own.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10
