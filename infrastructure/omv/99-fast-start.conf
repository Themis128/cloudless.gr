# 99-fast-start.conf — versioned copy of the correctness fix for GitHub Actions
# runner units on omv/omv-ha.
#
# The pi5-tuning boot-delay drop-in (10-boot-delay.conf) adds
#   ExecStartPre=/bin/sleep 120
# to every actions.runner.*.service so runners do not compete with k3s/mailcow
# at boot. systemd counts ExecStartPre against TimeoutStartSec, which the
# generated runner unit leaves at the 90s default — so the 120s sleep
# GUARANTEES "start-pre operation timed out" on service start, and, combined
# with override.conf's Restart=on-failure + StartLimitIntervalSec=0, produces an
# unbounded restart loop (NRestarts climbs into the hundreds, alerts fire
# non-stop). Observed 2026-08-28 on
# actions.runner.Themis128-cloudless.gr.omv-build.service.
#
# Named 99-fast-start.conf so it sorts LAST (after override.conf and
# alert-on-failure.conf) and its directives win:
#   - TimeoutStartSec=180  -> comfortably above the boot-delay's 120s sleep
#   - ExecStartPre=        -> clears 10-boot-delay's sleep, so a routine
#                             restart is not penalized by an extra 120s
# Boot staggering is preserved via 10-boot-delay's [Unit] After=/Wants=
# ordering; only the ExecStartPre sleep is removed. This mirrors the already-
# working `omv` runner, which carries the identical drop-in.
#
# Install (as root) onto each runner unit:
#   cp 99-fast-start.conf /etc/systemd/system/<unit>.service.d/99-fast-start.conf
#   systemctl daemon-reload && systemctl reset-failed <unit> && systemctl start <unit>
# Managed by infrastructure/omv/install-gha-runner-heal.sh.

[Service]
TimeoutStartSec=180
ExecStartPre=