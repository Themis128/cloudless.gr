apiVersion: v1
kind: Namespace
metadata:
  name: uptime-kuma
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: uptime-kuma
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels: {app: uptime-kuma}
spec:
  replicas: 1
  strategy:
    type: Recreate     # SQLite — must not have two pods touching the same DB file
  selector:
    matchLabels: {app: uptime-kuma}
  template:
    metadata:
      labels: {app: uptime-kuma}
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv         # Pi 5 — single-node cluster (omv-ha decommissioned 2026-08-08)
      containers:
      - name: uptime-kuma
          # Pinned major + minor for reproducibility. v2 is the current
          # stable line per the upstream How-to-Install wiki. arm64 OK.
        image: louislam/uptime-kuma:2
        ports:
        - {containerPort: 3001, name: http}
          # Force IPv4 listen — Pi 4/5 dual-stack default makes some
          # node-net probes hit ::1 which Uptime Kuma's bundled monitors
          # don't always handle gracefully.
        env:
        - {name: UPTIME_KUMA_HOST, value: 0.0.0.0}
        - {name: UPTIME_KUMA_PORT, value: '3001'}
            # After first-run setup, pin sqlite so the pod does not bounce
            # back to the setup-database entry page on restart.
        - {name: UPTIME_KUMA_DB_TYPE, value: sqlite}
        volumeMounts:
        - {name: data, mountPath: /app/data}
          # Probes target the embedded /api/entry-page which is unauth
          # (returns 302 to /dashboard on healthy boot, 200 during setup).
          # timeoutSeconds defaults to 1s, which is too tight on ARM — a slow
          # response counted as a failure and bounced the pod ("context
          # deadline exceeded"). 5s gives the Pi headroom.
        startupProbe:
          httpGet: {path: /, port: 3001}
          failureThreshold: 30
          periodSeconds: 5
          timeoutSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 3001}
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 5
        readinessProbe:
          httpGet: {path: /, port: 3001}
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 500m, memory: 256Mi}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: uptime-kuma-data
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels: {app: uptime-kuma}
spec:
  selector: {app: uptime-kuma}
  type: NodePort
  ports:
  - {name: http, port: 3001, targetPort: 3001, nodePort: 32501}
