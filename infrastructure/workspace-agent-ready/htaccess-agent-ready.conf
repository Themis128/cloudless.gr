# --- agent-ready ---
# NOTE: this block is PREPENDED above Nextcloud's stock rules so the
# pass-through [L] rules fire before the front-controller rewrite.
<IfModule mod_rewrite.c>
  RewriteEngine On
  # Serve our static well-known/root files directly — stop rewriting.
  RewriteCond %{REQUEST_URI} ^/(robots\.txt|sitemap\.xml|auth\.md|skill\.md|index\.md|agent-ready\.js)$ [NC]
  RewriteRule .* - [L]
  RewriteCond %{REQUEST_URI} ^/\.well-known/(api-catalog|openid-configuration|oauth-authorization-server|oauth-protected-resource|server-card\.json|index\.json|ai-catalog\.json|agent\.json|agent-card\.json|poppy\.json|http-message-signatures-directory|mcp/server-card\.json|agent-skills/index\.json)$ [NC]
  RewriteRule .* - [L]
  # oauth-protected-resource accepts a resource-path suffix (RFC 9728 §3.1):
  # the scanner's own path (/login) gets metadata with a matching `resource`;
  # other suffixes fall back to the root document.
  RewriteRule ^\.well-known/oauth-protected-resource/login$ /.well-known/prm-login [L]
  RewriteRule ^\.well-known/oauth-protected-resource/[a-zA-Z0-9._~/-]+$ /.well-known/oauth-protected-resource [L]
  # Markdown-for-Agents: Accept: text/markdown on / or /login serves index.md.
  RewriteCond %{HTTP:Accept} text/markdown
  RewriteCond %{REQUEST_URI} ^/?(login)?$
  RewriteRule .* /index.md [L,T=text/markdown]
</IfModule>
<IfModule mod_headers.c>
  # WebMCP script is external/'self' but Nextcloud's CSP uses strict-dynamic
  # (host allowlist ignored) — swap strict-dynamic for 'self' in script-src-elem.
  # PHP emits CSP via headers_out → plain 'Header edit' (not 'always').
  Header edit Content-Security-Policy "script-src-elem 'strict-dynamic'" "script-src-elem 'self'"
  Header always set Link "</.well-known/api-catalog>; rel=\"api-catalog\"; type=\"application/linkset+json\", </.well-known/oauth-authorization-server>; rel=\"oauth-authorization-server\"; type=\"application/json\", </.well-known/agent.json>; rel=\"agent-card\"; type=\"application/json\", </.well-known/mcp/server-card.json>; rel=\"mcp-server-card\"; type=\"application/json\", </.well-known/ai-catalog.json>; rel=\"ai-catalog\"; type=\"application/json\", </status.php>; rel=\"status\", </auth.md>; rel=\"agent-auth\"; type=\"text/markdown\""
  <FilesMatch "^(api-catalog|openid-configuration|oauth-authorization-server|oauth-protected-resource|server-card\.json|ai-catalog\.json|agent\.json|agent-card\.json|poppy\.json|http-message-signatures-directory|prm-login)$">
    Header set Content-Type "application/json"
    Header set Cache-Control "public, max-age=300"
  </FilesMatch>
  <FilesMatch "^index\.json$">
    Header set Content-Type "application/json"
    Header set Cache-Control "public, max-age=300"
  </FilesMatch>
  <Files "api-catalog">
    Header set Content-Type "application/linkset+json"
    Header set Cache-Control "public, max-age=300"
  </Files>
  <FilesMatch "^(auth\.md|skill\.md|index\.md)$">
    Header set Content-Type "text/markdown; charset=utf-8"
    Header set Cache-Control "public, max-age=300"
  </FilesMatch>
  <Files "robots.txt">
    Header set Content-Type "text/plain; charset=utf-8"
    Header set Cache-Control "public, max-age=300"
  </Files>
  <FilesMatch "^(agent-ready\.js|sitemap\.xml)$">
    Header set Cache-Control "public, max-age=300"
  </FilesMatch>
</IfModule>
<IfModule mod_substitute.c>
  Substitute "s#</head>#<script src=\"/agent-ready.js\" defer></script></head>#i"
</IfModule>
# PHP-level zlib compresses the body before output filters see it, which hid
# </head> from SUBSTITUTE whenever the client accepts gzip (cloudflared always
# does). Strip Accept-Encoding on the scoped URIs so PHP emits plaintext and
# the substitute filter can inject.
<IfModule mod_headers.c>
  RequestHeader unset Accept-Encoding "expr=%{THE_REQUEST} =~ m#^GET /(|login|index\.php)(\?| |$)#"
</IfModule>
<IfModule mod_filter.c>
  # WebMCP: inject external registration script — scoped to the public
  # login/landing pages only (never user HTML served via WebDAV).
  # THE_REQUEST is the original request line (unaffected by rewrites).
  FilterDeclare REPLACE_HEAD CONTENT_SET
  FilterProvider REPLACE_HEAD SUBSTITUTE "%{THE_REQUEST} =~ m#^(GET|HEAD) (https?://[^/ ]+)?/(|login|index\.php)(\?| |$)#"
  FilterChain REPLACE_HEAD
</IfModule>
# --- /agent-ready ---
