# Cloudflare Tunnel route: search.cloudless.gr → Meilisearch NodePort on omv-main
#
# Same tunnel as other services (ID e977a490-58c5-4fdb-9155-86832e3e636a).
#
# DNS record to add in Cloudflare (zone cloudless.gr):
#   search.cloudless.gr CNAME → e977a490-58c5-4fdb-9155-86832e3e636a.cfargotunnel.com
#   (proxied=true, TTL=auto)
#
# To activate on omv-main:
#   1. Append the ingress rule below to /etc/cloudflared/config.yml under
#      the existing `ingress:` key, BEFORE the catch-all `service: http_status:404` rule.
#   2. sudo systemctl restart cloudflared
#   3. Verify: curl -I https://search.cloudless.gr/health   # expect 200 with {"status":"available"}
#
# Required secret in k8s (search namespace):
#   kubectl -n search create secret generic meilisearch-master-key --from-literal=MEILI_MASTER_KEY="$(openssl rand -hex 32)"
#
---
# Ingress rule fragment — paste into /etc/cloudflared/config.yml
ingress_rule: |
  - hostname: search.cloudless.gr
    service: http://192.168.1.128:30770
    originRequest:
      connectTimeout: 15s
      tcpKeepAlive: 30s
      noTLSVerify: false
      httpHostHeader: search.cloudless.gr
