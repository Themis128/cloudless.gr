# Tailscale Ingress Rules for Self-Hosted Services
# These Ingress resources make services accessible via Tailscale MagicDNS
# After applying, services will be reachable at: https://<hostname>.ts.cloudless.gr

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-tailscale
  namespace: monitoring
  annotations:
    tailscale.com/hostname: "grafana"
    tailscale.com/allowlist: "tag:developers"  # Only developers can access
spec:
  ingressClassName: tailscale
  rules:
    - host: grafana.ts.cloudless.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prom-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
