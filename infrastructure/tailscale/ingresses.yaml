# Tailscale L7 Ingresses — private fabric only (no Funnel / no public exposure).
# MagicDNS host is taken from tls.hosts (or metadata annotation hostname).
# Shared ProxyGroup keeps device count at ~1 instead of N proxies.
#
# Reachable as: https://grafana.<tailnet>.ts.net  (or custom split-DNS if configured)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-tailscale
  namespace: monitoring
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: grafana
    # Advertise before TLS exists — otherwise CertDomains never includes the
    # Service VIP name and Let's Encrypt issuance deadlocks (HTTPS-only HA).
    # Docs/operator: advertise only after hasCerts unless http-endpoint is on.
    tailscale.com/http-endpoint: enabled
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - grafana
  defaultBackend:
    service:
      name: kube-prom-grafana
      port:
        number: 80
# Loki Ingress omitted — no Loki Service/Deploy on cluster yet.
# Re-add when monitoring/loki (or equivalent) exists.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meilisearch-tailscale
  namespace: meilisearch
  annotations:
    tailscale.com/proxy-group: ingress
    tailscale.com/hostname: meilisearch
    tailscale.com/http-endpoint: enabled
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - meilisearch
  defaultBackend:
    service:
      name: meilisearch
      port:
        number: 7700
