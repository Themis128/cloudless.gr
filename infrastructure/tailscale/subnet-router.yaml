# Tailscale Subnet Router for K3S Cluster
# Allows Tailscale clients to access k3s pod/service networks
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: k3s-subnet-router
  namespace: tailscale-operator
spec:
  replicas: 1
  tags:
    - tag:k3s-subnet-router
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Advertise k3s pod and service subnets to Tailscale
  # Allows Tailscale clients to reach services via MagicDNS: svc.cluster.local
  routes:
    - "10.42.0.0/16"    # Pod CIDR
    - "10.43.0.0/16"    # Service CIDR
  
  # High availability settings
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # Health check configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8090
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /ready
      port: 8090
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: k3s-subnet-router-pdb
  namespace: tailscale-operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      tailscale: subnet-router