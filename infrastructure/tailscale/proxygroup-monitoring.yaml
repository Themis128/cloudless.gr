# Tailscale ProxyGroup for GUI Applications
# Provides Tailscale access to Grafana, AppFlowy web UI, etc.
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: monitoring-proxies
  namespace: tailscale-operator
spec:
  replicas: 1
  tags:
    - tag:k3s-proxies
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Proxy configuration for Grafana and monitoring tools
  # Services using this ProxyGroup will be accessible via MagicDNS
  proxyClass: monitoring-proxy
  
  # Health monitoring
  livenessProbe:
    httpGet:
      path: /health
      port: 8090
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /ready
      port: 8090
    initialDelaySeconds: 10
    periodSeconds: 5
  
  # Pod disruption budget (always keep 1 running)
  podDisruptionBudget:
    minAvailable: 1
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: monitoring-proxies-pdb
  namespace: tailscale-operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      tailscale: proxy