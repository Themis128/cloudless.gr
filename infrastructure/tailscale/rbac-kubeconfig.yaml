# RBAC for Tailscale kube-apiserver ProxyGroup (auth/impersonation mode).
# Callers are impersonated as their Tailscale login / tags; grant cluster access here.
# Docs: https://tailscale.com/docs/kubernetes-operator/api-server-access/setup-api-over-tailscale
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-themis128-cluster-admin
  labels:
    app.kubernetes.io/part-of: tailscale-fabric
subjects:
  # GitHub-connected Tailscale login (see `tailscale status --json` → User.LoginName)
  - kind: User
    name: Themis128@github
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
# Optional: any device tagged tag:k8s-operator (the operator itself) — not needed for humans.
# Human admin group via Tailscale ACL tag if you later tag office as tag:admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-office-cluster-admin
  labels:
    app.kubernetes.io/part-of: tailscale-fabric
subjects:
  # When office/laptop is tagged, bind the tag as a Kubernetes group
  - kind: Group
    name: tag:k8s-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
