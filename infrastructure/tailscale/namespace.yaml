---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-operator-secrets
  namespace: tailscale-operator
type: Opaque
stringData:
  # These will be populated from AWS SSM or .env.local
  # TS_CLIENT_ID: ""  
  # TS_CLIENT_SECRET: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-operator
  namespace: tailscale-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailscale-operator
rules:
  - apiGroups: ["tailscale.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets", "services", "endpoints", "configmaps", "pods"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tailscale-operator
subjects:
  - kind: ServiceAccount
    name: tailscale-operator
    namespace: tailscale-operator