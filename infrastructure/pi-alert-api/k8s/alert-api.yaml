apiVersion: v1
kind: Namespace
metadata:
  name: alert-manager
  labels:
    app.kubernetes.io/name: alert-api
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: alert-manager
spec:
  limits:
  - type: Container
    default: {memory: 128Mi, cpu: 200m}
    defaultRequest: {memory: 32Mi, cpu: 25m}
    max: {memory: 200Mi, cpu: 500m}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alert-api-data
  namespace: alert-manager
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# Secrets are NOT in this file (apply would clobber live tokens).
# Create once:
#   kubectl -n alert-manager create secret generic alert-api-secrets \
#     --from-literal=SLACK_BOT_TOKEN='xoxb-...' \
#     --from-literal=SLACK_CHANNEL_ID='C09AF5W3X16' \
#     --from-literal=SLACK_WEBHOOK_URL=''
#   kubectl -n alert-manager create secret generic alert-api-mqtt-creds \
#     --from-literal=MQTT_USERNAME=alert-api \
#     --from-literal=MQTT_PASSWORD='...'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-api
  namespace: alert-manager
  labels:
    app: alert-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alert-api
  template:
    metadata:
      labels:
        app: alert-api
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      containers:
      - name: alert-api
        image: docker.io/library/alert-api:v3.5
        # v3.5: list_alerts calls get_alert_history (was broken get_history)
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: alert-api-secrets
              key: SLACK_WEBHOOK_URL
              optional: true
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: alert-api-secrets
              key: SLACK_BOT_TOKEN
              optional: true
        - name: SLACK_CHANNEL_ID
          valueFrom:
            secretKeyRef:
              name: alert-api-secrets
              key: SLACK_CHANNEL_ID
              optional: true
        - name: MQTT_BROKER_HOST
          value: mosquitto.monitoring.svc.cluster.local
        - name: MQTT_BROKER_PORT
          value: '1883'
        - name: MQTT_USERNAME
          valueFrom:
            secretKeyRef:
              name: alert-api-mqtt-creds
              key: MQTT_USERNAME
              optional: true
        - name: MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alert-api-mqtt-creds
              key: MQTT_PASSWORD
              optional: true
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests: {memory: 64Mi, cpu: 50m}
          limits: {memory: 200Mi, cpu: 500m}
        startupProbe:
          httpGet: {path: /health, port: http}
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 30
        readinessProbe:
          httpGet: {path: /health, port: http}
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: alert-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: alert-api
  namespace: alert-manager
  labels:
    app: alert-api
spec:
  type: NodePort
  selector:
    app: alert-api
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30820
