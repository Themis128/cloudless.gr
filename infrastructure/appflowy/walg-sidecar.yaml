# R16: AppFlowy WAL-G sidecar for continuous PostgreSQL backup
# Streams WAL to S3 ~5min RPO for the knowledge base

---
# Add to the appflowy/k8s/appflowy.yaml postgres deployment:
#
# Sidecar container for WAL-G
#   - Runs on omv (same node as postgres)
#   - Uses existing AWS credentials via IRSA or env vars
#   - Streams WAL to S3 every 60 seconds
#

AWSSecret:
  # IAM user credentials with S3 write access
  # Store in SSM: /cloudless/production/APPFLOWY_WALG_AWS_ACCESS_KEY_ID
  #                /cloudless/production/APPFLOWY_WALG_AWS_SECRET_ACCESS_KEY
  kind: Secret
  metadata:
    name: appflowy-walg-aws
    namespace: appflowy
  stringData:
    AWS_ACCESS_KEY_ID: "${APPFLOWY_WALG_AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${APPFLOWY_WALG_AWS_SECRET_ACCESS_KEY}"

