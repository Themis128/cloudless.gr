# R16: AppFlowy WAL-G continuous backup to S3
#
# Apply after creating the AWS secret from SSM:
#   kubectl -n appflowy create secret generic appflowy-walg-aws \
#     --from-literal=AWS_ACCESS_KEY_ID=… \
#     --from-literal=AWS_SECRET_ACCESS_KEY=…
#
# Then patch the postgres Deployment (already wired in k8s/appflowy.yaml)
# or apply this Secret + ConfigMap and restart postgres.
#
# RPO target: ~5 min (archive_timeout=300)
---
apiVersion: v1
kind: Secret
metadata:
  name: appflowy-walg-aws
  namespace: appflowy
  labels:
    app.kubernetes.io/component: walg
    app.kubernetes.io/part-of: appflowy
type: Opaque
stringData:
  # Populate from SSM before apply — do not commit real values.
  # /cloudless/production/APPFLOWY_WALG_AWS_ACCESS_KEY_ID
  # /cloudless/production/APPFLOWY_WALG_AWS_SECRET_ACCESS_KEY
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-walg-env
  namespace: appflowy
  labels:
    app.kubernetes.io/component: walg
    app.kubernetes.io/part-of: appflowy
data:
  AWS_REGION: "us-east-1"
  WALG_S3_PREFIX: "s3://cloudless-analytics-data/appflowy-wal/wal/"
  WALG_UPLOAD_CONCURRENCY: "2"
  WALG_SENTINEL_NAME: "appflowy-postgres-production"
  PGDATA: "/var/lib/postgresql/data/pgdata"
---
# Optional CronJob: base backup once daily (WAL streaming is continuous via sidecar).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: appflowy-walg-basebackup
  namespace: appflowy
  labels:
    app.kubernetes.io/component: walg
    app.kubernetes.io/part-of: appflowy
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: omv
          restartPolicy: OnFailure
          containers:
            - name: walg-backup
              image: ghcr.io/wal-g/wal-g:v3.0.3
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  export PGHOST=postgres.appflowy.svc.cluster.local
                  export PGPORT=5432
                  export PGUSER=postgres
                  export PGPASSWORD="${POSTGRES_PASSWORD}"
                  export PGDATABASE=postgres
                  wal-g backup-push "${PGDATA}"
              envFrom:
                - configMapRef:
                    name: appflowy-walg-env
                - secretRef:
                    name: appflowy-walg-aws
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: appflowy-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: appflowy-postgres
