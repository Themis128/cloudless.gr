# RESTORED 2026-07-04 — Postiz AI re-enabled with Ollama backend.
# Previously evicted 2026-06-21 to free omv RAM for AppFlowy Phase-1.
# Now routes:
#   Postiz Copilot → LiteLLM (this pod) → Ollama (qwen2.5-coder on Office WSL via Tailscale)
#
# Secrets still exist and were not deleted during eviction:
#   - postiz-anthropic:   ANTHROPIC_API_KEY (legacy, not used with Ollama)
#   - postiz-litellm-secrets: LITELLM_MASTER_KEY (used by Postiz as OPENAI_API_KEY)
#   - postiz-openai:      OPENAI_API_KEY (same value as LITELLM_MASTER_KEY)
# ConfigMap still exists:
#   - postiz-litellm-config: routes gpt-4.1 → ollama/qwen2.5-coder
#
# To disable AI again (free RAM): kubectl -n postiz delete deploy postiz-litellm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-litellm
  namespace: postiz
  labels:
    app: postiz-litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postiz-litellm
  template:
    metadata:
      labels:
        app: postiz-litellm
    spec:
      automountServiceAccountToken: false
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "1"
          env:
            - name: LITELLM_LOG
              value: WARNING
            - name: STORE_MODEL_IN_DB
              value: "False"
          envFrom:
            - secretRef:
                name: postiz-anthropic
            - secretRef:
                name: postiz-litellm-secrets
          ports:
            - containerPort: 4000
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: "150m"
              memory: "640Mi"
            limits:
              cpu: "1"
              memory: "1280Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: postiz-litellm-config
