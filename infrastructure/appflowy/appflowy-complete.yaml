# AppFlowy Deployment for K3S
# Collaborative workspace with encryption and Tailscale access
apiVersion: v1
kind: Namespace
metadata:
  name: appflowy
---
apiVersion: v1
kind: Secret
metadata:
  name: appflowy-secrets
  namespace: appflowy
type: Opaque
stringData:
  # Encryption key for data at rest (64 hex chars)
  # Generate: openssl rand -hex 32
  ENCRYPTION_KEY: "GENERATE_AND_STORE_IN_SSM_/cloudless/production/APPFLOWY_ENCRYPTION_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appflowy-config
  namespace: appflowy
data:
  database.yaml: |
    # Database connection pooling
    pool:
      min_idle: 5
      max_size: 20
      connection_timeout: 30s

    # Compression for exports
    export:
      format: "parquet"
      compression: "snappy"

  appflowy.yaml: |
    # Workspace settings
    workspace:
      compression: enabled
      encryption: aes-256-cbc

    # Document versioning (keep last 30 days)
    versions:
      retention_days: 30
      compression: zstd
---
apiVersion: v1
kind: Service
metadata:
  name: appflowy
  namespace: appflowy
spec:
  type: NodePort
  selector:
    app: appflowy
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30810
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appflowy-data
  namespace: appflowy
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appflowy
  namespace: appflowy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appflowy
  template:
    metadata:
      labels:
        app: appflowy
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: appflowy
          image: appflowy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: "postgres://postgres@postgres.database.svc.cluster.local:5432/cloudless"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: appflowy-secrets
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: appflowy-data
              mountPath: /app/data
            - name: appflowy-config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: appflowy-data
          persistentVolumeClaim:
            claimName: appflowy-data
        - name: appflowy-config
          configMap:
            name: appflowy-config
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - postgres
            topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: appflowy-pdb
  namespace: appflowy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: appflowy
---
# Tailscale ingress for direct access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appflowy-tailscale
  namespace: appflowy
  annotations:
    tailscale.com/hostname: "appflowy"
spec:
  ingressClassName: tailscale
  rules:
    - host: appflowy.ts.cloudless.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: appflowy
                port:
                  number: 80
