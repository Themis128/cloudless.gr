apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: pvc-backup
    backup.cloudless.gr/target: n8n-sqlite
spec:
  schedule: 15 4 * * *
  timeZone: Europe/Athens
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: alpine:3.20
            env:
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pvc-backup-r2
                  key: ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pvc-backup-r2
                  key: SECRET_ACCESS_KEY
            - name: R2_ENDPOINT
              value:
                https://fb7dc7b69b662480cd5961a4d1913c78.r2.cloudflarestorage.com
            - name: R2_BUCKET
              value: datalake-bucket
            command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache rclone sqlite tar gzip >/dev/null
              DATE=$(date -u +%Y-%m-%dT%H%M%SZ)
              KEY="pvc-backups/n8n/daily/${DATE}.sqlite.gz"
              LOCAL_FILE=/tmp/snap.sqlite.gz
              echo "→ snapshotting n8n sqlite"
              sqlite3 /n8n-data/database.sqlite ".backup /tmp/snap.sqlite"
              gzip -9 -c /tmp/snap.sqlite > "${LOCAL_FILE}"
              export RCLONE_CONFIG_R2_TYPE=s3
              export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
              export RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
              export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
              export RCLONE_CONFIG_R2_ENDPOINT="${R2_ENDPOINT}"
              export RCLONE_CONFIG_R2_REGION=auto
              export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
              SIZE=$(wc -c < "${LOCAL_FILE}")
              echo "→ uploading ${SIZE} bytes → r2://${R2_BUCKET}/${KEY}"
              rclone copyto "${LOCAL_FILE}" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket
              REMOTE_SIZE=$(rclone lsjson "r2:${R2_BUCKET}/${KEY}" | sed -n 's/.*"Size": *\([0-9]*\).*/\1/p' | head -1)
              echo "✅ remote size ${REMOTE_SIZE} bytes"
              if [ "${REMOTE_SIZE:-0}" -lt 10000 ]; then
                echo "❌ backup suspiciously small (<10KB) — failing job for retry"
                exit 1
              fi
            volumeMounts:
            - name: n8n-data
              mountPath: /n8n-data
              readOnly: true
            resources:
              requests:
                memory: 64Mi
                cpu: 100m
              limits:
                memory: 256Mi
                cpu: 300m
          volumes:
          - name: n8n-data
            persistentVolumeClaim:
              claimName: n8n-data
              readOnly: true
