apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-backup-espocrm
  namespace: espocrm
  labels:
    app.kubernetes.io/name: pvc-backup
    backup.cloudless.gr/target: espocrm-mariadb
spec:
  schedule: 45 3 * * *
  timeZone: Europe/Athens
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: alpine:3.20
            env:
            - name: MYSQL_HOST
              value: espocrm-mariadb
            - name: MYSQL_PORT
              value: '3306'
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: espocrm-secrets
                  key: mariadb-root-password
            - name: MYSQL_DATABASE
              value: espocrm
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pvc-backup-r2
                  key: ACCESS_KEY_ID
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pvc-backup-r2
                  key: SECRET_ACCESS_KEY
            - name: R2_ENDPOINT
              value:
                https://fb7dc7b69b662480cd5961a4d1913c78.r2.cloudflarestorage.com
            - name: R2_BUCKET
              value: datalake-bucket
            command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              apk add --no-cache rclone mariadb-client gzip >/dev/null
              DATE=$(date -u +%Y-%m-%dT%H%M%SZ)
              KEY="pvc-backups/espocrm/daily/${DATE}.sql.gz"
              LOCAL_FILE=/tmp/dump.sql.gz
              echo "→ dumping espocrm mariadb"
              mariadb-dump --host="${MYSQL_HOST}" --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --single-transaction --routines --triggers --events \
                --default-character-set=utf8mb4 \
                "${MYSQL_DATABASE}" \
                | gzip -9 > "${LOCAL_FILE}"
              export RCLONE_CONFIG_R2_TYPE=s3
              export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
              export RCLONE_CONFIG_R2_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
              export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
              export RCLONE_CONFIG_R2_ENDPOINT="${R2_ENDPOINT}"
              export RCLONE_CONFIG_R2_REGION=auto
              export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
              SIZE=$(wc -c < "${LOCAL_FILE}")
              echo "→ uploading ${SIZE} bytes → r2://${R2_BUCKET}/${KEY}"
              rclone copyto "${LOCAL_FILE}" "r2:${R2_BUCKET}/${KEY}" --s3-no-check-bucket
              REMOTE_SIZE=$(rclone lsjson "r2:${R2_BUCKET}/${KEY}" | sed -n 's/.*"Size": *\([0-9]*\).*/\1/p' | head -1)
              echo "✅ remote size ${REMOTE_SIZE} bytes"
              if [ "${REMOTE_SIZE:-0}" -lt 10000 ]; then
                echo "❌ backup suspiciously small (<10KB) — failing job for retry"
                exit 1
              fi
            resources:
              requests:
                memory: 128Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
