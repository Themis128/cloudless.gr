# Traefik IngressRoutes — all public app hostnames
#
# Traffic path: Cloudflare Tunnel → Traefik NodePort 30850 (web/HTTP)
#               → IngressRoute match → ClusterIP service
#
# TLS terminates at Cloudflare; the tunnel forwards plain HTTP to Traefik.
# All routes use the `web` entrypoint (HTTP).  No certResolver needed here.
#
# Apply:
#   kubectl apply -f infrastructure/traefik/ingressroutes.yaml
#
# Invariants:
#   - n8n and espocrm also keep their NodePort for ETL access via Tailscale.
#   - cloudless.gr / manage / pi-origin stay on NodePort 30300 (Worker proxy
#     path) and are NOT routed through Traefik.
#   - omv.cloudless.gr and webmail.cloudless.gr are non-k8s hosts; no IngressRoute.

---
# grafana.cloudless.gr → kube-prom-grafana (monitoring)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [web]
  routes:
  - kind: Rule
    match: Host(`grafana.cloudless.gr`)
    services:
    - name: kube-prom-grafana
      port: 80

