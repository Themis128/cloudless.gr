# docker-compose.mcp.yml - MCP Server Configuration Fix
# This file should be used specifically for MCP docker operations
#
# IMPORTANT: MCP servers use stdio transport and should be run with:
#   docker run -i --rm ...  (interactive mode with auto-removal)
#
# For production use, prefer managing MCP servers via cline_mcp_settings.json
# using npx/mcp-remote commands instead of docker-compose
#
# Reference: https://github.com/cloudflare/mcp

services:
  # Playwright MCP - Browser automation
  # Note: Microsoft's Playwright MCP image uses stdio transport
  # For proper stdio handling in docker, use: docker run -i --rm
  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    container_name: cloudless-playwright-mcp
    environment:
      - PLAYWRIGHT_BASE_URL=http://host.docker.internal:4000
      - PLAYWRIGHT_HEADLESS=true
    volumes:
      - /home/tbaltzakis/cloudless.gr:/workspace:cached
      - playwright-cache:/ms-playwright
    networks:
      - cloudless-network
    profiles:
      - mcp
    # Note: Run with: docker run -i --rm -it ... for proper stdio handling
    stdin_open: true
    tty: true

  # Cloudflare Pages MCP - Custom local server
  # Note: Uses stdio transport, requires interactive mode
  cloudflare-pages-mcp:
    build:
      context: ./cloudflare-pages-mcp
      dockerfile: Dockerfile
    container_name: cloudless-pages-mcp
    image: cloudless-pages-mcp:latest
    working_dir: /app
    environment:
      # Use environment variable references instead of hardcoded values
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    networks:
      - cloudless-network
    profiles:
      - mcp
    # Note: Run with: docker run -i --rm ... for proper stdio handling
    stdin_open: true
    tty: true

volumes:
  playwright-cache:

networks:
  cloudless-network:
    driver: bridge
