apiVersion: v1
kind: Namespace
metadata:
  name: cloudless
---
# Performance Tuning ConfigMap
# Based on Lighthouse findings: slow TTFB, LCP bottleneck, unused JS
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-performance-config
  namespace: cloudless
data:
  # Next.js Performance Optimization
  NODE_ENV: "production"
  NODE_OPTIONS: "--max-old-space-size=2048"  # Reduce GC pauses

  # Database Connection Pooling
  DATABASE_POOL_MIN: "5"
  DATABASE_POOL_MAX: "20"

  # Cache Strategy
  CACHE_TTL_PRODUCT_LIST: "60"      # Cache product list for 60s
  CACHE_TTL_SERVICE_DATA: "3600"    # Cache service data for 1 hour
  CACHE_TTL_SESSION: "1800"         # Cache session tokens for 30min

  # Parallel Query Execution
  ENABLE_PARALLEL_QUERIES: "true"
  QUERY_TIMEOUT_MS: "5000"
---
# PersistentVolume for DuckDB analytics data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: duckdb-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /var/lib/duckdb
  storageClassName: ""
---
# PersistentVolumeClaim for DuckDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duckdb-pvc
  namespace: cloudless
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
---
# Deployment with Resource Optimization and Quick Wins
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudless-app
  namespace: cloudless
  labels:
    app: cloudless-app
    version: v1
spec:
  replicas: 1  # Run single pod on omv (main node with NVMe)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0  # Zero downtime deployments

  selector:
    matchLabels:
      app: cloudless-app

  template:
    metadata:
      labels:
        app: cloudless-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"

    spec:
      # ECR authentication - pull images from AWS ECR
      imagePullSecrets:
      - name: regcred-ecr

      # Node Affinity: Prefer omv for performance (main node with NVMe)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - omv

      # Container Configuration
      containers:
      - name: app
        image: 278585680617.dkr.ecr.us-east-1.amazonaws.com/cloudless-pi-app:f4470f73af40
        imagePullPolicy: Always

        # Port Configuration
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        # AWS credentials for SSM access at runtime
        envFrom:
        - secretRef:
            name: pi-standby-aws-creds
        - configMapRef:
            name: app-performance-config

        # Sentry environment tagging for failover
        env:
        - name: SENTRY_ENVIRONMENT
          value: "pi-standby"

        # Resource Requests & Limits - Optimized
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        # Persistent storage for analytics
        volumeMounts:
        - name: duckdb-data
          mountPath: /app/data
          subPath: duckdb

        # Startup Probe
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24

        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Lifecycle Hooks
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

      # Volumes for persistent analytics storage
      volumes:
      - name: duckdb-data
        persistentVolumeClaim:
          claimName: duckdb-pvc
---
# Service Configuration
apiVersion: v1
kind: Service
metadata:
  name: cloudless-app
  namespace: cloudless
  labels:
    app: cloudless-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: cloudless-app

  # Session Affinity for cache hit rate
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
# Horizontal Pod Autoscaler - Increased max for traffic spikes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudless-app-hpa
  namespace: cloudless
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudless-app

  minReplicas: 1
  maxReplicas: 5      # Increased from 3 for better traffic handling

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudless-app-pdb
  namespace: cloudless
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudless-app
---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudless-app-network-policy
  namespace: cloudless
spec:
  podSelector:
    matchLabels:
      app: cloudless-app

  policyTypes:
  - Ingress
  - Egress

  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 3000

  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
# Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudless-app-ingress
  namespace: cloudless
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-cache: "on"
    nginx.ingress.kubernetes.io/proxy-cache-valid: "200 1y"
    nginx.ingress.kubernetes.io/proxy-cache-path: "/var/cache/nginx"
    nginx.ingress.kubernetes.io/compress: "true"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "32"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
spec:
  rules:
  - host: cloudless.gr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudless-app
            port:
              number: 80
  - host: "*.cloudless.gr"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudless-app
            port:
              number: 80