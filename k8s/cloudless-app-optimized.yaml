apiVersion: v1
kind: Namespace
metadata:
  name: cloudless
---
# Performance Tuning ConfigMap
# Based on Lighthouse findings: slow TTFB, LCP bottleneck, unused JS
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-performance-config
  namespace: cloudless
data:
  # Next.js Performance Optimization
  NODE_ENV: "production"
  NODE_OPTIONS: "--max-old-space-size=2048"  # Reduce GC pauses

  # Database Connection Pooling
  DATABASE_POOL_MIN: "5"
  DATABASE_POOL_MAX: "20"

  # Cache Strategy
  CACHE_TTL_PRODUCT_LIST: "60"      # Cache product list for 60s
  CACHE_TTL_SERVICE_DATA: "3600"    # Cache service data for 1 hour
  CACHE_TTL_SESSION: "1800"         # Cache session tokens for 30min

  # Parallel Query Execution
  ENABLE_PARALLEL_QUERIES: "true"
  QUERY_TIMEOUT_MS: "5000"
---
# Deployment with Resource Optimization
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudless-app
  namespace: cloudless
  labels:
    app: cloudless-app
    version: v1
spec:
  replicas: 3  # Minimum 3 for HA; HPA scales up under load
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0  # Zero downtime deployments

  selector:
    matchLabels:
      app: cloudless-app

  template:
    metadata:
      labels:
        app: cloudless-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"

    spec:
      # Affinity: Spread pods across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cloudless-app
              topologyKey: kubernetes.io/hostname

      # Container Configuration
      containers:
      - name: app
        image: 278585680617.dkr.ecr.us-east-1.amazonaws.com/cloudless-pi-app:latest
        imagePullPolicy: Always

        # Port Configuration
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        # Environment Variables for Performance
        envFrom:
        - configMapRef:
            name: app-performance-config

        # Environment Secrets (auth, DB credentials)
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: database-url
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: auth-secret
        - name: COGNITO_ISSUER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: cognito-issuer
        # R14: tag Pi-served Sentry events so they're distinguishable from
        # AWS Lambda's "production" environment. Operator can filter by env
        # in the Sentry dashboard to see which surface produced an error
        # during failover, instead of both showing as "production".
        - name: SENTRY_ENVIRONMENT
          value: "pi-standby"

        # Resource Requests & Limits
        # Problem: Underpowered pods cause slow TTFB and TBT
        # Solution: 512Mi memory minimum (was 256Mi), 500m CPU (was 250m)
        requests:
          cpu: 500m              # Request 0.5 CPU cores
          memory: 512Mi          # Request 512MB RAM
        limits:
          cpu: 1000m             # Allow burst to 1.0 CPU
          memory: 1Gi            # Hard limit 1GB (prevent OOM)

        # Startup Probe (wait for app to be ready)
        # Prevents traffic before app is ready, reducing 502 errors
        startupProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 15  # 30s total before failure

        # Readiness Probe (detect when app can handle traffic)
        # Removes pods from load balancer if slow
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        # Liveness Probe (restart dead containers)
        # Recover from hangs/deadlocks
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Lifecycle Hooks
        lifecycle:
          preStop:
            exec:
              # Graceful shutdown: wait for in-flight requests (max 30s)
              command: ["/bin/sh", "-c", "sleep 15"]
---
# Service Configuration
apiVersion: v1
kind: Service
metadata:
  name: cloudless-app
  namespace: cloudless
  labels:
    app: cloudless-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: cloudless-app

  # Session Affinity: Route requests from same client to same pod
  # Improves cache hit rate (local memory cache shared across requests)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour idle timeout
---
# Horizontal Pod Autoscaler
# Problem: Traffic spikes cause slow response times
# Solution: Auto-scale to 5-10 pods based on CPU/memory
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudless-app-hpa
  namespace: cloudless
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudless-app

  minReplicas: 3      # Minimum 3 pods always running
  maxReplicas: 10     # Scale up to 10 under heavy load

  metrics:
  # CPU-based autoscaling (scale when CPU > 70%)
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  # Memory-based autoscaling (scale when memory > 75%)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

  # Behavior: Gradual scale-down to avoid flapping
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
# PodDisruptionBudget: Protect app during node maintenance
# Ensures at least 2 pods are always running
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudless-app-pdb
  namespace: cloudless
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cloudless-app
---
# NetworkPolicy: Limit inbound/outbound traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudless-app-network-policy
  namespace: cloudless
spec:
  podSelector:
    matchLabels:
      app: cloudless-app

  policyTypes:
  - Ingress
  - Egress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx  # Allow from nginx ingress
    - namespaceSelector:
        matchLabels:
          name: cloudless  # Allow from same namespace (Prometheus, etc.)
    ports:
    - protocol: TCP
      port: 3000

  egress:
  # Allow DNS (port 53)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53

  # Allow to database (adjust IP/port to your DB)
  - to:
    - podSelector:
        matchLabels:
          app: postgres  # If DB is in cluster
    ports:
    - protocol: TCP
      port: 5432

  # Allow to external services (Cognito, payment processors, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443  # HTTPS
    - protocol: TCP
      port: 80   # HTTP
---
# Ingress Configuration with Caching Headers
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudless-app-ingress
  namespace: cloudless
  annotations:
    # nginx ingress controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Cache static assets (1 year)
    nginx.ingress.kubernetes.io/proxy-cache: "on"
    nginx.ingress.kubernetes.io/proxy-cache-valid: "200 1y"
    nginx.ingress.kubernetes.io/proxy-cache-path: "/var/cache/nginx"

    # Compression (Gzip reduces LCP by 30-40%)
    nginx.ingress.kubernetes.io/compress: "true"

    # Keep-alive to origin (reuse connections)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "32"

    # Timeouts: Reduce to fail fast if app is slow
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
spec:
  rules:
  - host: cloudless.gr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudless-app
            port:
              number: 80
  - host: "*.cloudless.gr"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudless-app
            port:
              number: 80
