# oauth2-proxy for manage.cloudless.gr - migrated from Keycloak to AWS Cognito.
#
# Cognito app client for oauth2-proxy is stored in SSM:
#   /cloudless/production/oauth2-proxy-client-id      -> 63d3fu5lp057694h0t70je4jk0
#   /cloudless/production/oauth2-proxy-client-secret   (SecureString)
# mirrored into the k8s Secret oauth2-proxy-secret (key: client-secret).
#
# Cognito issuer: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_1Bq3Mpqer
#
# BEFORE applying: the Cognito app client 63d3fu5lp057694h0t70je4jk0 MUST have
#   https://manage.cloudless.gr/oauth2/callback registered as an allowed callback URL.
#   A missing callback URL will break manage.cloudless.gr login.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: cloudless
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      nodeSelector:
        kubernetes.io/hostname: omv
      # wait-for-keycloak initContainer REMOVED - Keycloak no longer exists.
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_1Bq3Mpqer
            - --client-id=63d3fu5lp057694h0t70je4jk0
            - --redirect-url=https://manage.cloudless.gr/oauth2/callback
            - --upstream=http://cloudless-manager.cloudless.svc.cluster.local:3000
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --skip-provider-button=true
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_manager
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet: { path: /ping, port: 4180, scheme: HTTP }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 1
          readinessProbe:
            httpGet: { path: /ping, port: 4180, scheme: HTTP }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
