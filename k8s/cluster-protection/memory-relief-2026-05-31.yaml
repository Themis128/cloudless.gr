# ── Namespace-level defaults (was missing for these namespaces) ──
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: analytics
spec:
  limits:
  - type: Container
    default: {memory: 512Mi, cpu: 1}
    defaultRequest: {memory: 128Mi, cpu: 100m}
    max: {memory: 1Gi, cpu: 2}

---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: n8n
spec:
  limits:
  - type: Container
    default: {memory: 256Mi, cpu: 500m}
    defaultRequest: {memory: 64Mi, cpu: 50m}
    max: {memory: 384Mi, cpu: 1}

---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: ntfy
spec:
  limits:
  - type: Container
    default: {memory: 96Mi, cpu: 200m}
    defaultRequest: {memory: 32Mi, cpu: 25m}
    max: {memory: 128Mi, cpu: 500m}

---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: alert-manager
spec:
  limits:
  - type: Container
    default: {memory: 128Mi, cpu: 200m}
    defaultRequest: {memory: 32Mi, cpu: 25m}
    max: {memory: 200Mi, cpu: 500m}

---
# ── Per-deployment hard caps for known memory hogs ──

# Metabase — 927 Mi → 400 Mi cap. JVM heap can be tuned via JAVA_OPTS
# but the kernel limit alone forces it to GC more aggressively.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: analytics
spec:
  template:
    spec:
      containers:
      - name: metabase
        env:
        - name: JAVA_OPTS
          value: -Xmx320m -Xms128m
        - name: MB_JETTY_MAXTHREADS
          value: '20'
        resources:
          requests: {memory: 200Mi, cpu: 100m}
          limits: {memory: 400Mi, cpu: 1}

---
# n8n — 117 Mi → 256 Mi cap (keep headroom for workflow spikes)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  template:
    spec:
      containers:
      - name: n8n
        resources:
          requests: {memory: 80Mi, cpu: 50m}
          limits: {memory: 256Mi, cpu: 500m}

---
# ntfy — already small, just cap it
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
spec:
  template:
    spec:
      containers:
      - name: ntfy
        resources:
          requests: {memory: 24Mi, cpu: 10m}
          limits: {memory: 96Mi, cpu: 200m}
