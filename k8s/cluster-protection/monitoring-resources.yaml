# Prometheus — biggest single consumer (TSDB ingest + compaction).
# Patches the Prometheus CR managed by the prometheus-operator.
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: monitoring-prometheus
  namespace: monitoring
spec:
  retention: 3d
  retentionSize: 2GB
  resources:
    requests:
      memory: 400Mi
      cpu: 100m
    limits:
      memory: 700Mi
      cpu: 1
---
# Alertmanager — small, alerting only.
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: monitoring-alertmanager
  namespace: monitoring
spec:
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 200m
---
# Loki — single binary, all-in-one target. Bounded ingest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: loki
        resources:
          requests:
            memory: 200Mi
            cpu: 50m
          limits:
            memory: 400Mi
            cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-prom-grafana
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: grafana
        resources:
          requests:
            memory: 100Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-operator
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: operator
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 200Mi
            cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-prom-kube-state-metrics
  namespace: monitoring
spec:
  template:
    spec:
      containers:
      - name: kube-state-metrics
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 128Mi
            cpu: 200m

