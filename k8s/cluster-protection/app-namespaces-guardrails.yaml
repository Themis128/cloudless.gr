# Guardrails for app namespaces — LimitRange (defaults for pods that omit
# resources) + ResourceQuota (namespace blast-radius cap) pairs.
# Quotas are sized ~2x current usage so they bound a memory leak without
# ever firing during normal ops or blocking CronJob pods.
# Node memory pressure is the real risk (~70%); CPU is left uncapped since
# throttling is preferable to rejection there.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: cloudless
spec:
  limits:
  - type: Container
    default:
      memory: 768Mi
      cpu: 500m
    defaultRequest:
      memory: 256Mi
      cpu: 100m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cloudless-quota
  namespace: cloudless
spec:
  hard:
    pods: "3"
    requests.memory: 512Mi
    limits.memory: 1536Mi
---
