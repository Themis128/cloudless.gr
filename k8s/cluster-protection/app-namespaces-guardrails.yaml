---
# monitoring: LimitRange supplies defaults to kube-prometheus-stack sidecars
# (config-reloader, node-exporter) that ship without resources — this makes
# the quota safe instead of rejecting them at next restart.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: monitoring
spec:
  limits:
  - type: Container
    default:
      memory: 256Mi
      cpu: 300m
    defaultRequest:
      memory: 64Mi
      cpu: 50m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    pods: "25"
    requests.memory: 2Gi
    limits.memory: 6Gi
