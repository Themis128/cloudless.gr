# Scale-down of workloads to free memory on omv (Pi 5).
#
# Per decision 2026-05-31:
#   - Home Assistant: scale to 0 (frees 314 MiB). Currently shows 0 API calls
#     in 24h and the cluster is in iowait death-spiral. Re-scale to 1 with
#     `kubectl scale deploy home-assistant -n home-assistant --replicas=1`
#     if/when actually used. State is preserved on the PVC.
#
#   - Oncall stack (engine + celery + mariadb + redis): scale to 0 (frees ~900 MiB).
#     The cluster already has Slack notifier (src/lib/slack-notify.ts) and
#     Grafana IRM/Contact Points for alerting. Oncall added duplication and
#     was the single biggest contributor to memory pressure.
#
# Apply with:
#   bash k8s/cluster-protection/apply-memory-relief.sh
#
# Reverse (if needed):
#   kubectl scale deploy/home-assistant -n home-assistant --replicas=1
#   kubectl scale deploy/oncall-engine oncall-celery -n oncall --replicas=1
#   kubectl scale statefulset/oncall-mariadb -n oncall --replicas=1
#   kubectl scale deploy/oncall-redis -n oncall --replicas=1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-engine
  namespace: oncall
spec:
  replicas: 0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-celery
  namespace: oncall
spec:
  replicas: 0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-redis
  namespace: oncall
spec:
  replicas: 0

---
# StatefulSet for mariadb — replicas: 0 preserves PVCs
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oncall-mariadb
  namespace: oncall
spec:
  replicas: 0
