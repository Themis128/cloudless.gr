apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: oncall
spec:
  limits:
  - type: Container
    default:
      memory: 512Mi
      cpu: 500m
    defaultRequest:
      memory: 256Mi
      cpu: 100m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: oncall-quota
  namespace: oncall
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: '10'

