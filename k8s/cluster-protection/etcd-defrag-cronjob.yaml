apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
  namespace: monitoring
  labels:
    app: etcd-defrag
spec:
  # Sunday at 04:00 UTC. Cluster is idle: no ML retraining, no newsletter job.
  schedule: 0 4 * * 0
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Kill the Job after 10 minutes — defrag on a 27MB db takes <5s, on
      # a 2GB db (worst case at quota) ~30s. 10m is safety margin.
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: etcd-defrag
        spec:
          restartPolicy: OnFailure
          # MUST run on the etcd node (omv). Defrag is per-member; on a
          # single-server k3s cluster this is also the only member.
          nodeSelector:
            kubernetes.io/hostname: omv
          tolerations:
          - operator: Exists
          # Host network → reach 127.0.0.1:2379 directly.
          hostNetwork: true
          containers:
          - name: defrag
              # registry.k8s.io/etcd is distroless — no shell, just etcdctl
              # at /usr/local/bin/etcdctl. Call it directly with all flags as
              # args; no echo/ls diagnostic output (worth it: image is
              # already in k3s containerd because kubelet uses it).
            image: registry.k8s.io/etcd:3.5.13-0
            command:
            - /usr/local/bin/etcdctl
            args:
            - --endpoints=https://127.0.0.1:2379
            - --cacert=/etcd-certs/server-ca.crt
            - --cert=/etcd-certs/server-client.crt
            - --key=/etcd-certs/server-client.key
            - --command-timeout=5m
            - defrag
            - --cluster=false
            env:
            - name: ETCDCTL_API
              value: '3'
            volumeMounts:
            - name: etcd-certs
              mountPath: /etcd-certs
              readOnly: true
            securityContext:
                # Certs are mode 600 root:root — need root to read.
              runAsUser: 0
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
          volumes:
            # NOTE: k3s data-dir is on the SSD (not the default /var/lib/rancher/k3s).
            # If you move it back to default, update this path.
          - name: etcd-certs
            hostPath:
              path: 
                /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/server/tls/etcd
              type: Directory
