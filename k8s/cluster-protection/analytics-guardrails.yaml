apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: analytics
spec:
  limits:
  - type: Container
    default:
      memory: 512Mi
      cpu: 500m
    defaultRequest:
      memory: 256Mi
      cpu: 100m
    max:
      memory: 2Gi
      cpu: 2
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: analytics-quota
  namespace: analytics
spec:
  hard:
    # Sized for Metabase (1.5Gi) + DuckDB API (1.5Gi) + one active ML job (1Gi).
    # Since training jobs are scheduled sequentially, we don't need to sum all of them.
    requests.memory: 3Gi
    limits.memory: 4Gi
    requests.cpu: '2'
    limits.cpu: '4'
    pods: '15'
