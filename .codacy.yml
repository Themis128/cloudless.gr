engines:
  eslint:
    enabled: false
  pmd:
    enabled: false
  pylint:
    enabled: false
  dartanalyzer:
    enabled: false
  revive:
    enabled: false
  csslint:
    enabled: false
  stylelint:
    enabled: false
  opengrep:
    enabled: true
  trivy:
    enabled: true
  lizard:
    enabled: true
exclude_paths:
- infrastructure/**
- scripts/**
- e2e/**
- tests/**
- '**/*.test.ts'
- '**/*.test.tsx'
- '**/*.spec.ts'
- '**/__tests__/**'
- '**/node_modules/**'
# Generated reports / stale build output — these are what stall opengrep
- coverage/**
- '**/coverage/**'
- '**/lcov-report/**'
- '**/*.min.js'
- '.next*/**'
- '.open-next/**'
# Agent/dev tooling dirs — not product code, not security-relevant
- .claude/**
- .kiro/**
- .agents/**
- .github/**
- skills/**
- tools/**
- agents/**
- docs/**
- .next/**
- dist/**
- build/**
