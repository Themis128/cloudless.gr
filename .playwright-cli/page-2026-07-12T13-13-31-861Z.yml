              - text: . No brittle CSS paths.
            - heading "Parallelism and sharding" [level=4] [ref=e78]
            - paragraph [ref=e79]: Tests run in parallel by default across all configured browsers. Shard across multiple machines for faster CI. Full cross-browser coverage on every commit.
