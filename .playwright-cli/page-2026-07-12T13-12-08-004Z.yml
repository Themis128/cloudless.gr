          - generic [ref=e64]:
            - heading "Auto-wait and web-first assertions" [level=4] [ref=e65]
            - paragraph [ref=e66]: Playwright waits for elements to be 
                actionable before performing actions. Assertions automatically 
                retry until conditions are met. No artificial timeouts, no flaky
                tests.
            - heading "Test isolation" [level=4] [ref=e67]
            - paragraph [ref=e68]: Each test gets a fresh browser context — 
                equivalent to a brand new browser profile. Full isolation with 
                near-zero overhead. Save authentication state once and reuse it 
                across tests.
          - generic [ref=e69]:
            - heading "Resilient locators" [level=4] [ref=e70]
