version: '3.8'

services:
  comfyui:
    image: social-media-comfyui:local  # Using your active locally built image
    container_name: social-media-comfyui
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/home/user/ComfyUI
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8000 --cpu  # Added --cpu flag to bypass CUDA assertions
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - FAL_KEY=\${FAL_KEY}
    restart: unless-stopped