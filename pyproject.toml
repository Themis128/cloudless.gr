# Python tooling config for the repo's helper scripts and Pi-side services.
# The JS/TS app is linted by ESLint/Prettier/tsc; this file governs the
# ~20 Python files under scripts/, infrastructure/, and lambda/.
#
#   ruff check .          # lint  (pnpm lint:py)
#   ruff format --check . # format (pnpm format:py:check)
#   mypy .                # types (pnpm typecheck:py)
#
# Security scanning of the same files is handled separately by Bandit (.bandit).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  "node_modules",
  ".next",
  # Vendored OpenClaudia skill scripts (e.g. .claude/skills/podcast-edit/
  # filler_removal.py) are installed by external tooling and not owned here.
  # File ruff drift upstream rather than reformatting local copies.
  ".claude",
  ".kiro",
]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E) + warnings (W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["F", "E", "W", "I", "UP", "B", "C4"]
# E501 (line length) is reported by the formatter, not the linter — avoid
# double-flagging long strings/URLs that are intentionally kept on one line.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Agents/scripts often adjust sys.path before importing local packages.
"agents/**/*.py" = ["E402"]
"scripts/check_langsmith_api_clients.py" = ["E402"]
"scripts/cloudless_fast_answer.py" = ["E402"]
"scripts/langsmith_api_call.py" = ["E402"]
"scripts/langsmith_api_page.py" = ["E402"]
"scripts/langsmith_api_stream.py" = ["E402"]
"scripts/langsmith_endpoint_call.py" = ["E402"]
"scripts/vibe_plan.py" = ["E402"]
"scripts/vibe_status.py" = ["E402"]
"tests/langsmith_api/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Helper scripts are not fully typed; keep mypy as a correctness net, not a
# gate that demands annotations everywhere. Tighten per-module over time.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "."
# Don't deep-type agents/tools pulled in via imports from scripts — those
# modules are experimental helpers, not the CI gate surface.
follow_imports = "skip"
exclude = [
  '^\.venv/',
  '^\.mypy_cache/',
  '^node_modules/',
  '^\.next/',
  '^agents/',
  '^tools/',
]
