# Python tooling config for the repo's helper scripts and Pi-side services.
# The JS/TS app is linted by ESLint/Prettier/tsc; this file governs the
# ~20 Python files under scripts/, infrastructure/, and lambda/.
#
#   ruff check .          # lint  (pnpm lint:py)
#   ruff format --check . # format (pnpm format:py:check)
#   mypy .                # types (pnpm typecheck:py)
#
# Security scanning of the same files is handled separately by Bandit (.bandit).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".mypy_cache",
  ".ruff_cache",
  "node_modules",
  ".next",
]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors (E) + warnings (W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["F", "E", "W", "I", "UP", "B", "C4"]
# E501 (line length) is reported by the formatter, not the linter — avoid
# double-flagging long strings/URLs that are intentionally kept on one line.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Helper scripts are not fully typed; keep mypy as a correctness net, not a
# gate that demands annotations everywhere. Tighten per-module over time.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
  '^\.venv/',
  '^\.mypy_cache/',
  '^node_modules/',
  '^\.next/',
]
