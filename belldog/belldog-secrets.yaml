# WARNING: This file needs your Slack credentials
# Get values from https://api.slack.com/apps/YOUR-APP-ID

apiVersion: v1
kind: Secret
metadata:
  name: belldog-secrets
  namespace: belldog
type: Opaque
stringData:
  SLACK_TOKEN: "xoxb-YOUR-BOT-TOKEN-PLACEHOLDER"  # Replace with actual token
  SLACK_SIGNING_SECRET: "YOUR-SIGNING-SECRET-PLACEHOLDER"  # Replace with actual secret
