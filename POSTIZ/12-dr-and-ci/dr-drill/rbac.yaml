---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-drill
  namespace: postiz
---
# Scoped to postiz ns only; explicitly cannot touch production postiz-pg
# (the script targets only `postiz-pg-restore-test` by name).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-drill
  namespace: postiz
rules:
  # Create / delete / inspect the test cluster
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, create, delete, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups]
    verbs: [get, list]
  # Read pods so we know when the test cluster is Ready
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  # Exec into the restored pod to run psql assertions
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # The CronJob creates Secrets that the test cluster reuses (none today,
  # but leaves the door open if you add a custom external-cluster secret).
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-drill
  namespace: postiz
subjects:
  - kind: ServiceAccount
    name: dr-drill
    namespace: postiz
roleRef:
  kind: Role
  name: dr-drill
  apiGroup: rbac.authorization.k8s.io
