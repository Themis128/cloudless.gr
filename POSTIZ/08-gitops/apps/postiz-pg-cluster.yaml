---
# CNPG Cluster CR. Requires the operator to be installed first (wave -15).
# Secrets (postiz-pg-app-user, postiz-pg-superuser, postiz-pg-r2-creds) must
# pre-exist — they hold passwords ArgoCD shouldn't see. Apply them manually:
#   kubectl apply -f 02-cnpg/postiz-db-secret.yaml
#   kubectl apply -f 07-backups/cnpg/r2-creds.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postiz-pg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: postiz-platform
  source:
    repoURL: "REPLACE_WITH_REPO_URL"
    targetRevision: main
    path: 02-cnpg
    directory:
      include: 'cluster.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: postiz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
