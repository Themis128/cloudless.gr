---
# postiz-agent CronJob. The `postiz-api-key` Secret must pre-exist
# (apply 06-automation/postiz-agent/secret.yaml manually).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postiz-automation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: postiz-platform
  source:
    repoURL: "REPLACE_WITH_REPO_URL"
    targetRevision: main
    path: 06-automation/postiz-agent
    directory:
      include: 'cronjob.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: postiz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
