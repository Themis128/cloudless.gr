---
# Nightly mirror of in-cluster MinIO -> Cloudflare R2.
# `mc mirror --overwrite --remove` keeps R2 in lockstep with the source bucket.
# Drop `--remove` if you want R2 to be append-only (resists ransomware deletion).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-r2-mirror
  namespace: postiz
spec:
  schedule: "0 3 * * *"          # daily 03:00 UTC, 30 min after PG backup
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mc
              image: minio/mc:RELEASE.2025-04-16T18-13-26Z
              envFrom:
                - secretRef:
                    name: postiz-minio-r2-creds
              command: [sh, -c]
              args:
                - |
                  set -e
                  echo "==> Configuring mc aliases"
                  mc alias set src   "$MINIO_ENDPOINT"  "$MINIO_ACCESS_KEY"    "$MINIO_SECRET_KEY"
                  mc alias set r2    "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
                                     "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" \
                                     --api S3v4
                  echo "==> Mirroring postiz-uploads -> R2"
                  mc mirror --overwrite --remove --preserve \
                      src/postiz-uploads r2/postiz-uploads-mirror
                  echo "==> Mirror complete"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
