---
# Default-deny INGRESS + EGRESS for every app namespace. Subsequent
# NetworkPolicies in this folder explicitly allow only what's needed.
# This is the foundational "deny by default" rule.
#
# We intentionally do NOT apply default-deny to kube-system or cnpg-system
# — too easy to break cluster bootstrap.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: postiz
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  # DNS resolution is non-negotiable — every namespace's deny rule allows it.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: n8n
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
