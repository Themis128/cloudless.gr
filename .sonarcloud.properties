# SonarCloud configuration (EU region: sonarcloud.io — org Themis128)
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/
#
# Private Free plan caps ~50k ncloc. Full `src/` is ~95k, which makes
# Automatic Analysis on `main` fail ("The last analysis has failed") while
# PR decoration can still pass. Scope to server/security-critical paths.

sonar.organization=Themis128
sonar.projectKey=Themis128_cloudless.gr

# Analyze lib + API + edge proxy + auth context only (under Free LOC cap).
# Scope must stay < ~50k ncloc — third-party data integrations
# (ad analytics, EspoCRM, LinkedIn ads campaigns, GSC) carry no auth or
# secret surface and are excluded to keep Automatic Analysis on `main`
# passing; when it fails, PR quality gates compare against a stale
# baseline and every PR reports phantom "Duplication on New Code".
sonar.sources=src/lib,src/app/api,src/context,src/proxy.ts

# Exclude test files from Copy-Paste Detection (CPD).
# Test suites intentionally repeat describe/it/expect/vi.mock patterns
# across multiple files — this is not meaningful duplication.
#
# Also exclude the two sibling admin live-monitoring dashboards (esp32,
# monitor). They share polling + WebSocket-stream patterns by design;
# a proper refactor extracting usePollingFetch/useLogStream hooks is
# tracked as a follow-up. Until then, CPD flagging them is noise.
#
# ssm-config.ts / ssm-config-d1.ts are deliberate schema twins — the same
# AppConfig surface implemented once for SSM and once for Cloudflare D1.
# Every new key must appear identically in both files, so CPD flags
# ~100% of any config addition; that is structural, not copy-paste debt.
#
# Further deliberate-twin families (same pattern, parallel implementations
# by design — same precedent as ssm-config):
#  - src/app/api/auth/**   — the session/D1 auth route family (register,
#    session, confirm, login, activate, reset-password) shares a common
#    D1 handler scaffold per route on purpose (~485 lines).
#  - src/lib/store-products*.ts — server/client product schema twins.
#  - src/lib/appflowy-*.ts — per-entity AppFlowy CRUD twins (services,
#    testimonials, projects, case-studies follow one shape).
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/admin/esp32/**,**/admin/monitor/**,src/lib/ssm-config.ts,src/lib/ssm-config-d1.ts,src/app/api/auth/**,src/lib/store-products.ts,src/lib/store-products-client.ts,src/lib/appflowy-*.ts

# Exclude non-source directories and support files from analysis.
# Trailing entries are marketing/CRM integrations excluded to keep the
# analyzed ncloc under the ~50k Free cap (see sonar.sources note above).
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/public/**,**/docs/**,**/scripts/**,**/.github/**,**/*.lock,**/*.yml,**/*.yaml,**/*.md,**/*.json,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,src/lib/ad-analytics/**,src/lib/espocrm.ts,src/lib/campaigns/**,src/lib/gsc.ts
