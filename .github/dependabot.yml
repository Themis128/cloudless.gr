version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Athens
  open-pull-requests-limit: 5
  reviewers:
  - Themis128
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
      patterns:
      - '*'
      exclude-patterns:
      - next
      - sst
      - typescript
      - eslint
      - '@dsnp/parquetjs'
    major:
      update-types:
      - major
  ignore:
      # SST and Next.js majors need careful testing
  - dependency-name: sst
    update-types: [version-update:semver-major]
  - dependency-name: next
    update-types: [version-update:semver-major]
      # eslint v10 cannot land while `eslint-plugin-react` is in the lint
      # config — its peer range still caps at eslint ^9.7 and no v10-compatible
      # release exists (latest stable 7.37.5, no 8.x/9.x/10.x lines, the `next`
      # tag is an older 7.8.0-rc.0). Re-enable when the plugin ships v10
      # support (or after migrating to @eslint-react/eslint-plugin).
  - dependency-name: eslint
    update-types: [version-update:semver-major]
      # @dsnp/parquetjs ships an EMPTY tarball (no dist/) in every release
      # after 1.8.9 — 1.9.3 installs 9 doc files and no code, breaking all
      # ETL workflows with "Cannot find package .../dist/parquet.js".
      # Pinned to 1.8.9 by scripts/etl/package.json — do not bump until a
      # release actually ships dist/ again.
  - dependency-name: '@dsnp/parquetjs'

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Athens
  open-pull-requests-limit: 3
  labels:
  - ci
