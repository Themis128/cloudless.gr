name: omv recovery via omv-ha

# Recovery lane for when omv's tailscaled/GH-runners/docker are down but the
# host is up: runs on the omv-ha-deploy runner (same LAN), injects OMV_SSH_KEY
# and SSHes to omv over LAN to restart docker + actions-runner units.
#
# Trigger: workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probe only — no restarts'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recover:
    name: omv recovery via omv-ha LAN SSH
    runs-on: [self-hosted, omv-ha, deploy]
    timeout-minutes: 12
    env:
      PI_USER: tbaltzakis
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OMV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for h in 192.168.1.200 192.168.1.128 192.168.1.130; do
            ssh-keyscan -T5 -H "$h" >> ~/.ssh/known_hosts 2>/dev/null || true
          done

      - name: Probe omv candidate hosts
        id: probe
        run: |
          for h in 192.168.1.200 192.168.1.128 192.168.1.130; do
            OUT=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=6 \
                 "$PI_USER@$h" 'hostname' 2>/dev/null || true)
            echo "$h -> ${OUT:-unreachable}"
            # Only accept the host that identifies as omv (not omv-ha itself).
            if [ "$OUT" = "omv" ]; then
              echo "OMV_HOST=$h" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Restart docker + runner services on omv
        if: inputs.dry_run == false && steps.probe.outputs.OMV_HOST != ''
        run: |
          h="${{ steps.probe.outputs.OMV_HOST }}"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$PI_USER@$h" '
            echo "=== docker state ==="; sudo systemctl is-active docker || true;
            sudo systemctl start docker 2>/dev/null || true; sleep 5;
            docker ps --format "{{.Names}}\t{{.Status}}" 2>/dev/null | head -15;
            echo "=== runner units ===";
            sudo systemctl list-units --all --plain "actions.runner.*.service" --no-legend | awk "{print \$1, \$3, \$4}";
            UNITS=$(systemctl list-units --all --plain "actions.runner.*.service" --no-legend | awk "{print \$1}");
            FAILED=0; for u in $UNITS; do sudo systemctl restart "$u" && echo "restarted $u" || { echo "restart failed: $u"; FAILED=1; }; done;
            echo "=== tailscaled ===";
            sudo systemctl is-active tailscaled || sudo systemctl start tailscaled;
            [ "$FAILED" = "0" ]'
