name: Modern Web Guidance

# Fails PRs that introduce deterministic legacy web-platform patterns
# (IME-unsafe Enter handlers, unthemed color-scheme overrides, etc.).
# Scanner: https://github.com/GoogleChrome/modern-web-guidance — the same
# rules the .agents/skills/modern-web-guidance skill applies during
# development. Deterministic rules only (~35 rules / 33 guides); the
# semantic catalog is covered by the skill at authoring time.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "workers/**"
      - "*.html"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "workers/**"
      - "*.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-web-guidance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan for legacy web patterns
        id: scan
        run: |
          set +e
          # Scope to files changed by this PR/push — the gate exists to catch
          # patterns a change *introduces*, not pre-existing repo-wide debt
          # (a floated @latest scanner release must not retroactively fail
          # every open PR).
          case "${{ github.event_name }}" in
            pull_request)
              changed=$(git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}...HEAD")
              ;;
            push)
              if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                changed=$(git diff --name-only --diff-filter=ACMR "${{ github.event.before }}..HEAD")
              else
                changed=$(git diff --name-only --diff-filter=ACMR "HEAD~1..HEAD")
              fi
              ;;
            *)
              # workflow_dispatch / other events: diff the checked-out ref
              # against the default branch so a manual run reports the same
              # introduced-pattern scope as a PR.
              defbranch="${{ github.event.repository.default_branch }}"
              git fetch --no-tags --depth=1 origin "+refs/heads/${defbranch}:refs/remotes/origin/${defbranch}" 2>/dev/null || true
              changed=$(git diff --name-only --diff-filter=ACMR "origin/${defbranch}...HEAD" 2>/dev/null || true)
              ;;
          esac
          mapfile -t file_list < <(printf '%s\n' "$changed" | grep -E '\.(jsx?|tsx?|mjs|cjs|css|html?)$' | while IFS= read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done)
          if [ "${#file_list[@]}" -eq 0 ]; then
            echo '{"totalFindings":0}' > mwg-scan.json
          else
            npx -y modern-web-guidance@latest legacy-scan "${file_list[@]}" --json > mwg-scan.json
          fi
          set -e
          count=$(jq -r '.totalFindings' mwg-scan.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## Modern Web Guidance — legacy pattern scan"
            echo ""
            echo "Findings: **$count**"
            if [ "$count" -gt 0 ]; then
              echo ""
              echo '```json'
              jq '{guides: [.guides[] | {guideId, rules: [.rules[] | {ruleId, count, findings: [.findings[] | {file, line, message}]}]}]}' mwg-scan.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::error::modern-web-guidance found $count legacy pattern(s) — see step summary"
            exit 1
          fi

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modern-web-guidance-scan
          path: mwg-scan.json
          retention-days: 14
