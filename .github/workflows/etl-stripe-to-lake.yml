name: ETL — Stripe to Data Lake

on:
  schedule:
    - cron: '30 3 * * *'  # daily 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: us-east-1
  BUCKET: cloudless-analytics-data

jobs:
  stripe-sync:
    name: Sync Stripe → S3 Parquet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # `npm ci` uses scripts/etl/package-lock.json so the ETL container
        # gets the exact same deps every run. Previous `npm install stripe@18`
        # ignored the lockfile and pinned 4 majors behind main app's stripe.
        run: npm ci
        working-directory: scripts/etl

      - name: Run Stripe ETL
        run: node scripts/etl/stripe-to-lake.mjs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ANALYTICS_BUCKET: ${{ env.BUCKET }}

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": ":x: ETL — Stripe to Data Lake failed on '"$GITHUB_REF_NAME"' (#'"$GITHUB_RUN_NUMBER"'). See https://github.com/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"'"
            }'
