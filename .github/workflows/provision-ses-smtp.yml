name: Provision SES SMTP credentials

# One-shot provisioner for the SES SMTP credential Keycloak needs to send
# registration verification emails. Uses the OIDC deploy role (no static keys,
# no PAT). Idempotent: skips if the SSM params already exist.
#
# After it succeeds, trigger keycloak-configure-email.yml to apply the creds to
# the realm (or it runs automatically on its own next push).
#
# Requires AWS_DEPLOY_ROLE_ARN to allow: iam:GetUser, iam:CreateUser,
# iam:PutUserPolicy, iam:ListAccessKeys, iam:CreateAccessKey,
# iam:DeleteAccessKey, ssm:GetParameter, ssm:PutParameter. If it lacks
# iam:CreateUser the run fails cleanly with the exact missing permission.

on:
  workflow_dispatch:
    inputs:
      smtp_user:
        description: "Pre-created SES SMTP username (access key ID from AWS Console → SES → SMTP Settings). Leave blank to auto-provision via IAM."
        required: false
        default: ""
      smtp_password:
        description: "Pre-created SES SMTP password (derived credential shown at creation time — NOT the IAM secret key). Leave blank to auto-provision."
        required: false
        default: ""
      from_email:
        description: "Verified From address, e.g. noreply@cloudless.gr. Leave blank to keep existing or use default."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-ses-smtp.yml"
      - "scripts/provision-ses-smtp.sh"

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: provision-ses-smtp
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Provision SES SMTP creds into SSM
        id: provision
        env:
          AWS_REGION: us-east-1
          # Manual-bypass: if the user provided pre-created SES SMTP creds via
          # workflow_dispatch inputs, the script writes them straight to SSM and
          # skips IAM user creation (works without iam:CreateUser permission).
          TRIGGERED_BY: ${{ github.event_name }}
          SES_SMTP_USER_INPUT: ${{ github.event.inputs.smtp_user }}
          SES_SMTP_PASSWORD_INPUT: ${{ github.event.inputs.smtp_password }}
          SES_FROM_INPUT: ${{ github.event.inputs.from_email }}
        run: |
          # pipefail is required: without it, `script | tee` returns tee's exit
          # code (0) and masks the script's failure, falsely marking the job green.
          set -o pipefail
          bash scripts/provision-ses-smtp.sh 2>&1 | tee provision.log

      - name: Post result to tracking issue
        if: always()
        run: |
          {
            echo "# SES SMTP provisioning — $(date -u '+%F %T')Z"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo ""
            echo '```'
            cat provision.log 2>/dev/null || echo '(no log)'
            echo '```'
          } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
