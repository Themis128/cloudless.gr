name: Store SES SMTP credentials from GitHub Secrets → SSM → Keycloak

# Bypasses the iam:CreateUser blocker by reading pre-created SES SMTP credentials
# from GitHub Secrets and storing them directly to SSM, then configuring Keycloak.
#
# HOW TO USE (one-time setup):
#   1. AWS Console → SES → SMTP Settings → "Create SMTP credentials"
#      - Creates an IAM user automatically (this page does it, not you)
#      - Shows you the SMTP username (= IAM access key ID) and password ONCE
#      - Copy both values now — the password can't be retrieved later
#
#   2. GitHub → repo Settings → Secrets and variables → Actions → New secret:
#        SES_SMTP_USER     = the username shown in step 1
#        SES_SMTP_PASSWORD = the password shown in step 1
#
#   3. Push any change to this file (or touch it via the GitHub UI) to trigger.
#      The workflow writes the creds to SSM and configures Keycloak's email realm.
#
# Idempotent: safe to re-run. If creds already exist in SSM, skips the write.
# From address defaults to noreply@cloudless.gr (must be a verified SES address).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ses-smtp-from-secret.yml"
  workflow_dispatch:
    inputs:
      from_email:
        description: "Verified From address (default: noreply@cloudless.gr)"
        required: false
        default: "noreply@cloudless.gr"
      force:
        description: "Overwrite SSM params even if they already exist"
        type: boolean
        required: false
        default: false

permissions:
  id-token: write   # OIDC → AWS_DEPLOY_ROLE_ARN to write SSM params
  contents: read
  issues: write

concurrency:
  group: ses-smtp-setup
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  store-and-configure:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Validate secrets are set
        env:
          SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SMTP_PASS: ${{ secrets.SES_SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then
            echo "::error::SES_SMTP_USER and/or SES_SMTP_PASSWORD GitHub Secrets are not set."
            echo ""
            echo "Steps:"
            echo "  1. AWS Console → SES → SMTP Settings → Create SMTP credentials"
            echo "  2. GitHub → repo Settings → Secrets → add SES_SMTP_USER and SES_SMTP_PASSWORD"
            echo "  3. Re-trigger this workflow (push to this file or workflow_dispatch)"
            exit 1
          fi
          echo "✓ Both SES_SMTP_USER and SES_SMTP_PASSWORD secrets are present"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write SMTP credentials to SSM
        id: ssm
        env:
          SMTP_USER: ${{ secrets.SES_SMTP_USER }}
          SMTP_PASS: ${{ secrets.SES_SMTP_PASSWORD }}
          FROM_EMAIL: ${{ github.event.inputs.from_email || 'noreply@cloudless.gr' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail
          P_USER="/cloudless/production/SES_SMTP_USER"
          P_PASS="/cloudless/production/SES_SMTP_PASSWORD"
          P_FROM="/cloudless/production/SES_FROM_EMAIL"

          # Idempotency check (skip unless --force)
          EXISTING=$(aws ssm get-parameter --name "$P_USER" \
            --query 'Parameter.Value' --output text 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$FORCE" != "true" ]; then
            echo "✓ SES_SMTP_USER already in SSM (${EXISTING}). Skipping write (use force=true to overwrite)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$SMTP_PASS"
            aws ssm put-parameter --name "$P_USER" --type String \
              --overwrite --value "$SMTP_USER" \
              --description "SES SMTP username — from GitHub Secret" >/dev/null
            echo "  ✓ wrote $P_USER"
            aws ssm put-parameter --name "$P_PASS" --type SecureString \
              --overwrite --value "$SMTP_PASS" \
              --description "SES SMTP password — from GitHub Secret" >/dev/null
            echo "  ✓ wrote $P_PASS (SecureString)"
            # Set FROM if missing
            EXISTING_FROM=$(aws ssm get-parameter --name "$P_FROM" \
              --query 'Parameter.Value' --output text 2>/dev/null || true)
            if [ -z "$EXISTING_FROM" ] || [ "$FORCE" = "true" ]; then
              aws ssm put-parameter --name "$P_FROM" --type String \
                --overwrite --value "$FROM_EMAIL" \
                --description "SES verified From address" >/dev/null
              echo "  ✓ wrote $P_FROM=$FROM_EMAIL"
            fi
            echo "SSM_USER=$SMTP_USER" >> "$GITHUB_ENV"
            echo "✓ SMTP credentials written to SSM"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Keycloak email (apply SMTP to realm)
        id: keycloak
        env:
          AWS_DEFAULT_REGION: us-east-1
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -uo pipefail
          # Read SMTP creds from SSM (just written or pre-existing)
          SMTP_USER=$(aws ssm get-parameter \
            --name /cloudless/production/SES_SMTP_USER \
            --query 'Parameter.Value' --output text 2>/dev/null)
          SMTP_PASSWORD=$(aws ssm get-parameter \
            --name /cloudless/production/SES_SMTP_PASSWORD \
            --with-decryption --query 'Parameter.Value' --output text 2>/dev/null)
          FROM_EMAIL=$(aws ssm get-parameter \
            --name /cloudless/production/SES_FROM_EMAIL \
            --query 'Parameter.Value' --output text 2>/dev/null)
          [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$FROM_EMAIL" ] \
            || { echo "ERROR: SMTP creds missing from SSM"; exit 1; }
          echo "::add-mask::$SMTP_PASSWORD"
          export SMTP_USER SMTP_PASSWORD FROM_EMAIL
          bash scripts/keycloak-configure-email.sh 2>&1 | tee email-cfg.log

      - name: Post result to tracking issue
        if: always()
        run: |
          SKIPPED="${{ steps.ssm.outputs.skipped || 'false' }}"
          JOB="${{ job.status }}"
          {
            echo "# SES SMTP → Keycloak email config — $(date -u '+%F %T')Z"
            echo ""
            echo "**Status:** $JOB"
            if [ "$SKIPPED" = "true" ]; then
              echo "**SSM write:** skipped (creds already present — use force=true to overwrite)"
            else
              echo "**SSM write:** done (user: ${SSM_USER:-<from secret>})"
            fi
            echo ""
            echo '```'
            cat email-cfg.log 2>/dev/null || echo '(no log)'
            echo '```'
          } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
