name: Sync n8n workflows

# Push all workflow JSON files from infrastructure/n8n/workflows/ into the
# live n8n instance via the n8n REST API (X-N8N-API-KEY auth).
#
# Match by name: existing workflows are updated (nodes/connections/settings);
# their active state is preserved. New workflows are created (inactive unless
# the JSON has active:true).
#
# Requires GitHub Secrets:
#   TAILSCALE_OAUTH_CLIENT_ID, TAILSCALE_OAUTH_SECRET  — ephemeral CI node
#   N8N_API_KEY                                         — n8n Settings → n8n API

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/n8n/workflows/**.json'
      - 'scripts/n8n-sync-workflows.mjs'
      - '.github/workflows/sync-n8n-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-n8n-workflows
  cancel-in-progress: false

jobs:
  sync:
    name: Sync workflow JSONs → n8n
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Connect to tailnet
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888   # v4.1.3
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        tags: tag:ci

    - name: Sync workflow JSONs → n8n
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        N8N_API_URL: http://100.74.191.58:30900
        N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      run: node scripts/n8n-sync-workflows.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `n8n workflow sync failed — run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: `:x: *n8n workflow sync failed* — <https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}|View run>` }
              }]
            };
            await fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          }
