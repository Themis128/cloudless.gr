name: Sync n8n workflows

# Push all workflow JSON files from infrastructure/n8n/workflows/ into the
# live n8n pod via kubectl exec + `n8n import:workflow`.
#
# No API key required — uses the Pi self-hosted runner which has kubectl
# access to the k3s cluster directly.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/n8n/workflows/**.json'
      - 'scripts/n8n-sync-workflows.mjs'
      - '.github/workflows/sync-n8n-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-n8n-workflows
  cancel-in-progress: false

jobs:
  sync:
    name: Sync workflow JSONs → n8n
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Sync workflow JSONs → n8n
      env:
        N8N_NAMESPACE: n8n
      run: node scripts/n8n-sync-workflows.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `n8n workflow sync failed — run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: `:x: *n8n workflow sync failed* — <https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}|View run>` }
              }]
            };
            await fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
          }
