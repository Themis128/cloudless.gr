name: omv apply pending config changes

# Applies OpenMediaVault's pending configuration changes — the web UI banner
# "The configuration has been changed. You must apply the changes" — without
# logging into the UI. Uses the same RPC as the UI's Apply button
# (`omv-rpc Config applyChanges`, engined/rpc/config.inc), which deploys every
# dirty module AND clears /var/lib/openmediavault/dirtymodules.json, so the
# banner and pending-changes notifications go away. Runs directly on the omv
# self-hosted runner.
#
# Never print config values here: the repo is public and OMV config contains
# secrets (e.g. the SMTP relay password).
#
# Trigger: workflow_dispatch.
#   apply=false (default): diagnostics only — lists dirty module names and
#                          Config.isDirty. No changes.
#   apply=true:            calls Config.applyChanges (same as the UI Apply
#                          button), then re-checks Config.isDirty.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Deploy all dirty modules (default: diagnostics only)'
        required: false
        type: boolean
        default: false

# Two dispatches on the same host must never overlap — concurrent
# applyChanges calls race on the same dirtymodules/salt state.
concurrency:
  group: omv-apply-pending-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-pending:
    name: omv pending config changes
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 15
    env:
      APPLY: ${{ format('{0}', inputs.apply) == 'true' }}
    steps:
      - name: Show pending (dirty) modules
        run: |
          set -uo pipefail
          DIRTY=/var/lib/openmediavault/dirtymodules.json
          echo "=== $DIRTY (module names only) ==="
          if sudo test -f "$DIRTY"; then
            sudo cat "$DIRTY"
          else
            echo "(no dirtymodules.json — nothing pending)"
          fi
          echo
          echo "=== Config.isDirty ==="
          sudo omv-rpc -u admin 'Config' 'isDirty' '{}'

      - name: Apply pending changes (Config.applyChanges, same as UI Apply)
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          sudo omv-rpc -u admin 'Config' 'applyChanges' '{"modules": [], "force": false}'
          echo
          # applyChanges spawns module deploys; isDirty can lag — poll until
          # OMV reports clean (up to ~4 min) instead of checking once.
          echo "=== Config.isDirty after apply (polling, expect false) ==="
          RESULT=""
          for i in $(seq 1 48); do
            RESULT=$(sudo omv-rpc -u admin 'Config' 'isDirty' '{}')
            if [ "$RESULT" = "false" ]; then break; fi
            sleep 5
          done
          echo "$RESULT"
          if [ "$RESULT" != "false" ]; then
            echo "::error::OMV still reports pending changes after applyChanges"
            exit 1
          fi
