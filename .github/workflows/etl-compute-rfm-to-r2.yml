name: 'ETL: Compute RFM to R2'
# Reads lake/transactions parquet → writes ml-parquet RFM/churn scores.
# Runs after Stripe ETL so clients-to-r2 can join scores.

on:
  schedule:
  - cron: 15 6 * * *       # daily 06:15 UTC — after stripe (06:00), before clients (06:45)
  workflow_run:
    workflows: ['ETL: Stripe to R2']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-compute-rfm-to-r2
  cancel-in-progress: false

jobs:
  etl:
    name: Compute RFM → R2
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, omv, build]
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.3.1

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: scripts/etl
      run: |
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Run RFM compute → R2
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node compute-rfm-churn-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: Compute RFM to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: Compute RFM to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }
