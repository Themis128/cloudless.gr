name: Restart omv runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart:
    runs-on: [self-hosted, omv, build]
    timeout-minutes: 5
    steps:
      - name: Check omv node SSH and restart runner service
        run: |
          echo "=== omv-build node info ==="
          hostname && ip addr show | grep "inet " | head -5

          echo ""
          echo "=== Try SSH to omv-main (192.168.1.128) ==="
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            omv@192.168.1.128 \
            "sudo systemctl status actions.runner.* | head -20 && sudo systemctl restart actions.runner.*" \
            2>&1 || echo "SSH to 192.168.1.128 failed"

          echo ""
          echo "=== Try SSH via Tailscale ==="
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            omv@100.113.41.119 \
            "sudo systemctl restart actions.runner.*" \
            2>&1 || echo "SSH to 100.113.41.119 failed"
