name: CI Failure Babysitter (Agentic)

# Phase 5 of AGENTS_ROADMAP.md — Agentic CI.
# When a monitored workflow fails, this:
# 1. Fetches failed job logs
# 2. Calls Claude for root-cause analysis  
# 3. Auto-assigns GitHub Copilot coding agent to fix the issue
# 4. Posts diagnosis to the relevant PR (or tracking issue #382)

on:
  workflow_run:
    workflows:
      - CI
      - Deploy to Production
      - build pi image
      - Deploy to Pi
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed run ID to narrate"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  diagnose:
    name: Diagnose CI failure
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      pull-requests: write   # post PR comment
      issues: write          # post to tracking issue #382
      actions: read          # fetch job logs
      id-token: write        # OIDC → AWS SSM for ANTHROPIC_API_KEY

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Anthropic SDK
        run: pnpm add -D @anthropic-ai/sdk --no-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch ANTHROPIC_API_KEY from SSM
        id: ssm
        run: |
          KEY=$(aws ssm get-parameter \
            --name "/cloudless/production/ANTHROPIC_API_KEY" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Diagnose and auto-fix
        if: steps.ssm.outputs.key != ''
        id: diagnosis
        env:
          ANTHROPIC_API_KEY: ${{ steps.ssm.outputs.key }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run?.name || 'Manual trigger' }}
          RUN_ID: ${{ github.event.workflow_run?.id || github.event.inputs.run_id }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run?.head_branch || '' }}
          HEAD_SHA: ${{ github.event.workflow_run?.head_sha || '' }}
          PR_NUMBER: >-
            ${{ github.event.workflow_run?.pull_requests[0].number || '' }}
        run: |
          DIAGNOSIS=$(node scripts/ci-babysitter.mjs --json)
          echo "diagnosis<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIAGNOSIS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "$DIAGNOSIS" > diagnosis.json

      - name: Create auto-fix issue
        if: |
          steps.ssm.outputs.key != '' &&
          steps.diagnosis.outputs.diagnosis != '' &&
          github.event.workflow_run?.conclusion == 'failure'
        id: issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse the diagnosis and create an issue for Copilot coding agent
          python3 << 'PY'
          import json
          import os
          import subprocess
          
          diagnosis = json.loads(os.environ.get("DIAGNOSIS", "{}"))
          workflow_name = os.environ.get("WORKFLOW_NAME", "Unknown")
          head_branch = os.environ.get("HEAD_BRANCH", "")
          head_sha = os.environ.get("HEAD_SHA", "")
          pr_number = os.environ.get("PR_NUMBER", "")
          repo = os.environ.get("REPO", "Themis128/cloudless.gr")
          
          # Fall back to reading from diagnosis.json if env not set
          if not diagnosis:
              try:
                  with open("diagnosis.json") as f:
                      diagnosis = json.load(f)
              except:
                  pass
          
          root_cause = diagnosis.get("root_cause", "Unknown failure")
          fix = diagnosis.get("fix", "No fix suggested")
          
          # Create issue body with agent-friendly instructions
          body = f"""## 🤖 Agentic CI Fix: {workflow_name}

**Root Cause:** {root_cause}

**Suggested Fix:** {fix}

**Context:**
- Workflow: {workflow_name}
- Branch: `{head_branch}`
- SHA: `{head_sha}`
- PR: #{pr_number}

**Auto-fix instructions for GitHub Copilot:**
Please analyze the failure and propose a patch. Use the CodingAgent pattern:
1. Review the affected files in `src/`, `scripts/`, or `infrastructure/`
2. Create a minimal, targeted fix
3. Run `pnpm lint && pnpm typecheck && pnpm build` to verify
4. Push to a branch and create a PR

/cc @copilot-for-github-actions
"""
          
          # Create issue via GitHub API
          cmd = [
              "gh", "issue", "create",
              "--title", f"Auto-fix: {workflow_name} failure on {head_branch}",
              "--body", body,
              "--label", "auto-fix",
              "--label", "agentic-ci"
          ]
          result = subprocess.run(cmd, capture_output=True, text=True)
          if result.returncode == 0:
              issue_url = result.stdout.strip()
              print(f"Created auto-fix issue: {issue_url}")
              # Extract issue number
              import re
              match = re.search(r'/issues/(\d+)', issue_url)
              if match:
                  print(f"ISSUE_NUMBER={match.group(1)}")
          else:
              print(f"Failed to create issue: {result.stderr}")
              print("ISSUE_NUMBER=")
          PY

      - name: Post diagnosis to PR
        if: steps.diagnosis.outputs.diagnosis != '' && PR_NUMBER != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run?.pull_requests[0].number }}
        run: |
          # Post the diagnosis as a PR comment if we have a PR
          node - << 'JS'
          const diagnosis = require("./diagnosis.json");
          const prNumber = process.env.PR_NUMBER;
          if (prNumber) {
            const { execSync } = require("child_process");
            const body = `## 🔍 CI Failure Diagnosis

**Root cause:** ${diagnosis.root_cause || 'Unknown'}

**Fix:** ${diagnosis.fix || 'No fix suggested'}

**Confidence:** ${diagnosis.confidence || 'Unknown'}

_Auto-fix issue created — GitHub Copilot will investigate._`;
            try {
              execSync(`gh pr comment ${prNumber} --body '${body}'`, { stdio: "inherit" });
            } catch (e) {
              console.log("Could not post PR comment:", e.message);
            }
          }
          JS

      - name: Skip (API key absent)
        if: steps.ssm.outputs.key == ''
        run: echo "ANTHROPIC_API_KEY not in SSM — skipping diagnosis."