name: PR Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  # Dispatch-only. The Anthropic API call fails with 400 "credit balance
  # too low" while the account is unfunded. Until credits are added at
  # platform.claude.com/settings/billing, scheduled/auto runs would generate
  # GH email noise on every fire. Stays available for manual dispatch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

# One review per PR at a time; cancel stale runs on new push
concurrency:
  group: pr-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    # Failover-capable: defaults to ubuntu-latest. Flip via
    #   .github/scripts/toggle-runner.sh pi
    # when GH-hosted billing is broken.
    runs-on: ubuntu-latest
    # Skip bots, dependabot, and revert branches
    if: |
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'revert/')

    permissions:
      contents: read
      pull-requests: write
      id-token: write       # for OIDC → AWS (to fetch ANTHROPIC_API_KEY from SSM)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6
      with:
        fetch-depth: 0

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020         # v7.0.0
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Anthropic SDK (CI-only dep for review script)
      run: pnpm add -D @anthropic-ai/sdk --no-lockfile

    - name: Read Anthropic API key from repository secrets
      run: |
        KEY="${{ secrets.ANTHROPIC_API_KEY }}"
        if [ -z "$KEY" ] || [ "$KEY" = "None" ]; then
          echo "::warning::ANRTHOPIC_API_KEY not set in repo secrets — PR review will run without Anthropic and may skip some analyses."
        else
          echo "::add-mask::$KEY"
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
        fi

    - name: Build diff (src/ + root configs vs base branch)
      id: diff
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BASE_REF="${{ github.base_ref }}"
        if [ -z "$BASE_REF" ]; then
          BASE_REF=$(gh pr view "${{ inputs.pr_number }}" --json baseRefName -q .baseRefName)
        fi
        git fetch origin "$BASE_REF" --depth=50
        git diff "origin/${BASE_REF}...HEAD" \
          -- 'src/**' 'sentry.*.config.ts' 'instrumentation.ts' \
          > pr.diff
        LINES=$(wc -l < pr.diff)
        echo "Diff: $LINES lines"
        echo "diff_lines=$LINES" >> "$GITHUB_OUTPUT"

    - name: Run Claude PR review
      env:
        PR_NUMBER: ${{ inputs.pr_number || github.event.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: node scripts/pr-review.mjs

    - name: Post review comment
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PR="${{ inputs.pr_number || github.event.number }}"
        if [ ! -s review.md ]; then
          echo "No review output — skipping comment."
          exit 0
        fi
        # Update existing bot comment if present, otherwise create new
        gh pr comment "$PR" \
          --body-file review.md \
          --edit-last 2>/dev/null || \
        gh pr comment "$PR" \
          --body-file review.md
