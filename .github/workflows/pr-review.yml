name: PR Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Dispatch-only. The Anthropic API call fails with 400 "credit balance
  # too low" while the account is unfunded. Until credits are added at
  # platform.claude.com/settings/billing, scheduled/auto runs would generate
  # GH email noise on every fire. Stays available for manual dispatch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

# One review per PR branch at a time; cancel stale runs on new push
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    # Failover-capable: defaults to ubuntu-latest. Flip via
    #   .github/scripts/toggle-runner.sh pi
    # when GH-hosted billing is broken.
    runs-on: ubuntu-latest
    # Skip bots, dependabot, and revert branches
    if: |
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'revert/')

    permissions:
      contents: read
      pull-requests: write
      id-token: write # for OIDC → AWS (to fetch ANTHROPIC_API_KEY from SSM)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Anthropic SDK (CI-only dep for review script)
        run: pnpm add -D @anthropic-ai/sdk --no-lockfile

      # Reuse the OIDC role already configured for deploys
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Anthropic API key from SSM
        run: |
          KEY=$(aws ssm get-parameter \
            --name /cloudless/production/ANTHROPIC_API_KEY \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build diff (src/ + root configs vs base branch)
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" \
            -- 'src/**' 'sentry.*.config.ts' 'instrumentation.ts' \
            > pr.diff
          LINES=$(wc -l < pr.diff)
          echo "Diff: $LINES lines"
          echo "diff_lines=$LINES" >> "$GITHUB_OUTPUT"
        id: diff

      - name: Run Claude PR review
        env:
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/pr-review.mjs

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s review.md ]; then
            echo "No review output — skipping comment."
            exit 0
          fi
          # Update existing bot comment if present, otherwise create new
          gh pr comment "${{ github.event.number }}" \
            --body-file review.md \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.number }}" \
            --body-file review.md
