name: Cloudflare HA load balancer (RETIRED)

# Cloudflare Load Balancer is moot: the k3s cluster is single-node as of
# 2026-08-08 (omv-ha was drained). HA failover is now handled by
# ha-failover-watchdog.yml. Do not provision a paid Cloudflare LB.
# Cloudflare Free only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-lb
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
    - name: Cloudflare LB retired
      run: |
        echo "::error::Cloudflare HA LB is retired. Cluster is single-node; use ha-failover-watchdog.yml instead."
        exit 1
