name: 'ETL: AppFlowy to R2'
# AppFlowy workspaces/users via kubectl+psql on cluster postgres → R2.
# Uses Tailscale (tag:ci ephemeral node → k3s API at 100.74.191.58:6443).

on:
  schedule:
  - cron: 40 6 * * *       # daily 06:40 UTC — before materialize :45
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-appflowy-to-r2
  cancel-in-progress: false

jobs:
  etl:
    name: Run AppFlowy → R2 sync
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: scripts/etl
      run: |
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Connect to tailnet
      uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3         # v3.2.4
      with:
        oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        tags: tag:ci

    - name: Configure kubectl
      run: |
        # Runner env often sets KUBECONFIG=/etc/rancher/k3s/k3s.yaml (unreadable).
        # Always pin to a home-owned config from KUBECONFIG_B64.
        mkdir -p "$HOME/.kube"
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
        echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
        kubectl --kubeconfig="$HOME/.kube/config" get ns >/dev/null

    - name: Run AppFlowy-to-R2 sync
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: |
        export KUBECONFIG="${KUBECONFIG:-$HOME/.kube/config}"
        node appflowy-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: AppFlowy to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: AppFlowy to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }
