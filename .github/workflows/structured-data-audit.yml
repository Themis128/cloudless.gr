name: Structured Data Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/structured-data.ts'
      - 'src/components/JsonLd.tsx'
      - '__tests__/structured-data.test.ts'
      - 'src/app/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: JSON-LD Tests
    runs-on: [self-hosted, omv]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci -- __tests__/structured-data.test.ts
