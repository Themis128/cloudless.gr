name: I18N Quality Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main]
    paths:
    - src/locales/**
    - src/lib/i18n.ts
    - __tests__/locales-parity.test.ts
    - scripts/audit/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: Locale Parity and Placeholder Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020         # v7.0.0
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      # See api-contract-audit.yml: dropping `--` so vitest sees the file as
      # a filter rather than a stray positional arg that triggers a full run.
    - run: pnpm test:ci __tests__/locales-parity.test.ts
    - run: node scripts/audit/check-i18n-placeholders.mjs
