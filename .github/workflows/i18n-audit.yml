name: I18N Quality Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/locales/**'
      - 'src/lib/i18n.ts'
      - '__tests__/locales-parity.test.ts'
      - 'scripts/audit/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: Locale Parity and Placeholder Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See api-contract-audit.yml: dropping `--` so vitest sees the file as
      # a filter rather than a stray positional arg that triggers a full run.
      - run: pnpm test:ci __tests__/locales-parity.test.ts
      - run: node scripts/audit/check-i18n-placeholders.mjs
