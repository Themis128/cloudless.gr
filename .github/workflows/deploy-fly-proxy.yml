name: Deploy Fly.io Proxy

# Deploy the Fly.io HA failover proxy that sits in front of AWS CloudFront + Pi k3s.
# Handles automatic failover when AWS health check fails.
# Requires FLY_API_TOKEN secret with write access.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Actually deploy (true) or dry-run (false)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Fly.io proxy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd fly-proxy-app
          flyctl deploy --remote-only --app cloudless-proxy
        if: ${{ github.event.inputs.apply != 'false' }}

      - name: Show deployment status
        run: |
          flyctl status --app cloudless-proxy || echo "App not yet deployed"