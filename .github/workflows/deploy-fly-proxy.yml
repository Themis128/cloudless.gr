name: Deploy Fly.io HA Proxy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually deploy (true) or dry-run (false)
        type: boolean
        default: true

concurrency:
  group: deploy-fly-proxy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Fly cloudless-proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Require secrets
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: |
        if [ -z "$FLY_API_TOKEN" ]; then
          echo "::error::FLY_API_TOKEN secret is not set"
          exit 1
        fi
        if [ -z "$TS_AUTHKEY" ]; then
          echo "::error::TS_AUTHKEY secret is not set (Tailscale fallback)"
          exit 1
        fi

    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Create app if missing
      if: ${{ inputs.apply }}
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: flyctl apps create cloudless-proxy --org personal 2>/dev/null || true

    - name: Set Tailscale auth on Fly
      if: ${{ inputs.apply }}
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: flyctl secrets set TS_AUTHKEY="$TS_AUTHKEY" --app cloudless-proxy 
        --stage

    - name: Deploy
      if: ${{ inputs.apply }}
      working-directory: fly-proxy-app
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: flyctl deploy --remote-only --config fly.toml --app cloudless-proxy

    - name: Status
      if: ${{ always() && inputs.apply }}
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |
        flyctl status --app cloudless-proxy || true
        echo "--- /health ---"
        curl -sS --max-time 25 https://cloudless-proxy.fly.dev/health || true
        echo
        echo "--- /api/health via Fly ---"
        curl -sS --max-time 25 https://cloudless-proxy.fly.dev/api/health || true
        echo
