name: SHA drift detector

# Compares the SSM-published deploy SHA with what each surface
# (cloud cloudless.gr, Pi cloudless.online) actually serves via
# /api/health.version. Fails the run when drift persists past the
# 10-minute grace window so a stuck Pi rollout is caught before the
# weekly CI health routine notices.
#
# Pure comparison logic in src/lib/sha-drift.ts is unit-tested by
# __tests__/detect-sha-drift.test.ts; this workflow is the I/O wrapper.

on:
  schedule:
    # Every 6h on the half-hour (00:30, 06:30, 12:30, 18:30 UTC).
    # Spaced 15 min off the Pi TLS cert check so they don't share a
    # runner slot.
    - cron: '45 */6 * * *'
  workflow_dispatch:
  workflow_run:
    # Also after a deploy completes — gives the most useful signal
    # (right when convergence should be happening).
    workflows: ['HA sync orchestrator']
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: sha-drift
  cancel-in-progress: true

jobs:
  detect:
    name: detect-sha-drift
    runs-on: [self-hosted, omv]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-actions
          aws-region: us-east-1

      - name: detect drift
        id: drift
        # Run the script; capture exit code (0 ok, 1 drift, 2 read error).
        run: |
          set +e
          pnpm exec tsx scripts/detect-sha-drift.mts --json > /tmp/drift.json
          rc=$?
          set -e
          cat /tmp/drift.json
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: write step summary
        if: always()
        run: |
          if [ -s /tmp/drift.json ]; then
            {
              echo "## SHA drift detector"
              echo ""
              echo '```json'
              cat /tmp/drift.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: fail if drifted past grace window
        if: steps.drift.outputs.rc != '0'
        run: |
          echo "::error::Drift detected (exit ${{ steps.drift.outputs.rc }}). See step summary."
          exit 1
