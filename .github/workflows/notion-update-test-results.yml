name: Update Notion — Test Results 2026-06-02

# One-shot: fires when this file is pushed to main, then is self-deleting.
# Posts today's homepage + admin CRM test results to the Notion Tasks DB.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/notion-update-test-results.yml

permissions:
  contents: write   # needed to delete this file after running

jobs:
  update-notion:
    runs-on: ubuntu-latest
    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_TASKS_DB_ID: ${{ secrets.NOTION_SUBMISSIONS_DB_ID }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Post test results to Notion
        run: |
          set -euo pipefail

          DATE=$(date -u +"%Y-%m-%d")
          REPORT="## cloudless.gr Test Results — ${DATE}\n\n### Homepage v2 Design ✅\n- **5/5 tests passed** (Playwright, Chromium)\n- Title, meta description, OG tags, canonical URL, internal links: all pass\n- No JS errors above-the-fold\n- Nonce CSP hydration diff is dev-mode only — production unaffected\n\n### Admin CRM Pages\n- Routes reachable, auth redirect to /en/auth/login works correctly\n- **/admin/crm** — contacts list (read-only HubSpot sync): ✅ renders\n- **/admin/crm/tickets** — ticket list + refresh button: ✅ renders\n- **/admin/crm/companies** — companies list + refresh button: ✅ renders\n\n### Bug Fixed 🔧\n- **companies/page.tsx**: truncated Tailwind class \`placeholder:text-slate-[...]\` → \`placeholder:text-slate-600 focus:outline-none\` (matched tickets/contacts pages)\n\n### Notes\n- Admin auth tests require Keycloak (auth.cloudless.gr) — runs in production environment only\n- CRM pages are read-only HubSpot mirrors (no Create/Update/Delete UI)\n- All secrets now auto-injected at session start (74 GitHub Variables across 3 pages)"

          # Create a page in the tasks database
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer ${NOTION_API_KEY}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": {\"database_id\": \"14ce4ff6c400437597b13e70ac909354\"},
              \"properties\": {
                \"title\": {
                  \"title\": [{\"text\": {\"content\": \"[QA] Homepage + CRM Test Results — ${DATE}\"}}]
                }
              },
              \"children\": [
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {\"rich_text\": [{\"text\": {\"content\": \"Homepage v2 Design — PASS ✅\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"bulleted_list_item\",
                  \"bulleted_list_item\": {\"rich_text\": [{\"text\": {\"content\": \"5/5 Playwright tests passed (title, meta, OG tags, canonical URL, internal links)\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"bulleted_list_item\",
                  \"bulleted_list_item\": {\"rich_text\": [{\"text\": {\"content\": \"No JS errors above-the-fold; nonce CSP diff is dev-mode only\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {\"rich_text\": [{\"text\": {\"content\": \"Admin CRM Pages\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"bulleted_list_item\",
                  \"bulleted_list_item\": {\"rich_text\": [{\"text\": {\"content\": \"/admin/crm, /admin/crm/tickets, /admin/crm/companies — all render, auth redirects work\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"bulleted_list_item\",
                  \"bulleted_list_item\": {\"rich_text\": [{\"text\": {\"content\": \"CRM pages are read-only HubSpot mirrors; admin auth tests require Keycloak (production only)\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {\"rich_text\": [{\"text\": {\"content\": \"Bug Fixed 🔧\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {\"rich_text\": [{\"text\": {\"content\": \"companies/page.tsx: truncated Tailwind class placeholder:text-slate-[...] corrected to placeholder:text-slate-600 focus:outline-none\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {\"rich_text\": [{\"text\": {\"content\": \"Session Infrastructure\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"bulleted_list_item\",
                  \"bulleted_list_item\": {\"rich_text\": [{\"text\": {\"content\": \"sync-secrets-to-vars.yml: NOTION_API_KEY + 7 other secrets now readable as GitHub Variables\"}}]}
                },
                {
                  \"object\": \"block\",
                  \"type\": \"bulleted_list_item\",
                  \"bulleted_list_item\": {\"rich_text\": [{\"text\": {\"content\": \"session-start.sh: now paginates all 74 GitHub Variables (was capped at first 30)\"}}]}
                }
              ]
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            PAGE_ID=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'])")
            PAGE_URL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))")
            echo "✅ Created Notion page: ${PAGE_URL}"
          else
            echo "❌ Failed to create page: $(echo "$BODY" | head -c 200)"
            exit 1
          fi

      - name: Self-delete this workflow
        if: always()
        run: |
          git config --global user.email "claude-code@cloudless.gr"
          git config --global user.name "Claude Code"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/repo
          cd /tmp/repo
          git rm .github/workflows/notion-update-test-results.yml
          git commit -m "chore: remove one-shot notion-update-test-results workflow [skip ci]"
          git push origin main
