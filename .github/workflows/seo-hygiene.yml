name: SEO Hygiene Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src/locales/**'
      - 'scripts/audit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo:
    name: Link Text and SEO Baseline
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check descriptive link text
        run: node scripts/audit/check-generic-link-text.mjs || true
      - name: Validate robots and sitemap presence
        run: |
          test -f src/app/robots.ts
          test -f src/app/sitemap.ts
          echo "robots.ts and sitemap.ts found"
