name: PWA Runtime Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main]
    paths:
    - public/sw.js
    - public/offline.html
    - src/components/ServiceWorkerRegistration.tsx
    - __tests__/sw-runtime.test.ts
    - __tests__/service-worker.test.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: Service Worker Runtime Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v6
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1         # v4
      with:
        dest: ~/setup-pnpm-${{ runner.name }}
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      # See api-contract-audit.yml: dropping `--` so vitest sees the files as
      # filters rather than stray positional args that trigger a full run.
    - run: pnpm test:ci __tests__/sw-runtime.test.ts 
        __tests__/service-worker.test.tsx
