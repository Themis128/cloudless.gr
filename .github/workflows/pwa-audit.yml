name: PWA Runtime Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/sw.js'
      - 'public/offline.html'
      - 'src/components/ServiceWorkerRegistration.tsx'
      - '__tests__/sw-runtime.test.ts'
      - '__tests__/service-worker.test.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: Service Worker Runtime Tests
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See api-contract-audit.yml: dropping `--` so vitest sees the files as
      # filters rather than stray positional args that trigger a full run.
      - run: pnpm test:ci __tests__/sw-runtime.test.ts __tests__/service-worker.test.tsx
