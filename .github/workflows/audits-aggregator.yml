name: Audit Reports Aggregator

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Pulls the latest run of every audit workflow, downloads each report
# artifact, and synthesizes a single rolling dashboard:
#   - audit-report/dashboard.md    (PR / step-summary copy)
#   - audit-report/dashboard.json  (machine-readable, consumed by /admin/audits)
#
# Triggered nightly + on demand. The /admin/audits page in the app fetches
# the latest artifact via the GitHub Actions REST API at request time.

on:
  schedule:
    # Daily at 06:00 UTC — after every other audit has had a chance to land.
  - cron: 0 6 * * *
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: audits-aggregator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: Aggregate Audits
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020         # v7.0.0
      with:
        node-version: 22

    - name: Aggregate
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        set -e
        mkdir -p audit-report

        node scripts/audit/aggregate.mjs \
          --repo "$REPO" \
          --out-dir audit-report

        cat audit-report/dashboard.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload dashboard
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a         # v4
      with:
        name: audits-dashboard-${{ github.run_id }}
        path: audit-report/
        retention-days: 60
        if-no-files-found: error
