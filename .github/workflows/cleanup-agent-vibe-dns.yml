name: 'Cleanup agent/vibe DNS records + Access policies'

# One-off cleanup: deletes Cloudflare DNS CNAME records and Zero Trust Access
# applications for agent.cloudless.gr and vibe.cloudless.gr.
# Both subdomains backed the never-deployed vibe-agent / orphaned agent-canvas
# pods. The cloudflared tunnel routes were already removed on omv; this removes
# the Cloudflare-side remnants (DNS + Access).
#
# HOW TO RUN: push any change to this file (or workflow_dispatch). Result is
# posted to issue #382. Idempotent — safe to re-run.
#
# Token: secrets.CLOUDFLARE_API_TOKEN (needs Zone:Read + DNS:Edit +
# Access: Apps:Read/Delete). Zone ID from secrets.CLOUDFLARE_ZONE_ID.

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/cleanup-agent-vibe-dns.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cleanup-agent-vibe-dns
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.3.1

    - name: Delete DNS records + Access policies for agent + vibe
      id: cleanup
      run: |
        set -o pipefail
        exec 2>&1
        echo "=== Cloudflare cleanup: agent.cloudless.gr + vibe.cloudless.gr ==="
        echo "Zone: $ZONE_ID  Account: $ACCOUNT_ID"
        echo ""

        HOSTNAMES=("agent.cloudless.gr" "vibe.cloudless.gr")

        # --- 1. DNS records ---
        echo "### DNS Records"
        for host in "${HOSTNAMES[@]}"; do
          echo ""
          echo "--- $host ---"
          # List all DNS records matching this hostname
          records=$(curl -fsS -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$host" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" 2>&1) || {
              echo "  ⚠️ Failed to list DNS records for $host"
              echo "  $records"
              continue
            }

          # Extract record IDs
          ids=$(echo "$records" | python3 -c "
        import json,sys
        try:
            d=json.load(sys.stdin)
            if not d.get('success'):
                print('ERROR:', d.get('errors'))
                sys.exit(1)
            for r in d.get('result',[]):
                print(r['id'], r['type'], r['name'], r.get('content',''))
        except Exception as e:
            print('PARSE_ERROR:', e)
            sys.exit(1)
        " 2>&1) || {
              echo "  ⚠️ Failed to parse DNS records for $host"
              echo "  $ids"
              continue
            }

          if [[ -z "$ids" || "$ids" == "ERROR:"* || "$ids" == "PARSE_ERROR:"* ]]; then
            echo "  (no DNS records found)"
            echo "  $ids"
            continue
          fi

          echo "$ids" | while IFS=' ' read -r rid rtype rname rcontent; do
            echo "  Deleting $rtype record: $rname → $rcontent (id=$rid)"
            result=$(curl -fsS -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$rid" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" 2>&1) || {
                echo "  ⚠️ Delete failed for $rid"
                echo "  $result"
                continue
              }
            echo "  ✓ Deleted"
          done
        done

        # --- 2. Access applications ---
        echo ""
        echo "### Zero Trust Access Applications"
        for host in "${HOSTNAMES[@]}"; do
          echo ""
          echo "--- $host ---"
          # List Access applications for this account
          apps=$(curl -fsS -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/apps" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" 2>&1) || {
              echo "  ⚠️ Failed to list Access apps (token may lack Access scope)"
              echo "  $apps"
              continue
            }

          # Find app IDs matching this hostname
          app_ids=$(echo "$apps" | python3 -c "
        import json,sys
        try:
            d=json.load(sys.stdin)
            if not d.get('success'):
                print('ERROR:', d.get('errors'))
                sys.exit(1)
            for a in d.get('result',[]):
                domain = a.get('domain','') or a.get('self_hosted_domains',[''])[0]
                if '$host' in str(a):
                    print(a['id'], a.get('name','?'), domain)
        except Exception as e:
            print('PARSE_ERROR:', e)
            sys.exit(1)
        " 2>&1) || {
              echo "  ⚠️ Failed to parse Access apps"
              echo "  $app_ids"
              continue
            }

          if [[ -z "$app_ids" || "$app_ids" == "ERROR:"* || "$app_ids" == "PARSE_ERROR:"* ]]; then
            echo "  (no Access apps found)"
            echo "  $app_ids"
            continue
          fi

          echo "$app_ids" | while IFS=' ' read -r aid aname adomain; do
            echo "  Deleting Access app: $aname ($adomain) (id=$aid)"
            result=$(curl -fsS -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/apps/$aid" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" 2>&1) || {
                echo "  ⚠️ Delete failed for app $aid"
                echo "  $result"
                continue
              }
            echo "  ✓ Deleted"
          done
        done

        echo ""
        echo "=== Cleanup complete ==="

    - name: Post result to tracking issue
      if: always()
      run: |
        {
          echo "# agent/vibe Cloudflare cleanup — $(date -u '+%F %T')Z"
          echo ""
          echo "Deletes DNS CNAME records + Zero Trust Access apps for"
          echo "\`agent.cloudless.gr\` and \`vibe.cloudless.gr\` (orphaned vibe-agent /"
          echo "agent-canvas subdomains). Tunnel routes already removed on omv."
          echo ""
          echo "**Job:** ${{ job.status }}"
          echo ""
          echo '```'
          echo "(see workflow run logs for details)"
          echo '```'
        } > c.md
        gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
