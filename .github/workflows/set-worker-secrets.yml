name: Set Worker Secrets (Bulk)

# Sets ALL secrets from SSM to Cloudflare Workers via wrangler
# This enables both Workers deployment and k3s SSM_DISABLED=1 mode
# Run: gh workflow run set-worker-secrets.yml --repo Themis128/cloudless.gr

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be set (no actual changes)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Cloudflare token from SSM
        id: fetch
        run: |
          set -uo pipefail
          CF="$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption \
            --query Parameter.Value \
            --output text 2>/dev/null || echo '')"
          if [ -z "$CF" ] || [ "$CF" = "None" ]; then
            echo "::error::No Cloudflare token in SSM. Run store-cloudflare-token.yml first."
            exit 1
          fi
          echo "::add-mask::$CF"
          echo "CLOUDFLARE_API_TOKEN<<EOF" >> "$GITHUB_ENV"
          echo "$CF" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Fetch all secrets from SSM
        id: fetch-secrets
        run: |
          set -uo pipefail
          # All secrets to migrate - must exist in .env.example and SSM
          KEYS=(
            "SESSION_SECRET"
            "STRIPE_SECRET_KEY"
            "STRIPE_WEBHOOK_SECRET"
            "SLACK_WEBHOOK_URL"
            "SLACK_BOT_TOKEN"
            "SLACK_SIGNING_SECRET"
            "POSTIZ_API_KEY"
            "ADMIN_ALERT_SECRET"
            "ESPOCRM_API_KEY"
            "ANTHROPIC_API_KEY"
            "ACTIVECAMPAIGN_API_TOKEN"
            "NOTION_API_KEY"
          )
          for key in "${KEYS[@]}"; do
            val="$(aws ssm get-parameter \
              --name /cloudless/production/$key \
              --with-decryption \
              --query Parameter.Value \
              --output text 2>/dev/null || echo '')"
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
              echo "${key}<<EOF" >> "$GITHUB_ENV"
              echo "$val" >> "$GITHUB_ENV"
              echo "EOF" >> "$GITHUB_ENV"
              echo "Found: $key" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Generate SESSION_SECRET if missing
        if: env.SESSION_SECRET == ''
        run: |
          set -uo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "SESSION_SECRET<<EOF" >> "$GITHUB_ENV"
          echo "$SECRET" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "Generated SESSION_SECRET (was missing from SSM)" >> $GITHUB_STEP_SUMMARY

      - name: Dry run - show what would be set
        if: inputs.dry_run == true
        run: |
          echo "Would set these secrets to Cloudflare Workers:"
          for key in SESSION_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SLACK_WEBHOOK_URL POSTIZ_API_KEY ADMIN_ALERT_SECRET ESPOCRM_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${{ env[$key] }}" ]; then
              echo "  ✓ $key (has value)"
            fi
          done

      - name: Set all secrets to Workers
        if: inputs.dry_run != true
        run: |
          set -uo pipefail
          # All secrets to set
          for key in SESSION_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SLACK_WEBHOOK_URL POSTIZ_API_KEY ADMIN_ALERT_SECRET ESPOCRM_API_KEY ANTHROPIC_API_KEY; do
            if [ -n "${{ env[$key] }}" ]; then
              echo "Setting $key..."
              printf '%s' "${{ env[$key] }}" | npx wrangler secret put "$key" \
                --config wrangler-cloudflare-free.json \
                --env=production
            fi
          done

      - name: Verify secrets
        if: inputs.dry_run != true
        run: |
          echo "Verification:"
          echo "  - Worker health: https://cloudless.gr/api/health"
          echo "  - Secrets count: $(npx wrangler secret list --config wrangler-cloudflare-free.json --env=production | wc -l)"
