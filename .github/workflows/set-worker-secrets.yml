name: Set Worker Secrets

# Sets SESSION_SECRET and ANTHROPIC_API_KEY secrets on the cloudless-gr Worker
# Run this after verifying the Cloudflare token via verify-cloudflare-token.yml

on:
  workflow_dispatch:
    inputs:
      anthropic_api_key:
        description: "Anthropic API key for chat fallback (optional - leave empty if not needed)"
        required: false
      generate_session_secret:
        description: "Generate a new SESSION_SECRET if not provided"
        type: boolean
        default: true

permissions:
  id-token: write   # OIDC → AWS_DEPLOY_ROLE_ARN
  contents: read

concurrency:
  group: worker-secrets
  cancel-in-progress: false

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Cloudflare token from SSM
        id: fetch
        run: |
          set -uo pipefail
          CF="$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption \
            --query Parameter.Value \
            --output text 2>/dev/null || echo '')"
          if [ -z "$CF" ] || [ "$CF" = "None" ]; then
            echo "::error::No Cloudflare token in SSM. Run store-cloudflare-token.yml first."
            exit 1
          fi
          echo "::add-mask::$CF"
          echo "CLOUDFLARE_API_TOKEN<<EOF" >> "$GITHUB_ENV"
          echo "$CF" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Generate SESSION_SECRET if needed
        id: gen
        run: |
          if [ "${{ github.event.inputs.generate_session_secret }}" = "true" ]; then
            SECRET="$(openssl rand -hex 32)"
          else
            SECRET="${{ github.event.inputs.session_secret }}"
          fi
          echo "::add-mask::$SECRET"
          echo "SESSION_SECRET<<EOF" >> "$GITHUB_ENV"
          echo "$SECRET" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Set SESSION_SECRET
        env:
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
        run: |
          # Wrangler secret put reads from stdin - use printf to suppress newline warnings
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET \
            --config wrangler-cloudflare-free.json \
            --env=production

      - name: Set ANTHROPIC_API_KEY (optional)
        if: inputs.anthropic_api_key != ''
        env:
          ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY \
            --config wrangler-cloudflare-free.json \
            --env=production

       - name: Verify secrets set
         run: |
           echo "Verification:"
           echo "  - Worker: https://cloudless.gr/api/health"
           echo "  - Auth should return user data after login"
           echo ""
           echo "Next steps:"
           echo "  1. Test /api/auth/login with a test account"
           echo "  2. Monitor Workers AI incident status"
