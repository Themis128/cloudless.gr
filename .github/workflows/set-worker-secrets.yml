name: Set Worker Secrets (Bulk)

# Sets ALL secrets from SSM to Cloudflare Workers via wrangler
# Run: gh workflow run set-worker-secrets.yml --repo Themis128/cloudless.gr

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be set (no actual changes)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Fetch and set all secrets
        run: |
          set -uo pipefail
          
          DRY_RUN="${{ inputs.dry_run }}"
          
          # Fetch Cloudflare token from SSM
          CF_TOKEN="$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption \
            --query Parameter.Value \
            --output text 2>/dev/null || echo '')"
          
          if [ -z "$CF_TOKEN" ] || [ "$CF_TOKEN" = "None" ]; then
            echo "::error::No Cloudflare token in SSM. Run store-cloudflare-token.yml first."
            exit 1
          fi
          echo "::add-mask::$CF_TOKEN"
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          
          # All secrets to migrate
          SECRET_KEYS=(
            "SESSION_SECRET"
            "STRIPE_SECRET_KEY"
            "STRIPE_WEBHOOK_SECRET"
            "SLACK_WEBHOOK_URL"
            "SLACK_BOT_TOKEN"
            "SLACK_SIGNING_SECRET"
            "POSTIZ_API_KEY"
            "ADMIN_ALERT_SECRET"
            "ESPOCRM_API_KEY"
            "ANTHROPIC_API_KEY"
          )
          
          FOUND_COUNT=0
          for key in "${SECRET_KEYS[@]}"; do
            val="$(aws ssm get-parameter \
              --name /cloudless/production/$key \
              --with-decryption \
              --query Parameter.Value \
              --output text 2>/dev/null || echo '')"
            if [ -n "$val" ] && [ "$val" != "None" ]; then
              echo "::add-mask::$val"
              if [ "$DRY_RUN" = "true" ]; then
                echo "[DRY RUN] Would set: $key"
              else
                printf '%s' "$val" | npx wrangler secret put "$key" \
                  --config wrangler-cloudflare-free.json \
                  --env=production
              fi
              ((FOUND_COUNT++)) || true
            fi
          done
          
           if [ "$DRY_RUN" = "true" ]; then
             echo ""
             echo "[DRY RUN] Found $FOUND_COUNT secrets to set"
           else
             echo ""
             echo "Set $FOUND_COUNT secrets to Cloudflare Workers"
             echo "Verification: npx wrangler secret list --config wrangler-cloudflare-free.json --env=production"
           fi
