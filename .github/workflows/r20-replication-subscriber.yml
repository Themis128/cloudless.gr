# R20: Deploy Postgres logical replication subscriber
# Polls Pi postgres logical replication slot and writes to DDB

name: Deploy Replication Subscriber

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Deploy subscriber"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: r20-replication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy subscriber (placeholder)
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          echo "R20 deployment ready"
          echo "Prerequisites: operator must enable wal2json on Pi postgres"
          
      - name: Summary
        if: always()
        run: |
          echo "## R20 Replication Subscriber" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Placeholder deployed - requires operator action first" >> $GITHUB_STEP_SUMMARY
          echo "**Prerequisites:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Enable wal2json on AppFlowy/Postiz postgres pods" >> $GITHUB_STEP_SUMMARY
          echo "2. Create replication slot: CREATE SLOT cloudless_drain LOGICAL wal2json" >> $GITHUB_STEP_SUMMARY
          echo "3. Provide REPLICATION_DSN via SSM for network access" >> $GITHUB_STEP_SUMMARY