name: Set CAL_API_KEY in SSM

# One-shot workflow — trigger manually once after adding the CAL_API_KEY
# GitHub Secret. Writes /cloudless/production/CAL_API_KEY to AWS SSM as a
# SecureString so the Pi pod picks it up at runtime via getConfig().
on:
  workflow_dispatch:

jobs:
  set-ssm-param:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write CAL_API_KEY to SSM
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/CAL_API_KEY \
            --value "$CAL_API_KEY" \
            --type SecureString \
            --overwrite
          echo "✅ /cloudless/production/CAL_API_KEY written to SSM"
