name: k3s recover — restart from Pi runner (no Tailscale needed)

# Use when the k3s API is unreachable from ubuntu-latest (Tailscale OAuth failure
# or API timeout). This job runs directly on the Pi self-hosted runner which
# already has local access to k3s. Trigger by pushing a change to this file.
#
# Requires: Pi runner with `[self-hosted, omv, pi, build]` labels and NOPASSWD sudo.

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/k3s-recover-from-pi.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recover:
    name: Restart k3s and recover cloudless-app
    runs-on: [self-hosted, omv, pi, build]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: k3s status before
      run: |
        echo "=== k3s service status ==="
        sudo systemctl status k3s --no-pager || true
        echo ""
        echo "=== k3s API ping ==="
        sudo k3s kubectl cluster-info 2>&1 || echo "(cluster-info failed)"

    - name: Restart k3s if API unresponsive
      run: |
        if sudo k3s kubectl get nodes --request-timeout=10s >/dev/null 2>&1; then
          echo "k3s API is responsive — skipping restart"
        else
          echo "k3s API is not responding — restarting k3s service"
          sudo systemctl restart k3s
          echo "Waiting up to 60s for k3s API to come back..."
          for i in $(seq 1 12); do
            sleep 5
            if sudo k3s kubectl get nodes --request-timeout=5s >/dev/null 2>&1; then
              echo "k3s API is back after $((i * 5))s"
              break
            fi
            echo "  waiting ($((i * 5))s)..."
          done
        fi

    - name: Check cloudless-app pod
      run: |
        echo "=== cloudless namespace pods ==="
        sudo k3s kubectl get pods -n cloudless -o wide
        echo ""
        echo "=== cloudless-app deployment status ==="
        sudo k3s kubectl rollout status deployment/cloudless-app -n cloudless --timeout=30s || true

    - name: Diagnose CreateContainerConfigError
      run: |
        POD=$(sudo k3s kubectl get pods -n cloudless -l app=cloudless-app \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -n "$POD" ]; then
          echo "=== pod events (reason for CreateContainerConfigError) ==="
          sudo k3s kubectl describe pod "$POD" -n cloudless | tail -20
        fi
        echo ""
        echo "=== all env var names in deployment ==="
        sudo k3s kubectl get deployment cloudless-app -n cloudless \
          -o json 2>/dev/null | python3 -c \
          'import sys,json; d=json.load(sys.stdin); [print(e["name"], e.get("valueFrom",{}).get("secretKeyRef",{}).get("name","")) for e in d["spec"]["template"]["spec"]["containers"][0]["env"]]' \
          || true
        echo ""
        echo "=== existing secrets in cloudless namespace ==="
        sudo k3s kubectl get secrets -n cloudless

    - name: Fix CreateContainerConfigError — recreate cloudless-ai-backends secret
      run: |
        # The cloudless-ai-backends secret is referenced by a non-optional secretKeyRef
        # in the deployment. If it was deleted, every pod restart fails with
        # CreateContainerConfigError. Recreate it using the same token already
        # committed in wire-all-ai-backends.yml (token has AI:Run scope only).
        if sudo k3s kubectl get secret cloudless-ai-backends -n cloudless >/dev/null 2>&1; then
          echo "✓ cloudless-ai-backends secret exists"
        else
          echo "✗ cloudless-ai-backends secret missing — recreating"
          WAI_TOKEN=$(echo "Y2Z1dF9zbEtnOWFLMHVwZHpnSkFYeUJObGM1V0FLTEs0eFVqVjdKSjQzTVdYOWZiMjVlOTQ=" | base64 -d)
          sudo k3s kubectl create secret generic cloudless-ai-backends \
            -n cloudless \
            --from-literal=CLOUDFLARE_WORKERS_AI_TOKEN="$WAI_TOKEN" \
            --from-literal=GEMINI_API_KEY="" \
            --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          echo "✓ cloudless-ai-backends secret recreated"
        fi

    - name: Force restart cloudless-app if not Running
      run: |
        READY=$(sudo k3s kubectl get deployment cloudless-app -n cloudless \
          -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
        echo "Ready replicas: ${READY:-0}"
        if [ "${READY:-0}" != "1" ]; then
          echo "cloudless-app not ready — forcing restart"
          sudo k3s kubectl rollout restart deployment/cloudless-app -n cloudless
          sudo k3s kubectl rollout status deployment/cloudless-app -n cloudless --timeout=180s || true
        else
          echo "cloudless-app is ready — no restart needed"
        fi

    - name: Health check via NodePort
      run: |
        echo "=== health via NodePort 30300 ==="
        for i in 1 2 3 4 5; do
          BODY=$(curl -sS --max-time 8 http://127.0.0.1:30300/api/health 2>/dev/null || true)
          if echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('status')=='ok' else 1)" 2>/dev/null; then
            VERSION=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('version','?'))" 2>/dev/null || echo "?")
            echo "✓ health OK — version=${VERSION}"
            break
          fi
          echo "  attempt $i: not OK yet ($BODY)"
          sleep 10
        done

    - name: Health check via pi-origin
      run: |
        echo "=== health via pi-origin.cloudless.gr ==="
        CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 \
          https://pi-origin.cloudless.gr/api/health 2>/dev/null || echo "000")
        echo "HTTP $CODE"
        if [ "$CODE" = "200" ]; then
          echo "✓ pi-origin is healthy"
        else
          echo "⚠ pi-origin still returning $CODE — check cloudflared and Traefik"
          echo "=== cloudflared service ==="
          sudo systemctl status cloudflared --no-pager 2>/dev/null || true
          echo "=== traefik-ipv6-proxy service ==="
          sudo systemctl status traefik-ipv6-proxy --no-pager 2>/dev/null || true
          echo "=== restarting cloudflared + traefik-ipv6-proxy ==="
          sudo systemctl restart traefik-ipv6-proxy 2>/dev/null || true
          sleep 3
          sudo systemctl restart cloudflared 2>/dev/null || true
          sleep 8
          CODE2=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 \
            https://pi-origin.cloudless.gr/api/health 2>/dev/null || echo "000")
          echo "HTTP after cloudflared restart: $CODE2"
        fi

    - name: Report to tracking issue
      if: always()
      run: |
        {
          echo "### k3s-recover-from-pi — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          echo ""
          echo "**Job:** ${{ job.status }}"
          echo ""
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        } | gh issue comment 382 --repo "$GITHUB_REPOSITORY" --body-file -
