name: k3s Cluster Health Monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: k3s-cluster-health
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudless-pi-app
  K3S_API: "https://192.168.1.128:6443"
  K3S_NAMESPACE: cloudless
  ECR_STALE_HOURS: "48"
  # Etcd snapshots are scheduled every 6 h; warn if newest is older than 8 h
  ETCD_SNAPSHOT_WARN_HOURS: "8"
  # Warn when any node filesystem exceeds this usage percentage
  DISK_WARN_PCT: "80"

jobs:
  health:
    name: Cluster health check
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.report.outputs.summary }}
      healthy: ${{ steps.report.outputs.healthy }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Tailscale reachability ─────────────────────────────────────────────
      # NOTE: The self-hosted runner is already inside the Tailscale network on
      # omv-main, so this step validates local node health rather than external
      # client reachability.  A dedicated external probe (Gap 6) would require a
      # GH-hosted runner or a separate probe host.
      - name: Tailscale ping
        id: ts
        run: |
          set +e; tailscale ping --timeout=10s 100.113.41.119 > /tmp/ts.out 2>&1; rc=$?; set -e
          if [ $rc -ne 0 ]; then
            echo "result=FAIL: $(head -1 /tmp/ts.out)" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── Node status + disk pressure conditions ─────────────────────────────
      - name: Node status and disk pressure
        id: nodes
        run: |
          kubectl --server="${K3S_API}" get nodes -o wide 2>&1 | tee /tmp/nodes.out
          not_ready=$(grep -c "NotReady" /tmp/nodes.out || true)

          # Check node conditions for DiskPressure / MemoryPressure / PIDPressure
          pressure=$(kubectl --server="${K3S_API}" get nodes \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[?(@.status=="True")]}{.type}{","}{end}{"\n"}{end}' \
            2>/dev/null | grep -E "DiskPressure|MemoryPressure|PIDPressure" || true)

          if [ "$not_ready" -gt 0 ]; then
            echo "result=FAIL: ${not_ready} node(s) NotReady" >> "$GITHUB_OUTPUT"
          elif [ -n "$pressure" ]; then
            echo "result=FAIL: pressure conditions: $(echo "$pressure" | tr '\n' ';')" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── Filesystem usage on Pi nodes ──────────────────────────────────────
      - name: Disk usage
        id: disk
        run: |
          warn_pct="${DISK_WARN_PCT}"
          # df on the runner host itself (Pi node running the job)
          overloaded=$(df --output=pcent,target 2>/dev/null \
            | tail -n +2 \
            | awk -v w="$warn_pct" '{gsub(/%/,"",$1); if ($1+0 >= w+0) print $0}' || true)
          if [ -n "$overloaded" ]; then
            msg=$(echo "$overloaded" | head -3 | tr '\n' ' ')
            echo "result=WARN: filesystem(s) ≥${warn_pct}%: ${msg}" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── Pod health ────────────────────────────────────────────────────────
      - name: Pod health (readiness + CrashLoop/OOMKill)
        id: pods
        run: |
          kubectl --server="${K3S_API}" get pods -n "${K3S_NAMESPACE}" -o wide 2>&1 | tee /tmp/pods.out
          crashes=$(grep -cE "CrashLoopBackOff|OOMKilled|Error" /tmp/pods.out || true)
          not_running=$(grep -vE "Running|Completed|NAME" /tmp/pods.out | grep -c . || true)
          if [ "$crashes" -gt 0 ]; then
            echo "result=FAIL: ${crashes} pod(s) CrashLoop/OOMKilled" >> "$GITHUB_OUTPUT"
          elif [ "$not_running" -gt 0 ]; then
            echo "result=WARN: ${not_running} pod(s) not Running" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── PVC health ────────────────────────────────────────────────────────
      - name: PVC health
        id: pvc
        run: |
          kubectl --server="${K3S_API}" get pvc -n "${K3S_NAMESPACE}" 2>&1 | tee /tmp/pvc.out
          unbound=$(grep -cE "Pending|Lost" /tmp/pvc.out || true)
          if [ "$unbound" -gt 0 ]; then
            echo "result=FAIL: ${unbound} PVC(s) Pending/Lost" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── Ingress health ────────────────────────────────────────────────────
      - name: Ingress health
        id: ingress
        run: |
          kubectl --server="${K3S_API}" get ingress -n "${K3S_NAMESPACE}" 2>&1 | tee /tmp/ingress.out
          no_addr=$(grep -cE "<none>|pending" /tmp/ingress.out || true)
          if [ "$no_addr" -gt 0 ]; then
            echo "result=WARN: ${no_addr} ingress(es) without address" >> "$GITHUB_OUTPUT"
          else
            echo "result=ok" >> "$GITHUB_OUTPUT"
          fi

      # ── ECR image age ─────────────────────────────────────────────────────
      - name: ECR image age
        id: ecr
        run: |
          sha=$(kubectl --server="${K3S_API}" get deployment "${K3S_NAMESPACE}" \
            -n "${K3S_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null \
            | sed 's/.*://')
          if [ -z "$sha" ]; then
            echo "result=WARN: cannot determine deployed SHA" >> "$GITHUB_OUTPUT"
          else
            pushed_at=$(aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids imageTag="${sha}" \
              --query 'imageDetails[0].imagePushedAt' --output text 2>/dev/null)
            age_h=$(( ( $(date +%s) - $(date -d "${pushed_at}" +%s 2>/dev/null || echo 0) ) / 3600 ))
            if [ "$age_h" -gt "${ECR_STALE_HOURS}" ]; then
              echo "result=WARN: image ${age_h}h old (sha=${sha})" >> "$GITHUB_OUTPUT"
            else
              echo "result=ok (${age_h}h, sha=${sha})" >> "$GITHUB_OUTPUT"
            fi
          fi

      # ── etcd snapshot freshness ──────────────────────────────────────────
      # k3s writes snapshot metadata to /var/lib/rancher/k3s/server/db/snapshots/
      # and also pushes to S3.  We check the local index first (no AWS call needed)
      # then verify the newest S3 object age as a secondary confirmation.
      - name: etcd snapshot freshness
        id: etcd
        run: |
          warn_hours="${ETCD_SNAPSHOT_WARN_HOURS}"

          # --- local snapshot directory (fastest, no network) ---
          local_newest=$(find /var/lib/rancher/k3s/server/db/snapshots/ \
            -maxdepth 1 -name 'etcd-snapshot-*' -printf '%T@\n' 2>/dev/null \
            | sort -n | tail -1)
          if [ -n "$local_newest" ]; then
            age_h=$(( ( $(date +%s) - ${local_newest%.*} ) / 3600 ))
            if [ "$age_h" -gt "$warn_hours" ]; then
              echo "result=WARN: newest local snapshot ${age_h}h old (expected ≤${warn_hours}h)" >> "$GITHUB_OUTPUT"
            else
              echo "result=ok (local, ${age_h}h)" >> "$GITHUB_OUTPUT"
            fi
          else
            # --- fall back to S3 object listing ---
            bucket="${{ secrets.ETCD_SNAPSHOT_S3_BUCKET }}"
            if [ -z "$bucket" ]; then
              echo "result=WARN: no local snapshots and ETCD_SNAPSHOT_S3_BUCKET not set" >> "$GITHUB_OUTPUT"
            else
              newest_s3=$(aws s3api list-objects-v2 \
                --bucket "$bucket" \
                --prefix "etcd-snapshots/" \
                --query 'sort_by(Contents,&LastModified)[-1].LastModified' \
                --output text 2>/dev/null || true)
              if [ -z "$newest_s3" ] || [ "$newest_s3" = "None" ]; then
                echo "result=FAIL: no etcd snapshots found in S3" >> "$GITHUB_OUTPUT"
              else
                age_h=$(( ( $(date +%s) - $(date -d "$newest_s3" +%s 2>/dev/null || echo 0) ) / 3600 ))
                if [ "$age_h" -gt "$warn_hours" ]; then
                  echo "result=WARN: newest S3 snapshot ${age_h}h old" >> "$GITHUB_OUTPUT"
                else
                  echo "result=ok (S3, ${age_h}h)" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          fi

      # ── Build report ──────────────────────────────────────────────────────
      - name: Build report
        id: report
        if: always()
        run: |
          ts="${{ steps.ts.outputs.result }}"
          nodes="${{ steps.nodes.outputs.result }}"
          disk="${{ steps.disk.outputs.result }}"
          pods="${{ steps.pods.outputs.result }}"
          pvc="${{ steps.pvc.outputs.result }}"
          ingress="${{ steps.ingress.outputs.result }}"
          ecr="${{ steps.ecr.outputs.result }}"
          etcd="${{ steps.etcd.outputs.result }}"

          healthy=true
          for s in "$ts" "$nodes" "$pods" "$pvc"; do
            [[ "$s" == FAIL* ]] && healthy=false
          done

          summary="ts=${ts} | nodes=${nodes} | disk=${disk} | pods=${pods} | pvc=${pvc} | ingress=${ingress} | ecr=${ecr} | etcd=${etcd}"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
          echo "healthy=${healthy}" >> "$GITHUB_OUTPUT"

          {
            echo "## k3s Cluster Health — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "| Check | Result |"
            echo "|---|---|"
            for check in \
              "Tailscale:${ts}" \
              "Nodes / pressure:${nodes}" \
              "Disk usage:${disk}" \
              "Pods:${pods}" \
              "PVCs:${pvc}" \
              "Ingress:${ingress}" \
              "ECR age:${ecr}" \
              "etcd snapshots:${etcd}"; do
              echo "| ${check%%:*} | ${check#*:} |"
            done
            echo ""
            echo "**Overall healthy:** ${healthy}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Slack alert ───────────────────────────────────────────────────────
      - name: Slack alert on failure
        if: always() && steps.report.outputs.healthy == 'false'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C08UFCV3LJR",
              "text": ":red_circle: *k3s cluster health FAIL*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *k3s cluster health failure*\n```${{ steps.report.outputs.summary }}```"
                  }
                },
                {
                  "type": "context",
                  "elements": [{
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }]
                }
              ]
            }

  # One-shot step: store Grafana admin password in SSM so CI can query dashboards
  grafana-password-to-ssm:
    name: Store Grafana password in SSM
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 3
    needs: health
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Write Grafana admin password to SSM
        run: |
          PASS=$(kubectl get secret kube-prom-grafana -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          aws ssm put-parameter \
            --name "/cloudless/production/GRAFANA_ADMIN_PASSWORD" \
            --value "$PASS" \
            --type SecureString \
            --overwrite \
            --region us-east-1
          echo "Grafana password stored in SSM."
