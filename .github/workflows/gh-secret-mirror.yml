name: Mirror GitHub secrets into k3s (for Infisical harvest)

# GitHub Actions secrets are write-only — their values can never be read back
# via the API. This workflow is the ONLY path that moves them into the
# centralized store: it writes the values into a dedicated k8s Secret
# (`gh-actions-mirror` in the `cloudless` namespace) on omv. The home-ops
# `infisical-cluster-sync.py` cron (Sundays 05:45) then harvests that Secret
# into Infisical `cloudless-infra`/prod — missing keys only, never overwrites.
#
# Values are masked in logs by GitHub's secrets masking and reach kubectl
# as a base64 Secret manifest over stdin (`kubectl apply -f -`) — never as
# argv, so `sudo kubectl` on omv can't leak them into auth.log/journald.
# (The Secret itself is etcd-encrypted at rest by k3s.)
#
# Trigger: manual only — GH secrets change rarely. Re-run after rotating or
# adding any secret in the list below.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Connect to tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k8s

      - name: Wait for tailnet path to omv
        run: python3 scripts/ci/tailscale-wait.py 100.74.191.58 22

      - name: Configure kubectl via omv SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: scripts/ci/kubectl-via-omv-ssh.sh

      - name: Write GH secrets to gh-actions-mirror Secret
        env:
          S_GH_PAT: ${{ secrets.GH_PAT }}
          S_COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          S_GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          S_GH_AW_CI_TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          S_DEPLOY_ORCHESTRATOR_TOKEN: ${{ secrets.DEPLOY_ORCHESTRATOR_TOKEN }}
          S_TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          S_TS_CLIENT_ID: ${{ secrets.TS_CLIENT_ID }}
          S_TS_CLIENT_SECRET: ${{ secrets.TS_CLIENT_SECRET }}
          S_NOTION_GSC_REPORTS_DB_ID: ${{ secrets.NOTION_GSC_REPORTS_DB_ID }}
          S_OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: |
          set -euo pipefail
          manifest=$(python3 - <<'PY'
          import base64, json, os, sys
          KEYS = [
              "GH_PAT", "COPILOT_GITHUB_TOKEN", "GH_AW_GITHUB_TOKEN",
              "GH_AW_CI_TRIGGER_TOKEN", "DEPLOY_ORCHESTRATOR_TOKEN",
              "TS_AUTHKEY", "TS_CLIENT_ID", "TS_CLIENT_SECRET",
              "NOTION_GSC_REPORTS_DB_ID", "OMV_SSH_KEY",
          ]
          data = {}
          for k in KEYS:
              v = os.environ.get(f"S_{k}", "")
              if v:
                  data[k] = base64.b64encode(v.encode()).decode()
              else:
                  print(f"skip {k} (unset)", file=sys.stderr)
          if not data:
              print("{}")
          else:
              print(json.dumps({
                  "apiVersion": "v1", "kind": "Secret",
                  "metadata": {"name": "gh-actions-mirror", "namespace": "cloudless"},
                  "type": "Opaque", "data": data,
              }))
          PY
          )
          if [ "$manifest" = "{}" ]; then
            echo "no secrets set — nothing to mirror"; exit 0
          fi
          printf '%s\n' "$manifest" | kubectl apply -f -
          echo "mirrored $(printf '%s' "$manifest" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["data"]))') keys -> secret/gh-actions-mirror (cloudless)"
          kubectl -n cloudless get secret gh-actions-mirror -o jsonpath='{.data}' | python3 -c "import json,sys; print('keys:', sorted(json.load(sys.stdin)))"
