name: ntfy-restore — recover ntfy from CrashLoopBackOff or Error

# Recovers ntfy (push notification server) from Error / CrashLoopBackOff state.
#
# Trigger by touching this file or scripts/ntfy-restore.py, or via dispatch.
#
# When to use:
#   - cluster-doctor shows ntfy in Error or CrashLoopBackOff
#   - ntfy has restart count > 5
#   - Push notifications to mobile are not arriving

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/ntfy-restore.yml
    - scripts/ntfy-restore.py
  workflow_dispatch:
    inputs:
      ntfy_mem_limit:
        description: 'ntfy memory limit (default: 128Mi; current live limit is 96Mi)'
        required: false
        default: 128Mi

permissions:
  contents: read
  issues: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NTFY_MEM_LIMIT: ${{ github.event.inputs.ntfy_mem_limit || '128Mi' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v4.3.1

    - name: Connect to tailnet
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd         # v4.2.0
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
        tags: tag:k8s
        ping: 100.74.191.58
    - name: Wait for tailnet path to omv
      run: python3 scripts/ci/tailscale-wait.py 100.74.191.58 6443
    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Run ntfy-restore
      id: restore
      run: |
        set -o pipefail
        python3 scripts/ntfy-restore.py 2>&1 | tee restore.log

    - name: Post result to tracking issue
      if: always()
      run: |
        {
          echo "# ntfy restore — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          echo ""
          echo "**Status:** ${{ job.status }}"
          echo ""
          echo '```'
          cat restore.log 2>/dev/null || echo "(no log)"
          echo '```'
        } | gh issue comment 382 --repo "$GITHUB_REPOSITORY" --body-file -
