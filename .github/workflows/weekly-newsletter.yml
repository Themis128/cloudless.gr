name: Weekly Newsletter

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Every Monday at 09:00 UTC (11:00 Athens). Three hours after the draft
    # generator — that window is the human review SLA. If nothing is in review
    # by now, the publisher exits 0 and no newsletter is sent.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish approved posts and send newsletter
    # Runs on the omv self-hosted runner and reaches AppFlowy over the local
    # NodePort. The hosted path broke when Cloudflare Access was enabled on
    # appflowy.cloudless.gr (mid-Aug): /gotrue/token and /api/* got the SSO
    # login HTML → JSON.parse FATAL on every Monday since Aug-17.
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 15

    env:
      # AppFlowy via the local nginx NodePort — skips the CF Access gate that
      # only browser SSO sessions can pass. APPFLOWY_API_URL secret remains
      # for any future hosted-runner use.
      APPFLOWY_API_URL: http://localhost:30810
      APPFLOWY_EMAIL: ${{ secrets.APPFLOWY_EMAIL }}
      APPFLOWY_PASSWORD: ${{ secrets.APPFLOWY_PASSWORD }}
      CONTENT_WEBHOOK_SECRET: ${{ secrets.CONTENT_WEBHOOK_SECRET }}
      NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      NEWSLETTER_SLACK_CHANNEL_ID: ${{ secrets.NEWSLETTER_SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      # AppFlowy is deliberately scaled to 0 on omv k3s while unused — in that
      # state there is nothing to publish from, so the publish step soft-skips.
      # replicas>0 + unreachable NodePort is a real outage and still fails.
      - name: Check AppFlowy deployment state on omv
        id: appflowy
        run: |
          set -euo pipefail

          KCTL=(kubectl)
          if [ -r /etc/rancher/k3s/k3s.yaml ] && kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get ns >/dev/null 2>&1; then
            KCTL=(kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml)
          elif sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get ns >/dev/null 2>&1; then
            KCTL=(sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml)
          elif kubectl get ns >/dev/null 2>&1; then
            KCTL=(kubectl)
          else
            echo "::error::No kubeconfig found on runner (cannot determine AppFlowy deployment state)"
            exit 1
          fi

          REPS=$("${KCTL[@]}" get deploy -n appflowy --no-headers -o custom-columns=R:.spec.replicas 2>/dev/null || echo "KUBECTL_FAILED")
          if echo "$REPS" | grep -q KUBECTL_FAILED; then
            echo "::error::cannot read appflowy deployment state on omv"
            exit 1
          fi
          if [ -z "$REPS" ]; then
            echo "::error::appflowy namespace returned no Deployments — not a deliberate scale-to-0, refusing to skip"
            exit 1
          fi

          LIVE=$(echo "$REPS" | grep -cE '^[1-9]' || true)
          echo "appflowy deployments with replicas>0: $LIVE"

          if [ "$LIVE" -gt 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AppFlowy is intentionally scaled to 0 on omv — newsletter publish skipped (kubectl scale to revive)"
            {
              echo "## AppFlowy scaled to 0 — newsletter skipped"
              echo ""
              echo "AppFlowy deployments are scaled to 0 on omv; weekly newsletter publish is skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.appflowy.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Publish approved posts and send newsletter
        if: steps.appflowy.outputs.enabled == 'true'
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/publish-and-send-newsletter.ts

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ Weekly newsletter publish failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "❌ Newsletter Publish Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Monday publisher failed. Posts in review may not have been promoted, and the newsletter may not have sent.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }'
