name: Weekly Newsletter

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Every Monday at 09:00 UTC (11:00 Athens). Three hours after the draft
    # generator — that window is the human review SLA. If nothing is in review
    # by now, the publisher exits 0 and no newsletter is sent.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish approved posts and send newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_BLOG_DB_ID: ${{ secrets.NOTION_BLOG_DB_ID }}
      NOTION_WEBHOOK_SECRET: ${{ secrets.NOTION_WEBHOOK_SECRET }}
      NEWSLETTER_SEND_SECRET: ${{ secrets.NEWSLETTER_SEND_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # When both are set, the publisher posts confirmations to #newsletter
      # via the bot instead of falling back to the generic SLACK_WEBHOOK_URL.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      NEWSLETTER_SLACK_CHANNEL_ID: ${{ secrets.NEWSLETTER_SLACK_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Publish approved posts and send newsletter
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/publish-and-send-newsletter.ts

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ Weekly newsletter publish failed",
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "❌ Newsletter Publish Failed", "emoji": true }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Monday publisher failed. Posts in review may not have been promoted, and the newsletter may not have sent.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }'
