name: Check contact pipeline logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 5
    steps:
      - name: Check fresh contact logs
        run: |
          set -euo pipefail
          echo "=== Pod version ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- printenv 2>&1 | grep -i "VERCEL_GIT\|NEXT_PUBLIC_SITE\|NODE_ENV" | head -3 || true
          echo ""
          echo "=== Health check ==="
          curl -sS https://cloudless.gr/api/health 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print('version:', d.get('version'))" || true
          echo ""
          echo "=== Submit test contact ==="
          curl -sS -X POST https://cloudless.gr/api/contact \
            -H "Content-Type: application/json" \
            -d '{"name":"Themis Baltzakis","email":"devin-verify+e2e@cloudless.gr","phone":"+30 555 0000","service":"shop-online — E-shop Launch","message":"E2E verification — please disregard.","attribution":"{\"source\":\"devin-verify\",\"campaign\":\"shop-online\"}"}' \
            -w "\nHTTP %{http_code}\n" --max-time 30 2>&1
          echo ""
          echo "=== Wait 3s for background tasks ==="
          sleep 3
          echo "=== Fresh logs (since=15s) ==="
          sudo k3s kubectl -n cloudless logs deploy/cloudless-app --since=15s 2>&1 | head -40
