name: Check contact pipeline logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 5
    steps:
      - name: Verify deployed code has the fix
        run: |
          set -euo pipefail
          echo "=== Check if deployed route.js has || instead of ?? ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- node -e '
            const fs = require("fs");
            const code = fs.readFileSync("/app/.next/server/app/api/contact/route.js", "utf-8");
            // Search for the lastName fallback pattern
            const hasOrFallback = code.includes("||") && code.includes("split(\"@\")[0]");
            const hasNullishFallback = code.includes("??") && code.includes("split(\"@\")[0]");
            console.log("Has || fallback:", hasOrFallback);
            console.log("Has ?? fallback:", hasNullishFallback);
            // Find the actual line
            const idx = code.indexOf("split(\"@\")[0]");
            if (idx > -1) {
              const ctx = code.substring(Math.max(0, idx - 80), idx + 30);
              console.log("Context:", ctx);
            }
          ' 2>&1 || echo "node check failed"
          echo ""
          echo "=== Test EspoCRM create with firstName/lastName ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- node -e '
            const url = process.env.ESPOCRM_BASE_URL;
            const key = process.env.ESPOCRM_API_KEY;
            const body = JSON.stringify({
              firstName: "Themis",
              lastName: "Baltzakis",
              emailAddress: "test+e2e@cloudless.gr",
              phoneNumber: "+30 555 0000"
            });
            fetch(url + "/api/v1/Contact", {
              method: "POST",
              headers: {"X-Api-Key": key, "Content-Type": "application/json"},
              body
            })
              .then(r => { console.log("POST Status:", r.status); return r.text(); })
              .then(t => console.log("POST Body:", t.substring(0, 300)))
              .catch(e => console.log("POST Error:", e.message))
          ' 2>&1 || echo "node test failed"
