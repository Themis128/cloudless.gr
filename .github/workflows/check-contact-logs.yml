name: Check contact pipeline logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 5
    steps:
      - name: Test contact API and check fresh logs
        run: |
          set -euo pipefail
          echo "=== Pod env (EspoCRM + email) ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- env 2>&1 | grep -iE "^(ESPOCRM_BASE|RESEND|CLOUDFLARE_EMAIL|CLOUDFLARE_API)" | sed 's/=.*/=***/' || true
          echo ""
          echo "=== Submit test contact via Node fetch ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- node -e '
            fetch("http://localhost:3000/api/contact", {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({
                name: "Pipeline Verify Fresh",
                email: "devin-verify+fresh@cloudless.gr",
                phone: "+30 555 0000",
                service: "shop-online — E-shop Launch",
                message: "Fresh pipeline verification after restart — please disregard.",
                attribution: JSON.stringify({source:"devin-verify",campaign:"shop-online"})
              })
            }).then(r => r.text()).then(t => console.log("RESPONSE:", t)).catch(e => console.log("ERROR:", e.message))
          ' 2>&1 || echo "node fetch failed"
          echo ""
          echo "=== Wait 3s for background tasks ==="
          sleep 3
          echo "=== Fresh logs (since=30s) ==="
          sudo k3s kubectl -n cloudless logs deploy/cloudless-app --since=30s 2>&1 | grep -iE "(contact|email|slack|espocrm|appflowy|resend|error|warn|success|sending|lead)" | tail -30
