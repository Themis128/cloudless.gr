name: Check contact pipeline logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 5
    steps:
      - name: Debug EspoCRM config
        run: |
          set -euo pipefail
          echo "=== ConfigMap value ==="
          sudo k3s kubectl -n cloudless get configmap cloudless-app-config -o jsonpath='{.data.ESPOCRM_BASE_URL}'
          echo ""
          echo "=== Pod env value ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- printenv ESPOCRM_BASE_URL 2>&1 || echo "(not set)"
          echo ""
          echo "=== EspoCRM service in cluster ==="
          sudo k3s kubectl -n espocrm get svc 2>&1 || echo "(espocrm namespace not found)"
          echo ""
          echo "=== Test in-cluster EspoCRM from cloudless pod ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- node -e '
            const url = process.env.ESPOCRM_BASE_URL;
            console.log("ESPOCRM_BASE_URL:", url);
            fetch(url + "/api/v1/Contact", {headers: {"X-Api-Key": process.env.ESPOCRM_API_KEY}})
              .then(r => { console.log("Status:", r.status); return r.text(); })
              .then(t => console.log("Body:", t.substring(0, 200)))
              .catch(e => console.log("Error:", e.message))
          ' 2>&1 || echo "node test failed"
          echo ""
          echo "=== Recent logs (since=2m) ==="
          sudo k3s kubectl -n cloudless logs deploy/cloudless-app --since=2m 2>&1 | grep -iE "(contact|email|slack|espocrm|appflowy|resend|error|warn|success|sending|lead)" | tail -30
