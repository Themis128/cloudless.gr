name: Check contact pipeline logs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 5
    steps:
      - name: Check fresh logs
        run: |
          set -euo pipefail
          echo "=== Pod env (verify in-cluster URLs) ==="
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- printenv ESPOCRM_BASE_URL 2>&1 || true
          sudo k3s kubectl -n cloudless exec deploy/cloudless-app -- printenv APPFLOWY_API_URL 2>&1 || true
          echo ""
          echo "=== Logs since=30s (fresh) ==="
          sudo k3s kubectl -n cloudless logs deploy/cloudless-app --since=30s 2>&1 | head -60
