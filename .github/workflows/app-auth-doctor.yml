name: App auth doctor (Pi cloudless deployment wiring)
# re-triggered 2026-06-03 — post-deploy full-stack verification
# re-triggered 2026-06-03T00:30Z — post-k3s-restart verification (cluster recovered)

# Read-only: dumps how the k3s `cloudless` app is wired for auth (env names,
# secrets, configmaps — never values) so we can wire Keycloak onto the standby.
# Posts to issue #382.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/app-auth-doctor.yml"
      - "scripts/app-auth-doctor.sh"

permissions:
  contents: read
  issues: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1
      - name: Connect to tailnet
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Diagnose
        run: bash scripts/app-auth-doctor.sh 2>&1 | tee aad.log
      - name: Discover SSM param names (auth) via pi-standby-aws-creds
        run: |
          set -uo pipefail
          # Read the cluster's AWS creds (same ones the app uses for SSM); use them
          # only to LIST parameter names — values are never printed.
          AK=$(kubectl -n cloudless get secret pi-standby-aws-creds -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' 2>/dev/null | base64 -d || true)
          SK=$(kubectl -n cloudless get secret pi-standby-aws-creds -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' 2>/dev/null | base64 -d || true)
          [ -n "$AK" ] && echo "::add-mask::$AK"; [ -n "$SK" ] && echo "::add-mask::$SK"
          if [ -z "$AK" ] || [ -z "$SK" ]; then echo "## SSM: could not read pi-standby-aws-creds (keys may differ)"; kubectl -n cloudless get secret pi-standby-aws-creds -o jsonpath='{.data}' | grep -oE '"[^"]+":' | tr -d '":,' | sed 's/^/  key: /'; exit 0; fi
          export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$SK" AWS_REGION=us-east-1
          echo "## SSM /cloudless/production param NAMES matching AUTH|COGNITO|KEYCLOAK|NEXTAUTH:" | tee -a aad.log
          aws ssm get-parameters-by-path --path /cloudless/production --recursive --query 'Parameters[].Name' --output text 2>&1 \
            | tr '\t' '\n' | grep -iE 'AUTH_SECRET|COGNITO|KEYCLOAK|NEXTAUTH' | sed 's/^/  /' | tee -a aad.log || echo "  (none / aws error)" | tee -a aad.log
      - name: Post to tracking issue
        if: always()
        run: |
          { echo "# App auth doctor — $(date -u '+%F %T')Z"; echo; echo '```'; cat aad.log 2>/dev/null || echo '(no log)'; echo '```'; } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
