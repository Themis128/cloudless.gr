name: Platform crons

# Triggers the app's authenticated cron endpoints on a schedule:
#
#   /api/cron/owner-digest           — weekly Slack digest (Mon 06:00 UTC)
#   /api/cron/client-reports         — monthly client status emails (1st 08:00 UTC;
#                                      endpoint is idempotent within a 25-day window,
#                                      so re-runs are safe)
#   /api/cron/email-digest           — weekly executive email digest (Mon 08:00 UTC)
#   /api/cron/consultation-reminder  — pre-consultation Slack+email reminder (every 30min)
#
# Auth: CRON_SECRET is read from SSM /cloudless/production/CRON_SECRET via the
# existing AWS OIDC deploy role — no extra repo secrets needed.
#
# Manual run: workflow_dispatch with a target picker (defaults to all).

on:
  schedule:
  - cron: 0 6 * * 1       # owner-digest — Mondays 06:00 UTC
  - cron: 0 8 1 * *       # client-reports — 1st of the month 08:00 UTC
  - cron: 0 8 * * 1       # email-digest — Mondays 08:00 UTC
  - cron: 0,30 * * * *    # consultation-reminder — every 30 minutes
  workflow_dispatch:
    inputs:
      target:
        description: Which cron endpoint(s) to trigger
        type: choice
        default: all
        options:
        - all
        - owner-digest
        - client-reports
        - email-digest
        - consultation-reminder

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  # Bypass Cloudflare Bot Fight Mode on the apex (GHA IPs get 403 interstitials).
  # pi-origin hits the tunnel → Pi NodePort directly; app still enforces CRON_SECRET.
  BASE_URL: https://pi-origin.cloudless.gr

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Read CRON_SECRET from repository secrets
      id: secret
      run: |
        SECRET="${{ secrets.CRON_SECRET }}"
        if [ -z "$SECRET" ]; then
          echo "::error::CRON_SECRET not set in repository secrets — cron endpoints cannot authenticate."
          exit 1
        fi
        echo "::add-mask::$SECRET"
        echo "value=$SECRET" >> "$GITHUB_OUTPUT"

    - name: Decide targets
      id: targets
      run: |
        EVENT="${{ github.event_name }}"
        SCHEDULE="${{ github.event.schedule }}"
        INPUT="${{ github.event.inputs.target }}"
        RUN_DIGEST="false"
        RUN_REPORTS="false"
        RUN_EMAIL_DIGEST="false"
        RUN_CONSULT_REMINDER="false"
        if [ "$EVENT" = "workflow_dispatch" ]; then
          case "$INPUT" in
            all)                    RUN_DIGEST="true"; RUN_REPORTS="true"; RUN_EMAIL_DIGEST="true"; RUN_CONSULT_REMINDER="true" ;;
            owner-digest)           RUN_DIGEST="true" ;;
            client-reports)         RUN_REPORTS="true" ;;
            email-digest)           RUN_EMAIL_DIGEST="true" ;;
            consultation-reminder)  RUN_CONSULT_REMINDER="true" ;;
          esac
        elif [ "$SCHEDULE" = "0 6 * * 1" ]; then
          RUN_DIGEST="true"
        elif [ "$SCHEDULE" = "0 8 1 * *" ]; then
          RUN_REPORTS="true"
        elif [ "$SCHEDULE" = "0 8 * * 1" ]; then
          RUN_EMAIL_DIGEST="true"
        elif [ "$SCHEDULE" = "0,30 * * * *" ]; then
          RUN_CONSULT_REMINDER="true"
        fi
        echo "digest=$RUN_DIGEST" >> "$GITHUB_OUTPUT"
        echo "reports=$RUN_REPORTS" >> "$GITHUB_OUTPUT"
        echo "email_digest=$RUN_EMAIL_DIGEST" >> "$GITHUB_OUTPUT"
        echo "consult_reminder=$RUN_CONSULT_REMINDER" >> "$GITHUB_OUTPUT"

    - name: Trigger owner-digest
      if: steps.targets.outputs.digest == 'true'
      run: |
        echo "Calling $BASE_URL/api/cron/owner-digest"
        RESPONSE=$(curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
          -H "Authorization: Bearer ${{ steps.secret.outputs.value }}" \
          "$BASE_URL/api/cron/owner-digest")
        echo "Response: $RESPONSE"
        echo "## Owner digest" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Trigger client-reports
      if: steps.targets.outputs.reports == 'true'
      run: |
        echo "Calling $BASE_URL/api/cron/client-reports"
        RESPONSE=$(curl -fsS --retry 3 --retry-delay 10 --max-time 120 \
          -H "Authorization: Bearer ${{ steps.secret.outputs.value }}" \
          "$BASE_URL/api/cron/client-reports")
        echo "Response: $RESPONSE"
        echo "## Client reports" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Trigger email-digest
      if: steps.targets.outputs.email_digest == 'true'
      run: |
        echo "Calling $BASE_URL/api/cron/email-digest"
        RESPONSE=$(curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
          -H "Authorization: Bearer ${{ steps.secret.outputs.value }}" \
          "$BASE_URL/api/cron/email-digest")
        echo "Response: $RESPONSE"
        echo "## Email digest" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Trigger consultation-reminder
      if: steps.targets.outputs.consult_reminder == 'true'
      run: |
        echo "Calling $BASE_URL/api/cron/consultation-reminder"
        RESPONSE=$(curl -fsS --retry 2 --retry-delay 5 --max-time 30 \
          -H "Authorization: Bearer ${{ steps.secret.outputs.value }}" \
          "$BASE_URL/api/cron/consultation-reminder")
        echo "Response: $RESPONSE"
        echo "## Consultation reminder" >> "$GITHUB_STEP_SUMMARY"
        echo '```json' >> "$GITHUB_STEP_SUMMARY"
        echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
