name: MCP Security Scan

on:
  pull_request:
    # Scanner only inspects src/**/*.{ts,tsx,js,jsx,py,md}, so non-source PRs
    # (docs, workflow tweaks, .env templates) can skip the scan.
    paths:
      - 'src/**'
      - 'tools/mcp-security-scanner/**'
      - '.github/workflows/mcp-security-scan.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/mcp-security-scanner/**'
      - '.github/workflows/mcp-security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Run MCP security scanner
    runs-on: [self-hosted, omv]
    # Informational only — scanner flags normal Next.js patterns (template
    # literals, process.env refs, console.error) as false positives.
    # Results are visible in the Actions log but do not block deploys.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install scanner dependencies
        run: npm install
        working-directory: tools/mcp-security-scanner

      - name: Run MCP security scan
        # Scan only the app src/ directory — exclude tools/ to avoid
        # the scanner flagging its own source code as vulnerable.
        # --exit-zero: findings for intentionally public routes (contact, subscribe,
        # blog, health) are expected and documented. Scanner is informational only.
        run: npm run scan -- --path "../../src/**/*.{ts,tsx,js,jsx,py,md}" --exit-zero
        working-directory: tools/mcp-security-scanner
