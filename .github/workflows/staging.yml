name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Staging
    environment: staging
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"self-hosted"') }}
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-staging-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-staging-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-staging-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:ci

      - name: Validate secrets exist
        run: |
          [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]] || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          [[ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]] || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply staging database migrations
        run: npx wrangler d1 migrations apply user-auth-db --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      - name: Deploy to Staging
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-cloudflare-free.json --env staging
          wranglerVersion: "4.15.0"

      - name: Health check
        run: |
          sleep 10
          curl -sf https://staging.cloudless.gr/api/health || exit 1
          echo "✅ Staging health check passed"

      - name: Notify Slack — staging deploy result
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS=":white_check_mark: Staging Deploy Succeeded"
          else
            STATUS=":x: Staging Deploy Failed"
          fi
          curl -s --max-time 10 -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"${STATUS} — \`${GITHUB_SHA::7}\` by ${{ github.actor }}\",
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"${STATUS}\", \"emoji\": true}},
                {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Stage:* \`staging\`\n*Commit:* \`${GITHUB_SHA::7}\`\n*Actor:* ${{ github.actor }}\"}},
                {\"type\": \"context\", \"elements\": [{\"type\": \"mrkdwn\", \"text\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>\"}]}
              ]
            }" || true