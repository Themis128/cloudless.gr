name: Force Pi rollout (RETIRED — use deploy-pi.yml)

# ECR force-rollout is retired. Live path: deploy-pi.yml (R2 artifact + CF Workflow).
# Do not push to this file to trigger rollouts.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Ignored — workflow is retired
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pi-rollout-force-retired
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: ECR force-rollout retired
        run: |
          echo "::error::rollout-pi-force (ECR) is retired. Trigger deploy-pi.yml or the Pi deploy orchestrator Worker. Cloudflare Free / R2 only."
          exit 1
