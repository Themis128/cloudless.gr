name: Force Pi rollout (existing ECR image, no OIDC)

# Unblock Pi rollout when AWS_DEPLOY_ROLE_ARN OIDC is broken.
# No AWS credentials needed — uses TS_AUTHKEY + KUBECONFIG_B64 + OMV_SSH_KEY.
# The image must already exist in ECR (built by a previous successful deploy-pi run).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rollout-pi-force.yml"
  workflow_dispatch:
    inputs:
      sha:
        description: 'Short ECR image tag (12-char SHA already in ECR)'
        required: true
        default: '89b57243c994'

env:
  # SHA used when triggered by push (no workflow_dispatch input available).
  # Update this value to re-trigger a rollout to a different image.
  DEFAULT_ROLLOUT_SHA: '89b57243c994'
  ECR_REGISTRY: 278585680617.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: cloudless-pi-app
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless

jobs:
  rollout:
    name: Rollout existing image to Pi k3s
    runs-on: ubuntu-latest

    steps:
      - name: Connect to tailnet
        continue-on-error: true
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify Tailscale path to omv-main
        run: |
          tailscale ping -c 3 --timeout=15s 100.113.41.119 \
            || echo "Note: Tailscale using DERP relay — kubectl will still work"
          nc -zv -w 10 100.113.41.119 6443 \
            && echo "Port 6443 directly reachable" \
            || echo "Port 6443 via nc failed — proceeding over Tailscale relay"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Diagnose k3s on Pi
        env:
          PI_HOST: "100.113.41.119"
          PI_USER: "tbaltzakis"
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OMV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "$PI_USER@$PI_HOST" '
              echo "=== k3s service status ==="
              systemctl is-active k3s || true
              echo "=== last 20 k3s journal lines ==="
              sudo journalctl -u k3s -n 20 --no-pager 2>/dev/null || true
              echo "=== memory ==="
              free -m
              echo "=== disk ==="
              df -h /
              echo "=== etcd defrag (while k3s is running) ==="
              # Ensure k3s is running before attempting defrag
              if ! systemctl is-active --quiet k3s; then
                echo "k3s not active — starting it first for etcd defrag..."
                sudo systemctl start k3s
                sleep 15
              fi
              sudo k3s etcdctl defrag \
                --endpoints=https://127.0.0.1:2379 \
                --cacert=/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt \
                --cert=/var/lib/rancher/k3s/server/tls/etcd/server-client.crt \
                --key=/var/lib/rancher/k3s/server/tls/etcd/server-client.key \
                2>/dev/null && echo "etcd defrag done" || echo "etcd defrag skipped"
              echo "=== Kill leftover containerd-shim processes ==="
              # Orphaned shims from previous k3s crashes consume memory and
              # cause k3s to OOM on reconciliation. Kill them before restart
              # so k3s starts with a clean container slate.
              SHIM_PIDS=$(pgrep containerd-shim 2>/dev/null | tr '\n' ' ' || true)
              if [ -n "$SHIM_PIDS" ]; then
                echo "Killing containerd-shim PIDs: $SHIM_PIDS"
                sudo kill -9 $SHIM_PIDS 2>/dev/null || true
                sleep 2
              else
                echo "No leftover containerd-shim processes found"
              fi
              echo "=== Stop cloudless app containers before restart (free RAM) ==="
              sudo crictl ps 2>/dev/null | grep cloudless | awk '{print $1}' \
                | xargs -r sudo crictl stop --timeout 10 2>/dev/null || true
              sudo crictl ps -a 2>/dev/null | grep cloudless | awk '{print $1}' \
                | xargs -r sudo crictl rm -f 2>/dev/null || true
              echo "=== Restart k3s after defrag + cleanup ==="
              sudo systemctl restart k3s
              echo "k3s restarted — waiting 30s for etcd to initialise..."
              sleep 30
              echo "=== Compact + defrag etcd to clear NOSPACE condition ==="
              ETCD_EP="https://127.0.0.1:2379"
              ETCD_CA="/var/lib/rancher/k3s/server/tls/etcd/server-ca.crt"
              ETCD_CRT="/var/lib/rancher/k3s/server/tls/etcd/server-client.crt"
              ETCD_KEY="/var/lib/rancher/k3s/server/tls/etcd/server-client.key"
              REV=$(sudo k3s etcdctl endpoint status \
                --endpoints="$ETCD_EP" --cacert="$ETCD_CA" \
                --cert="$ETCD_CRT" --key="$ETCD_KEY" \
                --write-out=json 2>/dev/null \
                | grep -o '"revision":[0-9]*' | head -1 | cut -d: -f2 || echo "")
              if [ -n "$REV" ] && [ "$REV" -gt 0 ] 2>/dev/null; then
                echo "Compacting to revision $REV..."
                sudo k3s etcdctl compact "$REV" \
                  --endpoints="$ETCD_EP" --cacert="$ETCD_CA" \
                  --cert="$ETCD_CRT" --key="$ETCD_KEY" \
                  2>/dev/null && echo "compact done" || echo "compact skipped"
                echo "Defragmenting after compact..."
                sudo k3s etcdctl defrag \
                  --endpoints="$ETCD_EP" --cacert="$ETCD_CA" \
                  --cert="$ETCD_CRT" --key="$ETCD_KEY" \
                  2>/dev/null && echo "defrag done" || echo "defrag skipped"
                echo "Disarming NOSPACE alarm if set..."
                sudo k3s etcdctl alarm disarm \
                  --endpoints="$ETCD_EP" --cacert="$ETCD_CA" \
                  --cert="$ETCD_CRT" --key="$ETCD_KEY" \
                  2>/dev/null && echo "alarm disarm done" || echo "alarm disarm skipped"
              else
                echo "etcd not ready for compact (rev=$REV) — skipping"
              fi
              echo "Sleeping 15s after etcd maintenance..."
              sleep 15
              echo "=== Scale cloudless to 0 replicas (free RAM for /readyz polling) ==="
              sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                scale deployment/cloudless -n cloudless --replicas=0 \
                2>/dev/null && echo "scale to 0: done" || echo "scale to 0: skipped (k3s not ready)"
              echo "Sleeping 20s for pod to terminate..."
              sleep 20
            '

      - name: Wait for k3s /readyz (3x stable via kubectl)
        run: |
          wait_for_api() {
            local stable=0
            for i in $(seq 1 120); do
              if kubectl get --raw /readyz --request-timeout=5s 2>/dev/null \
                  | grep -q 'ok'; then
                stable=$((stable + 1))
                echo "  ${i}/120 — /readyz ok (stable ${stable}/3)"
                if [ "$stable" -ge 3 ]; then
                  return 0
                fi
              else
                stable=0
                echo "  ${i}/120 — /readyz not ready, waiting 5s..."
              fi
              sleep 5
            done
            return 1
          }

          echo "Waiting for k3s API to be stable (3x kubectl /readyz ok)..."
          if wait_for_api; then
            echo "k3s API stable — proceeding to rollout"
          else
            echo "::error::k3s /readyz never returned 3x ok in 10 min — aborting"
            exit 1
          fi

      - name: Refresh ECR pull credentials on Pi
        env:
          PI_HOST: "100.113.41.119"
          PI_USER: "tbaltzakis"
        run: |
          # ECR tokens expire after 12h. The ecr-heal cronjob refreshes them
          # every 5 min, but it may not have run yet when the new pod tries to
          # pull — causing ImagePullBackOff. Trigger it explicitly and wait.
          echo "Triggering ecr-heal job to refresh ECR pull credentials..."
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$PI_USER@$PI_HOST" '
              JOB=ecr-refresh-pre-rollout
              sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                delete job "$JOB" -n cloudless --ignore-not-found 2>/dev/null || true
              sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                create job "$JOB" --from=cronjob/ecr-heal \
                -n cloudless 2>/dev/null \
                && echo "ecr-heal job created" \
                || echo "ecr-heal cronjob not found — skipping credential refresh"
              for i in $(seq 1 24); do
                STATUS=$(sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                  get job "$JOB" -n cloudless \
                  -o jsonpath="{.status.conditions[?(@.type==\"Complete\")].status}" \
                  2>/dev/null || echo "")
                if [ "$STATUS" = "True" ]; then
                  echo "ECR credentials refreshed (attempt ${i})"
                  break
                fi
                echo "  ${i}/24 — waiting for ecr-heal job..."
                sleep 5
              done
              sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                delete job "$JOB" -n cloudless --ignore-not-found 2>/dev/null || true
            ' 2>/dev/null || echo "ECR credential refresh SSH step failed — continuing"

      - name: Set image and roll out
        env:
          PI_HOST: "100.113.41.119"
          PI_USER: "tbaltzakis"
        run: |
          SHA="${{ github.event.inputs.sha || env.DEFAULT_ROLLOUT_SHA }}"
          echo "Rolling out image tag: ${SHA}"

          # Retry loop: etcd may still be settling after startup maintenance.
          for attempt in 1 2 3; do
            echo "=== kubectl attempt ${attempt}/3 ==="

            kubectl patch deployment/${{ env.K3S_DEPLOYMENT }} \
              -n ${{ env.K3S_NAMESPACE }} \
              -p '{"spec":{"progressDeadlineSeconds":3600}}' \
            && kubectl set image deployment/${{ env.K3S_DEPLOYMENT }} \
                 ${{ env.K3S_DEPLOYMENT }}=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${SHA} \
                 -n ${{ env.K3S_NAMESPACE }} \
            && break

            if [ "$attempt" -lt 3 ]; then
              echo "kubectl failed — waiting 60s before retry..."
              sleep 60
            else
              echo "::error::kubectl failed after 3 attempts"
              exit 1
            fi
          done

          # Scale to 0 before image pull: stops the running Next.js pod (frees
          # ~500 MB Pi RAM) so containerd can pull + start the new image without
          # OOM-killing k3s. rollout-restart (old+new overlap) caused k3s to
          # crash-loop for 30 min in run #4 (apiserver not ready, pod stuck
          # Terminating). Sequential scale 0→1 avoids that entirely.
          echo "Scaling down to 0 to free RAM before image pull..."
          kubectl scale deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }} --replicas=0

          # Poll /readyz instead of blind sleep: k3s can crash after the
          # scale-to-0 write (etcd + reconciliation pressure). Wait up to
          # 3 min for 3× stable /readyz before issuing scale-to-1.
          echo "Waiting for k3s to stay stable after scale-to-0 (up to 3 min)..."
          stable=0
          for i in $(seq 1 36); do
            if kubectl get --raw /readyz --request-timeout=5s 2>/dev/null \
                | grep -q 'ok'; then
              stable=$((stable + 1))
              echo "  ${i}/36 — /readyz ok (stable ${stable}/3)"
              if [ "$stable" -ge 3 ]; then
                break
              fi
            else
              stable=0
              echo "  ${i}/36 — k3s not ready, waiting 5s..."
            fi
            sleep 5
          done

          echo "Scaling back up to 1 with new image..."
          kubectl scale deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }} --replicas=1

          # Run rollout readiness check via SSH on the Pi itself (local kubeconfig,
          # 127.0.0.1:6443). Each SSH poll is a fresh short-lived connection —
          # k3s crashes between polls are handled transparently.
          # Every 6 iterations (~1 min) print pod status so we can see what's
          # blocking readiness (ContainerCreating, CrashLoopBackOff, etc.).
          echo "Waiting for rollout via SSH on Pi (local kubeconfig, up to 30 min)..."
          ROLLOUT_DONE=0
          for i in $(seq 1 180); do
            READY=$(ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$PI_USER@$PI_HOST" \
              "sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                get deployment/${{ env.K3S_DEPLOYMENT }} \
                -n ${{ env.K3S_NAMESPACE }} \
                -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0" \
              2>/dev/null || echo "0")
            if [ "${READY:-0}" = "1" ]; then
              echo "Rollout complete — 1/1 replicas ready (attempt ${i})"
              ROLLOUT_DONE=1
              break
            fi
            echo "  ${i}/180 — readyReplicas=${READY:-0}, waiting 10s..."
            # Every 6 polls (~1 min) show pod status to surface the blocking condition
            if [ $((i % 6)) -eq 0 ]; then
              echo "--- pod status (attempt ${i}) ---"
              ssh -i ~/.ssh/id_ed25519 \
                -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
                "$PI_USER@$PI_HOST" \
                "sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                  get pod -n ${{ env.K3S_NAMESPACE }} -o wide 2>/dev/null || true" \
                2>/dev/null || true
            fi
            sleep 10
          done

          if [ "$ROLLOUT_DONE" -ne 1 ]; then
            echo "::error::Rollout timed out after 30 min — dumping pod details"
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              "$PI_USER@$PI_HOST" \
              "sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                get pod -n ${{ env.K3S_NAMESPACE }} -o wide 2>/dev/null || true; \
               echo '---'; \
               sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                describe pod -n ${{ env.K3S_NAMESPACE }} 2>/dev/null | tail -60 || true; \
               echo '---'; \
               sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml \
                logs -n ${{ env.K3S_NAMESPACE }} -l app=${{ env.K3S_DEPLOYMENT }} \
                --tail=30 --previous 2>/dev/null || true" \
              2>/dev/null || true
            exit 1
          fi
          echo "Rollout complete: SHA=${SHA}"
