name: Switch to k3s cluster

# Forces cloudless.gr and www.cloudless.gr to point to Pi k3s cluster (omv.tail8eb71.ts.net)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/switch-to-k3s.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get Cloudflare token
        id: token
        run: |
          TOKEN=$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption --region us-east-1 \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Switch DNS to k3s
        run: |
          set -e
          ZONE_ID=$(curl -sS \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            "https://api.cloudflare.com/client/v4/zones?name=cloudless.gr" \
            | jq -r '.result[0].id')

          for HOST in cloudless.gr www.cloudless.gr; do
            # List all records to see what type they are
            curl -sS \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$HOST" \
              | jq '.result[] | {id, type, name, content}'
            
            # Get first record (any type)
            REC_ID=$(curl -sS \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$HOST" \
              | jq -r '.result[0].id // empty')
            
            if [ -n "$REC_ID" ]; then
              echo "→ Switching $HOST -> omv.tail8eb71.ts.net (record: $REC_ID)"
              curl -sS -X PATCH \
                -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$REC_ID" \
                -d '{"content":"omv.tail8eb71.ts.net","proxied":true}' | jq -r '.success'
            else
              echo "No record found for $HOST"
            fi
          done

      - name: Report
        if: always()
        run: |
          echo "# Switch to k3s — $(date -u '+%Y-%m-%d %H:%M:%SZ')" | \
            gh issue comment 382 --repo "${{ github.repository }}" --body-file -