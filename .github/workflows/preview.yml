name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-deploy-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v6 v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-preview-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:ci

      - name: Validate secrets
        run: |
          echo "OIDC assume role failed for PR preview."
          echo "If this is from a fork, GitHub will not grant OIDC tokens by default."
          echo "If this is an internal PR, check that the IAM trust policy allows the pull_request sub-claim for this repo."
          exit 1

      - name: Apply preview database migrations
        run: npx wrangler d1 migrations apply auth-db-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build for Cloudflare
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr

      - name: Upload static assets
        run: |
          mkdir -p ./out
          if [ -d ".next/static" ]; then cp -r .next/static/* ./out/ 2>/dev/null || true; fi
          if [ -d "public" ]; then cp -r public/* ./out/ 2>/dev/null || true; fi
          if [ -d "./out" ]; then
            find "./out" -type f | while read -r file; do
              rel_path="${file#./out/}"
              [[ "$rel_path" == .* ]] && continue
              npx wrangler r2 object put "cloudless-assets-preview/$rel_path" --file="$file" 2>/dev/null || true
            done
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Preview
        id: deploy
        run: |
          pnpm deploy:staging 2>&1 | tee deploy-output.txt
          # Extract the site URL from SST output
          URL=$(grep -oP 'https://\S+' deploy-output.txt | head -1 || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy -c wrangler.preview.jsonc
          wranglerVersion: "4.15.0"

      - name: Preview health check
        run: |
          sleep 5
          curl -sf "${{ steps.deploy.outputs.deployment-url }}/api/health" || exit 1
          echo "✅ Preview health check passed"

      - name: Comment Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const body = `## 🚀 Preview Deployment\n\n| | |\n|---|---|\n| **URL** | ${url} |\n| **Branch** | \`${{ github.head_ref }}\` |\n| **Commit** | \`${{ github.sha }}\` |\n\n*This preview environment shares bindings with other PR previews.*`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('Preview Deployment'));

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: url,
              context: 'Preview Deploy',
              description: 'Deployed to preview'
            });