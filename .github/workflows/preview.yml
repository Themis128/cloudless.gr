name: Preview Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'sst.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        id: awscreds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6 v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-preview-${{ github.run_id }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Fail with OIDC trust-policy guidance
        if: steps.awscreds.outcome == 'failure'
        run: |
          echo "OIDC assume role failed for PR preview."
          echo "If this is from a fork, GitHub will not grant OIDC tokens by default."
          echo "If this is an internal PR, check that the IAM trust policy allows the pull_request sub-claim for this repo."
          exit 1

      - name: Deploy staging
        id: deploy
        run: |
          pnpm deploy:staging 2>&1 | tee deploy-output.txt
          # Extract the site URL from SST output
          URL=$(grep -oP 'https://\S+' deploy-output.txt | head -1 || echo "")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        if: steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@d4d6b0936434b21bc8345ad45a440c5f7d2c40ff # v3
        with:
          header: preview-url
          message: |
            ### 🚀 Preview deployed!
            **URL:** ${{ steps.deploy.outputs.url }}
            **Commit:** ${{ github.sha }}
