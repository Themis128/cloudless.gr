name: Notion integration health-check

# Hourly probe of every Notion DB the production code talks to.
# If any DB returns `object_not_found` (integration was unshared) or any
# other 4xx, the run fails red and Slack-pings so we know before users see
# 502s from /api/admin/calendar/create or empty content fallbacks elsewhere.
#
# This is the companion to:
#   - 8983eb3 (calendar fix that propagates failures as 502)
#   - calendar-notion-reshare skill (how to fix when this workflow alerts)
#
# Notion's API has no "share with this integration" endpoint, so detection
# is the best we can do — but detection within an hour beats production
# 502s every time.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: notion-integration-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Notion token + DB IDs from SSM
        id: secrets
        run: |
          set -e
          TOKEN=$(aws ssm get-parameter \
            --name /cloudless/production/NOTION_API_KEY \
            --with-decryption --region us-east-1 \
            --query 'Parameter.Value' --output text)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::No Notion token in SSM"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Probe each DB
        id: probe
        env:
          NOTION_TOKEN: ${{ steps.secrets.outputs.token }}
        run: |
          set -e
          # The DBs production code reads. Each entry: name|ssm_path
          # If an SSM key doesn't exist yet, the probe is skipped (not failed).
          # SSM key names verified against /cloudless/production/* on 2026-06-14.
          DBS=(
            "calendar|/cloudless/production/NOTION_CALENDAR_DB_ID"
            "case-studies|/cloudless/production/NOTION_CASE_STUDIES_DB_ID"
            "testimonials|/cloudless/production/NOTION_TESTIMONIALS_DB_ID"
            "services|/cloudless/production/NOTION_SERVICES_DB_ID"
            "faqs|/cloudless/production/NOTION_FAQS_DB_ID"
            "blog|/cloudless/production/NOTION_BLOG_DB_ID"
            "docs|/cloudless/production/NOTION_DOCS_DB_ID"
            "projects|/cloudless/production/NOTION_PROJECTS_DB_ID"
            "reports|/cloudless/production/NOTION_REPORTS_DB_ID"
            "analytics|/cloudless/production/NOTION_ANALYTICS_DB_ID"
            "gsc-reports|/cloudless/production/NOTION_GSC_REPORTS_DB_ID"
            "tasks|/cloudless/production/NOTION_TASKS_DB_ID"
            "submissions|/cloudless/production/NOTION_SUBMISSIONS_DB_ID"
            "esp32-devices|/cloudless/production/NOTION_ESP32_DEVICES_DB_ID"
            "esp32-telemetry|/cloudless/production/NOTION_ESP32_TELEMETRY_DB_ID"
          )

          FAILED=()
          MISSING=()
          OK=()

          for ENTRY in "${DBS[@]}"; do
            NAME=$(echo "$ENTRY" | cut -d'|' -f1)
            SSM_PATH=$(echo "$ENTRY" | cut -d'|' -f2)

            DB_ID=$(aws ssm get-parameter \
              --name "$SSM_PATH" \
              --query 'Parameter.Value' --output text 2>/dev/null || echo "")

            if [ -z "$DB_ID" ] || [ "$DB_ID" = "None" ]; then
              MISSING+=("$NAME (no SSM key)")
              continue
            fi

            RESP=$(curl -sS \
              -H "Authorization: Bearer $NOTION_TOKEN" \
              -H "Notion-Version: 2022-06-28" \
              "https://api.notion.com/v1/databases/$DB_ID")

            CODE=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('code', 'ok' if d.get('object')=='database' else 'unknown'))")

            if [ "$CODE" = "ok" ]; then
              OK+=("$NAME")
            else
              FAILED+=("$NAME ($CODE)")
            fi
          done

          # Emit a structured summary
          {
            echo "## Notion integration health"
            echo ""
            echo "| DB | Status |"
            echo "|----|--------|"
            for N in "${OK[@]}";      do echo "| $N | ✅ |"; done
            for N in "${FAILED[@]}";  do echo "| $N | ❌ |"; done
            for N in "${MISSING[@]}"; do echo "| $N | ⚪ |"; done
            echo ""
            echo "✅ healthy · ❌ integration unshared / API error · ⚪ SSM key not configured"
          } >> "$GITHUB_STEP_SUMMARY"

          # Output for downstream steps
          FAILED_JSON=$(printf '%s\n' "${FAILED[@]}" | python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          echo "failed=$FAILED_JSON" >> "$GITHUB_OUTPUT"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::${#FAILED[@]} Notion DB(s) unreachable: ${FAILED[*]}"
            exit 1
          fi
          echo "✅ All configured DBs reachable"

      - name: Slack alert on failure
        if: failure() && steps.probe.outputs.failed != '[]'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FAILED: ${{ steps.probe.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then exit 0; fi
          curl -s --max-time 10 -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \":warning: Notion integration health alert\",
              \"blocks\": [
                {\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\":warning: Notion integration health alert\"}},
                {\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"One or more Notion DBs are unreachable. Likely cause: integration was unshared from the DB.\n\nUnreachable: \`$FAILED\`\"}},
                {\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"*Fix:* run the \`calendar-notion-reshare\` skill — open each DB in Notion → ••• → Connections → add 'Cloudless.gr App'.\"}},
                {\"type\":\"actions\",\"elements\":[
                  {\"type\":\"button\",\"text\":{\"type\":\"plain_text\",\"text\":\"View run\"},\"url\":\"$RUN_URL\"}
                ]}
              ]
            }"
