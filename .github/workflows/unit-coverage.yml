name: unit-coverage
on:
  pull_request:
    paths:
    - src/**
    - __tests__/**
    - vitest.config.mts
    - package.json
    - .github/workflows/unit-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Vitest coverage (D1 / Cloudflare Free)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      CI: 'true'
      # No LocalStack / AWS — ssm-config is D1+env; stripe idempotency is D1.

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: pnpm/action-setup@v6

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install deps
      run: pnpm install --frozen-lockfile

    - name: Run unit tests with coverage (no AWS)
      run: |
        pnpm exec vitest run \
          --config vitest.config.mts \
          --coverage \
          --coverage.provider=v8 \
          --coverage.reporter=text-summary \
          --coverage.reporter=json-summary \
          --coverage.include='src/lib/ssm-config.ts' \
          --coverage.include='src/lib/ssm-config-d1.ts' \
          --coverage.include='src/lib/stripe-transactions.ts' \
          --coverage.include='src/lib/d1-write-budget.ts' \
          --reporter=default

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: vitest-coverage
        path: coverage/
        retention-days: 7
