# Probe LinkedIn GH secrets without printing token values.
# Reports HTTP status / grant errors only.

name: Probe LinkedIn secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ACCESS / CAPI / refresh_grant
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_CAPI_ACCESS_TOKEN: ${{ secrets.LINKEDIN_CAPI_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_AD_ACCOUNT_ID_SECRET: ${{ secrets.LINKEDIN_AD_ACCOUNT_ID }}
          LINKEDIN_AD_ACCOUNT_ID_VAR: ${{ vars.LINKEDIN_AD_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          acct="${LINKEDIN_AD_ACCOUNT_ID_VAR:-512642510}"
          echo "AD_ACCOUNT var=${LINKEDIN_AD_ACCOUNT_ID_VAR:-EMPTY} secret_set=$([ -n "${LINKEDIN_AD_ACCOUNT_ID_SECRET:-}" ] && echo yes || echo no)"
          echo "CLIENT_ID len=${#LINKEDIN_CLIENT_ID} CLIENT_SECRET set=$([ -n "${LINKEDIN_CLIENT_SECRET:-}" ] && echo yes || echo no)"

          probe_bearer() {
            local name="$1" token="${2:-}"
            if [ -z "$token" ]; then
              echo "$name: EMPTY"
              return
            fi
            code=$(curl -sS -o /tmp/li-body -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "LinkedIn-Version: 202605" \
              -H "X-Restli-Protocol-Version: 2.0.0" \
              "https://api.linkedin.com/rest/adAccounts/${acct}" || echo 000)
            # never print body (may leak)
            echo "$name: HTTP ${code} token_len=${#token}"
          }

          probe_bearer ACCESS "$LINKEDIN_ACCESS_TOKEN"
          probe_bearer CAPI "$LINKEDIN_CAPI_ACCESS_TOKEN"

          if [ -z "${LINKEDIN_REFRESH_TOKEN:-}" ]; then
            echo "refresh_grant: EMPTY refresh token"
          else
            body=$(curl -sS -X POST 'https://www.linkedin.com/oauth/v2/accessToken' \
              -d "grant_type=refresh_token" \
              -d "refresh_token=${LINKEDIN_REFRESH_TOKEN}" \
              -d "client_id=${LINKEDIN_CLIENT_ID}" \
              -d "client_secret=${LINKEDIN_CLIENT_SECRET}")
            # strip any access_token field if present
            safe=$(printf '%s' "$body" | sed -E 's/"access_token":"[^"]*"/"access_token":"***"/g; s/"refresh_token":"[^"]*"/"refresh_token":"***"/g')
            echo "refresh_grant: ${safe}"
          fi
