name: Rotate Cloudflare API token

# Rotates CLOUDFLARE_API_TOKEN via Cloudflare API Tokens Write.
# Free-tier: GitHub secret is source of truth (no AWS SSM).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually rotate (true) or dry-run / verify only (false)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-token-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Load current token from GitHub secret
        id: current
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Verify current token + extract id
        id: verify
        env:
          TOKEN: ${{ steps.current.outputs.token }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          SUCCESS=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
          if [ "$SUCCESS" != "True" ]; then
            echo "::error::Token verify failed: $RESP"
            exit 1
          fi
          TOKEN_ID=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          echo "token_id=$TOKEN_ID" >> "$GITHUB_OUTPUT"
          echo "✅ Current token id: $TOKEN_ID — verified active"

      - name: Dry-run summary
        if: ${{ inputs.apply != true }}
        env:
          TOKEN_ID: ${{ steps.verify.outputs.token_id }}
        run: |
          {
            echo "## Cloudflare token rotation — DRY RUN"
            echo ""
            echo "- Current token id: \`$TOKEN_ID\`"
            echo "- To rotate: re-run with **apply=true**"
            echo "- Updates GitHub secret \`CLOUDFLARE_API_TOKEN\` (requires \`GH_PAT\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rotate token via Cloudflare API
        if: ${{ inputs.apply == true }}
        id: rotate
        env:
          OLD_TOKEN: ${{ steps.current.outputs.token }}
          TOKEN_ID: ${{ steps.verify.outputs.token_id }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          # Fail before invalidating the old token if we cannot persist the new one.
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::GH_PAT secret required before rotate — refusing to invalidate CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          RESP=$(curl -sS -X PUT \
            -H "Authorization: Bearer $OLD_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/$TOKEN_ID/value" \
            -d '{}')
          SUCCESS=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
          if [ "$SUCCESS" != "True" ]; then
            echo "::error::Rotate failed: $RESP"
            exit 1
          fi
          NEW_TOKEN=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('result') or '')")
          if [ -z "$NEW_TOKEN" ]; then
            echo "::error::Rotate succeeded but Cloudflare returned an empty token"
            exit 1
          fi
          echo "::add-mask::$NEW_TOKEN"
          echo "new_token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Rotated — new token length: ${#NEW_TOKEN}"

      - name: Verify new token
        if: ${{ inputs.apply == true }}
        env:
          NEW_TOKEN: ${{ steps.rotate.outputs.new_token }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: Bearer $NEW_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          SUCCESS=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
          if [ "$SUCCESS" != "True" ]; then
            echo "::error::New token verify failed: $RESP"
            exit 1
          fi
          echo "✅ New token verified"

      - name: Update GH Actions secret
        if: ${{ inputs.apply == true }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.rotate.outputs.new_token }}
        run: |
          set -euo pipefail
          echo "::add-mask::$NEW_TOKEN"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT missing after rotate — set CLOUDFLARE_API_TOKEN manually ASAP"
            exit 1
          fi
          echo -n "$NEW_TOKEN" | gh secret set CLOUDFLARE_API_TOKEN --repo "${{ github.repository }}"
          echo "✅ GitHub Actions secret updated"

      - name: Apply summary
        if: ${{ inputs.apply == true }}
        env:
          TOKEN_ID: ${{ steps.verify.outputs.token_id }}
        run: |
          {
            echo "## Cloudflare token rotated"
            echo "- Token id (unchanged): \`$TOKEN_ID\`"
            echo "- GitHub secret \`CLOUDFLARE_API_TOKEN\` updated"
            echo "- Old secret invalidated immediately by Cloudflare"
          } >> "$GITHUB_STEP_SUMMARY"
