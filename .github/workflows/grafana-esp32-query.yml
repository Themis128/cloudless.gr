name: Grafana ESP32 Query
on:
  workflow_dispatch:
    inputs:
      dashboard_uid:
        description: Dashboard UID
        default: esp32-watchdog
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Connect to tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k8s
      - name: Wait for tailnet path to omv
        run: python3 scripts/ci/tailscale-wait.py 100.74.191.58 22
      - name: Configure kubectl via omv SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: scripts/ci/kubectl-via-omv-ssh.sh

      - name: Get Grafana admin password
        run: |
          PASS=$(kubectl get secret kube-prom-grafana -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          echo "::add-mask::${PASS}"
          echo "GRAFANA_PASS=${PASS}" >> "$GITHUB_ENV"
      - name: Query Grafana and ESP32 data
        env:
          DASHBOARD_UID: ${{ inputs.dashboard_uid }}
        run: python3 scripts/grafana-esp32-query.py
