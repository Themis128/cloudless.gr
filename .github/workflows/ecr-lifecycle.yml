name: ECR Lifecycle Policy & Cleanup
on:
  # Run weekly on Sunday at 03:00 UTC to prune ECR images automatically
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudless-pi-app
jobs:
  ecr-cleanup:
    name: Set lifecycle policy and prune old images
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Set ECR lifecycle policy (keep last 5 images)
        run: |
          aws ecr put-lifecycle-policy \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --lifecycle-policy-text "{\"rules\":[{\"rulePriority\":1,\"description\":\"Keep last 5 images\",\"selection\":{\"tagStatus\":\"any\",\"countType\":\"imageCountMoreThan\",\"countNumber\":5},\"action\":{\"type\":\"expire\"}}]}" \
            --region "${{ env.AWS_REGION }}"
          echo "Lifecycle policy applied."
      - name: Delete all but last 5 images
        run: |
          TOTAL=$(aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" --region "${{ env.AWS_REGION }}" --query "length(imageDetails)" --output text)
          KEEP=5; DELETE_COUNT=$((TOTAL - KEEP))
          if [ "$DELETE_COUNT" -le 0 ]; then echo "Only $TOTAL images — nothing to delete."; exit 0; fi
          echo "Deleting $DELETE_COUNT oldest of $TOTAL..."
          aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" --region "${{ env.AWS_REGION }}" --query "sort_by(imageDetails,&imagePushedAt)[:${DELETE_COUNT}].imageDigest" --output text | tr "\t" "\n" | while read DIGEST; do
            aws ecr batch-delete-image --repository-name "${{ env.ECR_REPOSITORY }}" --image-ids imageDigest="$DIGEST" --region "${{ env.AWS_REGION }}" --output json
          done
          echo "Done. Remaining: $(aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" --region "${{ env.AWS_REGION }}" --query "length(imageDetails)" --output text)"