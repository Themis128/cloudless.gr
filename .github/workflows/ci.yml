name: CI
# runner: self-hosted via vars.RUNNER_GENERIC (toggle-runner.sh pi|hosted)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "__tests__/**"
      - "sst.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "mcp.json"
      - ".mcp.json"
      - ".github/workflows/**"
      # Root-level config that affects build/lint/quality gates.
      # Without these, PRs editing only these files hang on the required
      # "Build" check because CI never triggers.
      - ".codacy/**"
      - ".sonarcloud.properties"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "prettier.config.*"
      # Cluster manifests + repo-root ignore rules also gate the required
      # "Build" check — without these, k8s-only or .gitignore-only PRs
      # are BLOCKED forever because the required check never fires.
      - "k8s/**"
      - ".gitignore"

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    # Failover-capable: defaults to ubuntu-latest. Flip via
    #   .github/scripts/toggle-runner.sh pi
    # when GH-hosted billing/capacity is broken.
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a4d402482785f524245f3df3eb3532 # v4.1.0
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a4d402482785f524245f3df3eb3532 # v4.1.0
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=3072

  build:
    name: Build
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
      NEXT_PUBLIC_HUBSPOT_PORTAL_ID: ${{ secrets.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: baltzakisthemiscom
      SENTRY_PROJECT: cloudless-gr
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a4d402482785f524245f3df3eb3532 # v4.1.0
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm build

  test:
    name: Unit Tests
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a4d402482785f524245f3df3eb3532 # v4.1.0
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm test:ci
