name: CI
# runner: self-hosted via vars.RUNNER_GENERIC (toggle-runner.py pi|hosted)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - public/**
      - e2e/**
      - __tests__/**
        # Unit/surface test sources — a tests-only PR must still fire the
        # required Build/Unit/Lint/Type checks or it stays BLOCKED forever.
      - tests/**
      - sst.config.cloudflare.ts
      - next.config.ts
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vitest.config.*
      - playwright.config.*
      - mcp.json
      - .mcp.json
      - .github/workflows/**
      - .github/dependabot.yml
        # actionlint's self-hosted-runner label list — without it, a
        # config-only PR hangs on the required checks (never fires CI).
      - .github/actionlint.yaml
        # Root-level config that affects build/lint/quality gates.
        # Without these, PRs editing only these files hang on the required
        # "Build" check because CI never triggers.
      - ops/**
      - .codacy/**
      - .sonarcloud.properties
      - .eslintrc*
      - eslint.config.*
      - .prettierrc*
      - prettier.config.*
      - .markdownlint-cli2.*
      - .markdownlint.*
      - .yamllint.yml
      - .yamllint.yaml
        # Python tooling config + sources linted by the python-lint job
        # (ruff/mypy). Without these, a Python-only change never fires CI.
      - pyproject.toml
      - .bandit
      - scripts/**
      - lambda/**
        # Cluster manifests, docs, agent skills, repo-root ignore rules, and
        # infrastructure firmware/k8s configs also gate the required "Build"
        # check — without these, PRs that touch only those paths are BLOCKED
        # forever because the required check never fires.
      - k8s/**
      - docs/**
      - .claude/**
        # Cursor agent rules under .cursor/ also gate required Build/Lint/Type/Unit
        # checks -- without this, a .cursor-only edit stays BLOCKED forever.
      - .cursor/**
        # Root-level project-memory docs (CLAUDE.md, AGENTS.md, README.md) also
        # gate the required "Build" check — they live at the repo root, not under
        # docs/, so without listing them a docs-only edit is BLOCKED forever.
      - "*.md"
      - .gitignore
      - infrastructure/**
        # Slack app manifest — slack-manifest-apply.yml deploys it, but the
        # required "Build" check still has to fire for the PR to merge.
        # Without this, a manifest-only edit stays BLOCKED forever.
      - slack-app.manifest.json
        # LICENSE-only PRs also need required Build/Lint/Type/Unit checks
        # to fire, otherwise branch protection blocks forever.
      - LICENSE
        # Worker-only PRs (workers/postiz-ai-proxy, pi-origin-proxy, etc.)
        # also gate the required "Build" check — without this, a
        # workers-only edit stays BLOCKED forever.
      - workers/**
        # Git hooks PRs (pre-commit/pre-push guards) also gate the required
        # checks — a .githooks-only edit stays BLOCKED forever without this.
      - .githooks/**

concurrency:
