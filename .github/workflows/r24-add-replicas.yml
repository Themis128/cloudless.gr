name: r24-add-replicas (RETIRED)

# R24 DynamoDB Global Tables replicas is retired. D1 is the source of truth;
# AWS DynamoDB is no longer the primary data layer. Do not add replicas.
# Cloudflare Free only.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Ignored — workflow retired
        required: false
        default: ''

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
    - name: R24 add-replicas retired
      run: |
        echo "::error::r24-add-replicas is retired. D1 is the source of truth; see infrastructure/r20-replication/DEPRECATED.md."
        exit 1
