# R24: Deploy DR to us-west-2 - AWS-side passive disaster recovery
# Creates a secondary-region Lambda + adds Global Tables replicas

name: Deploy DR West

on:
  workflow_dispatch:
    inputs:
      add_replicas:
        description: 'Add Global Tables replicas to existing tables'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: r24-add-replicas
  cancel-in-progress: false

jobs:
  add-replicas:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.add_replicas == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Add Global Tables replicas (us-west-2)
        run: |
          set -e
          # The table names are generated by SST with pattern: <stack>-<name>-<stage>
          # In production: cloudless-StripeTransactions-production, etc.
          
          for table in StripeTransactions UserProfile AdminNotifications AnalyticsCache SessionTokenStore; do
            echo "Adding us-west-2 replica to ${table}..."
            aws dynamodb update-table \
              --table-name "cloudless-${table}-production" \
              --region us-east-1 \
              --replicas "RegionName=us-west-2" \
              || echo "Replica may already exist or table not found"
          done
          
          echo "Replicas added. Verify in AWS Console DynamoDB Global Tables."