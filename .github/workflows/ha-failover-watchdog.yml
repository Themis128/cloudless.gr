name: HA failover watchdog

# Poor-man's HA failover for cloudless.gr — routes traffic to Pi k3s cluster
# when Cloudflare Workers have issues. Uses Tailscale Funnel for Pi access.
#
# Tokens: Zone → DNS: Edit (in SSM /cloudless/production/CLOUDFLARE_API_TOKEN)
#
# Endpoints:
#   Primary: cloudless-gr.baltzakis-themis.workers.dev (Cloudflare Worker)
#   Standby: github-omv.tail4ecae1.ts.net (omv/Pi via Tailscale Funnel)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PRIMARY_TARGET: "cloudless-gr.baltzakis-themis.workers.dev"
  STANDBY_TARGET: "github-omv.tail4ecae1.ts.net"
  HEALTH_URL: "https://cloudless-proxy.fly.dev/api/health"
  HEALTH_HOST_HEADER: "cloudless.gr"
  HEALTH_TIMEOUT_SEC: "15"
  ZONE_NAME: "cloudless.gr"
  HOSTNAMES: "cloudless.gr www.cloudless.gr"
  FAIL_THRESHOLD: "1"
  RECOVER_THRESHOLD: "3"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_state:
        description: "Force DNS state (primary | standby | auto)"
        type: choice
        options: [auto, primary, standby]
        default: auto

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: ha-failover-watchdog
  cancel-in-progress: false

jobs:
  probe-and-steer:
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"'"'ubuntu-latest'"'"') }}
    timeout-minutes: 4
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Resolve Cloudflare token
        id: token
        env:
          SECRET_FALLBACK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          TOKEN=$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption --region us-east-1 \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then TOKEN="$SECRET_FALLBACK"; fi
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::No Cloudflare token resolved"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Probe primary origin
        id: probe
        env:
          URL: ${{ env.HEALTH_URL }}
          HOST_HDR: ${{ env.HEALTH_HOST_HEADER }}
          TIMEOUT: ${{ env.HEALTH_TIMEOUT_SEC }}
        run: |
          set +e
          status_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time "$TIMEOUT" --connect-timeout 5 \
            -H "Host: $HOST_HDR" "$URL")
          rc=$?
          if [ $rc -ne 0 ] || [ "$status_code" -lt 200 ] || [ "$status_code" -ge 500 ]; then
            echo "result=unhealthy" >> "$GITHUB_OUTPUT"
          else
            echo "result=healthy" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide target state
        id: decide
        env:
          FORCE: ${{ inputs.force_state }}
          PROBE_RESULT: ${{ steps.probe.outputs.result }}
        run: |
          set -e
          if [ "$FORCE" = "primary" ] || [ "$FORCE" = "standby" ]; then
            echo "target=$FORCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "target=$([ "$PROBE_RESULT" = "unhealthy" ] && echo "standby" || echo "primary")" >> "$GITHUB_OUTPUT"

      - name: Reconcile DNS
        id: reconcile
        env:
          CF_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.decide.outputs.target }}
          ZONE_NAME: ${{ env.ZONE_NAME }}
          PRIMARY_TARGET: ${{ env.PRIMARY_TARGET }}
          STANDBY_TARGET: ${{ env.STANDBY_TARGET }}
        run: |
          set -e
          DESIRED="$([ "$TARGET" = "standby" ] && echo "$STANDBY_TARGET" || echo "$PRIMARY_TARGET")"
          ZONE_ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")
          ALL_RECS=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records")
          echo "$ALL_RECS" | python3 -c "import sys,json; [print(f\"{r['type']}|{r['name']}|{r['id']}|{r.get('content','')}\") for r in json.load(sys.stdin)['result']]" > /tmp/records.txt
          CHANGED=0
          for HOST in cloudless.gr www.cloudless.gr; do
            REC_LINE=$(grep "|${HOST}|" /tmp/records.txt | grep -E "^A|^CNAME" | head -1)
            if [ -z "$REC_LINE" ]; then continue; fi
            REC_ID=$(echo "$REC_LINE" | cut -d'|' -f3)
            CURRENT=$(echo "$REC_LINE" | cut -d'|' -f4)
            if [ "$CURRENT" != "$DESIRED" ]; then
              echo "→ Switching $HOST: $CURRENT → $DESIRED"
              curl -sS -X PATCH -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$REC_ID" -d "{\"content\":\"$DESIRED\",\"proxied\":true}" > /dev/null
              CHANGED=1
            fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## HA failover watchdog"
            echo ""
            echo "- Probe: **${{ steps.probe.outputs.result }}**"
            echo "- Target: **${{ steps.decide.outputs.target }}**"
            echo "- DNS Changed: ${{ steps.reconcile.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post result to tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# HA failover watchdog — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo ""
            echo "- Probe: ${{ steps.probe.outputs.result }}"
            echo "- Target: ${{ steps.decide.outputs.target }}"
            echo "- DNS Changed: ${{ steps.reconcile.outputs.changed }}"
          } | gh issue comment 382 --body-file -