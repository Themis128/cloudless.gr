name: Restart Pi self-hosted runners

# Pi GitHub Actions runner agents can become inactive after cluster OOM or host
# stress events. This workflow SSHes into the Pi host via Tailscale and restarts
# any actions.runner services that are inactive/dead/failed.
#
# Runs on ubuntu-latest so it works even when Pi runners are offline.
# Posts result to tracking issue #382.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/restart-pi-runners.yml

permissions:
  contents: read
  issues: write

jobs:
  restart-runners:
    name: Restart runner agents on omv
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Ensure Tailscale Slack channel
        id: slack-channel
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NEWSLETTER_SLACK_BOT_TOKEN: ${{ secrets.NEWSLETTER_SLACK_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          tokens = [
              token for token in (
                  os.environ.get("SLACK_BOT_TOKEN", ""),
                  os.environ.get("NEWSLETTER_SLACK_BOT_TOKEN", ""),
              ) if token
          ]

          def request(token, method, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          token = next((candidate for candidate in tokens if request(candidate, "auth.test").get("ok")), "")
          if not token:
              raise SystemExit("No configured Slack bot token passed auth.test")

          def call(method, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(
                  f"https://slack.com/api/{method}",
                  data=data,
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise SystemExit(f"Slack {method} failed: {result.get('error', 'unknown_error')}")
              return result

          query = urllib.parse.urlencode({"exclude_archived": "true", "limit": 200, "types": "public_channel"})
          channels = call(f"conversations.list?{query}")["channels"]
          channel = next((item for item in channels if item["name"] == "tailscale"), None)
          if channel is None:
              channel = call("conversations.create", {"name": "tailscale", "is_private": False})["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"channel_id={channel['id']}\n")
          print(f"Tailscale notifications channel ready: #{channel['name']}")
          PY

      - name: Connect to tailnet with OAuth
        id: tailscale-oauth
        continue-on-error: true
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci
          ping: github-omv.tail4ecae1.ts.net

      - name: Connect to tailnet with recovery auth key
        if: steps.tailscale-oauth.outcome == 'failure'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: github-omv.tail4ecae1.ts.net

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OMV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github-omv.tail4ecae1.ts.net >> ~/.ssh/known_hosts

      - name: List and restart inactive runner services
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o ConnectTimeout=15 tbaltzakis@github-omv.tail4ecae1.ts.net"

          echo "=== Runner service status (before) ==="
          $SSH "sudo systemctl list-units 'actions.runner.*' --no-pager --all" || true

          echo "--- restarting inactive/failed runner services ---"
          $SSH "
            set -euo pipefail
            services=\$(sudo systemctl list-units 'actions.runner.*' --no-pager --all --output=json 2>/dev/null \
              | python3 -c \"import sys,json; units=json.load(sys.stdin); [print(u['unit']) for u in units if u['active'] in ('inactive','failed')]\" 2>/dev/null || true)
            if [ -z \"\$services\" ]; then
              echo 'All runner services are already active — nothing to restart.'
            else
              for svc in \$services; do
                echo \"  restarting: \$svc\"
                sudo systemctl restart \"\$svc\"
              done
            fi
          "

          echo "=== Runner service status (after) ==="
          $SSH "sudo systemctl list-units 'actions.runner.*' --no-pager --all" || true

      - name: Post result to Tailscale Slack channel
        if: always() && steps.slack-channel.outputs.channel_id != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ steps.slack-channel.outputs.channel_id }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          status = os.environ["JOB_STATUS"]
          payload = {
              "channel": os.environ["CHANNEL_ID"],
              "text": f"Tailscale runner recovery {status}",
              "blocks": [
                  {
                      "type": "header",
                      "text": {"type": "plain_text", "text": f"Tailscale runner recovery: {status}"},
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"The automated Pi runner recovery workflow finished with *{status}*.",
                      },
                  },
                  {
                      "type": "section",
                      "text": {"type": "mrkdwn", "text": f"<{os.environ['RUN_URL']}|Open workflow run>"},
                  },
              ],
          }
          request = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SLACK_BOT_TOKEN']}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit(f"Slack chat.postMessage failed: {result.get('error', 'unknown_error')}")
          print("Tailscale runner recovery notification sent")
          PY

      - name: Send operator email notification
        if: always()
        continue-on-error: true
        run: |
          payload=$(python3 - <<'PY'
          import json
          import os
          print(json.dumps({
              "severity": os.environ.get("SEVERITY", "high"),
              "title": f"Tailscale runner recovery {os.environ['JOB_STATUS']}",
              "message": "The automated Pi runner recovery workflow completed.",
              "click": os.environ["RUN_URL"],
              "source": "github-actions/tailscale",
          }))
          PY
          )
          curl --fail --silent --show-error --max-time 30 \
            -X POST http://github-omv.tail4ecae1.ts.net:30300/api/webhooks/admin-alert \
            -H "x-cloudless-alert-secret: $ALERT_SECRET" \
            -H "content-type: application/json" \
            --data "$payload"
        env:
          ALERT_SECRET: ${{ secrets.NOTION_WEBHOOK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEVERITY: ${{ job.status == 'success' && 'info' || 'high' }}

      - name: Post result to tracking issue
        if: always()
        run: |
          {
            echo "# restart-pi-runners — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo ""
            echo "**Job:** ${{ job.status }}"
            echo ""
            echo "SSH to omv via Tailscale MagicDNS to list/restart inactive \`actions.runner.*\` services."
          } | gh issue comment 382 --repo "$GITHUB_REPOSITORY" --body-file -
