name: ETL — AWS Cost Explorer → R2 Data Lake

# Migrated version of etl-aws-cost-to-lake.yml
# Uses R2 S3-compatible endpoint instead of AWS S3.
# Set CLOUDFLARE_ACCOUNT_ID and CF_R2_ACCESS_KEY_ID/CF_R2_SECRET_ACCESS_KEY secrets
# to enable R2 target. Otherwise falls back to AWS S3.

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily (≈ 09:30 EEST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/etl-aws-cost-to-r2.yml"
      - "scripts/etl/aws-cost-to-r2.mjs"

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: us-east-1
  BUCKET: datalake-bucket

jobs:
  etl:
    name: AWS Cost → R2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: scripts/etl

      - name: Run AWS Cost ETL to R2
        run: node scripts/etl/aws-cost-to-r2.mjs
        env:
          ANALYTICS_BUCKET: ${{ env.BUCKET }}
          AWS_COST_LOOKBACK_DAYS: "60"
          # R2 credentials (optional - falls back to AWS S3 if not set)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      - name: Ping Kuma on success
        if: success()
        env:
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_ETL_AWS_COST }}
        run: |
          [ -z "$KUMA_PUSH_TOKEN" ] && exit 0
          curl -fsS --max-time 10 --retry 3 \
            "https://kuma.cloudless.gr/api/push/${KUMA_PUSH_TOKEN}?status=up&msg=etl-aws-cost+r2+ok" \
            > /dev/null || true

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_ETL_AWS_COST }}
        run: |
          [ -n "$KUMA_PUSH_TOKEN" ] && \
            curl -fsS --max-time 10 --retry 3 \
              "https://kuma.cloudless.gr/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=etl-aws-cost+r2+failed" \
              > /dev/null || true
          [ -n "$SLACK_WEBHOOK_URL" ] && \
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "text": ":x: ETL — AWS Cost → R2 failed See https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              }' || true