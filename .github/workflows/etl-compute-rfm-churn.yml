name: ETL — Compute RFM + churn scores

on:
  schedule:
    # 03:45 UTC — after Stripe ETL (03:30 UTC) finishes loading transactions
    # but before clients-to-lake (04:00 UTC) joins the scores in.
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: us-east-1
  BUCKET: cloudless-analytics-data

jobs:
  rfm-compute:
    name: Compute RFM + churn from transactions parquet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: scripts/etl

      - name: Compute scores
        run: node scripts/etl/compute-rfm-churn.mjs
        env:
          ANALYTICS_BUCKET: ${{ env.BUCKET }}

      - name: Ping Kuma on success
        if: success()
        env:
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_ETL_RFM }}
        run: |
          [ -z "$KUMA_PUSH_TOKEN" ] && exit 0
          curl -fsS --max-time 10 --retry 3 \
            "https://kuma.cloudless.gr/api/push/${KUMA_PUSH_TOKEN}?status=up&msg=etl-rfm+ok" \
            > /dev/null || true

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_ETL_RFM }}
        run: |
          [ -n "$KUMA_PUSH_TOKEN" ] && \
            curl -fsS --max-time 10 --retry 3 \
              "https://kuma.cloudless.gr/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=etl-rfm+failed" \
              > /dev/null || true
          [ -n "$SLACK_WEBHOOK_URL" ] && \
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "text": ":x: ETL — Compute RFM + churn failed See https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              }' || true
