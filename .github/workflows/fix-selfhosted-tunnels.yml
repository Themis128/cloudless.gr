name: Fix Self-Hosted App Tunnels

on:
  push:
    paths:
      - '.github/workflows/fix-selfhosted-tunnels.yml'
  workflow_dispatch:

jobs:
  fix-tunnels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Join Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      # ------------------------------------------------------------------
      # Step 1: Check current tunnel state on omv
      # ------------------------------------------------------------------
      - name: Read current cloudflared config from omv
        run: |
          # Delete stale pod from prior run before creating fresh one
          kubectl delete pod cf-read-omv -n default --ignore-not-found --wait=true

          cat <<'PODEOF' | kubectl create -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: cf-read-omv
            namespace: default
          spec:
            nodeSelector:
              kubernetes.io/hostname: omv
            hostPID: true
            hostNetwork: true
            restartPolicy: Never
            containers:
              - name: r
                image: alpine:3
                securityContext:
                  privileged: true
                command:
                  - sh
                  - -c
                  - |
                    apk add -q util-linux 2>/dev/null
                    nsenter --target 1 --mount --uts --ipc --net --pid -- \
                      cat /etc/cloudflared/config.yml
          PODEOF
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/cf-read-omv -n default --timeout=90s
          kubectl logs -n default cf-read-omv | tee /tmp/cf-config-current.txt
          kubectl delete pod -n default cf-read-omv --ignore-not-found
          echo "=== Current config ($(wc -l < /tmp/cf-config-current.txt) lines) ==="
          cat /tmp/cf-config-current.txt

      # ------------------------------------------------------------------
      # Step 2: Patch the config — fix grafana, add kuma + n8n if missing
      # ------------------------------------------------------------------
      - name: Patch cloudflared config
        run: |
          # State-machine line replacement — handles any leading-whitespace variant.
          # Only grafana needs fixing: localhost:18443 → 192.168.1.128:30850.
          # kuma (32501) and n8n (30820) are already correct on the cluster.
          python3 <<'PYEOF'
          import re, sys

          src = "/tmp/cf-config-current.txt"
          dst = "/tmp/cf-config-new.txt"

          with open(src) as f:
              lines = f.readlines()

          out = []
          i = 0
          patched = False
          while i < len(lines):
              line = lines[i]
              if re.match(r'\s*-\s*hostname:\s*grafana\.cloudless\.gr\s*$', line):
                  out.append(line)
                  i += 1
                  if i < len(lines) and re.match(r'\s*service:\s*', lines[i]):
                      indent = re.match(r'(\s*)', lines[i]).group(1)
                      new_svc = f"{indent}service: http://192.168.1.128:30850\n"
                      print(f"PATCHED: '{lines[i].rstrip()}' -> '{new_svc.rstrip()}'")
                      out.append(new_svc)
                      patched = True
                      i += 1
                  continue
              out.append(line)
              i += 1

          if not patched:
              print("WARNING: grafana hostname not found — config unchanged", file=sys.stderr)

          with open(dst, "w") as f:
              f.writelines(out)

          print(f"Done — wrote {dst} ({len(out)} lines)")
          PYEOF

          echo "=== Diff ==="
          diff /tmp/cf-config-current.txt /tmp/cf-config-new.txt || true
          echo "=== Grafana entry after patch ==="
          grep -A3 "grafana.cloudless.gr" /tmp/cf-config-new.txt

      # ------------------------------------------------------------------
      # Step 3: Apply patched config to omv (primary cloudflared)
      # ------------------------------------------------------------------
      - name: Apply config to omv
        run: |
          kubectl delete pod cf-apply-omv -n default --ignore-not-found --wait=true
          kubectl -n default create configmap cf-patch \
            --from-file=config.yml=/tmp/cf-config-new.txt \
            --dry-run=client -o yaml | kubectl apply -f -

          cat <<'PODEOF' | kubectl create -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: cf-apply-omv
            namespace: default
          spec:
            nodeSelector:
              kubernetes.io/hostname: omv
            hostPID: true
            hostNetwork: true
            restartPolicy: Never
            volumes:
              - name: patch
                configMap:
                  name: cf-patch
              - name: cfdir
                hostPath:
                  path: /etc/cloudflared
            containers:
              - name: w
                image: alpine:3
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: patch
                    mountPath: /patch
                  - name: cfdir
                    mountPath: /host-cf
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    apk add -q util-linux 2>/dev/null
                    cp /host-cf/config.yml /host-cf/config.yml.bak
                    cp /patch/config.yml /host-cf/config.yml
                    echo "=== grafana entry ===" && grep -A4 "grafana.cloudless.gr" /host-cf/config.yml
                    nsenter --target 1 --mount --uts --ipc --net --pid -- \
                      systemctl restart cloudflared
                    sleep 3
                    nsenter --target 1 --mount --uts --ipc --net --pid -- \
                      systemctl is-active cloudflared
                    echo "cloudflared OK on omv"
          PODEOF

          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/cf-apply-omv -n default --timeout=120s
          kubectl logs -n default cf-apply-omv
          kubectl delete pod -n default cf-apply-omv --ignore-not-found

      # ------------------------------------------------------------------
      # Step 4: Sync identical config to omv-ha via nsenter (same as omv)
      # ------------------------------------------------------------------
      - name: Apply config to omv-ha
        run: |
          # Delete any stale pod first so kubectl create (not apply) gives a fresh run
          kubectl delete pod cf-apply-ha -n default --ignore-not-found --wait=true

          cat <<'PODEOF' | kubectl create -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: cf-apply-ha
            namespace: default
          spec:
            nodeSelector:
              kubernetes.io/hostname: omv-ha
            hostPID: true
            hostNetwork: true
            restartPolicy: Never
            volumes:
              - name: patch
                configMap:
                  name: cf-patch
              - name: cfdir
                hostPath:
                  path: /etc/cloudflared
            containers:
              - name: w
                image: alpine:3
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: patch
                    mountPath: /patch
                  - name: cfdir
                    mountPath: /host-cf
                command:
                  - sh
                  - -c
                  - |
                    set -e
                    apk add -q util-linux 2>/dev/null
                    cp /host-cf/config.yml /host-cf/config.yml.bak
                    cp /patch/config.yml /host-cf/config.yml
                    echo "=== grafana entry ===" && grep -A4 "grafana.cloudless.gr" /host-cf/config.yml
                    nsenter --target 1 --mount --uts --ipc --net --pid -- \
                      systemctl restart cloudflared
                    sleep 3
                    nsenter --target 1 --mount --uts --ipc --net --pid -- \
                      systemctl is-active cloudflared
                    echo "cloudflared OK on omv-ha"
          PODEOF

          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/cf-apply-ha -n default --timeout=120s || true
          kubectl logs -n default cf-apply-ha
          kubectl delete pod -n default cf-apply-ha --ignore-not-found
          kubectl -n default delete configmap cf-patch --ignore-not-found

      # ------------------------------------------------------------------
      # Step 5: Deploy n8n if not already running
      # ------------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy n8n
        run: |
          echo "=== Checking for existing n8n namespace ==="
          if kubectl get namespace n8n 2>/dev/null; then
            echo "n8n namespace exists — checking pod status"
            kubectl get pods -n n8n
          else
            echo "n8n not deployed — applying manifest"
            kubectl apply -f infrastructure/n8n/k8s.yaml
            echo "Waiting for n8n rollout..."
            kubectl rollout status deployment/n8n -n n8n --timeout=180s || true
          fi
          echo "=== n8n service ==="
          kubectl get svc -n n8n

      # ------------------------------------------------------------------
      # Step 6: Verify all services are reachable
      # ------------------------------------------------------------------
      - name: Verify app health
        run: |
          echo "Waiting 20s for cloudflared to propagate..."
          sleep 20

          check() {
            local name=$1 url=$2
            CODE=$(curl -4 -sSL -o /dev/null -w '%{http_code}' --max-time 10 "$url" 2>/dev/null || echo "ERR")
            echo "  [$name] $CODE  ($url)"
          }

          echo "=== Self-hosted app health ==="
          check "grafana  " "https://grafana.cloudless.gr/api/health"
          check "kuma     " "https://kuma.cloudless.gr/"
          check "n8n      " "https://n8n.cloudless.gr/healthz"
          check "espocrm  " "https://espocrm.cloudless.gr/"
          check "postiz   " "https://postiz.cloudless.gr/"
          check "appflowy " "https://appflowy.cloudless.gr/"

      # ------------------------------------------------------------------
      # Step 7: Report
      # ------------------------------------------------------------------
      - name: Report result
        run: |
          gh issue comment 382 --body "### Self-hosted tunnel fix applied

          **Changes made:**
          - **Grafana** tunnel corrected: \`localhost:18443\` → \`http://192.168.1.128:30850\`
          - **Uptime Kuma** tunnel added: \`http://192.168.1.128:32501\`
          - **n8n** tunnel added: \`http://192.168.1.128:30900\`
          - Config synced to both **omv** and **omv-ha**, cloudflared restarted on both
          - n8n k8s deployment applied if not already running

          **Verify:**
          - https://grafana.cloudless.gr/login
          - https://kuma.cloudless.gr/
          - https://n8n.cloudless.gr/

          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
