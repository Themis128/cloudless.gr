name: Store Cloudflare API token → GitHub Secret → apply HA load balancer

# Accepts the Cloudflare API token as a workflow_dispatch input, masks it,
# stores it as the GitHub Actions secret CLOUDFLARE_API_TOKEN (no AWS SSM),
# then optionally runs the HA load-balancer apply in the same job
# (token passed to setup-cloudflare-lb.sh as env from the dispatch input).
#
# REQUIRED SECRETS:
#   GH_PAT — PAT with `repo` scope. GITHUB_TOKEN cannot write Actions secrets.
#
# HOW TO USE:
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token
#      (Zone:Read, LB:Edit, DNS:Edit for cloudless.gr — see cloudflare-token-doctor skill)
#   2. Run this workflow with the token value.
#      apply=true (default) immediately wires the LB.
#      apply=false stores only.

on:
  workflow_dispatch:
    inputs:
      cloudflare_token:
        description: Cloudflare API token (Zone:Read, LB:Edit, DNS:Edit for
          cloudless.gr)
        required: true
      secret_name:
        description: GitHub secret name to write (default CLOUDFLARE_API_TOKEN;
          use CLOUDFLARE_WORKERS_DEPLOY_TOKEN for worker deploys)
        required: false
        default: CLOUDFLARE_API_TOKEN
      apply:
        description: Also apply the HA load balancer after storing (true=apply,
          false=store only; LB steps only run for CLOUDFLARE_API_TOKEN)
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-lb
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  store-and-apply:
    runs-on: ubuntu-latest
    env:
      # Issue comments use the default token; secret writes use GH_PAT below.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v4.3.1

    - name: Store Cloudflare token as GitHub Actions secret
      id: store
      env:
        CF_TOKEN: ${{ github.event.inputs.cloudflare_token }}
        SECRET_NAME: ${{ github.event.inputs.secret_name }}
          # GITHUB_TOKEN cannot write secrets — need GH_PAT with repo scope.
        GH_TOKEN: ${{ secrets.GH_PAT }}
        GH_PAT_SET: ${{ secrets.GH_PAT != '' }}
      run: |
        set -uo pipefail
        echo "::add-mask::$CF_TOKEN"
        if [ -z "$CF_TOKEN" ]; then
          echo "::error::cloudflare_token input is empty"
          exit 1
        fi
        if [ "$GH_PAT_SET" != "true" ]; then
          echo "::error::GH_PAT secret is not set. Add a repo-scoped PAT as GH_PAT so this workflow can write secrets."
          exit 1
        fi
        NAME="${SECRET_NAME:-CLOUDFLARE_API_TOKEN}"
        case "$NAME" in
          CLOUDFLARE_API_TOKEN|CLOUDFLARE_WORKERS_DEPLOY_TOKEN) ;;
          *) echo "::error::secret_name must be CLOUDFLARE_API_TOKEN or CLOUDFLARE_WORKERS_DEPLOY_TOKEN"; exit 1 ;;
        esac
        if ! printf '%s' "$CF_TOKEN" | gh secret set "$NAME" --repo "${{ github.repository }}" --body -; then
          echo "::error::Failed to store GitHub Actions secret $NAME"
          exit 1
        fi
        echo "✓ Token stored as GitHub secret $NAME"
        echo "stored=true" >> "$GITHUB_OUTPUT"

    - name: Apply Cloudflare HA load balancer
      id: apply
      if: ${{ github.event.inputs.apply == 'true' && github.event.inputs.secret_name
        == 'CLOUDFLARE_API_TOKEN' && steps.store.outputs.stored == 'true' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ github.event.inputs.cloudflare_token }}
        MODE: apply
        CONFIRM: '1'
      run: |
        echo "::add-mask::$CLOUDFLARE_API_TOKEN"
        set -o pipefail
        bash scripts/setup-cloudflare-lb.sh 2>&1 | tee cloudflare-lb.log

    - name: Report (store-only mode)
      id: report
      if: ${{ github.event.inputs.apply != 'true' && github.event.inputs.secret_name
        == 'CLOUDFLARE_API_TOKEN' && steps.store.outputs.stored == 'true' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ github.event.inputs.cloudflare_token }}
        MODE: report
        CONFIRM: '0'
      run: |
        echo "::add-mask::$CLOUDFLARE_API_TOKEN"
        set -o pipefail
        bash scripts/setup-cloudflare-lb.sh 2>&1 | tee cloudflare-lb.log

    - name: Post result to tracking issue
      if: always()
      run: |
        APPLY="${{ github.event.inputs.apply }}"
        {
          echo "# Cloudflare HA load balancer — $(date -u '+%F %T')Z"
          echo ""
          echo "**Mode:** $( [ "$APPLY" = "true" ] && echo 'apply (token stored + LB wired)' || echo 'store-only (token in GH secret, report run)' )"
          echo "**Job:** ${{ job.status }}"
          echo ""
          echo '```'
          cat cloudflare-lb.log 2>/dev/null || echo '(no log — token stored as GitHub secret)'
          echo '```'
        } > c.md
        gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
