name: OMV disk prune
# Manual sda1/k3s disk cleanup on the omv self-hosted runner.
# Prunes containerd images (crictl), docker layers, and journal —
# buys headroom on the k3s SSD before the 85% remediate threshold.

on:
  schedule:
    - cron: "20 4 * * 0"  # weekly auto-heal, Sunday 04:20
  workflow_dispatch:
    inputs:
      docker_prune:
        description: "Also docker system prune -af (plain-docker workspace)"
        required: false
        default: "true"
      journal_mb:
        description: "journalctl vacuum size in MB"
        required: false
        default: "200"
      diagnose_only:
        description: "Only run the k3s dir audit — no prunes"
        required: false
        default: "false"
      restart_k3s:
        description: "Restart k3s after prune (fix wedged kubelet/pod stalls)"
        required: false
        default: "false"
      pods_restart:
        description: "Dump pod inventory + rollout restart all app deployments"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  prune:
    runs-on: [self-hosted, omv]
    steps:
      - name: Disk before
        run: df -h / /var/lib/rancher/k3s /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7 2>/dev/null | sort -u

      - name: k3s dir audit (find the real sda1 consumer)
        run: |
          sudo du -xh --max-depth=1 /var/lib/rancher/k3s 2>/dev/null | sort -rh | head -12
          echo "--- local-path PVs ---"
          sudo du -xh --max-depth=1 /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/storage 2>/dev/null | sort -rh | head -12
          echo "--- sda1 root (the real 94G lives here if not in k3s) ---"
          sudo du -xh --max-depth=2 /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7 2>/dev/null | sort -rh | head -15

      - name: containerd image prune (k3s images live on sda1)
        if: inputs.diagnose_only != 'true'
        run: sudo crictl rmi --prune || echo "crictl unavailable"

      - name: journal vacuum
        if: inputs.diagnose_only != 'true'
        run: sudo journalctl --vacuum-size=${{ inputs.journal_mb }}M || true

      - name: runner-work purge (~7G regenerable build state)
        if: inputs.diagnose_only != 'true'
        run: sudo rm -rf /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/runner-work/{.pnpm-store,build} 2>/dev/null; echo "runner-work purged"

      - name: NAS-Backup move sda1 → sdb1 + symlink (writers stay on sdb1)
        if: inputs.diagnose_only != 'true'
        run: |
          SRC=/srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/NAS-Backup
          DST=/srv/dev-disk-by-uuid-fa6231ab-eae7-40ea-a4b6-400f767a89d7/NAS-Backup
          if [ -d "$SRC" ] && [ ! -L "$SRC" ]; then
            sudo mkdir -p "$DST"
            sudo bash -c "shopt -s dotglob nullglob && mv $SRC/* $DST/"
            sudo rmdir "$SRC" && sudo ln -s "$DST" "$SRC" && echo "NAS-Backup moved + symlinked to sdb1"
          else
            echo "NAS-Backup already linked or absent"
          fi

      - name: docker-cache registry GC (~20G pull-through blobs)
        if: inputs.diagnose_only != 'true'
        run: |
          REG=$(sudo docker ps --format '{{.Names}}' | grep -i registry | head -1)
          if [ -n "$REG" ]; then
            sudo docker exec "$REG" bin/registry garbage-collect /etc/docker/registry/config.yml 2>/dev/null | tail -3 || echo "gc skipped"
          else
            sudo rm -rf /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/docker-cache/blobs/* 2>/dev/null && echo "orphaned cache blobs cleared (no live registry)" || echo "no registry container + blob clear skipped"
          fi

      - name: docker system prune
        if: inputs.docker_prune == 'true' && inputs.diagnose_only != 'true'
        run: sudo docker system prune -af --volumes 2>/dev/null | tail -5 || echo "docker prune skipped"

      - name: tailnet services heal (appflowy/ntfy/kuma unreachable 000)
        if: inputs.diagnose_only != 'true'
        run: |
          # Bounce the right layer: tailscaled is only the host daemon — the
          # *.ts.net services route through the k3s tailscale-operator. If its
          # namespace is empty (evicted in a disk-full event), bounces do
          # nothing; the operator needs a redeploy (tailscale-deploy.yml).
          OP_PODS=$(sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml -n tailscale-operator get pods --no-headers 2>/dev/null | wc -l)
          echo "tailscale-operator pods: $OP_PODS"
          if [ "$OP_PODS" -eq 0 ]; then
            echo "::warning::tailscale-operator namespace EMPTY — all *.ts.net services down; run tailscale-deploy.yml"
          fi
          sudo systemctl restart tailscaled 2>/dev/null; echo "tailscaled bounced"
          sudo systemctl restart cloudflared 2>/dev/null; echo "cloudflared bounced"

      - name: Restart k3s (kubelet stall — pods stuck ContainerCreating/crashloop)
        if: inputs.restart_k3s == 'true'
        run: |
          echo "=== restarting k3s (pod creation stalls detected) ==="
          systemctl list-units --type=service --all | grep -iE "k3s|rancher|containerd" || true
          # omv's k3s unit is k3s-k3s-omv.service (verified via unit listing);
          # generic k3s* greps match phantom failure-alert units instead.
          K3S_UNIT=k3s-k3s-omv.service
          if systemctl list-units --type=service --all | grep -q "$K3S_UNIT"; then
            sudo systemctl restart "$K3S_UNIT" && echo "$K3S_UNIT restarted"
          else
            echo "k3s-k3s-omv.service missing — restarting containerd + docker"
            sudo systemctl restart containerd 2>/dev/null || true
            sudo systemctl restart docker 2>/dev/null || true
          fi
          sleep 30
          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes
          echo "=== pods after restart ==="
          sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get pods -A | grep -vE "Running|Completed" | head -15

      - name: Pod inventory + restart sweep (dead apps behind the ts.net VIPs)
        if: inputs.pods_restart == 'true'
        run: |
          KC="sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml"
          echo "=== pod inventory (non-healthy) ==="
          $KC get pods -A -o wide 2>/dev/null | grep -vE "Running|Completed" | head -30
          echo "=== rollout-restarting every deployment (down apps recover) ==="
          $KC get deploy -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | \
            while read ns dep; do
              [ -z "$dep" ] && continue
              echo "restart: $ns/$dep"
              $KC -n "$ns" rollout restart deployment/"$dep" 2>/dev/null || true
            done
          echo "=== pod state after 60s ==="
          sleep 60
          $KC get pods -A 2>/dev/null | grep -vE "Running|Completed" | head -20

      - name: Disk after
        run: df -h / /var/lib/rancher/k3s /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7 2>/dev/null | sort -u
