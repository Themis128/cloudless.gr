name: 'ETL: Clients to R2'
# ETL sync: Cognito users + portals + ML scores → unified clients parquet in R2.
# Reads users + config from D1 via Cloudflare REST API (CLOUDFLARE_ACCOUNT_ID + CLOUDFLARE_API_TOKEN).
# Must run on self-hosted Pi runners — Cloudflare blocks data-center IPs.

on:
  schedule:
  - cron: 45 6 * * *       # daily at 06:45 UTC — after stripe (06:00) + RFM (06:15)
  workflow_run:
    workflows: ['ETL: Compute RFM to R2']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etl:
    name: Run Clients → R2 sync
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Always Pi — Cloudflare blocks GH-hosted/data-center IPs for this ETL.
    # Do not use vars.RUNNER_GENERIC failover (hosted = blocked).
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22


    - name: Install dependencies (use pnpm, avoid npm ci on pnpm-managed repo)
      working-directory: scripts/etl
      run: |
        # Ensure pnpm is available via corepack, then install production deps
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Run Clients-to-R2 sync
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node clients-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: Clients to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: Clients to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }

# Required secrets (add via GitHub repo → Settings → Secrets → Actions):
# CF_ACCOUNT_ID - Your Cloudflare account ID
# CLOUDFLARE_API_TOKEN - Cloudflare API token (D1 REST + Workers AI)
# CF_R2_ACCESS_KEY_ID - R2 access key from Cloudflare dashboard
# CF_R2_SECRET_ACCESS_KEY - R2 secret key from Cloudflare dashboard
# SLACK_WEBHOOK_URL - Slack webhook for failure notifications (optional)
