name: Cloudflare Workers Deploy

# Production frontend + App Router API for cloudless.gr.
# OpenNext builds the Next.js app and SST deploys it as a Cloudflare Worker
# (custom domain cloudless.gr). This is NOT Cloudflare Pages — there is no
# Pages project for the main site.

on:
  push:
    branches: [main]
    paths:
      # Full app surface — OpenNext Worker serves pages + API (not CF Pages).
      - 'migrations/*.sql'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.jsonc'
      - 'sst.config.cloudflare.ts'
      - 'opennext.config.*'
      - 'next.config.*'
      - '.github/workflows/cloudflare-deploy.yml'
      - 'scripts/cf-build-wrapper.sh'
      - 'scripts/sst-next-build.mjs'
      - 'scripts/opennext-middleware-fix.mjs'
      - 'scripts/strip-opennext-bin-fonts.mjs'
      - 'open-next.config.cloudflare.ts'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install

      - name: Apply D1 migrations
        # Wrangler 4 defaults to local .wrangler state without --remote.
        run: npx wrangler d1 migrations apply user-auth-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set CRON_SECRET secret
        run: echo "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET --config wrangler.jsonc || echo "CRON_SECRET already set"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build Next.js app with OpenNext
        run: pnpm run cf:build

      # SST cloudflare.Worker was bundling past the free-plan 3 MiB limit
      # (CF error 10027). OpenNext + wrangler keeps assets out of the script.
      - name: Point wrangler at OpenNext output
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          let t = fs.readFileSync(path, "utf8");
          t = t.replace(/"main"\s*:\s*"[^"]*"/, '"main": ".open-next/worker.js"');
          t = t.replace(/"directory"\s*:\s*"\.\/out"/, '"directory": ".open-next/assets"');
          fs.writeFileSync(path, t);
          console.log("wrangler.jsonc → main=.open-next/worker.js assets=.open-next/assets");
          NODE

      - name: Report OpenNext Worker size
        run: |
          du -sh .open-next/worker.js .open-next/assets 2>/dev/null || true
          if [ -f .open-next/worker.js ]; then
            gzip -c .open-next/worker.js | wc -c | awk '{printf "worker.js gzip ≈ %.2f MiB (free limit 3.00)\n", $1/1024/1024}'
          fi

      - name: Deploy Worker (OpenNext + wrangler)
        run: |
          set -euo pipefail
          set -o pipefail
          if ! pnpm cf:deploy 2>&1 | tee /tmp/cf-deploy.log; then
            if grep -qE '10027|size limit of 3 MiB' /tmp/cf-deploy.log; then
              echo "::error::Worker exceeds Cloudflare free-plan 3 MiB limit. Upgrade Workers to Paid (10 MiB) at https://dash.cloudflare.com → Workers & Pages → Plans, then re-run this workflow."
            fi
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

# Required secrets:
# CLOUDFLARE_API_TOKEN - Cloudflare API token
# CF_ACCOUNT_ID - Cloudflare account ID
# CLOUDFLARE_ZONE_ID - Cloudflare zone ID for custom domain binding
# CRON_SECRET - Shared secret for cron job authorization
# NOTE: Free Workers plan caps script size at 3 MiB (gzip). Full OpenNext
# Next.js 16 apps often need Workers Paid (10 MiB).