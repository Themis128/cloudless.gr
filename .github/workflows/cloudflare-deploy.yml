name: Cloudflare Workers Deploy

# Production frontend + App Router API for cloudless.gr.
# OpenNext builds the Next.js app and SST deploys it as a Cloudflare Worker
# (custom domain cloudless.gr). This is NOT Cloudflare Pages — there is no
# Pages project for the main site.

on:
  push:
    branches: [main]
    paths:
      # Full app surface — OpenNext Worker serves pages + API (not CF Pages).
      - 'migrations/*.sql'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'wrangler.jsonc'
      - 'sst.config.cloudflare.ts'
      - 'opennext.config.*'
      - 'next.config.*'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: false
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install

      - name: Apply D1 migrations
        # Wrangler 4 defaults to local .wrangler state without --remote.
        run: npx wrangler d1 migrations apply user-auth-db --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set CRON_SECRET secret
        run: echo "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET --config wrangler.jsonc || echo "CRON_SECRET already set"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build Next.js app with OpenNext
        run: pnpm run cf:build

      - name: Delete .bin font files (prevents SST loader error)
        run: find .open-next -name "*.bin" -delete || echo "No .bin files found"

      - name: Unlock SST (handle concurrent lock)
        run: npx sst unlock --config sst.config.cloudflare.ts --stage production || true

      - name: Deploy SST stack
        run: pnpm exec sst deploy --config sst.config.cloudflare.ts --stage production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

# Required secrets:
# CLOUDFLARE_API_TOKEN - Cloudflare API token
# CF_ACCOUNT_ID - Cloudflare account ID
# CLOUDFLARE_ZONE_ID - Cloudflare zone ID for custom domain binding
# CRON_SECRET - Shared secret for cron job authorization