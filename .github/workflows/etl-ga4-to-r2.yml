name: 'ETL: GA4 to R2'
# GA4 traffic metrics → R2. Feeds admin datalake daily series + channel mix.

on:
  schedule:
  - cron: 40 6 * * *       # daily 06:40 UTC (after GSC 06:10)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-ga4-to-r2
  cancel-in-progress: false

jobs:
  etl:
    name: Run GA4 → R2 sync
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: scripts/etl
      run: |
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Run GA4-to-R2 sync
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        GA4_OAUTH_CLIENT_ID: ${{ secrets.GA4_OAUTH_CLIENT_ID }}
        GA4_OAUTH_CLIENT_SECRET: ${{ secrets.GA4_OAUTH_CLIENT_SECRET }}
        GA4_REFRESH_TOKEN: ${{ secrets.GA4_REFRESH_TOKEN }}
        GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || 'properties/532355790' }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node ga4-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: GA4 to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: GA4 to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }
