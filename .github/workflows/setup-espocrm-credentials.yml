name: Setup EspoCRM credentials in SSM

# Adds the EspoCRM admin password to SSM for ETL authentication.
# This workflow fetches the admin password from the EspoCRM secret on the Pi
# and stores it as ESPOCRM_API_PASSWORD (for Basic Auth) in SSM.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  setup-credentials:
    name: Add EspoCRM credentials to SSM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get admin password from EspoCRM secret (via k3s SSH)
        id: pwd
        run: |
          # Note: This requires manual input if SSH access isn't configured in GitHub
          # If k3s SSH access is not available, set the admin password manually:
          echo "ADMIN_PASSWORD=${{ github.event.inputs.admin_password }}" >> "$GITHUB_OUTPUT"

      - name: Store ESPOCRM_API_PASSWORD in SSM
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/ESPOCRM_API_PASSWORD \
            --type SecureString \
            --description "EspoCRM admin password for Basic Auth ETL authentication" \
            --value "${{ steps.pwd.outputs.ADMIN_PASSWORD }}" \
            --overwrite || true

      - name: Verify
        run: |
          aws ssm get-parameter \
            --name /cloudless/production/ESPOCRM_API_PASSWORD \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text | head -c 4 && echo "... (truncated for safety)"