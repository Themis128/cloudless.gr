name: Store Sentry webhook secret → SSM + cluster secret

# Operator pastes the Sentry Internal Integration Client Secret once.
# Closes R8 inbound issue events → /api/webhooks/sentry.
#
# HOW TO USE:
#   1. Sentry → Settings → Developer Settings → New Internal Integration
#      Webhook URL: https://cloudless.gr/api/webhooks/sentry
#      Subscribe: issue events
#   2. Copy Client Secret → dispatch this workflow
#   3. Confirm issue comment on #382 + a test issue reaching Slack/ntfy

on:
  workflow_dispatch:
    inputs:
      sentry_webhook_secret:
        description: Sentry Internal Integration Client Secret
        required: true
      update_cluster_secret:
        description: Also patch cloudless/cloudless-secrets (Pi SSM_DISABLED=1)
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: store-sentry-webhook-secret
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v4.3.1

    - name: Configure AWS credentials (OIDC)
      uses:
        aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a             # v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: us-east-1

    - name: Store SENTRY_WEBHOOK_SECRET to SSM
      id: store
      env:
        SECRET: ${{ github.event.inputs.sentry_webhook_secret }}
        AWS_DEFAULT_REGION: us-east-1
      run: |
        set -uo pipefail
        echo "::add-mask::$SECRET"
        if [ -z "$SECRET" ]; then
          echo "::error::sentry_webhook_secret input is empty"
          exit 1
        fi
        OUT=$(aws ssm put-parameter \
          --name /cloudless/production/SENTRY_WEBHOOK_SECRET \
          --type SecureString \
          --overwrite \
          --value "$SECRET" \
          --description "Sentry Internal Integration client secret for /api/webhooks/sentry" \
          --output json)
        VER=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Version",""))')
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        echo "✓ Stored SSM /cloudless/production/SENTRY_WEBHOOK_SECRET version=$VER"

    - name: Connect to tailnet
      if: ${{ github.event.inputs.update_cluster_secret == 'true' }}
      uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3         # v3.2.4
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}

    - name: Configure kubectl
      if: ${{ github.event.inputs.update_cluster_secret == 'true' }}
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Patch cloudless-secrets + restart app
      if: ${{ github.event.inputs.update_cluster_secret == 'true' }}
      env:
        SECRET: ${{ github.event.inputs.sentry_webhook_secret }}
      run: |
        set -uo pipefail
        echo "::add-mask::$SECRET"
        # Merge-patch a single key — never replace the whole secret.
        B64=$(printf '%s' "$SECRET" | base64 -w0)
        kubectl -n cloudless patch secret cloudless-secrets --type merge \
          -p "{\"data\":{\"SENTRY_WEBHOOK_SECRET\":\"$B64\"}}"
        kubectl -n cloudless rollout restart deploy/cloudless-app
        kubectl -n cloudless rollout status deploy/cloudless-app --timeout=180s

    - name: Post result to tracking issue
      if: always()
      run: |
        {
          echo "# Sentry webhook secret — $(date -u '+%F %T')Z"
          echo ""
          echo "**Job:** ${{ job.status }}"
          echo "**SSM version:** ${{ steps.store.outputs.version || 'n/a' }}"
          echo "**Cluster secret updated:** ${{ github.event.inputs.update_cluster_secret }}"
          echo ""
          echo "Next: create a test Sentry issue and confirm \`/api/webhooks/sentry\` delivers to Slack/ntfy."
        } > c.md
        gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
