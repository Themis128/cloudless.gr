name: SST Cloudflare Infra Deploy

on:
  push:
    branches: [main]
    paths:
      - 'sst.config.cf-infra.ts'
      - '.github/workflows/sst-infra-deploy.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: false
        default: 'production'

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # For OIDC authentication to Cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install

      - name: Install SST
        run: npm install -g sst@4

      - name: Deploy to Cloudflare
        run: pnpm sst deploy --config sst.config.cf-infra.ts --stage ${{ github.event.inputs.stage || 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Sync D1 migrations
        run: npx wrangler d1 migrations apply user-auth-db --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set CRON_SECRET secret
        run: echo "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET --config wrangler.jsonc || echo "CRON_SECRET already set"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}