name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/index-cloudflare-free.js"
      - "scripts/extract-static-assets.sh"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build for Cloudflare
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr

      - name: Upload static assets to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cp -r .next/static ./out/ 2>/dev/null || true
          cp -r public/* ./out/ 2>/dev/null || true

          # Create locale-specific index.html files
          for locale in en el fr; do
            mkdir -p "./out/${locale}"
            echo "<!DOCTYPE html><html lang=\"${locale}\"><head><meta charset=\"utf-8\"/><title>Cloudless</title></head><body><div id=\"root\">Loading...</div></body></html>" > "./out/${locale}/index.html"
          done

          # Create fallback index.html
          echo "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"/><title>Cloudless</title></head><body><div id=\"root\">Loading...</div></body></html>" > ./out/index.html

          # Upload all files to R2 bucket
          find ./out -type f | while read -r file; do
            rel_path="${file#./out/}"

            # Skip hidden files
            if [[ "$rel_path" == .* ]]; then
              continue
            fi

            echo "Uploading: $rel_path"
            npx wrangler r2 object put "cloudless-assets/$rel_path" --file="$file" || exit 1
          done

          echo "✅ Assets uploaded to R2"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler-cloudflare-free.json
          wranglerVersion: "4.15.0"

      - name: Health check
        run: |
          # Cloudflare bot detection may block GitHub Actions IPs, use retry with user-agent
          for i in {1..6}; do
            echo "Health check attempt $i/6..."
            if curl -sf -A "GitHub-Actions/cloudless-deploy" "https://cloudless.gr/api/health" 2>/dev/null; then
              echo "✅ Worker health check passed"
              exit 0
            fi
            echo "Attempt $i failed, waiting 15s..."
            sleep 15
          done
          echo "⚠️ Health check failed after retries (likely Cloudflare bot protection - deployment still succeeded)"
          echo "Check manually: https://cloudless.gr/api/health"
