name: Deploy Cloudflare Worker

# Legacy R2 static-upload helper. Worker script deploy is retired (stub
# wrangler-cloudflare-free.json); production Workers go through
# cloudflare-deploy.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - src/index-cloudflare-free.js
    - scripts/extract-static-assets.py
    - .github/workflows/deploy-cloudflare.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build for Cloudflare
      run: pnpm cf:build
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        NEXT_PUBLIC_AUTH_PROVIDER: d1
        NEXT_PUBLIC_SITE_URL: https://cloudless.gr

    - name: Upload static assets to R2
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      run: |
        cp -r .next/static ./out/ 2>/dev/null || true
        cp -r public/* ./out/ 2>/dev/null || true

        # Create locale-specific index.html files
        for locale in en el fr; do
          mkdir -p "./out/${locale}"
          echo "<!DOCTYPE html><html lang=\"${locale}\"><head><meta charset=\"utf-8\"/><title>Cloudless</title></head><body><div id=\"root\">Loading...</div></body></html>" > "./out/${locale}/index.html"
        done

        # Create fallback index.html
        echo "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"/><title>Cloudless</title></head><body><div id=\"root\">Loading...</div></body></html>" > ./out/index.html

        # Upload all files to R2 bucket
        find ./out -type f | while read -r file; do
          rel_path="${file#./out/}"

          # Skip hidden files
          if [[ "$rel_path" == .* ]]; then
            continue
          fi

          echo "Uploading: $rel_path"
          npx wrangler r2 object put "cloudless-assets/$rel_path" --file="$file" || exit 1
        done

        echo "✅ Assets uploaded to R2"

    # wrangler-cloudflare-free.json is a stub since #1567 ("Use wrangler.jsonc
    # / workers/pi-origin-proxy"). Deploying the old cloudless-gr-free Worker
    # with custom_domain routes would collide with cloudless2 — see
    # docs/cloudflare/CLOUDFLARE.md. Canonical free-plan deploy:
    # .github/workflows/cloudflare-deploy.yml
    - name: Deploy Worker
      run: |
        set -euo pipefail
        echo "::notice::Skipping legacy wrangler-cloudflare-free.json deploy (stub; no Worker entry-point)."
        echo "Canonical path: cloudflare-deploy.yml (cloudless2 / pi-origin-proxy)."
        echo "R2 asset upload above remains available for static objects."

    - name: Validate Cloudflare account ID secret
      if: always()
      run: |
        if [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
          echo "❌ Missing required secret: CF_ACCOUNT_ID"
          echo "Please add this GitHub repository secret with your Cloudflare account ID"
          exit 1
        fi
        echo "✅ CF_ACCOUNT_ID secret is configured"
