name: Deploy to Cloudflare Workers (Agentic)

# Agentic deployment workflow for Cloudflare Workers + Pi k3s
# Builds Next.js, uploads static assets to R2, deploys Worker, and rolls out to Pi
# No AWS dependencies - uses Wrangler CLI and GitHub Container Registry for k3s

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'public/**'
      - '*.json'
      - '*.ts'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # for SSM SHA recording
  packages: write  # for GHCR push

env:
  NODE_VERSION: 22

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .next/cache
            ~/.pnpm-store
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      - name: Resolve SHA
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Full SHA: ${GITHUB_SHA}"
          echo "Short SHA: ${SHA}"

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint check
        run: pnpm lint

  build-assets:
    name: Build Assets
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .next/cache
            ~/.pnpm-store
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build and upload assets to R2 (includes extraction + upload)
        run: pnpm cf:r2:upload-static
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
          NEXT_PUBLIC_STAGE: production
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-worker:
    name: Deploy to Cloudflare Workers
    needs: [build-and-validate, build-assets]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy to Workers (Primary)
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env=production
          workingDirectory: .

      - name: Configure AWS credentials (OIDC)
        id: aws
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Record deploy SHA to SSM
        if: steps.aws.outcome == 'success'
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/cloud-sha \
            --value "${{ github.sha }}" \
            --type String --overwrite --region us-east-1

  build-pi-image:
    name: Build Pi Image (GHCR)
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          buildkitd-config-inline: |
            [grpc]
              keepalive = 3600
            [worker.oci]
              max-parallelism = 2

      - name: Compute lowercase owner
        id: repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.owner }}/cloudless-pi-app:${{ needs.build-and-validate.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false
          provenance: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://cloudless.gr
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_AUTH_PROVIDER=d1
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
            APP_VERSION=${{ github.sha }}

  rollout-k3s:
    name: Rollout to k3s (Pi)
    needs: [build-pi-image, deploy-worker]
    if: always() && (needs.deploy-worker.result == 'success' || needs.build-pi-image.result == 'success')
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"'"'ubuntu-latest'"'"') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Connect to tailnet
        continue-on-error: true
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Diagnose k3s API reachability
        run: |
          set +e
          echo "==> Checking k3s API reachability"
          kubectl get --raw /healthz --request-timeout=10s
          rc=$?
          echo "kubectl exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::kubectl could not reach k3s API — Pi runner may be offline"
            echo "AWS Lambda/Workers is primary; skipping k3s rollout"
            exit 0
          fi
          echo "/healthz ok — k3s API is reachable"

      - name: Compute lowercase owner
        id: repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set image and rollout
        run: |
          kubectl set image deployment/cloudless \
            cloudless=ghcr.io/${{ steps.repo.outputs.owner }}/cloudless-pi-app:${{ needs.build-and-validate.outputs.short_sha }} \
            -n cloudless || {
              echo "::warning::Failed to set image — Pi deployment may be stale"
              exit 0
            }
          kubectl rollout status deployment/cloudless -n cloudless --timeout=600s || {
            echo "::warning::Rollout timed out — check Pi cluster manually"
            exit 0
          }