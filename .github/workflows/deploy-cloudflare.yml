name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/index-cloudflare-free.js"
      - "scripts/extract-static-assets.sh"
      - ".github/workflows/deploy-cloudflare.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build for Cloudflare
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr

      - name: Upload static assets to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p ./out
          if [ -d ".next/static" ]; then cp -r .next/static ./out/ 2>/dev/null || true; fi
          if [ -d "public" ]; then cp -r public/* ./out/ 2>/dev/null || true; fi
          
          # Create locale-specific index.html files
          for locale in en el fr; do
            mkdir -p "./out/${locale}"
            cat > "./out/${locale}/index.html" << EOF
<!DOCTYPE html>
<html lang="${locale}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Clear skies. Zero friction." />
  <title>Cloudless — Cloud Computing, Serverless & AI Marketing</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div id="root">Loading...</div>
</body>
</html>
EOF
          done
          
          # Create fallback index.html for root path
          cat > ./out/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Clear skies. Zero friction." />
  <title>Cloudless — Cloud Computing, Serverless & AI Marketing</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <div id="root">Loading...</div>
</body>
</html>
EOF

          # Upload all files to R2 bucket
          if [ -d "./out" ]; then
            find "./out" -type f | while read -r file; do
              rel_path="${file#./out/}"
              
              # Skip hidden files
              if [[ "$rel_path" == .* ]]; then
                continue
              fi

              echo "Uploading: $rel_path"
              npx wrangler r2 object put "cloudless-assets/$rel_path" --file="$file" || exit 1
            done
            echo "✅ Assets uploaded to R2"
          else
            echo "❌ No ./out directory found"
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler-cloudflare-free.json
          wranglerVersion: "4.15.0"

      - name: Health check
        run: |
          sleep 5
          curl -sf "https://cloudless.gr/api/health" || exit 1
          echo "✅ Worker health check passed"