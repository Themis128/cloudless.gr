name: omv tailscaled restart (self-hosted, no tailnet needed)

# Restarts tailscaled on the omv host via the self-hosted runner.
# Use when ephemeral CI nodes i/o-timeout reaching 100.74.191.58 while the
# omv GitHub runner stays online — that pattern means the host is up but
# tailscaled is wedged (stale netmap: it never learns about new ephemeral
# peers, so it drops their traffic; tailscale/github-action#40/#130/#266).

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  restart:
    name: Restart tailscaled on omv
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    steps:
    - name: Restart tailscaled and verify
      run: |
        set -e
        echo "=== before ==="
        systemctl is-active tailscaled || true
        tailscale status --self --peers=false 2>/dev/null || true

        sudo systemctl restart tailscaled
        sleep 8

        echo "=== after ==="
        systemctl is-active tailscaled
        tailscale status --self --peers=false
        tailscale netcheck | head -12 || true

        # Confirm the node re-registered with control (Online state).
        for i in $(seq 1 12); do
          if tailscale status --self --peers=false --json 2>/dev/null \
              | grep -q '"Online":true\|"BackendState":"Running"'; then
            echo "tailscaled back Online after ${i} checks"
            exit 0
          fi
          sleep 5
        done
        echo "::warning::tailscaled restarted but did not report Online yet"
        tailscale status | head -15 || true

    - name: Tailnet listener diagnostics
      if: always()
      continue-on-error: true
      run: |
        echo "=== Listening sockets (NodePorts + SSH) ==="
        ss -tln 2>/dev/null | grep -E ':(22|6443|30300|30700|30900|30850)\b' || true

        echo "=== Self-connect via own tailscale IP ==="
        for port in 22 6443 30300 30700 30850; do
          code=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' "http://100.74.191.58:${port}/" 2>/dev/null || echo "FAIL")
          echo "  100.74.191.58:${port} -> ${code}"
        done

        echo "=== INPUT policy / tailscale0 rules ==="
        sudo iptables -L INPUT -n --line-numbers 2>/dev/null | head -25 || true

        echo "=== kube-proxy DNAT for 30700 ==="
        sudo iptables -t nat -S 2>/dev/null | grep -E '30700|KUBE-NODEPORT' | head -10 || true

        echo "=== FORWARD chain (NodePort traffic path) ==="
        sudo iptables -L FORWARD -n --line-numbers 2>/dev/null | head -30 || true

        echo "=== kube-router netpol FORWARD rules ==="
        sudo iptables -S 2>/dev/null | grep -E 'KUBE-ROUTER|KUBE-POD-FW|REJECT|DROP' | head -30 || true

        echo "=== tailscale0 iface / rp_filter ==="
        ip link show tailscale0 2>/dev/null | head -3 || true
        sysctl net.ipv4.conf.tailscale0.rp_filter net.ipv4.conf.all.rp_filter 2>/dev/null || true

        echo "=== NetworkPolicies in cluster ==="
        kubectl get networkpolicies -A 2>/dev/null || sudo k3s kubectl get networkpolicies -A 2>/dev/null || true

        echo "=== tailscaled recent denies ==="
        sudo journalctl -u tailscaled --since '-2h' --no-pager 2>/dev/null | grep -iE 'deny|drop|acl|filter' | tail -15 || true

        KCTL="sudo k3s kubectl"
        $KCTL get --raw=/healthz >/dev/null 2>&1 || KCTL="kubectl"
        echo "KCTL=$KCTL"
        $KCTL get nodes -o wide || true
        systemctl is-active k3s k3s-agent 2>/dev/null || true

        echo "=== espocrm baseline netpol spec ==="
        $KCTL get netpol baseline -n espocrm -o yaml 2>/dev/null | sed -n '/spec:/,$p' || true

        echo "=== espocrm pod + endpoint ==="
        $KCTL get pods -n espocrm -o wide || true
        $KCTL get endpoints -n espocrm || true

        echo "=== n8n pod + endpoints (NodePort 30900 ETL path) ==="
        $KCTL get pods -n n8n -o wide || true
        $KCTL get endpoints -n n8n || true
        $KCTL get svc -n n8n -o wide || true
        $KCTL get svc -n n8n n8n -o jsonpath='{.spec.type} {.spec.ports}' || true
        echo
        code=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' "http://100.74.191.58:30900/healthz" 2>/dev/null || echo "FAIL")
        echo "  100.74.191.58:30900 -> ${code}"
        code=$(curl -sS -m 5 -o /dev/null -w '%{http_code}' "http://192.168.1.128:30900/healthz" 2>/dev/null || echo "FAIL")
        echo "  192.168.1.128:30900 -> ${code}"
        echo "=== n8n netpol specs (ingress cidrs decide tailnet reachability) ==="
        $KCTL get netpol -n n8n -o yaml | sed -n '/spec:/,$p' | grep -vE "status|resourceVersion|uid:|creationTimestamp" | head -60 || true
        $KCTL get events -n n8n --sort-by=.lastTimestamp | tail -8 || true

        echo "=== KUBE-POD-FW chain for espocrm pod IP ==="
        POD_IP=$($KCTL get pods -n espocrm -o jsonpath='{.items[0].status.podIP}' 2>/dev/null) || POD_IP=""
        echo "podIP=$POD_IP"
        sudo iptables -S 2>/dev/null | grep -E "$POD_IP" | head -10 || true

        echo "=== ts-forward chain ==="
        sudo iptables -S ts-forward 2>/dev/null || true
        sudo iptables -S ts-input 2>/dev/null | head -15 || true

        echo "=== k3s/uptime (what restarted ~13:26Z) ==="
        systemctl show k3s -p ActiveEnterTimestamp 2>/dev/null || true
        uptime -s || true
        $KCTL get pods -n kube-system -o wide 2>/dev/null | grep -iE 'router|proxy|flannel|traefik' || true

    - name: Post result to tracking issue
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh issue comment 382 --repo Themis128/cloudless.gr --body "$(cat <<'BODY'
        ### omv tailscaled restart — $(date -u +%F\ %T)Z
        **Job:** ${{ job.status }}
        Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        BODY
        )" || true
