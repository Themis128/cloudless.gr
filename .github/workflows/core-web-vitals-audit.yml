name: Core Web Vitals Route Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_run:
    # Production deploys ship via Cloudflare Workers, not legacy AWS SST.
    workflows: ['Cloudflare Workers Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Route-level Lighthouse
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The omv runner is arm64 and has no system Chrome/Chromium. Reuse the
      # Playwright-bundled Chromium (Chrome for Testing has arm64 builds).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Locate Chromium binary
        run: |
          CHROME_BIN=$(find ~/.cache/ms-playwright -path '*chromium-*/chrome-*/chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "::error::Could not locate Playwright Chromium binary under ~/.cache/ms-playwright"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using CHROME_PATH=$CHROME_BIN"

      - name: Warm CDN cache
        run: |
          for url in \
            https://cloudless.gr \
            https://cloudless.gr/en \
            https://cloudless.gr/en/services \
            https://cloudless.gr/en/contact \
            https://cloudless.gr/en/store; do
            curl -s -o /dev/null -w "%{url_effective} → %{http_code} (%{time_total}s)\n" "$url"
          done

      - name: Run Lighthouse on key routes
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .github/lighthouserc.cjs
          # Audit the locale-resolved URLs directly. The bare `/services`,
          # `/contact`, `/store` paths all 307-redirect through next-intl
          # middleware to `/en/<path>` (this is by design — `localePrefix:
          # always`). Auditing the bare paths makes Lighthouse pay for the
          # redirect round-trip on every probe, which (a) doesn't measure
          # the actual page perf and (b) varies more between runs.
          # The user-perceived perf for someone landing on `cloudless.gr/`
          # is captured by auditing `https://cloudless.gr` (apex → locale
          # redirect) and `https://cloudless.gr/en` (the resolved root).
          urls: |
            https://cloudless.gr
            https://cloudless.gr/en
            https://cloudless.gr/en/services
            https://cloudless.gr/en/contact
            https://cloudless.gr/en/store
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Surface per-route CWV scores inline
        env:
          MANIFEST: ${{ steps.lhci.outputs.manifest }}
        run: |
          # Group multi-run manifest by URL and reduce to the median per metric.
          MEDIANS=$(echo "$MANIFEST" | jq '[
            group_by(.url)[]
            | {
                url: .[0].url,
                perf: ([.[].summary.performance]        | sort | .[(length / 2) | floor]),
                a11y: ([.[].summary.accessibility]      | sort | .[(length / 2) | floor]),
                bp:   ([.[].summary["best-practices"]]  | sort | .[(length / 2) | floor]),
                seo:  ([.[].summary.seo]                | sort | .[(length / 2) | floor])
              }
          ]')

          echo "## 📊 Core Web Vitals Route Audit (median of 3 runs)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Route | Perf | A11y | Best Practices | SEO |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|------|----------------|-----|" >> "$GITHUB_STEP_SUMMARY"

          echo "$MEDIANS" | jq -r '.[] |
            "| \(.url) | \((.perf * 100) | round) | \((.a11y * 100) | round) | \((.bp * 100) | round) | \((.seo * 100) | round) |"
          ' >> "$GITHUB_STEP_SUMMARY"

          # Fail if any route's median falls below thresholds.
          # The bare `https://cloudless.gr/` triggers a locale redirect (307 → /en)
          # which penalizes Lighthouse perf by ~20-30 points. Skip perf check for
          # that URL — `/en` already covers the actual page performance.
          FAILED=$(echo "$MEDIANS" | jq --arg root "https://cloudless.gr/" '[.[] | select(
            (if .url == $root then false else .perf < 0.60 end) or
            .a11y < 0.90 or .bp < 0.90 or .seo < 0.90
          ) | .url] | length')

          if [ "$FAILED" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **$FAILED route(s) fell below score thresholds (median of 3 runs).**" >> "$GITHUB_STEP_SUMMARY"
            echo "Thresholds: Performance ≥ 60 · Accessibility ≥ 90 · Best Practices ≥ 90 · SEO ≥ 90" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All routes passed Core Web Vitals thresholds (median of 3 runs; Perf ≥ 60 · A11y ≥ 90 · BP ≥ 90 · SEO ≥ 90)." >> "$GITHUB_STEP_SUMMARY"
