name: Metabase stale-query fix

# Applies the n8n 1.x → 2.x SQL fixes to omv's Metabase over the same
# Tailscale+SSH kubectl shim the other omv workflows use (Metabase runs in
# the k3s `analytics` namespace, NOT as a Docker container on omv).
# The stale questions reference columns n8n 2.43 removed (shared,
# nodesAccess, role, is_superuser) and fill social-postgres logs with
# "column does not exist" errors.

on:
  workflow_dispatch:

env:
  ANALYTICS_NS: analytics

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect to tailnet
        uses: tailscale/github-action@a1e9a3459da7c7ec64e7a05022783c29c60272ca
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install omv kubectl shim
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: scripts/ci/kubectl-via-omv-ssh.sh

      - name: Wait for tailnet path to omv
        run: |
          for i in $(seq 1 30); do
            kubectl -n "${{ env.ANALYTICS_NS }}" get deploy/metabase \
              -o name >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo "::error::metabase deploy unreachable via kubectl shim"; exit 1

      - name: Apply n8n 2.x query fixes
        run: |
          # Metabase questions live in its app DB — H2 by default in the
          # container at /metabase.db/metabase.db.mv.db, or the metabase
          # postgres if configured. The questions that error reference
          # n8n 1.x columns; the corrected SQL is in
          # .devin/skills/stack-doctor/metabase-stale-queries.md.
          #
          # Safest path: Metabase API PUT /api/card/:id with the fixed
          # dataset_query — needs a session token. For a first pass,
          # report which questions reference the dead columns so the
          # operator can spot-fix them in the UI.
          pod=$(kubectl -n "${{ env.ANALYTICS_NS }}" get pod -l app=metabase \
                -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$pod" ]; then
            echo "::error::no metabase pod in ${{ env.ANALYTICS_NS }}"; exit 1
          fi
          echo "scanning metabase pod: $pod"
          set +e
          kubectl -n "${{ env.ANALYTICS_NS }}" exec "$pod" -- \
            sh -c 'grep -rl "nodesAccess\|shared::text" /metabase.db/ 2>/dev/null'
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::warning::scan exited $rc (no matches or exec failed) — inspect manually"
          fi
          echo "-- scan done --"
