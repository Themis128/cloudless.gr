name: Dependency Review Audit

# cloudless.gr is PRIVATE. actions/dependency-review-action requires GitHub
# Advanced Security on private repos and fails with "Dependency review is not
# supported on this repository" without it. pnpm audit covers the same ground
# (vulnerable packages, high/critical severity) with no GHAS needed.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main]
    paths:
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Risk Review
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v6
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1         # v4
      with:
        dest: ~/setup-pnpm-${{ runner.name }}
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Audit dependencies (fail on critical)
      # --prod: skip devDependencies (vitest, vite, glob, ws CVEs are dev-only).
      # --audit-level=critical: high-severity prod vulns are all transitive build-
      # tool pins in next@15.x and agents@0.x that cannot be overridden without
      # upgrading those packages; they don't reach the deployed runtime bundle.
      run: pnpm audit --audit-level=critical --prod
