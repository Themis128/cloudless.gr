name: Bundle Budget Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main]
    paths:
    - src/**
    - package.json
    - pnpm-lock.yaml
    - next.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Budget history:
      #   1700KB → 1800KB (Phase 6.3): calm-cloud rebrand (theme-v2.css + alpha override list)
      #   1800KB → 1900KB (portal feature): customer portal flow added /portal/waiting,
      #     /portal/[token] timeline, admin pending-clients UI, lucide-react icons (~25KB).
      #   1900KB → 2300KB (analytics warehouse): @aws-sdk/client-s3 server-side only;
      #   2300KB → 2310KB (2026-06-23): minor baseline drift, current static chunks 2303KB.
      #     client bundle growth from portal/dashboard/admin expansion (~292KB).
      #   2310KB → 2800KB (2026-07-29): AppFlowy CMS dual-run + admin surface growth;
      #     measured static chunks 2736KB on PR #1368.
      #   2800KB → 3200KB (2026-08-21): EspoCRM + AI SDK growth; measured 3118KB
      #     on PR #1714 (20 minor/patch dep updates including ai 7.0.56→7.0.66).
      #   3200KB → 3400KB (2026-08-29): react-markdown + remark-gfm for ChatWidget
      #     GFM table rendering; measured 3274KB on PR #1751.
      BUNDLE_MAX_KB: '3400'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020         # v7.0.0
      with:
        node-version: 22
        cache: pnpm
      # Cache Next.js build output between runs. Mirrors deploy.yml.
    - name: Restore Next.js build cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae         # v5.0.5
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
          hashFiles('src/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          nextjs-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile
    - run: pnpm build
    - run: node scripts/audit/check-bundle-budget.mjs
    - name: Emit bundle-size report for aggregator
      if: always()
      run: |
        mkdir -p audit-report
        node scripts/audit/bundle-report.mjs --out audit-report/bundle.json --md audit-report/bundle.md
        cat audit-report/bundle.md >> "$GITHUB_STEP_SUMMARY" || true
    - name: Upload bundle report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a         # v4
      with:
        name: bundle-report-${{ github.run_id }}
        path: audit-report/
        retention-days: 30
        if-no-files-found: warn
