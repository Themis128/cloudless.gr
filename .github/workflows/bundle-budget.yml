name: Bundle Budget Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle Budget
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Budget history:
      #   1700KB → 1800KB (Phase 6.3): calm-cloud rebrand (theme-v2.css + alpha override list)
      #   1800KB → 1900KB (portal feature): customer portal flow added /portal/waiting,
      #     /portal/[token] timeline, admin pending-clients UI, lucide-react icons (~25KB).
      #   1900KB → 2300KB (analytics warehouse): @aws-sdk/client-s3 server-side only;
      #     client bundle growth from portal/dashboard/admin expansion (~292KB).
      #   2300KB → 2330KB (LangGraph agent protocol): undici + @sentry/core declared
      #     as direct deps (were transitive); actual client bundle contribution ~26KB.
      BUNDLE_MAX_KB: "2330"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      # Cache Next.js build output between runs. Mirrors deploy.yml.
      - name: Restore Next.js build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/audit/check-bundle-budget.mjs
      - name: Emit bundle-size report for aggregator
        if: always()
        run: |
          mkdir -p audit-report
          node scripts/audit/bundle-report.mjs --out audit-report/bundle.json --md audit-report/bundle.md
          cat audit-report/bundle.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: bundle-report-${{ github.run_id }}
          path: audit-report/
          retention-days: 30
          if-no-files-found: warn
