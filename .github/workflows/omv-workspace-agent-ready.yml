name: omv workspace agent-readiness

# Publishes agent-readiness artifacts into the Nextcloud workspace
# container (cloud.cloudless.gr): robots.txt, sitemap.xml, auth.md,
# /.well-known/* discovery docs, and .htaccess rules for Link headers +
# Markdown-for-Agents negotiation. Payload lives versioned in
# infrastructure/workspace-agent-ready/. Runs on the omv self-hosted
# runner which has docker access to the OMV workspace stack.
#
# Trigger: workflow_dispatch.
#   apply=false (default): diagnostics only — locate the container and
#                          probe current endpoints, no changes.
#   apply=true:            copy files into the container docroot and
#                          append the .htaccess block (idempotent).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Copy files + patch .htaccess (default: diagnostics only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agent-ready:
    name: workspace agent-readiness
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 15
    env:
      APPLY: ${{ format('{0}', inputs.apply) == 'true' }}
      SRC: infrastructure/workspace-agent-ready
      ROOT: /var/www/html
    steps:
      - uses: actions/checkout@v4

      - name: Locate Nextcloud container + probe endpoints
        run: |
          set -uo pipefail
          echo "=== containers ==="
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}' | grep -iE 'nextcloud|cloud' \
            || docker ps --format '{{.Names}}\t{{.Image}}' | head -20
          # The web container publishes :11000 (the tunnel target). Sidecars
          # (notify-push, cron, worker, talk-hpb) share the same image/volume
          # but must not be selected.
          NC=""
          for c in $(docker ps --format '{{.Names}} {{.Ports}}' | grep ':11000->' | awk '{print $1}'); do
            if docker exec "$c" test -f /var/www/html/version.php 2>/dev/null; then NC=$c; break; fi
          done
          if [ -z "$NC" ] && docker exec nextcloud test -f /var/www/html/version.php 2>/dev/null; then NC=nextcloud; fi
          if [ -z "$NC" ]; then
            for c in $(docker ps --format '{{.Names}}' | grep -iE 'nextcloud'); do
              if docker exec "$c" test -f /var/www/html/version.php 2>/dev/null; then NC=$c; break; fi
            done
          fi
          echo "resolved NC=$NC"
          echo "$NC" > /tmp/nc-container
          if [ -n "$NC" ]; then
            docker exec "$NC" sh -c 'ls -la /var/www/html/robots.txt /var/www/html/.htaccess 2>&1 | head -5; apache2ctl -M 2>/dev/null | grep -E "headers|rewrite" || true'
          fi
          for p in /robots.txt /sitemap.xml /.well-known/api-catalog; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://cloud.cloudless.gr$p" --max-time 10 || echo ERR)
            echo "$code $p"
          done

      - name: Resolve docroot host path (docroot is a read-only bind mount)
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          NC=$(cat /tmp/nc-container)
          [ -z "$NC" ] && { echo "::error::no nextcloud container found"; exit 1; }
          DOCROOT=$(docker inspect "$NC" --format '{{range .Mounts}}{{if eq .Destination "/var/www/html"}}{{.Source}}{{end}}{{end}}')
          if [ -z "$DOCROOT" ]; then
            # Maybe a parent dir is mounted (e.g. /var/www).
            DOCROOT=$(docker inspect "$NC" --format '{{range .Mounts}}{{if eq .Destination "/var/www"}}{{.Source}}/html{{end}}{{end}}')
          fi
          if [ -z "$DOCROOT" ]; then
            RO=$(docker inspect "$NC" --format '{{.HostConfig.ReadonlyRootfs}}')
            if [ "$RO" = "true" ]; then
              echo "::error::container runs read-only rootfs and has no docroot bind mount — payload needs a compose volume change"
              docker inspect "$NC" --format '{{json .Mounts}}'
              exit 1
            fi
            # No docroot bind mount → docroot is container-writable; signal
            # the docker-cp path instead.
            DOCROOT="containerfs"
          fi
          echo "docroot target: $DOCROOT"
          echo "$DOCROOT" > /tmp/nc-docroot

      - name: Copy agent-readiness files to docroot
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          D=$(cat /tmp/nc-docroot)
          NC=$(cat /tmp/nc-container)
          if [ "$D" = "containerfs" ]; then
            docker exec "$NC" mkdir -p "$ROOT/.well-known/mcp" "$ROOT/.well-known/agent-skills"
            docker cp "$SRC/robots.txt"  "$NC:$ROOT/robots.txt"
            docker cp "$SRC/sitemap.xml" "$NC:$ROOT/sitemap.xml"
            docker cp "$SRC/auth.md"     "$NC:$ROOT/auth.md"
            docker cp "$SRC/skill.md"    "$NC:$ROOT/skill.md"
            docker cp "$SRC/index.md"    "$NC:$ROOT/index.md"
            docker cp "$SRC/agent-ready.js" "$NC:$ROOT/agent-ready.js"
            docker cp "$SRC/.well-known/." "$NC:$ROOT/.well-known/"
            docker exec "$NC" sh -c 'chown -R www-data:www-data /var/www/html/.well-known /var/www/html/robots.txt /var/www/html/sitemap.xml /var/www/html/auth.md /var/www/html/skill.md /var/www/html/index.md /var/www/html/agent-ready.js 2>/dev/null; chmod -R a+r /var/www/html/.well-known /var/www/html/robots.txt /var/www/html/sitemap.xml /var/www/html/auth.md /var/www/html/skill.md /var/www/html/index.md /var/www/html/agent-ready.js'
          else
            sudo mkdir -p "$D/.well-known/mcp" "$D/.well-known/agent-skills"
            sudo cp "$SRC/robots.txt"  "$D/robots.txt"
            sudo cp "$SRC/sitemap.xml" "$D/sitemap.xml"
            sudo cp "$SRC/auth.md"     "$D/auth.md"
            sudo cp "$SRC/skill.md"    "$D/skill.md"
            sudo cp "$SRC/index.md"    "$D/index.md"
            sudo cp "$SRC/agent-ready.js" "$D/agent-ready.js"
            sudo cp -r "$SRC/.well-known/." "$D/.well-known/"
            sudo chmod -R a+r "$D/.well-known" "$D/robots.txt" "$D/sitemap.xml" "$D/auth.md" "$D/skill.md" "$D/index.md" "$D/agent-ready.js"
          fi
          echo "files copied to $D"

      - name: Ensure mod_headers + mod_rewrite are enabled
        if: env.APPLY == 'true'
        run: |
          set -uo pipefail
          NC=$(cat /tmp/nc-container)
          docker exec "$NC" sh -c '
            MISSING=""
            for m in headers rewrite substitute; do
              apache2ctl -M 2>/dev/null | grep -q "${m}_module" || MISSING="$MISSING $m"
            done
            if [ -n "$MISSING" ]; then
              echo "enabling:$MISSING"
              a2enmod $MISSING 2>/dev/null || true
              apache2ctl graceful 2>/dev/null || apachectl graceful 2>/dev/null || true
            else
              echo "modules already enabled"
            fi'

      - name: Prepend/replace .htaccess block (Link headers + markdown negotiation)
        if: env.APPLY == 'true'
        run: |
          set -euo pipefail
          D=$(cat /tmp/nc-docroot)
          NC=$(cat /tmp/nc-container)
          if [ "$D" = "containerfs" ]; then
            if docker exec "$NC" grep -q "agent-ready" "$ROOT/.htaccess" 2>/dev/null; then
              # Replace the marked block in place (updates are versioned).
              docker cp "$SRC/htaccess-agent-ready.conf" "$NC:/tmp/agent-htaccess.conf"
              docker exec "$NC" sh -c 'sed "/# --- agent-ready ---/,/# --- \/agent-ready ---/d" /var/www/html/.htaccess > /tmp/ht.base && cat /tmp/agent-htaccess.conf /tmp/ht.base > /var/www/html/.htaccess && rm /tmp/agent-htaccess.conf /tmp/ht.base'
              echo ".htaccess block replaced (container)"
            else
              docker cp "$SRC/htaccess-agent-ready.conf" "$NC:/tmp/agent-htaccess.conf"
              docker exec "$NC" sh -c 'cat /tmp/agent-htaccess.conf /var/www/html/.htaccess > /tmp/ht.new && cat /tmp/ht.new > /var/www/html/.htaccess && rm /tmp/agent-htaccess.conf /tmp/ht.new'
              echo ".htaccess block prepended (container)"
            fi
          else
            if sudo grep -q "agent-ready" "$D/.htaccess" 2>/dev/null; then
              sudo bash -c "sed '/# --- agent-ready ---/,/# --- \/agent-ready ---/d' '$D/.htaccess' > /tmp/ht.base && cat '$SRC/htaccess-agent-ready.conf' /tmp/ht.base > '$D/.htaccess' && rm /tmp/ht.base"
              echo ".htaccess block replaced (host)"
            else
              sudo cp "$D/.htaccess" "$D/.htaccess.agent-ready.bak" 2>/dev/null || true
              sudo bash -c "cat '$SRC/htaccess-agent-ready.conf' '$D/.htaccess' > '$D/.htaccess.new' && cat '$D/.htaccess.new' > '$D/.htaccess' && rm '$D/.htaccess.new'"
              sudo chmod a+r "$D/.htaccess"
              echo ".htaccess block prepended (host)"
            fi
          fi

      - name: Restart container if WebMCP injection inactive
        if: env.APPLY == 'true'
        run: |
          set -uo pipefail
          NC=$(cat /tmp/nc-container)
          # graceful reload doesn't always pick up newly a2enmod'd modules —
          # if the tag isn't in the page, restart the web container (brief).
          sleep 2
          PAGE=$(curl -sk -w '\n%{http_code}' https://cloud.cloudless.gr/login --max-time 15 || true)
          CODE=$(printf '%s' "$PAGE" | tail -1)
          BODY=$(printf '%s' "$PAGE" | head -n -1)
          if [ "$CODE" != "200" ]; then
            echo "::warning::/login probe returned $CODE — skipping restart decision"
          elif printf '%s' "$BODY" | grep -q "agent-ready.js"; then
            echo "webmcp injection active — no restart needed"
          else
            echo "injection absent — restarting $NC to load mod_substitute"
            docker restart "$NC" >/dev/null
            sleep 10
            docker exec "$NC" sh -c 'apache2ctl -M 2>/dev/null | grep -E "substitute|headers|rewrite"' || true
          fi

      - name: Verify endpoints
        if: env.APPLY == 'true'
        run: |
          set -uo pipefail
          sleep 3
          for p in /robots.txt /sitemap.xml /auth.md /skill.md /agent-ready.js /.well-known/api-catalog \
                   /.well-known/openid-configuration /.well-known/oauth-authorization-server \
                   /.well-known/oauth-protected-resource /.well-known/mcp/server-card.json \
                   /.well-known/agent-skills/index.json /.well-known/ai-catalog.json \
                   /.well-known/agent.json /.well-known/agent-card.json \
                   /.well-known/poppy.json /.well-known/http-message-signatures-directory; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://cloud.cloudless.gr$p" --max-time 10 || echo ERR)
            echo "$code $p"
          done
          echo "--- Link header ---"
          curl -skI https://cloud.cloudless.gr/ --max-time 10 | grep -i '^link:' | head -c 300 || true; echo
          echo "--- markdown negotiation ---"
          curl -sk -o /dev/null -w '%{http_code} %{content_type}\n' -H 'Accept: text/markdown' https://cloud.cloudless.gr/ --max-time 10 || true
          echo "--- webmcp injection ---"
          curl -sk https://cloud.cloudless.gr/login --max-time 15 | grep -c "agent-ready.js" || true
