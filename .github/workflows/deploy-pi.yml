name: Deploy to Pi (hostPath standalone — no ECR)

# Cloudflare-first: build Next standalone on GitHub-hosted native ARM64
# (ubuntu-24.04-arm), upload artifact, then roll out from omv-ha (deploy proxy)
# via rsync + kubectl over SSH/Tailscale.
#
# omv never runs `pnpm build` — compiling on the Pi 5 control plane pegs the
# USB SSD and trips the hardware watchdog (~5m into Turbopack).
#
# Jobs:
#   build   — ubuntu-24.04-arm          (heavy compile; free for public repos)
#   rollout — [self-hosted, omv-ha, deploy] (rsync SafeDeploy + kubectl)
#
# Concurrency: deploy the LATEST main SHA only. cancel-in-progress: true so a
# newer push supersedes an older in-progress/queued run.

on:
  push:
    branches: [main]
    paths:
    - src/**
    - public/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - next.config.ts
    - patches/**
    - scripts/pi-rollout-from-artifact.sh
    - .github/workflows/deploy-pi.yml
  workflow_dispatch:
    inputs:
      rollout_only:
        description: Skip build; re-rollout using the standalone artifact for this SHA (must already exist)
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-pi
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless-app
  STANDALONE_HOSTPATH: /home/tbaltzakis/cloudless-standalone
  OMV_SSH_HOST: 192.168.1.128

jobs:
  build:
    name: Build standalone artifact
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.rollout_only) }}
    outputs:
      already: ${{ steps.skip.outputs.already }}
      artifact: ${{ steps.pack.outputs.artifact }}

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v4.3.1

    - name: Skip if SHA already live
      id: skip
      run: |
        set -euo pipefail
        WANT="${{ github.sha }}"
        LIVE=""
        for candidate in \
          https://pi-origin.cloudless.gr/api/health \
          https://cloudless.gr/api/health
        do
          BODY=$(curl -sS --max-time 10 "$candidate" || true)
          if echo "$BODY" | jq -e .version >/dev/null 2>&1; then
            LIVE=$(echo "$BODY" | jq -r .version)
            echo "health $candidate → version=${LIVE}"
            break
          fi
          echo "health $candidate → unreachable or invalid"
        done
        if [ -n "$LIVE" ] && [ "$LIVE" = "$WANT" ]; then
          echo "already=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy skipped"
            echo "Live hostPath already serves \`${WANT}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Already deployed ${WANT} — skipping build/rollout"
        else
          echo "already=false" >> "$GITHUB_OUTPUT"
          echo "Need deploy: live=${LIVE:-unknown} want=${WANT}"
        fi

    - name: Setup pnpm
      if: steps.skip.outputs.already != 'true'
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1         # v4

    - name: Setup Node
      if: steps.skip.outputs.already != 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: '24'
        cache: pnpm

    - name: Restore Next.js build cache
      if: steps.skip.outputs.already != 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae         # v5.0.5
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
          nextjs-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: steps.skip.outputs.already != 'true'
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build Next.js standalone
      if: steps.skip.outputs.already != 'true'
      env:
        NEXT_OUTPUT_STANDALONE: '1'
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        NEXT_PUBLIC_STAGE: production
        NEXT_PUBLIC_AUTH_PROVIDER: d1
        NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        SENTRY_ENVIRONMENT: pi-standby
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: pi-standby
        NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
        NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
        NEXT_PUBLIC_GTM_ID: GTM-W7N3J3TV
        APP_VERSION: ${{ github.sha }}
        NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
      run: pnpm build

    - name: Ensure rsync
      if: steps.skip.outputs.already != 'true'
      run: |
        set -euo pipefail
        if ! command -v rsync >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y rsync
        fi

    - name: Install Syft for SBOM generation
      if: steps.skip.outputs.already != 'true'
      continue-on-error: true
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Generate SBOM
      if: steps.skip.outputs.already != 'true'
      continue-on-error: true
      run: |
        set -euo pipefail
        if ! command -v syft >/dev/null 2>&1; then
          echo "syft not installed — skipping SBOM"
          exit 0
        fi
        # Match ci.yml: new Syft no longer accepts packages:pnpm-lock.yaml.
        syft dir:. --source-name cloudless.gr -o syft-json > sbom.json
        test -s sbom.json

    - name: Upload SBOM artifact
      if: steps.skip.outputs.already != 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.json
        retention-days: 30
        if-no-files-found: ignore

    - name: Scan licenses with pnpm licenses
      if: steps.skip.outputs.already != 'true'
      continue-on-error: true
      run: |
        pnpm licenses ls --json > licenses.json

    - name: Upload licenses artifact
      if: steps.skip.outputs.already != 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: licenses
        path: licenses.json
        retention-days: 30
        if-no-files-found: ignore

    - name: Pack standalone artifact
      id: pack
      if: steps.skip.outputs.already != 'true'
      run: |
        set -euo pipefail
        SRC=".next/standalone"
        if [ ! -f "${SRC}/server.js" ]; then
          echo "::error::Standalone build output not found at ${SRC}/server.js"
          exit 1
        fi
        OUT="${RUNNER_TEMP}/standalone-pack"
        rm -rf "$OUT"
        mkdir -p "$OUT/standalone"
        rsync -a "$SRC/" "$OUT/standalone/"

        # Hosted arm64 + Turbopack file tracing often omits Next's own runtime
        # deps (@next/env, @swc/helpers, styled-jsx, …). Inject from the install
        # tree so the Pi node:22 hostPath boot does not MODULE_NOT_FOUND.
        inject_pkg() {
          local spec="$1"
          local dest="$OUT/standalone/node_modules/${spec}"
          if [ -f "${dest}/package.json" ]; then
            return 0
          fi
          local src=""
          if [ -f "node_modules/${spec}/package.json" ]; then
            src="node_modules/${spec}"
          else
            src=$(find node_modules -path "*/${spec}/package.json" 2>/dev/null | head -1 | xargs -r dirname || true)
          fi
          if [ -z "${src:-}" ] || [ ! -d "$src" ]; then
            echo "::warning::Could not locate ${spec} in install tree — skipping"
            return 0
          fi
          mkdir -p "$(dirname "$dest")"
          rsync -a "$src/" "$dest/"
          echo "Injected ${spec} from ${src}"
        }

        # next/package.json dependencies (runtime) + common helpers
        while IFS= read -r dep; do
          [ -n "$dep" ] || continue
          inject_pkg "$dep"
        done < <(node -e "const d=require('./node_modules/next/package.json').dependencies||{}; for (const k of Object.keys(d)) console.log(k)")
        inject_pkg "@swc/helpers"
        inject_pkg "client-only"
        inject_pkg "server-only"

        # Fail fast if the known crash deps are still missing
        for must in @next/env @swc/helpers; do
          if [ ! -f "$OUT/standalone/node_modules/${must}/package.json" ]; then
            echo "::error::Required runtime package ${must} missing from standalone after inject"
            exit 1
          fi
        done

        if [ -d .next/static ]; then
          mkdir -p "$OUT/static"
          rsync -a .next/static/ "$OUT/static/"
        fi
        if [ -d public ]; then
          mkdir -p "$OUT/public"
          rsync -a public/ "$OUT/public/"
        fi

        # SafeDeploy / hostPath boot needs BUILD_ID under standalone/.next.
        # Turbopack standalone tracing sometimes omits it; copy from the build root.
        if [ ! -s "$OUT/standalone/.next/BUILD_ID" ]; then
          if [ -s .next/BUILD_ID ]; then
            mkdir -p "$OUT/standalone/.next"
            cp -a .next/BUILD_ID "$OUT/standalone/.next/BUILD_ID"
            echo "Copied .next/BUILD_ID into standalone pack"
          else
            echo "::error::Missing .next/BUILD_ID after build — refusing to pack"
            exit 1
          fi
        fi
        test -s "$OUT/standalone/.next/BUILD_ID"
        echo "standalone BUILD_ID=$(cat "$OUT/standalone/.next/BUILD_ID")"
        # Non-hidden backup: upload-artifact@v4 drops dotdirs unless
        # include-hidden-files is set — keep a plain-file copy as failsafe.
        cp -a "$OUT/standalone/.next/BUILD_ID" "$OUT/standalone/BUILD_ID"
        cp -a "$OUT/standalone/.next/BUILD_ID" "$OUT/BUILD_ID"
        echo "standalone/.next file count=$(find "$OUT/standalone/.next" -type f | wc -l)"

        echo "Packed $(du -sh "$OUT" | cut -f1) → $OUT"
        echo "artifact=$OUT" >> "$GITHUB_OUTPUT"

    - name: Upload standalone artifact
      if: steps.skip.outputs.already != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: standalone-${{ github.sha }}
        path: ${{ steps.pack.outputs.artifact }}
        retention-days: 2
        if-no-files-found: error
        # Required: standalone embeds `.next/` (BUILD_ID + server traces).
        # v4 omits hidden files/dirs by default → 269MB pack becomes ~30MB
        # and rollout fails "missing .next/BUILD_ID".
        include-hidden-files: true

  rollout:
    name: Roll out via omv-ha proxy
    needs: [build]
    # Run when build finished and did not skip; OR when rollout_only dispatch
    # (build job is skipped entirely — needs succeeds with skipped build only
    # if we use if: always() carefully). For rollout_only, build is skipped
    # via job-level if, and needs: build would fail — use:
    if: |
      always() && (
        (needs.build.result == 'success' && needs.build.outputs.already != 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.rollout_only && needs.build.result == 'skipped')
      )
    runs-on: [self-hosted, omv-ha, deploy]
    timeout-minutes: 15

    steps:
    - name: Checkout (rollout script)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v4.3.1
      with:
        sparse-checkout: |
          scripts/pi-rollout-from-artifact.sh
        sparse-checkout-cone-mode: false

    - name: Download standalone artifact (this run)
      if: needs.build.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: standalone-${{ github.sha }}
        path: ${{ runner.temp }}/standalone-artifact

    - name: Download standalone artifact (prior run — rollout_only)
      if: github.event_name == 'workflow_dispatch' && inputs.rollout_only
      env:
        GH_TOKEN: ${{ github.token }}
        WANT_SHA: ${{ github.sha }}
        ARTIFACT_NAME: standalone-${{ github.sha }}
        OUT: ${{ runner.temp }}/standalone-artifact
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        # No `gh` on omv-ha — use the GitHub REST API + curl.
        API="https://api.github.com/repos/${REPO}"
        AUTH=( -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" )
        RUNS_JSON=$(curl -fsSL "${AUTH[@]}" \
          "${API}/actions/workflows/deploy-pi.yml/runs?branch=main&status=completed&per_page=30")
        # Keep python one-liners indented — unindented lines terminate YAML `|` blocks.
        RUN_ID=$(printf '%s' "$RUNS_JSON" | WANT_SHA="$WANT_SHA" python3 -c "import json,os,sys; want=os.environ['WANT_SHA']; runs=json.load(sys.stdin).get('workflow_runs') or []; ids=[r['id'] for r in runs if r.get('head_sha')==want]; print(ids[0] if ids else '')")
        if [ -z "${RUN_ID:-}" ]; then
          echo "::error::No completed deploy-pi run found for SHA ${WANT_SHA}"
          exit 1
        fi
        echo "Found run ${RUN_ID} for ${WANT_SHA}"
        ARTS_JSON=$(curl -fsSL "${AUTH[@]}" "${API}/actions/runs/${RUN_ID}/artifacts?per_page=50")
        ART_ID=$(printf '%s' "$ARTS_JSON" | ARTIFACT_NAME="$ARTIFACT_NAME" python3 -c "import json,os,sys; name=os.environ['ARTIFACT_NAME']; arts=json.load(sys.stdin).get('artifacts') or []; ids=[a['id'] for a in arts if a.get('name')==name and not a.get('expired')]; print(ids[0] if ids else '')")
        if [ -z "${ART_ID:-}" ]; then
          echo "::error::Artifact ${ARTIFACT_NAME} not found (or expired) on run ${RUN_ID}"
          exit 1
        fi
        echo "Downloading artifact id=${ART_ID} → ${OUT}"
        ZIP="${RUNNER_TEMP}/standalone-artifact.zip"
        curl -fsSL "${AUTH[@]}" -L \
          "${API}/actions/artifacts/${ART_ID}/zip" -o "$ZIP"
        python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$ZIP" "$OUT"
        rm -f "$ZIP"
        ls -la "$OUT" | head -20

    - name: Roll out (rsync + kubectl over SSH)
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/standalone-artifact
        APP_VERSION: ${{ github.sha }}
        OMV_SSH_HOST: ${{ env.OMV_SSH_HOST }}
        STANDALONE_HOSTPATH: ${{ env.STANDALONE_HOSTPATH }}
        K3S_NAMESPACE: ${{ env.K3S_NAMESPACE }}
        K3S_DEPLOYMENT: ${{ env.K3S_DEPLOYMENT }}
      run: |
        set -euo pipefail
        chmod +x scripts/pi-rollout-from-artifact.sh
        # download-artifact / gh run download may nest an extra directory —
        # normalize to …/standalone/server.js
        ROOT="${ARTIFACT_DIR}"
        if [ ! -f "${ROOT}/standalone/server.js" ]; then
          CAND=$(find "$ROOT" -type f -path '*/standalone/server.js' 2>/dev/null | head -1 || true)
          if [ -n "$CAND" ]; then
            ROOT=$(dirname "$(dirname "$CAND")")
            echo "Normalized ARTIFACT_DIR → $ROOT"
            export ARTIFACT_DIR="$ROOT"
          fi
        fi
        scripts/pi-rollout-from-artifact.sh
