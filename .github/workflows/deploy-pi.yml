name: Deploy to Pi (ECR + k3s rollout)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

permissions:
  id-token: write  # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 278585680617.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: cloudless-pi-app
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless

jobs:
  build-and-push:
    name: Build arm64 image and push to ECR
    runs-on: [self-hosted, omv]
    outputs:
      sha: ${{ github.sha }}
      image_exists: ${{ steps.check_ecr.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image tag already exists in ECR
        id: check_ecr
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ github.sha }} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null | grep -q "${{ github.sha }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${{ github.sha }} already in ECR — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image ${{ github.sha }} not found — will build and push."
          fi

      - name: Set up QEMU (arm64 emulation)
        if: steps.check_ecr.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.check_ecr.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Prune stale buildx cache
        if: steps.check_ecr.outputs.exists != 'true'
        run: docker buildx prune -f --filter until=48h || true

      - name: Build and push Docker image
        if: steps.check_ecr.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          # SHA tag only — ECR has immutable tags, :latest is never pushed.
          # Rollout uses kubectl set image with this SHA for pinned, reproducible deploys.
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_HUBSPOT_PORTAL_ID=${{ secrets.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            APP_VERSION=${{ github.sha }}

      - name: Update SSM image tracking
        run: |
          aws ssm put-parameter \
            --name "/cloudless/production/current-image-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  rollout:
    name: Rollout restart on k3s
    # Runs on the self-hosted runner on omv-main — has direct kubectl access
    # to the local k3s API (192.168.1.128:6443) without any VPN or tunnel.
    # Runs even if image already existed (build skipped) so re-dispatch always
    # repoints the deployment to the correct SHA.
    runs-on: [self-hosted, omv]
    needs: build-and-push
    if: always() && needs.build-and-push.result != 'cancelled' && (needs.build-and-push.result == 'success' || needs.build-and-push.outputs.image_exists == 'true')

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pre-pull image into containerd (k8s.io namespace)
        # Pull the image directly into the containerd namespace that k3s uses
        # (k8s.io) before triggering the rollout. This means the pod starts
        # immediately rather than waiting 4+ min for in-rollout ECR pull.
        # Uses sudo ctr (bundled with k3s) which correctly handles the k8s.io
        # namespace and ECR auth. k3s ctr and crictl both ignore ECR credentials.
        run: |
          IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.sha }}"
          ECR_TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "Pre-pulling ${IMAGE} into containerd k8s.io namespace..."
          sudo ctr -n k8s.io images pull -u "AWS:${ECR_TOKEN}" "${IMAGE}"
          echo "Pre-pull complete."

      - name: Set image and rollout
        run: |
          kubectl set image deployment/${{ env.K3S_DEPLOYMENT }} \
            ${{ env.K3S_DEPLOYMENT }}=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.sha }} \
            -n ${{ env.K3S_NAMESPACE }}
          # Image is already local — rollout completes in <30s
          kubectl rollout status deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }} --timeout=180s
