name: Deploy to Pi (GHCR + k3s rollout)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.ts"
      - "patches/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-pi.yml"
      - ".github/workflows/build-pi-image.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_REPOSITORY: themis128/${{ github.event.repository.name }}-pi-app
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless

jobs:
  push-ghcr:
    name: Push arm64 image to GHCR
    # Failover-capable: when Pi runners are offline, flip
    #   .github/scripts/toggle-runner.sh pi
    # to route this onto GitHub-hosted runners with QEMU for arm64 cross-compilation.
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    outputs:
      short_sha: ${{ steps.check_ghcr.outputs.short_sha }}
      image_exists: ${{ steps.check_ghcr.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image tag already exists in GHCR
        id: check_ghcr
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${SHORT_SHA}"
          if docker manifest inspect "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${SHORT_SHA} already in GHCR — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image ${SHORT_SHA} not found — will build and push."
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        if: steps.check_ghcr.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.check_ghcr.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4.0.0

      - name: ensure local cache dirs exist
        if: steps.check_ghcr.outputs.exists != 'true'
        run: |
          sudo mkdir -p /opt/docker-cache
          sudo chmod 777 /opt/docker-cache

      - name: warm base image into Docker daemon cache
        if: steps.check_ghcr.outputs.exists != 'true'
        run: docker pull node:22-alpine

      # Build with load:true (not push:true) — see the long comment in
      # build-pi-image.yml for the rationale. Push happens via plain
      # `docker push` in the next step.
      - name: Build and load to dockerd
        if: steps.check_ghcr.outputs.exists != 'true'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ steps.check_ghcr.outputs.short_sha }}
          cache-from: type=local,src=/opt/docker-cache
          cache-to: type=local,dest=/opt/docker-cache,mode=max
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_AUTH_PROVIDER=d1
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
            APP_VERSION=${{ github.sha }}

      - name: Push to GHCR
        if: steps.check_ghcr.outputs.exists != 'true'
        run: |
          TAG="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ steps.check_ghcr.outputs.short_sha }}"
          echo "==> docker push ${TAG}"
          docker push "${TAG}"

  rollout:
    name: Rollout restart on k3s
    # GH-hosted runner joins tailnet, uses KUBECONFIG_B64 to call k3s API
    # directly over Tailscale — no SSH hop required.
    # Failover-capable: when GH-hosted billing is broken, flip
    #   .github/scripts/toggle-runner.sh pi
    # to route this onto the self-hosted Pi build runners.
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    needs: push-ghcr
    if: always() && needs.push-ghcr.result != 'cancelled' && (needs.push-ghcr.result == 'success' || needs.push-ghcr.outputs.image_exists == 'true')

    steps:
      - name: Connect to tailnet
        continue-on-error: true
        uses: tailscale/github-action@v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Verify Tailscale path to omv-main
        run: |
          tailscale ping -c 3 --timeout=15s 100.74.191.58 \
            || echo "Note: Tailscale using DERP relay — kubectl will still work"
          nc -zv -w 10 100.74.191.58 6443 \
            && echo "Port 6443 directly reachable" \
            || echo "Port 6443 via nc failed — proceeding over Tailscale relay"
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Set image and roll out
        run: |
          kubectl set image deployment/${{ env.K3S_DEPLOYMENT }} \
            ${{ env.K3S_DEPLOYMENT }}=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ needs.push-ghcr.outputs.short_sha }} \
            -n ${{ env.K3S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K3S_DEPLOYMENT }} -n ${{ env.K3S_NAMESPACE }} --timeout=180s
