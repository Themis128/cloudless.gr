name: Deploy to Pi (ECR + k3s rollout)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

permissions:
  id-token: write  # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 278585680617.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: cloudless-pi-app
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless

jobs:
  build-and-push:
    name: Build arm64 image and push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_HUBSPOT_PORTAL_ID=${{ secrets.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            APP_VERSION=${{ github.sha }}

      - name: Update SSM image tracking
        run: |
          aws ssm put-parameter \
            --name "/cloudless/production/current-image-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ github.sha }} \
            --query 'imageDetails[0].imageDigest' --output text)
          aws ssm put-parameter \
            --name "/cloudless/production/ECR_LATEST_DIGEST" \
            --value "$DIGEST" \
            --type String --overwrite

  rollout:
    name: Rollout restart on k3s
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }} --timeout=300s
