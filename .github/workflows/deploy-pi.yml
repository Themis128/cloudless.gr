name: Deploy to Pi (ECR + k3s rollout)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

permissions:
  id-token: write  # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 278585680617.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: cloudless-pi-app
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless

jobs:
  build-and-push:
    name: Build arm64 image and push to ECR
    # GitHub-hosted native arm64 runner — no QEMU, and no build load on the
    # Pi. Only the rollout job below needs a self-hosted runner (local k3s API).
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ github.sha }}
      image_exists: ${{ steps.check_ecr.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4 # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2

      - name: Check if image tag already exists in ECR
        id: check_ecr
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ github.sha }} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null | grep -q "${{ github.sha }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${{ github.sha }} already in ECR — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image ${{ github.sha }} not found — will build and push."
          fi

      - name: Set up QEMU (arm64 emulation)
        if: steps.check_ecr.outputs.exists != 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.check_ecr.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Prune stale buildx cache
        if: steps.check_ecr.outputs.exists != 'true'
        run: docker buildx prune -f --filter until=48h || true

      - name: Build and push Docker image
        if: steps.check_ecr.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # SHA tag only — ECR has immutable tags, :latest is never pushed.
          # Rollout uses kubectl set image with this SHA for pinned, reproducible deploys.
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_HUBSPOT_PORTAL_ID=${{ secrets.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            APP_VERSION=${{ github.sha }}

      - name: Update SSM image tracking
        run: |
          aws ssm put-parameter \
            --name "/cloudless/production/current-image-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  rollout:
    name: Rollout restart on k3s
    # Runs on a GitHub-hosted runner that joins the tailnet via Tailscale and
    # reaches the k3s API over it (omv-main = 100.113.41.119:6443). No
    # self-hosted runner on the Pi is required.
    # Runs even if image already existed (build skipped) so re-dispatch always
    # repoints the deployment to the correct SHA.
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && needs.build-and-push.result != 'cancelled' && (needs.build-and-push.result == 'success' || needs.build-and-push.outputs.image_exists == 'true')

    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        # KUBECONFIG_B64 is base64 of /etc/rancher/k3s/k3s.yaml with the server
        # rewritten to the tailnet address https://100.113.41.119:6443.
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set image and roll out
        run: |
          kubectl set image deployment/${{ env.K3S_DEPLOYMENT }} \
            ${{ env.K3S_DEPLOYMENT }}=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.sha }} \
            -n ${{ env.K3S_NAMESPACE }}
          # No local ctr pre-pull when running off-Pi — the pod pulls the image
          # from ECR via the in-cluster ecr-cred-refresher. Allow time for that.
          kubectl rollout status deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }} --timeout=420s
