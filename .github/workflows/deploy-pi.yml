name: Deploy to Pi (hostPath standalone — no ECR)

# Cloudflare-first: build Next standalone on the Pi runner and sync into
# /home/tbaltzakis/cloudless-standalone (k8s/cloudless-app-hostpath.yaml).
# Does not use AWS ECR, OIDC, or SSM.
#
# Runner: exclusive [self-hosted, omv, build]. Do not put audits/CWV/ETL on
# the `build` label — they starve this workflow (see docs/runners.md).
#
# Concurrency: serialize (cancel-in-progress: false + queue: max). Rapid main
# merges used to abort mid-build ("Canceling since a higher priority waiting
# request for deploy-pi exists") and leave hostPath on a stale SHA.
#
# Caching: pnpm store + Next.js build cache on OMV-HA runner for speed.

on:
  push:
    branches: [main]
    paths:
    - src/**
    - public/**
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - next.config.ts
    - patches/**
    - .github/workflows/deploy-pi.yml
  workflow_dispatch:

permissions:
  contents: read

# Serialize deploys: never cancel a build already in progress; a newer push
# queues behind it (GitHub keeps only the newest *pending* run). This is what
# the header comment above describes — the block was missing, which is why
# rapid main merges cancelled builds mid-flight.
concurrency:
  group: deploy-pi
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless-app
  STANDALONE_HOSTPATH: /home/tbaltzakis/cloudless-standalone
  # Cache paths on self-hosted runner (OMV-HA) - pnpm store only
  PNPM_STORE_PATH: /home/tbaltzakis/.pnpm-store

jobs:
  build-and-rollout:
    name: Build standalone + roll out hostPath
    runs-on: [self-hosted, omv, build]
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v4.3.1

    - name: Skip if SHA already live
      id: skip
      run: |
        set -euo pipefail
        WANT="${{ github.sha }}"
        LIVE=""
        for candidate in http://127.0.0.1:30300/api/health http://192.168.1.128:30300/api/health; do
          BODY=$(curl -sS --max-time 5 "$candidate" || true)
          if echo "$BODY" | jq -e .version >/dev/null 2>&1; then
            LIVE=$(echo "$BODY" | jq -r .version)
            echo "health $candidate → version=${LIVE}"
            break
          fi
          echo "health $candidate → unreachable or invalid"
        done
        if [ -n "$LIVE" ] && [ "$LIVE" = "$WANT" ]; then
          echo "already=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy skipped"
            echo "Live hostPath already serves \`${WANT}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Already deployed ${WANT} — skipping build/rollout"
        else
          echo "already=false" >> "$GITHUB_OUTPUT"
          echo "Need deploy: live=${LIVE:-unknown} want=${WANT}"
        fi

    - name: Setup Node
      if: steps.skip.outputs.already != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Configure pnpm store
      if: steps.skip.outputs.already != 'true'
      run: |
        set -euo pipefail
        mkdir -p "${PNPM_STORE_PATH}"
        pnpm config set store-dir "${PNPM_STORE_PATH}"

    # NOTE: Next.js build cache restore DISABLED to avoid stale proxy.ts config
    # from previous builds (e.g., old `export const runtime = "edge";`).
    # The cache would cause "Route segment config is not allowed in Proxy file" errors.
    # First run after this change will be slower; subsequent runs can re-enable if stable.

    - name: Clean stale build output
      if: steps.skip.outputs.already != 'true'
      run: |
        set -euo pipefail
        if [ -d .next ]; then
          echo "Removing stale .next/ for clean build..."
          rm -rf .next
          echo "Cleaned .next/"
        else
          echo "No stale .next/ — clean workspace"
        fi

    - name: Install dependencies
      if: steps.skip.outputs.already != 'true'
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build Next.js standalone
      if: steps.skip.outputs.already != 'true'
      env:
        NEXT_OUTPUT_STANDALONE: '1'
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        NEXT_PUBLIC_STAGE: production
        NEXT_PUBLIC_AUTH_PROVIDER: d1
        NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        SENTRY_ENVIRONMENT: pi-standby
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: pi-standby
        NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
        NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
        APP_VERSION: ${{ github.sha }}
        NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
      run: pnpm build

    - name: Sync standalone → hostPath
      if: steps.skip.outputs.already != 'true'
      run: |
        set -euo pipefail
        DEST="${{ env.STANDALONE_HOSTPATH }}"
        STAGE="${DEST}.next-${GITHUB_SHA::12}"
        SRC=".next/standalone"
        if [ ! -f "${SRC}/server.js" ]; then
          echo "::error::Standalone build output not found at ${SRC}/server.js. The 'Build Next.js standalone' step may have failed. Check the build logs above for errors."
          exit 1
        fi
        sudo rm -rf "${STAGE}"
        sudo mkdir -p "${STAGE}"
        sudo rsync -a "${SRC}/" "${STAGE}/"
        if [ -d .next/static ]; then
          sudo mkdir -p "${STAGE}/.next/static"
          sudo rsync -a .next/static/ "${STAGE}/.next/static/"
        fi
        if [ -d public ]; then
          sudo mkdir -p "${STAGE}/public"
          sudo rsync -a public/ "${STAGE}/public/"
        fi
        sudo mkdir -p "${DEST}"
        sudo rsync -a --delete "${STAGE}/" "${DEST}/"
        sudo rm -rf "${STAGE}"
        if [ ! -f "${DEST}/server.js" ]; then
          echo "::error::Sync completed but ${DEST}/server.js does not exist — rsync failed silently."
          exit 1
        fi
        echo "Synced standalone → ${DEST}"

    - name: Resolve kubectl
      if: steps.skip.outputs.already != 'true'
      id: kubectl
      run: |
        set -euo pipefail
        # The k3s API server on the control-plane Pi can be briefly unresponsive
        # right after a build pegs CPU/IO, so probe with retries + a generous
        # per-attempt timeout instead of failing on a single 5s miss (which
        # threw away an already-successful build + hostPath sync).
        BIN=""
        for attempt in $(seq 1 6); do
          if command -v kubectl >/dev/null 2>&1 && kubectl get --raw /readyz --request-timeout=15s >/dev/null 2>&1; then
            BIN="kubectl"; break
          elif sudo kubectl get --raw /readyz --request-timeout=15s >/dev/null 2>&1; then
            BIN="sudo kubectl"; break
          fi
          echo "kubectl not ready (attempt ${attempt}/6) — waiting 10s…"
          sleep 10
        done
        if [ -z "$BIN" ]; then
          echo "::error::kubectl cannot reach the cluster after 6 attempts (~2min)"
          exit 1
        fi
        echo "Using: ${BIN}"
        echo "bin=${BIN}" >> "$GITHUB_OUTPUT"

    - name: Roll out cloudless-app
      if: steps.skip.outputs.already != 'true'
      env:
        KUBECTL: ${{ steps.kubectl.outputs.bin }}
      run: |
        set -euo pipefail
        FULL_SHA="${{ github.sha }}"
        $KUBECTL set env "deployment/${{ env.K3S_DEPLOYMENT }}" \
          -n "${{ env.K3S_NAMESPACE }}" \
          "APP_VERSION=${FULL_SHA}" \
          "NEXT_PUBLIC_APP_VERSION=${FULL_SHA}" \
          "NEXT_PUBLIC_AUTH_PROVIDER=d1" \
          "SSM_DISABLED=1" \
          "CLOUDFLARE_ACCOUNT_ID=fb7dc7b69b662480cd5961a4d1913c78"
        $KUBECTL rollout restart "deployment/${{ env.K3S_DEPLOYMENT }}" \
          -n "${{ env.K3S_NAMESPACE }}"
        $KUBECTL rollout status "deployment/${{ env.K3S_DEPLOYMENT }}" \
          -n "${{ env.K3S_NAMESPACE }}" --timeout=600s
        # Wait for pod to be fully ready and NodePort to propagate
        sleep 15
        echo "Checking pod status:"
        $KUBECTL get pods -n "${{ env.K3S_NAMESPACE }}" -l app=cloudless-app -o wide
        echo "Checking service endpoints:"
        $KUBECTL get endpoints -n "${{ env.K3S_NAMESPACE }}" cloudless-app
        curl -sS --max-time 5 http://127.0.0.1:30300/api/health || true
        echo

    - name: Verify rollout
      if: steps.skip.outputs.already != 'true'
      run: |
        set -euo pipefail
        # Extra wait for NodePort to be fully ready
        sleep 10
        HEALTH_CHECK_FAILED=1
        for candidate in http://127.0.0.1:30300/api/health http://192.168.1.128:30300/api/health; do
          echo "Trying $candidate..."
          RESPONSE=$(curl -sS --max-time 10 "$candidate" 2>&1 || true)
          echo "Response: $RESPONSE"
          if echo "$RESPONSE" | jq -e .version >/dev/null 2>&1; then
            HEALTH_CHECK_FAILED=0
            echo "health check passed via $candidate"
            break
          fi
          echo "health check failed for $candidate"
        done
        if [ $HEALTH_CHECK_FAILED -ne 0 ]; then
          echo "::error::Rollout verification failed - health endpoint not accessible or invalid response"
          echo "Debugging info:"
          $KUBECTL get pods -n "${{ env.K3S_NAMESPACE }}" -l app=cloudless-app -o wide
          $KUBECTL describe pod -n "${{ env.K3S_NAMESPACE }}" -l app=cloudless-app
          $KUBECTL logs -n "${{ env.K3S_NAMESPACE }}" -l app=cloudless-app --tail=50
          exit 1
        fi
        echo "Rollout verification successful"
