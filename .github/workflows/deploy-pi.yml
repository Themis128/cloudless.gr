name: Deploy to Pi (ECR + k3s rollout)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-pi
  cancel-in-progress: true

permissions:
  id-token: write  # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 278585680617.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: cloudless-pi-app
  K3S_NAMESPACE: cloudless
  K3S_DEPLOYMENT: cloudless

jobs:
  build-and-push:
    name: Build arm64 image and push to ECR
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Push SHA tag only — ECR has immutable tags so :latest is never
          # overwritten from CI. The rollout job uses kubectl set image with
          # the SHA tag so every deploy is pinned and fully reproducible.
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_COGNITO_USER_POOL_ID=${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
            NEXT_PUBLIC_COGNITO_CLIENT_ID=${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
            NEXT_PUBLIC_HUBSPOT_PORTAL_ID=${{ secrets.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            APP_VERSION=${{ github.sha }}

      - name: Update SSM image tracking
        run: |
          aws ssm put-parameter \
            --name "/cloudless/production/current-image-sha" \
            --value "${{ github.sha }}" \
            --type String --overwrite

  rollout:
    name: Rollout restart on k3s
    # Runs on the self-hosted runner on omv-main — has direct kubectl access
    # to the local k3s API (192.168.1.128:6443) without any VPN or tunnel.
    runs-on: [self-hosted, omv]
    needs: build-and-push

    steps:
      - name: Set image and rollout
        run: |
          kubectl set image deployment/${{ env.K3S_DEPLOYMENT }} \
            ${{ env.K3S_DEPLOYMENT }}=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-push.outputs.sha }} \
            -n ${{ env.K3S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K3S_DEPLOYMENT }} \
            -n ${{ env.K3S_NAMESPACE }} --timeout=300s
