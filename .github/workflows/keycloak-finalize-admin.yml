name: keycloak-finalize-admin — set permanent admin password (REST API, no kubectl)
# re-triggered 2026-06-02e — rewritten to use Keycloak REST API; no Tailscale/kubectl needed

# Sets a permanent admin password for tbaltzakis@cloudless.gr and grants
# realm-management:realm-admin so the user can access auth.cloudless.gr/admin.
#
# Uses the Keycloak REST admin API directly — auth.cloudless.gr must be reachable
# (it always is). Works even when k3s apiserver or kubelet proxy is returning 502.
#
# Requires: ADMIN_BOOTSTRAP_PASSWORD secret (Keycloak internal admin password).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keycloak-finalize-admin.yml"
      - "scripts/keycloak-finalize-admin.sh"
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Admin email (default: tbaltzakis@cloudless.gr)"
        required: false
        default: "tbaltzakis@cloudless.gr"
      keycloak_admin_password:
        description: "Keycloak internal admin password (overrides ADMIN_BOOTSTRAP_PASSWORD secret and SSM)"
        required: false
        default: ""

permissions:
  id-token: write   # OIDC → AWS for SSM fallback
  contents: read
  issues: write

concurrency:
  group: keycloak-finalize-admin
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ADMIN_EMAIL: ${{ github.event.inputs.admin_email || 'tbaltzakis@cloudless.gr' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Configure AWS credentials (OIDC — for SSM fallback)
        if: ${{ github.event.inputs.keycloak_admin_password == '' && secrets.ADMIN_BOOTSTRAP_PASSWORD == '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Resolve Keycloak admin password (input → secret → SSM)
        id: resolve
        env:
          INPUT_PW: ${{ github.event.inputs.keycloak_admin_password }}
          SECRET_PW: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail
          PW="${INPUT_PW:-}"
          if [ -z "$PW" ]; then PW="${SECRET_PW:-}"; fi
          if [ -z "$PW" ]; then
            PW=$(aws ssm get-parameter \
              --name /cloudless/production/KEYCLOAK_ADMIN_PASSWORD \
              --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || true)
          fi
          if [ -z "$PW" ]; then
            echo "::error::No Keycloak admin password found. Provide it via:"
            echo "  1. workflow_dispatch keycloak_admin_password input"
            echo "  2. ADMIN_BOOTSTRAP_PASSWORD GitHub Secret"
            echo "  3. SSM /cloudless/production/KEYCLOAK_ADMIN_PASSWORD"
            exit 1
          fi
          echo "::add-mask::$PW"
          echo "pw=$PW" >> "$GITHUB_OUTPUT"

      - name: Finalize admin account (permanent password + realm-admin via REST API)
        shell: bash
        env:
          KEYCLOAK_ADMIN_PASSWORD: ${{ steps.resolve.outputs.pw }}
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email || 'tbaltzakis@cloudless.gr' }}
        run: |
          set -o pipefail
          bash scripts/keycloak-finalize-admin.sh 2>&1 | tee finalize.log

      - name: Post new credentials to tracking issue
        if: always()
        run: |
          {
            echo "# Keycloak admin finalized — $(date -u '+%F %T')Z"
            echo ""
            echo "> Permanent password set. UPDATE_PASSWORD required action cleared."
            echo "> Log in at **https://cloudless.gr** → Account or **https://auth.cloudless.gr/admin**"
            echo ""
            echo '```'
            cat finalize.log 2>/dev/null || echo "(no log)"
            echo '```'
          } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
