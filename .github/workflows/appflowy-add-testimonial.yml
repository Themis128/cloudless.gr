name: AppFlowy add testimonial (Micro1 ML interview feedback)

# One-shot CMS write: creates the `[Testimonial] Themistoklis Baltzakis`
# page in AppFlowy Cloud so it appears on cloudless.gr via
# /api/testimonials (featured → /links page too).
#
# AppFlowy admin write endpoints in the Next.js app are stubs, so this
# drives the AppFlowy-Cloud page-view API directly from inside the
# cloudless-app pod (which already carries APPFLOWY_API_URL /
# APPFLOWY_EMAIL / APPFLOWY_PASSWORD env). Same tailnet+SSH pattern as
# pi-appflowy-provision.yml. No secrets are printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-testimonial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Connect to tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k8s

      - name: Wait for tailnet path to omv
        run: python3 scripts/ci/tailscale-wait.py 100.74.191.58 22

      - name: Configure kubectl via omv SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: scripts/ci/kubectl-via-omv-ssh.sh

      - name: Write testimonial markdown
        run: |
          cat > /tmp/testimonial-body.md <<'MD'
          **Company**: Micro1
          **Role**: ML Engineer (MSc/PhD) — interview candidate
          **Quote**: The Micro1 ML Engineer interview delivered detailed, technically specific feedback on my applied ML work — 3D medical-imaging segmentation (isotropic resampling, z-score normalization, class-imbalance handling, Dice and IoU), PyTorch and Transformers workflows, and Python/pandas depth. A rare level of specificity.
          **Rating**: 5
          **Featured**: true
          MD
          # heredoc keeps leading spaces out of the field lines? No —
          # indented heredoc strips the common indent, so lines are clean.
          cat /tmp/testimonial-body.md

      - name: Probe in-cluster gotrue endpoints
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n cloudless -l app=cloudless-app -o name | head -1)
          cat > /tmp/gotrue-probe.mjs <<'EOF'
          const bases = [
            "http://gotrue.appflowy.svc.cluster.local:9999",
            "http://nginx.appflowy.svc.cluster.local/gotrue",
          ];
          let selected = "";
          for (const b of bases) {
            try {
              const r = await fetch(`${b}/token?grant_type=password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: "probe@invalid.invalid", password: "x" }),
                signal: AbortSignal.timeout(8000),
              });
              const t = await r.text();
              const ct = r.headers.get("content-type") || "";
              console.log(`PROBE ${b} -> ${r.status} ${ct} ${t.slice(0, 100).replace(/\s+/g, " ")}`);
              if (!selected && ct.includes("json")) selected = b;
            } catch (e) {
              console.log(`PROBE ${b} -> ERR ${String(e).slice(0, 120)}`);
            }
          }
          if (!selected) { console.log("SELECTED=NONE"); process.exit(1); }
          console.log(`SELECTED=${selected}`);
          EOF
          kubectl cp /tmp/gotrue-probe.mjs "${POD#pod/}:/tmp/gotrue-probe.mjs" -n cloudless
          kubectl exec -n cloudless "$POD" -- node /tmp/gotrue-probe.mjs | tee /tmp/probe.out
          grep '^SELECTED=' /tmp/probe.out | grep -v NONE

      - name: Export AppFlowy env for Infisical sync
        # Reads the pod's APPFLOWY_* env into a base64 artifact (values never
        # hit the step log) so an operator can mirror them into Infisical.
        # Artifact is deleted after sync; retention is 1 day regardless.
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n cloudless -l app=cloudless-app -o name | head -1)
          kubectl exec -n cloudless "$POD" -- sh -c \
            'env | grep -E "^APPFLOWY_" | sort' | base64 -w0 > /tmp/appflowy-env.b64
          echo "exported $(wc -c < /tmp/appflowy-env.b64) bytes"

      - name: Upload env artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appflowy-env
          path: /tmp/appflowy-env.b64
          retention-days: 1

      - name: Diagnose gotrue login response
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n cloudless -l app=cloudless-app -o name | head -1)
          cat > /tmp/gotrue-diag.mjs <<'EOF'
          const bases = [
            "http://gotrue.appflowy.svc.cluster.local:9999",
            "http://nginx.appflowy.svc.cluster.local/gotrue",
          ];
          for (const b of bases) {
            try {
              const r = await fetch(`${b}/token?grant_type=password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: process.env.APPFLOWY_EMAIL, password: process.env.APPFLOWY_PASSWORD }),
                redirect: "manual",
                signal: AbortSignal.timeout(8000),
              });
              const t = await r.text();
              console.log(`DIAG ${b} -> ${r.status} ct=${r.headers.get("content-type")} loc=${r.headers.get("location")} body=${t.slice(0, 160).replace(/\s+/g, " ")}`);
            } catch (e) {
              console.log(`DIAG ${b} -> ERR ${String(e).slice(0, 160)}`);
            }
          }
          EOF
          kubectl cp /tmp/gotrue-diag.mjs "${POD#pod/}:/tmp/gotrue-diag.mjs" -n cloudless
          kubectl exec -n cloudless "$POD" -- node /tmp/gotrue-diag.mjs

      - name: Upload testimonial page into AppFlowy
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n cloudless -l app=cloudless-app -o name | head -1)
          echo "pod: $POD"
          kubectl cp scripts/appflowy-upload-md.mjs "${POD#pod/}:/tmp/appflowy-upload-md.mjs" -n cloudless
          kubectl cp /tmp/testimonial-body.md "${POD#pod/}:/tmp/testimonial-body.md" -n cloudless
          GOTRUE_URL=$(kubectl exec -n cloudless "$POD" -- node /tmp/gotrue-probe.mjs | grep '^SELECTED=' | cut -d= -f2-)
          if [ -z "$GOTRUE_URL" ] || [ "$GOTRUE_URL" = "NONE" ]; then
            echo "no working gotrue endpoint found"; exit 1
          fi
          echo "using gotrue: $GOTRUE_URL"
          # API base = pod's APPFLOWY_API_URL (appflowy-cloud:8000 serves
          # /api/* directly). Auth base = probed gotrue endpoint. The public
          # hostname is behind Cloudflare Access (SSO HTML) — never use it.
          kubectl exec -n cloudless "$POD" -- sh -c \
            "APPFLOWY_BASE_URL=\"\${APPFLOWY_API_URL:-https://appflowy.cloudless.gr}\" APPFLOWY_GOTRUE_URL='$GOTRUE_URL' node /tmp/appflowy-upload-md.mjs /tmp/testimonial-body.md --title '[Testimonial] Themistoklis Baltzakis'"
