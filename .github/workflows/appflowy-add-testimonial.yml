name: AppFlowy add testimonial

# Creates a `[Testimonial] <name>` page in AppFlowy Cloud so it appears on
# cloudless.gr via /api/testimonials (featured → /links page too).
#
# Reusable: pass name/company/role/quote (+ optional service/rating/featured)
# as workflow_dispatch inputs. Defaults reproduce the Micro1 ML-interview
# testimonial. AppFlowy admin write endpoints in the Next.js app are stubs,
# so this drives the AppFlowy-Cloud page-view API directly from inside the
# cloudless-app pod. No secrets are printed.
#
# In-cluster endpoints (verified 2026-11-09):
#   API base  -> nginx.appflowy svc :80  (/api/* → appflowy-cloud:8000)
#   Auth base -> nginx.appflowy/gotrue (/gotrue/* → gotrue:9999)
# The pod's APPFLOWY_API_URL env is the PUBLIC hostname, which sits behind
# Cloudflare Access and returns SSO HTML — never use it as APPFLOWY_BASE_URL.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Testimonial author name (page title suffix)"
        required: true
        default: "Themistoklis Baltzakis"
      company:
        description: "Company / org"
        required: false
        default: "Micro1"
      role:
        description: "Role / context"
        required: false
        default: "ML Engineer (MSc/PhD) — interview candidate"
      quote:
        description: "Testimonial text"
        required: true
        default: "The Micro1 ML Engineer interview delivered detailed, technically specific feedback on my applied ML work — 3D medical-imaging segmentation (isotropic resampling, z-score normalization, class-imbalance handling, Dice and IoU), PyTorch and Transformers workflows, and Python/pandas depth. A rare level of specificity."
      service:
        description: "Service line (optional)"
        required: false
        default: ""
      rating:
        description: "Rating 1-5"
        required: false
        default: "5"
      featured:
        description: "Show on /links featured section (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  add-testimonial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Connect to tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k8s

      - name: Wait for tailnet path to omv
        run: python3 scripts/ci/tailscale-wait.py 100.74.191.58 22

      - name: Configure kubectl via omv SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: scripts/ci/kubectl-via-omv-ssh.sh

      - name: Write testimonial markdown
        env:
          T_NAME: ${{ inputs.name }}
          T_COMPANY: ${{ inputs.company }}
          T_ROLE: ${{ inputs.role }}
          T_QUOTE: ${{ inputs.quote }}
          T_SERVICE: ${{ inputs.service }}
          T_RATING: ${{ inputs.rating }}
          T_FEATURED: ${{ inputs.featured }}
        run: |
          {
            [ -n "$T_COMPANY" ] && printf '**Company**: %s\n' "$T_COMPANY"
            [ -n "$T_ROLE" ]    && printf '**Role**: %s\n' "$T_ROLE"
            printf '**Quote**: %s\n' "$T_QUOTE"
            [ -n "$T_SERVICE" ] && printf '**Service**: %s\n' "$T_SERVICE"
            printf '**Rating**: %s\n' "$T_RATING"
            printf '**Featured**: %s\n' "$T_FEATURED"
          } > /tmp/testimonial-body.md
          cat /tmp/testimonial-body.md

      - name: Probe in-cluster AppFlowy API bases
        # Picks the first base whose /api/workspace answers JSON (401 for a
        # bogus bearer proves the route is real; HTML means a SPA/CF-Access
        # catch-all). Runs inside the cloudless-app pod.
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n cloudless -l app=cloudless-app -o name | head -1)
          cat > /tmp/api-probe.mjs <<'EOF'
          const bases = [
            "http://nginx.appflowy.svc.cluster.local",
            "http://appflowy-cloud.appflowy.svc.cluster.local:8000",
          ];
          let selected = "";
          for (const b of bases) {
            try {
              const r = await fetch(`${b}/api/workspace`, {
                headers: { Authorization: "Bearer invalid", Accept: "application/json" },
                signal: AbortSignal.timeout(8000),
              });
              const t = await r.text();
              const ct = r.headers.get("content-type") || "";
              console.log(`PROBE ${b} -> ${r.status} ${ct} ${t.slice(0, 100).replace(/\s+/g, " ")}`);
              if (!selected && ct.includes("json")) selected = b;
            } catch (e) {
              console.log(`PROBE ${b} -> ERR ${String(e).slice(0, 120)}`);
            }
          }
          if (!selected) { console.log("SELECTED=NONE"); process.exit(1); }
          console.log(`SELECTED=${selected}`);
          EOF
          kubectl cp /tmp/api-probe.mjs "${POD#pod/}:/tmp/api-probe.mjs" -n cloudless
          kubectl exec -n cloudless "$POD" -- node /tmp/api-probe.mjs | tee /tmp/probe.out
          grep '^SELECTED=' /tmp/probe.out | grep -v NONE

      - name: Upload testimonial page into AppFlowy
        env:
          T_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n cloudless -l app=cloudless-app -o name | head -1)
          echo "pod: $POD"
          kubectl cp scripts/appflowy-upload-md.mjs "${POD#pod/}:/tmp/appflowy-upload-md.mjs" -n cloudless
          kubectl cp /tmp/testimonial-body.md "${POD#pod/}:/tmp/testimonial-body.md" -n cloudless
          API_URL=$(kubectl exec -n cloudless "$POD" -- node /tmp/api-probe.mjs | grep '^SELECTED=' | cut -d= -f2-)
          if [ -z "$API_URL" ] || [ "$API_URL" = "NONE" ]; then
            echo "no working AppFlowy API base found"; exit 1
          fi
          # Positional args keep the title injection-safe (names may contain
          # quotes). nginx serves both surfaces in-cluster: /api/* →
          # appflowy-cloud, /gotrue/* → gotrue (path-stripped). Verified
          # live 2026-11-09. Gotrue always goes through nginx —
          # appflowy-cloud:8000 has no /gotrue route (SPA HTML catch-all).
          echo "using api: $API_URL"
          kubectl exec -n cloudless "$POD" -- sh -c \
            'APPFLOWY_BASE_URL="$1" APPFLOWY_GOTRUE_URL="$2" node /tmp/appflowy-upload-md.mjs /tmp/testimonial-body.md --title "$3"' \
            _ "$API_URL" "http://nginx.appflowy.svc.cluster.local/gotrue" "[Testimonial] $T_NAME"
