name: AppFlowy → Sitemap Sync

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_V2_TO_NODE24: "true"
  APPFLOWY_API_URL: ${{ secrets.APPFLOWY_API_URL }}
  APPFLOWY_EMAIL: ${{ secrets.APPFLOWY_EMAIL }}
  APPFLOWY_PASSWORD: ${{ secrets.APPFLOWY_PASSWORD }}

jobs:
  sync:
    name: Sync AppFlowy docs & blog slugs into sitemap
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Fetch published slugs from AppFlowy
        id: slugs
        run: |
          BASE="${APPFLOWY_API_URL%/}"

          # Login via GoTrue password grant
          TOKEN=$(curl -sS "${BASE}/gotrue/token?grant_type=password" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${APPFLOWY_EMAIL}\",\"password\":\"${APPFLOWY_PASSWORD}\"}" \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "AppFlowy login failed" >&2
            exit 1
          fi

          # Get primary workspace
          WORKSPACE_ID=$(curl -sS "${BASE}/api/workspace" \
            -H "Authorization: Bearer ${TOKEN}" \
            | jq -r '.data[0].workspace_id')

          if [ -z "$WORKSPACE_ID" ] || [ "$WORKSPACE_ID" = "null" ]; then
            echo "No workspace found" >&2
            exit 1
          fi

          # Walk the workspace folder tree (depth=5 covers nested spaces).
          # Pages prefixed "[Docs]" → /docs/*, "[Blog]" → /blog/*.
          # code -2 means workspace is empty — emit empty arrays and continue.
          FOLDER_JSON=$(curl -sS "${BASE}/api/workspace/${WORKSPACE_ID}/folder?depth=5" \
            -H "Authorization: Bearer ${TOKEN}")

          FOLDER_CODE=$(echo "$FOLDER_JSON" | jq -r '.code // 0')
          if [ "$FOLDER_CODE" != "0" ]; then
            echo "AppFlowy workspace has no content yet (code=${FOLDER_CODE})"
            ALL_VIEWS="[]"
            DOCS_VIEWS="[]"
            BLOG_VIEWS="[]"
          else
            ALL_VIEWS=$(echo "$FOLDER_JSON" \
              | jq '[.. | objects | select(.name? and .layout? == "Document") | .name]' 2>/dev/null || echo "[]")
            DOCS_VIEWS=$(echo "$FOLDER_JSON" \
              | jq '[.. | objects | select(.name? and .layout? == "Document" and (.name | startswith("[Docs]"))) | .name | ltrimstr("[Docs] ")]' 2>/dev/null || echo "[]")
            BLOG_VIEWS=$(echo "$FOLDER_JSON" \
              | jq '[.. | objects | select(.name? and .layout? == "Document" and (.name | startswith("[Blog]"))) | .name | ltrimstr("[Blog] ")]' 2>/dev/null || echo "[]")
          fi

          DOCS_COUNT=$(echo "$DOCS_VIEWS" | jq 'length')
          BLOG_COUNT=$(echo "$BLOG_VIEWS" | jq 'length')

          echo "docs_views<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ALL_VIEWS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "blog_views<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BLOG_VIEWS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "docs_count=${DOCS_COUNT}" >> "$GITHUB_OUTPUT"
          echo "blog_count=${BLOG_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Generate sitemap fragment
        env:
          DOCS_VIEWS: ${{ steps.slugs.outputs.docs_views }}
          BLOG_VIEWS: ${{ steps.slugs.outputs.blog_views }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          slugify() {
            echo "$1" | tr '[:upper:]' '[:lower:]' | sed 's/ /-/g' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//'
          }

          {
            echo "$DOCS_VIEWS" | jq -r '.[]?' | while read -r name; do
              slug=$(slugify "$name")
              [ -n "$slug" ] && echo "/docs/${slug}	${TODAY}"
            done
            echo "$BLOG_VIEWS" | jq -r '.[]?' | while read -r name; do
              slug=$(slugify "$name")
              [ -n "$slug" ] && echo "/blog/${slug}	${TODAY}"
            done
          } | sort -u > src/data/notion-sitemap-entries.tsv

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/notion-sitemap-entries.tsv && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated sitemap entries
        if: steps.diff.outputs.changed == 'true'
        id: push
        run: |
          BRANCH="chore/sitemap-sync-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/notion-sitemap-entries.tsv
          git commit -m "chore: sync AppFlowy docs/blog slugs into sitemap entries

          Docs: ${{ steps.slugs.outputs.docs_count }} views
          Blog: ${{ steps.slugs.outputs.blog_count }} views"
          git push --force origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH="${{ steps.push.outputs.branch }}"
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --title "chore: sync AppFlowy sitemap entries $(date -u +%Y-%m-%d)" \
              --body "Automated PR — updates \`src/data/notion-sitemap-entries.tsv\` from AppFlowy.
          Docs: ${{ steps.slugs.outputs.docs_count }} | Blog: ${{ steps.slugs.outputs.blog_count }}" \
              --base main \
              --head "$BRANCH"
          fi
          PR_NUM=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.diff.outputs.changed == 'true' && steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ steps.pr.outputs.number }}"
          gh pr merge "$PR_NUM" --squash --auto --delete-branch

      - name: Summary
        run: |
          echo "### 📄 AppFlowy → Sitemap Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | Views |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docs   | ${{ steps.slugs.outputs.docs_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Blog   | ${{ steps.slugs.outputs.blog_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "✅ PR opened on \`${{ steps.push.outputs.branch }}\` and merged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No changes — sitemap entries are already up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
