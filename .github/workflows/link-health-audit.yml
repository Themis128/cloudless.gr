name: Link Health Audit (live site)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Crawls the live sitemap.xml + key landing pages and reports broken /
# redirected / slow URLs. Distinct from links-audit.yml which only checks
# markdown sources in the repo.

on:
  schedule:
    # Daily at 04:30 UTC.
  - cron: 30 4 * * *
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL
        default: https://cloudless.gr
      strict:
        description: Fail on broken links
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: link-health-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Link Health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v6
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22

    - name: Run live link health audit
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://cloudless.gr' }}
        STRICT: ${{ github.event.inputs.strict || 'true' }}
      run: |
        set -e
        mkdir -p audit-report
        node scripts/audit/link-health.mjs \
          --base "$BASE_URL" \
          --json audit-report/links.json \
          --md   audit-report/links.md
        cat audit-report/links.md >> "$GITHUB_STEP_SUMMARY"

        if [ "$STRICT" = "true" ]; then
          BROKEN=$(node -e "console.log(require('./audit-report/links.json').broken || 0)")
          if [ "$BROKEN" != "0" ]; then
            echo "::error::$BROKEN broken link(s) found on live site"
            exit 1
          fi
        fi

    - name: Upload links report
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1         # v4
      with:
        name: links-report-${{ github.run_id }}
        path: audit-report/
        retention-days: 30
        if-no-files-found: warn
