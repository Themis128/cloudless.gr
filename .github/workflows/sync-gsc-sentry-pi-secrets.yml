name: Sync GSC + Sentry secrets → Pi cloudless-secrets

# Patches k8s Secret cloudless-secrets (namespace cloudless) from GitHub
# repo secrets, then restarts cloudless-app. Runs on the omv self-hosted
# runner so kubectl talks to local k3s — no Tailscale OAuth required.
#
# Required repo secrets:
#   GOOGLE_CLIENT_EMAIL, GOOGLE_PRIVATE_KEY, GOOGLE_CALENDAR_ID, GSC_SITE_URL
#   SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-gsc-sentry-pi-secrets
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Patch cloudless-secrets (merge keys only)
      env:
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        set -euo pipefail
        KUBECTL="sudo k3s kubectl"
        for name in GOOGLE_CLIENT_EMAIL GOOGLE_PRIVATE_KEY GOOGLE_CALENDAR_ID GSC_SITE_URL SENTRY_AUTH_TOKEN; do
          if [ -z "${!name}" ]; then
            echo "::error::$name GitHub secret is empty"
            exit 1
          fi
          echo "::add-mask::${!name}"
        done
        : "${SENTRY_ORG:=baltzakisthemiscom}"
        : "${SENTRY_PROJECT:=cloudless-gr}"
        : "${GSC_SITE_URL:=sc-domain:cloudless.gr}"

        PATCH=$(python3 -c '
        import json, os, base64, re
        keys = [
          "GOOGLE_CLIENT_EMAIL",
          "GOOGLE_PRIVATE_KEY",
          "GOOGLE_CALENDAR_ID",
          "GSC_SITE_URL",
          "SENTRY_AUTH_TOKEN",
          "SENTRY_ORG",
          "SENTRY_PROJECT",
        ]
        placeholder = re.compile(r"^(your[_-]?value|your[_-]?service|changeme|todo|xxx|placeholder)", re.I)
        data = {}
        for k in keys:
          v = (os.environ.get(k) or "").strip()
          if not v:
            raise SystemExit(f"missing {k}")
          if placeholder.match(v):
            raise SystemExit(f"{k} looks like a placeholder (starts with your_/changeme/…); refuse to sync")
          if k == "GOOGLE_PRIVATE_KEY":
            # Accept PEM with real or escaped newlines
            pem = v.replace("\\n", "\n")
            if "BEGIN" not in pem or len(pem) < 200:
              raise SystemExit("GOOGLE_PRIVATE_KEY must be a PEM private key (BEGIN…, length>=200)")
            v = pem
          if k == "GSC_SITE_URL" and not (v.startswith("sc-domain:") or v.startswith("https://")):
            raise SystemExit("GSC_SITE_URL must be sc-domain:… or https://…")
          data[k] = base64.b64encode(v.encode()).decode()
        print(json.dumps({"data": data}))
        ')

        $KUBECTL -n cloudless patch secret cloudless-secrets --type merge -p "$PATCH"
        echo "Patched keys: GOOGLE_CLIENT_EMAIL GOOGLE_PRIVATE_KEY GOOGLE_CALENDAR_ID GSC_SITE_URL SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT"

    - name: Restart cloudless-app
      run: |
        sudo k3s kubectl -n cloudless rollout restart deploy/cloudless-app
        sudo k3s kubectl -n cloudless rollout status deploy/cloudless-app --timeout=180s

    - name: Verify key presence (names only)
      run: |
        sudo k3s kubectl -n cloudless get secret cloudless-secrets -o json \
          | python3 -c '
        import json,sys
        keys=set(json.load(sys.stdin).get("data",{}))
        need=["GOOGLE_CLIENT_EMAIL","GOOGLE_PRIVATE_KEY","GOOGLE_CALENDAR_ID","GSC_SITE_URL","SENTRY_AUTH_TOKEN","SENTRY_ORG","SENTRY_PROJECT"]
        missing=[k for k in need if k not in keys]
        print("present:", ", ".join(k for k in need if k in keys))
        if missing:
          print("MISSING:", ", ".join(missing))
          raise SystemExit(1)
        print("all required keys present")
        '

    - name: Comment tracking issue
      if: always()
      run: |
        {
          echo "# GSC + Sentry → Pi secrets — $(date -u '+%F %T')Z"
          echo ""
          echo "**Job:** ${{ job.status }}"
          echo "**Runner:** self-hosted omv (local k3s)"
          echo "**Target:** cloudless/cloudless-secrets → restart cloudless-app"
          echo ""
          echo "cloudless2 remains a proxy only; secrets live on the Pi pod."
        } > c.md
        gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md || true
