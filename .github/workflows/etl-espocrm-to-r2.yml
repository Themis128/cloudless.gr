name: ETL: EspoCRM to R2
# Hourly ETL sync from EspoCRM to R2 data lake. Uses Wrangler secrets, no AWS dependency.
# Must run on self-hosted Pi runners — Cloudflare blocks data-center IPs.

on:
  schedule:
    - cron: "20 * * * *" # hourly at :20 (offset from EspoCRM 03:15 + Stripe 03:30)
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etl-espocrm-to-r2.yml"
      - "scripts/etl/espocrm-to-r2.mjs"

permissions:
  contents: read

jobs:
  etl:
    name: Run EspoCRM → R2 sync
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"self-hosted,omv,build"') }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 9

      - name: Install dependencies
        working-directory: scripts/etl
        run: pnpm install --frozen-lockfile

      - name: Run EspoCRM-to-R2 sync
        working-directory: scripts/etl
        env:
          ESPOCRM_BASE_URL: ${{ secrets.ESPOCRM_BASE_URL }}
          ESPOCRM_API_KEY: ${{ secrets.ESPOCRM_API_KEY }}
          ESPOCRM_API_PASSWORD: ${{ secrets.ESPOCRM_API_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: node espocrm-to-r2.mjs

      - name: Ping Kuma on success
        if: always() && github.event_name != 'push'
        uses: actions/github-script@v9
        env:
          KUMA_PUSH_URL: ${{ secrets.KUMA_PUSH_ETL_ESPOCRM }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (process.env.KUMA_PUSH_URL) {
              fetch(process.env.KUMA_PUSH_URL).catch(() => {});
            }

      - name: Notify Slack on failure
        if: failure()
        uses: actions/github-script@v9
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (process.env.SLACK_WEBHOOK_URL) {
              const payload = {
                text: `ETL: EspoCRM to R2 failed in workflow run ${context.runId}`,
                blocks: [{
                  type: "section",
                  text: { type: "mrkdwn", text: ":x: ETL: EspoCRM to R2 failed" }
                }]
              };
              fetch(process.env.SLACK_WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              }).catch(() => {});
            }