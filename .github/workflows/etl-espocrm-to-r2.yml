name: ETL — EspoCRM to R2 Data Lake

# Migrated version using R2 S3-compatible endpoint.
# Set CLOUDFLARE_ACCOUNT_ID and CF_R2_ACCESS_KEY_ID/CF_R2_SECRET_ACCESS_KEY secrets
# to enable R2 target. Otherwise falls back to AWS S3.

on:
  schedule:
    - cron: "20 * * * *" # hourly at :20 (offset from EspoCRM 03:15 + Stripe 03:30)
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etl-espocrm-to-r2.yml"
      - "scripts/etl/espocrm-to-r2.mjs"

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: us-east-1
  BUCKET: datalake-bucket

jobs:
  espocrm-sync:
    name: Sync EspoCRM → R2 Parquet
    # Pinned to self-hosted Pi runners (omv / omv-2 / omv-3).
    # Cloudflare's edge bot-detection / Super Bot Fight Mode silently
    # 404's /api/v1/* requests originating from data-center IPs (incl.
    # GitHub Actions ubuntu-latest pool) — every entity hit a sustained
    # block in runs #27885175515 / #27885186551 (2026-06-20 22:01-22:05),
    # confirmed by external curl from WSL showing HTTP 401 with a
    # WWW-Authenticate: Basic challenge from Cloudflare. Cluster-side
    # probes through the same hostname return 200 fine because the Pi's
    # residential IP scores clean. Running the ETL from the Pi puts it
    # on the same path the cluster pod uses → no edge interception.
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: scripts/etl

      - name: Pull EspoCRM credentials from SSM
        id: ssm
        run: |
          BASE=$(aws ssm get-parameter --name /cloudless/production/ESPOCRM_BASE_URL --query 'Parameter.Value' --output text)
          # Prefer API_PASSWORD (Basic Auth) over API_KEY
          API_PASSWORD=$(aws ssm get-parameter --name /cloudless/production/ESPOCRM_API_PASSWORD --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          API_KEY=$(aws ssm get-parameter --name /cloudless/production/ESPOCRM_API_KEY --with-decryption --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          [ -n "$API_PASSWORD" ] && echo "::add-mask::$API_PASSWORD"
          [ -n "$API_KEY" ] && echo "::add-mask::$API_KEY"
          {
            echo "ESPOCRM_BASE_URL=$BASE"
            echo "ESPOCRM_API_PASSWORD=$API_PASSWORD"
            echo "ESPOCRM_API_KEY=$API_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: Run EspoCRM ETL to R2
        run: node scripts/etl/espocrm-to-r2.mjs
        env:
          ESPOCRM_BASE_URL: ${{ steps.ssm.outputs.ESPOCRM_BASE_URL }}
          ESPOCRM_API_PASSWORD: ${{ steps.ssm.outputs.ESPOCRM_API_PASSWORD }}
          ESPOCRM_API_KEY: ${{ steps.ssm.outputs.ESPOCRM_API_KEY }}
          ANALYTICS_BUCKET: ${{ env.BUCKET }}

      - name: Ping Kuma on success
        if: success()
        env:
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_ETL_ESPOCRM }}
        run: |
          [ -z "$KUMA_PUSH_TOKEN" ] && exit 0
          curl -fsS --max-time 10 --retry 3 \
            "https://kuma.cloudless.gr/api/push/${KUMA_PUSH_TOKEN}?status=up&msg=etl-espocrm+r2+ok" \
            > /dev/null || true

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_ETL_ESPOCRM }}
        run: |
          [ -n "$KUMA_PUSH_TOKEN" ] && \
            curl -fsS --max-time 10 --retry 3 \
              "https://kuma.cloudless.gr/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=etl-espocrm+r2+failed" \
              > /dev/null || true
          [ -n "$SLACK_WEBHOOK_URL" ] && \
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "text": ":x: ETL — EspoCRM to R2 failed See https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              }' || true