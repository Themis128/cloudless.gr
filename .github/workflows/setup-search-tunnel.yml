# Setup Meilisearch Cloudflare Tunnel
# R21a: Adds search.cloudless.gr ingress + DNS to the shared tunnel
#
# This workflow:
#   1. Creates DNS CNAME record for search.cloudless.gr
#   2. Posts instructions to the tracking issue
#
# Prerequisites: CLOUDFLARE_API_TOKEN in SSM

name: Setup Search Tunnel

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Hostname (without .cloudless.gr)'
        required: false
        default: 'search'

permissions:
  id-token: write
  contents: read
  issues: write

env:
  ZONE: cloudless.gr
  TUNNEL_ID: e977a490-58c5-4fdb-9155-86832e3e636a

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east1

      - name: Get Cloudflare credentials from SSM
        id: cf
        run: |
          CF_TOKEN=$(aws ssm get-parameter --name /cloudless/production/CLOUDFLARE_API_TOKEN --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not found in SSM. Set via CLAUDE.md operator action."
            exit 1
          fi
          echo "CF_TOKEN=${CF_TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Get Zone ID
        id: zone
        env:
          CF_TOKEN: ${{ steps.cf.outputs.CF_TOKEN }}
        run: |
          ZONE_ID=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=${{ env.ZONE }}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id')
          echo "ZONE_ID=${ZONE_ID}" >> "$GITHUB_OUTPUT"

      - name: Create DNS CNAME record
        id: dns
        env:
          CF_TOKEN: ${{ steps.cf.outputs.CF_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.ZONE_ID }}
          SUB: ${{ github.event.inputs.hostname }}
        run: |
          EXISTS=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=${SUB}" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id // empty')
          
          TUNNEL_HOST="${{ env.TUNNEL_ID }}.cfargotunnel.com"
          
          if [ -n "$EXISTS" ]; then
            echo "${SUB}.cloudless.gr CNAME already exists, skipping"
          else
            echo "Creating ${SUB}.cloudless.gr CNAME record..."
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"${SUB}\",\"content\":\"${TUNNEL_HOST}\",\"ttl\":1,\"proxied\":true,\"comment\":\"Meilisearch R21a via cloudflare tunnel\"}" | jq .
          fi

      - name: Output ingress rule for operator
        run: |
          echo "## Ingress rule to add to /etc/cloudflared/config.yml" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat << 'INGRESS' >> $GITHUB_STEP_SUMMARY
          - hostname: search.cloudless.gr
            service: http://192.168.1.128:30770
            originRequest:
              connectTimeout: 15s
              tcpKeepAlive: 30s
              httpHostHeader: search.cloudless.gr
          INGRESS
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run this on BOTH omv and omv-ha nodes before `systemctl restart cloudflared`**" >> $GITHUB_STEP_SUMMARY

      - name: Post to issue
        run: |
          {
            echo "## R21a Tunnel Setup — $(date -u '+%F %T')Z"
            echo ""
            echo "**DNS:** search.cloudless.gr → CNAME to tunnel created"
            echo ""
            echo "**Next operator action:**"
            echo "1. SSH to omv and omv-ha"
            echo "2. Append the ingress rule from the summary above to /etc/cloudflared/config.yml (before the catch-all rule)"
            echo "3. Run `sudo systemctl restart cloudflared` on BOTH nodes"
            echo "4. Verify: curl -I https://search.cloudless.gr/health"
          } > /tmp/comment.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file /tmp/comment.md || true