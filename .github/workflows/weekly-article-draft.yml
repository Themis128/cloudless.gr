name: Weekly Article Draft

on:
  # Dispatch-only. The Anthropic API call fails with 400 "credit balance
  # too low" while the account is unfunded. Until credits are added at
  # platform.claude.com/settings/billing, scheduled/auto runs would generate
  # GH email noise on every fire. Stays available for manual dispatch.
  workflow_dispatch:

concurrency:
  group: weekly-article-draft
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  draft:
    name: Generate weekly blog draft
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AI_GENERATE_SECRET: ${{ secrets.AI_GENERATE_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      CLOUDFLARE_ACCOUNT_ID: fb7dc7b69b662480cd5961a4d1913c78
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # AppFlowy (self-hosted Notion replacement) — scripts/generate-weekly-article.ts
      # reads APPFLOWY_API_URL + APPFLOWY_EMAIL + APPFLOWY_PASSWORD to write drafts.
      APPFLOWY_API_URL: ${{ secrets.APPFLOWY_API_URL }}
      APPFLOWY_EMAIL: ${{ secrets.APPFLOWY_EMAIL }}
      APPFLOWY_PASSWORD: ${{ secrets.APPFLOWY_PASSWORD }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      NEWSLETTER_SLACK_CHANNEL_ID: ${{ secrets.NEWSLETTER_SLACK_CHANNEL_ID }}
      SLACK_OPS_USER_ID: ${{ secrets.SLACK_OPS_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate weekly article draft
        run: pnpm exec tsx --tsconfig scripts/tsconfig.json scripts/generate-weekly-article.ts

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg run_url "$RUN_URL" '{
              text: "❌ Weekly article draft generation failed",
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: "❌ Weekly Draft Failed", emoji: true }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "The Monday-morning AI draft generator failed. No newsletter will be sent unless you re-run it (button below) or draft something manually in Notion."
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      style: "primary",
                      text: { type: "plain_text", text: "🔁 Re-run draft", emoji: true },
                      action_id: "rerun_weekly_draft",
                      value: "weekly-article-draft.yml"
                    },
                    {
                      type: "button",
                      text: { type: "plain_text", text: "View logs", emoji: true },
                      url: $run_url,
                      action_id: "view_failed_run_logs"
                    }
                  ]
                }
              ]
            }')"
