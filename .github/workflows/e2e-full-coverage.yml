name: e2e-full-coverage
on:
  pull_request:
    paths:
      - src/**
      - e2e/**
      - playwright.config.mts
      - package.json
      - .github/workflows/e2e-full-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright full coverage (local dev)
    # Default GH-hosted; RUNNER_X64=["self-hosted","legion","x64"] for Legion failover.
    runs-on: ${{ fromJSON(vars.RUNNER_X64 || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NEXT_PUBLIC_E2E: '1'
      E2E_ADMIN_TOKEN: e2e-admin-token-do-not-use-in-prod
      CI: 'true'
      E2E_USER_EMAIL: testuser@cloudless.gr
      E2E_USER_PASSWORD: TestPass123!
      E2E_ADMIN_EMAIL: testadmin@cloudless.gr
      E2E_ADMIN_PASSWORD: AdminPass123!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply local D1 migrations
        run: |
          # Non-interactive CI skips the confirmation prompt automatically.
          # Includes 0015-fix-user-role-fk (broken user_old FK → signup fails).
          pnpm exec wrangler d1 migrations apply user-auth-db --local

      - name: Setup test database
        env:
          NEXT_PUBLIC_E2E: '1'
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          E2E_ADMIN_TOKEN: e2e-admin-token-do-not-use-in-prod
        run: |
          echo "Setting up test database..."
          setsid pnpm dev -p 4000 < /dev/null > /tmp/dev-server.log 2>&1 &
          DEV_PID=$!

          for i in $(seq 1 45); do
            if curl -sf -m 2 http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "Dev server ready"
              break
            fi
            sleep 2
          done

          echo "Seeding admin user..."
          curl -sS -X POST http://localhost:4000/api/auth/register-d1 \
            -H "Content-Type: application/json" \
            -d '{"email":"testadmin@cloudless.gr","password":"AdminPass123!","name":"Test Admin"}' \
            || echo "Admin register soft-failed (may already exist)"

          echo "Promoting test admin..."
          curl -sS -X POST http://localhost:4000/api/admin/users \
            -H "Authorization: Bearer e2e-admin-token-do-not-use-in-prod" \
            -H "Content-Type: application/json" \
            -d '{"action":"promote","username":"testadmin@cloudless.gr"}' \
            || echo "Promotion soft-failed"

          echo "Seeding test user..."
          curl -sS -X POST http://localhost:4000/api/auth/register-d1 \
            -H "Content-Type: application/json" \
            -d '{"email":"testuser@cloudless.gr","password":"TestPass123!","name":"Test User"}' \
            || echo "User register soft-failed (may already exist)"

          kill $DEV_PID 2>/dev/null || true
          pkill -f "next dev -p 4000" 2>/dev/null || true
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 4000/tcp 2>/dev/null || true
          else
            lsof -ti:4000 | xargs -r kill -9 2>/dev/null || true
          fi
          sleep 2
          echo "Database seeding complete"

      - name: Run Playwright deep suite
        run: |
          pnpm exec playwright test --config=playwright.config.mts \
            --project=chromium \
            --reporter=line \
            --workers=2 \
            e2e/deep/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
