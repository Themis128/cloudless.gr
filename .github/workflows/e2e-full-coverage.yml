name: e2e-full-coverage
on:
  pull_request:
    paths:
      - src/**
      - e2e/**
      - playwright.config.mts
      - package.json
      - .github/workflows/e2e-full-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-full-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright full coverage (live D1)
    # Default GH-hosted; RUNNER_X64=["self-hosted","legion","x64"] for Legion failover.
    runs-on: ${{ fromJSON(vars.RUNNER_X64 || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NEXT_PUBLIC_E2E: '1'
      NEXT_PUBLIC_AUTH_PROVIDER: d1
      CI: 'true'
      AUTH_DB_USE_HTTP: '1'
      AUTH_DB_PREFER_LOCAL: '0'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CLOUDFLARE_D1_DATABASE_ID: 7ca74513-23c3-412a-b9ca-b0c55835973d
      E2E_ADMIN_TOKEN: e2e-admin-token-do-not-use-in-prod
      E2E_USER_EMAIL: testuser@cloudless.gr
      E2E_USER_PASSWORD: TestPass123!
      E2E_ADMIN_EMAIL: testadmin@cloudless.gr
      E2E_ADMIN_PASSWORD: AdminPass123!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Probe live user-auth-db and ensure seed users
        env:
          NEXT_PUBLIC_E2E: '1'
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          AUTH_DB_USE_HTTP: '1'
          AUTH_DB_PREFER_LOCAL: '0'
          E2E_ADMIN_TOKEN: e2e-admin-token-do-not-use-in-prod
        run: |
          echo "Starting next-dev against live D1..."
          # scripts/dev-server.sh reads DEV_PORT / DEV_HOST. Do not pass
          # `next dev -p` flags — unknown args used to exit 2 before listen.
          export DEV_PORT=4000
          export DEV_HOST=127.0.0.1
          setsid pnpm dev < /dev/null > /tmp/dev-server.log 2>&1 &
          DEV_PID=$!

          dump_dev_log() {
            echo "==== /tmp/dev-server.log ===="
            cat /tmp/dev-server.log || true
          }

          for i in $(seq 1 90); do
            if curl -sf -m 2 http://127.0.0.1:4000/api/health > /dev/null 2>&1; then
              echo "Dev server ready"
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "Dev server exited before ready"
              dump_dev_log
              exit 1
            fi
            sleep 2
          done

          HEALTH="$(curl -sS -m 8 http://127.0.0.1:4000/api/health || true)"
          echo "health: $HEALTH"
          if ! echo "$HEALTH" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body.get("dbConnected") is True, body
          assert body.get("authDb") == "d1-http", body
          '; then
            dump_dev_log
            exit 1
          fi
          echo "Seeding admin user on live user-auth-db (idempotent)..."
          curl -sS -X POST http://127.0.0.1:4000/api/auth/register-d1 \
            -H "Content-Type: application/json" \
            -d '{"email":"testadmin@cloudless.gr","password":"AdminPass123!","name":"Test Admin"}' \
            || echo "Admin register soft-failed (may already exist)"

          echo "Promoting test admin..."
          curl -sS -X POST http://127.0.0.1:4000/api/admin/users \
            -H "Authorization: Bearer e2e-admin-token-do-not-use-in-prod" \
            -H "Content-Type: application/json" \
            -d '{"action":"promote","username":"testadmin@cloudless.gr"}' \
            || echo "Promotion soft-failed"

          echo "Seeding test user..."
          curl -sS -X POST http://127.0.0.1:4000/api/auth/register-d1 \
            -H "Content-Type: application/json" \
            -d '{"email":"testuser@cloudless.gr","password":"TestPass123!","name":"Test User"}' \
            || echo "User register soft-failed (may already exist)"

          kill $DEV_PID 2>/dev/null || true
          pkill -f "next dev -p 4000" 2>/dev/null || true
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 4000/tcp 2>/dev/null || true
          else
            lsof -ti:4000 | xargs -r kill -9 2>/dev/null || true
          fi
          sleep 2
          echo "Live D1 seed complete"

      - name: Run Playwright deep suite
        run: |
          pnpm exec playwright test --config=playwright.config.mts \
            --project=chromium \
            --reporter=line \
            --workers=2 \
            e2e/deep/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
