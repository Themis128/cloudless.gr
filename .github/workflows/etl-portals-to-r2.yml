name: 'ETL: Portals to R2'
# ETL sync: Client portals from D1 app_config → portals parquet in R2.
# Reads config from D1 app_config via Cloudflare D1 REST API.
# Must run on self-hosted Pi runners — Cloudflare blocks data-center IPs.

on:
  schedule:
  - cron: 30 6 * * *       # daily at 06:30 UTC (offset from clients at 06:45)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etl:
    name: Run Portals → R2 sync
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.3.1

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22


    - name: Install dependencies (use pnpm, avoid npm ci on pnpm-managed repo)
      working-directory: scripts/etl
      run: |
        # Ensure pnpm is available via corepack, then install production deps
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Run Portals-to-R2 sync
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node portals-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: Portals to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: Portals to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }

# Required secrets (add via GitHub repo → Settings → Secrets → Actions):
# CF_ACCOUNT_ID - Your Cloudflare account ID
# CLOUDFLARE_API_TOKEN - Cloudflare API token (D1 REST)
# CF_R2_ACCESS_KEY_ID - R2 access key from Cloudflare dashboard
# CF_R2_SECRET_ACCESS_KEY - R2 secret key from Cloudflare dashboard
# SLACK_WEBHOOK_URL - Slack webhook for failure notifications (optional)
