name: Validate Dev Container

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [main]
    paths: [.devcontainer/**]
  pull_request:
    paths: [.devcontainer/**]
  workflow_dispatch:

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e         # v4

    - name: Build dev container image
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf         # v7
      with:
        context: .
        file: .devcontainer/Dockerfile
        push: false
        load: true
        tags: cloudless-devcontainer:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify AWS CLI
      run: |
        docker run --rm cloudless-devcontainer:ci \
          sh -c 'aws --version && echo "arch: $(uname -m)"'

    - name: Verify pnpm store is writable as node user
      run: |
        docker run --rm --user node cloudless-devcontainer:ci \
          sh -c 'touch /pnpm-store/.write-test && rm /pnpm-store/.write-test && echo "pnpm store writable"'

    - name: Verify CI env var is NOT set in image
      run: |
        docker run --rm cloudless-devcontainer:ci \
          sh -c 'if [ "${CI:-}" = "true" ]; then echo "ERROR: CI=true is set" && exit 1; fi && echo "CI not forced in image - OK"'
