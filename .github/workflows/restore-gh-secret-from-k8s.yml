name: Restore GH secret from Pi cloudless-secrets

# Copies an allowlisted key from k8s Secret cloudless/cloudless-secrets into a
# GitHub Actions repository secret. Used when a GH secret was overwritten or
# lost while the cluster still has the live value (e.g. ESPOCRM_WEBHOOK_SECRET).
#
# Requires GH_PAT (GITHUB_TOKEN cannot write Actions secrets).
# Runs on the self-hosted omv runner (local k3s).

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: Key in cloudless/cloudless-secrets to copy into GH Actions
        required: true
        type: choice
        options:
          - ESPOCRM_WEBHOOK_SECRET
          - SOCIALAUTO_LEADS_WEBHOOK_SECRET
          - ESPOCRM_API_KEY
          - LINKEDIN_ACCESS_TOKEN
          - LINKEDIN_REFRESH_TOKEN
          - LINKEDIN_CAPI_ACCESS_TOKEN
          - LINKEDIN_CLIENT_ID
          - LINKEDIN_CLIENT_SECRET
          - LINKEDIN_ORGANIZATION_URN
          - LINKEDIN_AD_ACCOUNT_ID
        default: ESPOCRM_WEBHOOK_SECRET


permissions:
  contents: read

concurrency:
  group: restore-gh-secret-from-k8s
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  restore:
    name: k8s → GitHub Actions secret
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    steps:
      - name: Copy secret (value never logged)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT is required to write Actions secrets"
            exit 1
          fi

          VAL=$(sudo k3s kubectl -n cloudless get secret cloudless-secrets \
            -o "jsonpath={.data.${SECRET_NAME}}" | base64 -d || true)
          if [ -z "${VAL}" ]; then
            echo "::error::${SECRET_NAME} missing or empty in cloudless/cloudless-secrets"
            exit 1
          fi

          LEN=$(printf '%s' "$VAL" | wc -c)
          printf '%s' "$VAL" | gh secret set "$SECRET_NAME" --repo "${{ github.repository }}"
          unset VAL
          echo "Restored ${SECRET_NAME} from cluster (length=${LEN})"
