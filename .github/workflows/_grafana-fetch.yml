name: _Grafana fetch (one-shot)
on:
  workflow_dispatch:
    inputs:
      dashboard_uid:
        description: Grafana dashboard UID
        default: esp32-watchdog
permissions:
  id-token: write
  contents: read
jobs:
  fetch:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 5
    steps:
      - name: Get Grafana password + dashboard
        run: |
          PASS=$(kubectl get secret kube-prom-grafana -n monitoring \
            -o jsonpath='{.data.admin-password}' | base64 -d)
          echo "GRAFANA_PASS=${PASS}" >> "$GITHUB_ENV"
          echo "::add-mask::${PASS}"

          echo "=== Dashboard ==="
          curl -sf "http://kube-prom-grafana.monitoring.svc.cluster.local:80/api/dashboards/uid/${{ inputs.dashboard_uid }}" \
            -u "admin:${PASS}" | python3 -m json.tool

          echo "=== Alerts ==="
          curl -sf "http://kube-prom-grafana.monitoring.svc.cluster.local:80/api/alertmanager/grafana/api/v2/alerts" \
            -u "admin:${PASS}" | python3 -m json.tool 2>/dev/null || echo "no alerts"

          echo "=== ESP32 pods ==="
          kubectl get pods -A | grep -iE "esp32|arduino|sensor" || echo "no esp32 pods"

          echo "=== ESP32 Prometheus targets ==="
          curl -sf "http://monitoring-prometheus.monitoring.svc.cluster.local:9090/api/v1/targets" \
            | python3 -c "
import sys,json
d=json.load(sys.stdin)
for t in d.get('data',{}).get('activeTargets',[]):
    labels=t.get('labels',{})
    if any(k in str(labels).lower() for k in ['esp','arduino','sensor','iot']):
        print(t.get('health'), labels.get('job'), labels.get('instance'), t.get('lastError',''))
" 2>/dev/null || echo "no esp32 targets"
