name: Tailscale relogin omv-ha

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  relogin:
    runs-on: [self-hosted, omv, pi]
    steps:
      - name: Mint auth key + tailscale up on omv-ha (192.168.1.130)
        env:
          TS_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SEC: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          TS_ID2: ${{ secrets.TS_CLIENT_ID }}
          TS_SEC2: ${{ secrets.TS_CLIENT_SECRET }}
          TS_AUTHKEY_FALLBACK: ${{ secrets.TS_AUTHKEY }}
          OMV_SSH: ${{ secrets.OMV_SSH_KEY }}
        run: |
          set -u
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$OMV_SSH" > ~/.ssh/omv_key
          chmod 600 ~/.ssh/omv_key
          ssh-keyscan -H 192.168.1.130 >> ~/.ssh/known_hosts 2>/dev/null || true

          up_with_key() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -i ~/.ssh/omv_key tbaltzakis@192.168.1.130 \
              "sudo tailscale up --auth-key='$1' --hostname=omv-ha --accept-routes && sudo tailscale set --ssh=false && tailscale status | head -3" 2>&1
          }

          mint_key() {
            local resp
            resp=$(curl -sS -w '\n%{http_code}' -X POST https://api.tailscale.com/api/v2/oauth/token \
              -d "grant_type=client_credentials" -u "$1:$2") || { echo "oauth curl fail" >&2; return 1; }
            local code body tok
            code=$(printf '%s' "$resp" | tail -1); body=$(printf '%s' "$resp" | sed '$d')
            tok=$(printf '%s' "$body" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null)
            [ -n "$tok" ] || { echo "oauth token fail http=$code: $(printf '%s' "$body" | head -c 300)" >&2; return 1; }
            resp=$(curl -sS -w '\n%{http_code}' -X POST https://api.tailscale.com/api/v2/tailnet/-/keys \
              -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' \
              -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":false,"preauthorized":true,"tags":["tag:k8s"]}}},"expirySeconds":300}')
            code=$(printf '%s' "$resp" | tail -1); body=$(printf '%s' "$resp" | sed '$d')
            printf '%s' "$body" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("key",""))' 2>/dev/null
            [ "$code" = "200" ] || echo "key mint http=$code: $(printf '%s' "$body" | head -c 300)" >&2
          }

          KEY=""
          KEY=$(mint_key "$TS_ID" "$TS_SEC") || KEY=""
          [ -n "$KEY" ] || KEY=$(mint_key "$TS_ID2" "$TS_SEC2") || KEY=""
          if [ -z "$KEY" ]; then echo "::warning::oauth mints failed — trying TS_AUTHKEY fallback"; KEY="$TS_AUTHKEY_FALLBACK"; fi

          if [ -z "$KEY" ]; then
            echo "::error::no auth key could be minted and TS_AUTHKEY fallback empty"
            exit 1
          fi
          echo "::add-mask::$KEY"
          if out=$(up_with_key "$KEY"); then
            echo "$out"
            echo "## omv-ha tailscale relogin OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$out"
            echo "::error::tailscale up failed on omv-ha"
            exit 1
          fi
