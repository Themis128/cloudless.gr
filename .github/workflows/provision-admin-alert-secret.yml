name: Provision ADMIN_ALERT_SECRET + ntfy → Pi k3s

# Reads ADMIN_ALERT_SECRET from infrastructure/cloudless/secrets.yaml (already
# committed), patches cloudless/cloudless-secrets, enables ntfy fan-out, ensures
# the cloudless-app pod's envFrom includes cloudless-secrets, and creates the
# omv-ops/admin-alert-secret for the sdb1 CronJob.
#
# Trigger: push to this file's path (cluster-incident-response pattern).
# No manual inputs or AWS SSM required.

on:
  push:
    paths:
      - .github/workflows/provision-admin-alert-secret.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: provision-admin-alert-secret
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provision:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read + mask ADMIN_ALERT_SECRET from secrets.yaml
        id: secret
        run: |
          set -euo pipefail
          SECRET=$(python3 -c "
          import re, sys
          with open('infrastructure/cloudless/secrets.yaml') as f:
              m = re.search(r'ADMIN_ALERT_SECRET:\s*([0-9a-f]{40,})', f.read())
              if not m:
                  sys.exit('ADMIN_ALERT_SECRET not found in infrastructure/cloudless/secrets.yaml')
              print(m.group(1).strip())
          ")
          echo "::add-mask::$SECRET"
          echo "value=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Patch cloudless/cloudless-secrets
        env:
          SECRET: ${{ steps.secret.outputs.value }}
        run: |
          set -euo pipefail
          KUBECTL="sudo k3s kubectl"
          PATCH=$(python3 -c "
          import json, os, base64
          data = {
            'ADMIN_ALERT_SECRET': base64.b64encode(os.environ['SECRET'].encode()).decode(),
            'ADMIN_PUSH_VIA_NTFY': base64.b64encode(b'1').decode(),
            # In-cluster URL — avoids tunnel round-trip; ntfy pod is in namespace 'ntfy'
            'NTFY_BASE_URL': base64.b64encode(b'http://ntfy.ntfy.svc.cluster.local').decode(),
            'NTFY_TOPIC': base64.b64encode(b'cloudless-ops').decode(),
          }
          print(json.dumps({'data': data}))
          ")
          $KUBECTL -n cloudless patch secret cloudless-secrets --type merge -p "$PATCH"
          echo "Patched: ADMIN_ALERT_SECRET ADMIN_PUSH_VIA_NTFY NTFY_BASE_URL NTFY_TOPIC"

      - name: Ensure cloudless-secrets in pod envFrom
        run: |
          set -euo pipefail
          KUBECTL="sudo k3s kubectl"
          NS=cloudless
          DEPLOY=cloudless-app
          SECRET=cloudless-secrets

          ALREADY=$($KUBECTL -n "$NS" get deploy "$DEPLOY" -o json \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          refs = d['spec']['template']['spec']['containers'][0].get('envFrom', [])
          names = [r.get('secretRef', {}).get('name', '') for r in refs]
          print('yes' if '$SECRET' in names else 'no')
          " 2>/dev/null || echo "no")

          if [ "$ALREADY" = "yes" ]; then
            echo "cloudless-secrets already in envFrom — skipping patch"
          else
            HAS_ENVFROM=$($KUBECTL -n "$NS" get deploy "$DEPLOY" -o json \
              | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          refs = d['spec']['template']['spec']['containers'][0].get('envFrom')
          print('yes' if refs is not None else 'no')
              " 2>/dev/null || echo "no")

            if [ "$HAS_ENVFROM" = "yes" ]; then
              $KUBECTL -n "$NS" patch deploy "$DEPLOY" --type=json -p \
                "[{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/envFrom/-\",\"value\":{\"secretRef\":{\"name\":\"$SECRET\"}}}]"
            else
              $KUBECTL -n "$NS" patch deploy "$DEPLOY" --type=json -p \
                "[{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/envFrom\",\"value\":[{\"secretRef\":{\"name\":\"$SECRET\"}}]}]"
            fi
            echo "Added cloudless-secrets to envFrom"
          fi

      - name: Create omv-ops/admin-alert-secret for sdb1 CronJob
        env:
          SECRET: ${{ steps.secret.outputs.value }}
        run: |
          set -euo pipefail
          KUBECTL="sudo k3s kubectl"
          $KUBECTL create namespace omv-ops --dry-run=client -o yaml | $KUBECTL apply -f -
          $KUBECTL -n omv-ops create secret generic admin-alert-secret \
            --from-literal=ADMIN_ALERT_SECRET="$SECRET" \
            --dry-run=client -o yaml | $KUBECTL apply -f -
          echo "omv-ops/admin-alert-secret: OK"

      - name: Restart cloudless-app
        run: |
          sudo k3s kubectl -n cloudless rollout restart deploy/cloudless-app
          sudo k3s kubectl -n cloudless rollout status deploy/cloudless-app --timeout=180s

      - name: Verify keys present
        run: |
          sudo k3s kubectl -n cloudless get secret cloudless-secrets -o json \
            | python3 -c "
          import json, sys
          keys = set(json.load(sys.stdin).get('data', {}))
          need = ['ADMIN_ALERT_SECRET', 'ADMIN_PUSH_VIA_NTFY', 'NTFY_BASE_URL', 'NTFY_TOPIC']
          missing = [k for k in need if k not in keys]
          print('present:', ', '.join(k for k in need if k in keys))
          if missing:
              print('MISSING:', ', '.join(missing))
              raise SystemExit(1)
          print('all required keys present')
          "

      - name: Smoke-test admin-alert webhook
        run: |
          SECRET_VAL=$(sudo k3s kubectl -n cloudless get secret cloudless-secrets -o json \
            | python3 -c "
          import json, sys, base64
          d = json.load(sys.stdin)
          print(base64.b64decode(d['data']['ADMIN_ALERT_SECRET']).decode())
          ")
          echo "::add-mask::$SECRET_VAL"
          CODE=$(curl -sS -o /tmp/alert-resp -w '%{http_code}' --max-time 10 \
            -X POST http://127.0.0.1:30300/api/webhooks/admin-alert \
            -H "x-cloudless-alert-secret: $SECRET_VAL" \
            -H "Content-Type: application/json" \
            -d '{"severity":"info","title":"provision smoke-test","message":"ADMIN_ALERT_SECRET is live","source":"provision-workflow"}')
          echo "HTTP $CODE — $(cat /tmp/alert-resp | head -c 200)"
          [ "$CODE" = "200" ] || { echo "::warning::Smoke-test returned $CODE (app may still be rolling out)"; true; }

      - name: Comment issue #382
        if: always()
        run: |
          {
            echo "## admin-alert-secret provision — $(date -u '+%F %T')Z"
            echo ""
            echo "**Status:** ${{ job.status }}"
            echo ""
            echo "Patched \`cloudless/cloudless-secrets\`:"
            echo "- \`ADMIN_ALERT_SECRET\` — \`/api/webhooks/admin-alert\` auth secret"
            echo "- \`ADMIN_PUSH_VIA_NTFY=1\` — ntfy phone push enabled"
            echo "- \`NTFY_BASE_URL=http://ntfy.ntfy.svc.cluster.local\` — in-cluster"
            echo "- \`NTFY_TOPIC=cloudless-ops\`"
            echo ""
            echo "Also created \`omv-ops/admin-alert-secret\` (for sdb1 CronJob)."
            echo ""
            echo "cloudless-app restarted and verified."
          } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md || true
