name: Pi fix D1 auth (create Secret, wire envFrom, restart, verify)

# Fixes /api/auth/login returning HTTP 500 with empty body.
# Root cause (issue #382 comment 5220320281): cloudless-app deployment
# has no Cloudflare env vars set → D1 HTTP client calls the API with an
# empty/absent Bearer token → 401 → throws → unhandled → 500.
#
# This workflow is idempotent — safe to re-run.

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: 7ca74513-23c3-412a-b9ca-b0c55835973d
      NAMESPACE: cloudless
      DEPLOYMENT: cloudless-app
      SECRET_NAME: cloudless-app-cf
    steps:
    - name: Validate required secrets
      run: |
        set -euo pipefail
        missing=()
        [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=("CLOUDFLARE_API_TOKEN")
        [ -n "$CF_ACCOUNT_ID" ]        || missing+=("CF_ACCOUNT_ID")
        [ -n "${{ secrets.KUBECONFIG_B64 }}" ] || missing+=("KUBECONFIG_B64")
        [ -n "${{ secrets.TS_AUTHKEY }}" ]     || missing+=("TS_AUTHKEY")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Missing required repo secrets: ${missing[*]}"; exit 1
        fi

    - name: Pre-verify token against Cloudflare API
      run: |
        set -euo pipefail
        r=$(curl -s -o /dev/null -w '%{http_code}' \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          https://api.cloudflare.com/client/v4/user/tokens/verify)
        if [ "$r" != "200" ]; then
          echo "::error::Token verify returned HTTP $r — will not push a bad token into the cluster"; exit 1
        fi
        echo "OK  token verify → 200"

    - name: Connect to tailnet
      uses: tailscale/github-action@v3
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        version: latest
        tags: tag:ci

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        kubectl version --client -o yaml | head -3

    - name: Capture BEFORE state
      run: |
        {
          echo "## BEFORE — $(date -u '+%F %T')Z"
          echo
          echo '### Deployment env (literals + valueFrom refs)'
          echo '```'
          kubectl get deploy "$DEPLOYMENT" -n "$NAMESPACE" -o json \
            | jq -r '.spec.template.spec.containers[]?.env[]? | "\(.name)=\(.value // ("secret:" + (.valueFrom.secretKeyRef.name // "?") + ":" + (.valueFrom.secretKeyRef.key // "?")))"' \
            | sort -u || echo '(no env array)'
          echo '```'
          echo
          echo '### Deployment envFrom (Secret / ConfigMap refs)'
          echo '```'
          kubectl get deploy "$DEPLOYMENT" -n "$NAMESPACE" -o json \
            | jq -r '.spec.template.spec.containers[]?.envFrom[]? | "\(.secretRef.name // .configMapRef.name)  (\(.secretRef | if . then "Secret" else "ConfigMap" end))"' \
            || echo '(no envFrom array)'
          echo '```'
          echo
          echo '### Pod status'
          echo '```'
          kubectl get pods -n "$NAMESPACE" -l app="$DEPLOYMENT" -o wide
          echo '```'
        } > before.md
        cat before.md

    - name: Create / update the Secret (server-side apply, idempotent)
      run: |
        set -euo pipefail
        kubectl create secret generic "$SECRET_NAME" \
          --namespace "$NAMESPACE" \
          --from-literal=CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
          --from-literal=CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" \
          --from-literal=CLOUDFLARE_D1_DATABASE_ID="$D1_DATABASE_ID" \
          --dry-run=client -o yaml \
          | kubectl apply -f -
        echo "OK  Secret $SECRET_NAME applied"

    - name: Patch deployment to consume the Secret via envFrom
      run: |
        set -euo pipefail
        # Merge (not replace) envFrom so we don't blow away any existing refs.
        existing=$(kubectl get deploy "$DEPLOYMENT" -n "$NAMESPACE" -o json \
          | jq --arg n "$SECRET_NAME" '
              .spec.template.spec.containers[0].envFrom //= [] |
              (.spec.template.spec.containers[0].envFrom | map(.secretRef?.name) | index($n))
          ')
        if [ "$existing" = "null" ] || [ "$existing" = "" ]; then
          kubectl patch deploy "$DEPLOYMENT" -n "$NAMESPACE" --type=json -p "[
            {
              \"op\": \"add\",
              \"path\": \"/spec/template/spec/containers/0/envFrom/-\",
              \"value\": { \"secretRef\": { \"name\": \"$SECRET_NAME\" } }
            }
          ]" 2>/dev/null || \
          kubectl patch deploy "$DEPLOYMENT" -n "$NAMESPACE" --type=json -p "[
            {
              \"op\": \"add\",
              \"path\": \"/spec/template/spec/containers/0/envFrom\",
              \"value\": [ { \"secretRef\": { \"name\": \"$SECRET_NAME\" } } ]
            }
          ]"
          echo "OK  envFrom added"
        else
          echo "OK  envFrom already references $SECRET_NAME (index $existing) — no patch needed"
        fi

    - name: Rollout restart & wait
      run: |
        set -euo pipefail
        kubectl rollout restart deployment/"$DEPLOYMENT" -n "$NAMESPACE"
        kubectl rollout status deployment/"$DEPLOYMENT" -n "$NAMESPACE" --timeout=180s

    - name: Capture AFTER state
      run: |
        {
          echo "## AFTER — $(date -u '+%F %T')Z"
          echo
          echo '### envFrom refs on cloudless-app'
          echo '```'
          kubectl get deploy "$DEPLOYMENT" -n "$NAMESPACE" -o json \
            | jq -r '.spec.template.spec.containers[]?.envFrom[]? | "\(.secretRef.name // .configMapRef.name)"'
          echo '```'
          echo
          echo '### Pods'
          echo '```'
          kubectl get pods -n "$NAMESPACE" -l app="$DEPLOYMENT" -o wide
          echo '```'
          echo
          echo '### Env presence inside the new pod (names + presence only, values redacted)'
          POD=$(kubectl get pod -n "$NAMESPACE" -l app="$DEPLOYMENT" -o name | head -1)
          echo '```'
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID; do
            n=$(kubectl exec -n "$NAMESPACE" "$POD" -- printenv "$v" 2>/dev/null | wc -c)
            echo "$v: $([ "$n" -gt 1 ] && echo "present ($((n-1)) chars)" || echo "MISSING")"
          done
          echo '```'
        } > after.md
        cat after.md

    - name: Live probe /api/auth/login (expect 401, not 500)
      run: |
        set -euo pipefail
        # Give the pod a moment past readiness
        sleep 8
        {
          echo "## Live probe — $(date -u '+%F %T')Z"
          echo
          for name in "bad-creds" "malformed"; do
            case "$name" in
              bad-creds) body='{"email":"probe@invalid.example","password":"definitely-wrong"}' ;;
              malformed) body='not-json' ;;
            esac
            code=$(curl -s -o /tmp/rsp.txt -w '%{http_code}' -m 15 \
              -X POST https://cloudless.gr/api/auth/login \
              -H "Content-Type: application/json" \
              --data-binary "$body")
            echo "### $name"
            echo "- status: $code (want 401 for bad-creds, 400 for malformed; 500 = still broken)"
            echo '- body: `'"$(head -c 200 /tmp/rsp.txt | tr -d '\n')"'`'
          done
        } > probe.md
        cat probe.md

    - name: Post everything to tracking issue 382
      if: always()
      run: |
        {
          echo "# Pi fix D1 auth — $(date -u '+%F %T')Z"
          echo
          echo "Triggered by: ${{ github.actor }} (run ${{ github.run_id }})"
          echo
          cat before.md 2>/dev/null || true
          echo
          cat after.md  2>/dev/null || true
          echo
          cat probe.md  2>/dev/null || true
        } > comment.md
        gh issue comment 382 --repo "${{ github.repository }}" --body-file comment.md
