name: CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        # Requires GitHub Advanced Security (GHAS) — available on public repos or
        # private repos with a GHAS licence. Without it the upload step returns a
        # 403 / "Code scanning is not enabled" error, so we mark it non-fatal and
        # still surface any findings in the log.
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: '/language:${{ matrix.language }}'
