name: CodeQL Security Analysis

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      # CodeQL also covers our Node tooling: audit scripts, Lambda handlers,
      # e2e helpers. Without these, alerts on those files only surface on
      # the weekly Monday scan instead of the commit that introduces them.
      - 'scripts/**'
      - 'lambda/**'
      - 'e2e/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'lambda/**'
      - 'e2e/**'
      - '.github/workflows/codeql.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC

permissions:
  security-events: write
  actions: read
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4

      - name: Perform CodeQL Analysis
        # Requires GitHub Advanced Security (GHAS) — available on public repos or
        # private repos with a GHAS licence. Without it the upload step returns a
        # 403 / "Code scanning is not enabled" error, so we mark it non-fatal and
        # still surface any findings in the log.
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        continue-on-error: true
        with:
          category: '/language:${{ matrix.language }}'
