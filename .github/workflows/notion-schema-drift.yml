name: Notion schema drift

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - "scripts/notion-schema-sync.ts"
      - ".github/workflows/notion-schema-drift.yml"
  schedule:
    # Daily at 06:15 UTC (catches drift introduced via the Notion UI).
    # Spaced 15 min off the Pi TLS Cert Check (which fires every 6h at :30)
    # so the two don't compete for the same runner slot at 06:30.
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: notion-schema-sync --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6 v6.2.0
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-actions
          aws-region: us-east-1

      - name: Fetch NOTION_API_KEY from SSM
        run: |
          KEY=$(aws ssm get-parameter \
            --name /cloudless/production/NOTION_API_KEY \
            --with-decryption \
            --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          echo "NOTION_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run dry-run schema sync
        id: sync
        run: |
          set -o pipefail
          npx tsx --tsconfig scripts/tsconfig.json scripts/notion-schema-sync.ts --dry-run \
            | tee /tmp/sync.out
          # Fail the job if any line starts with "→" (proposed addition)
          if grep -E "^→" /tmp/sync.out >/dev/null; then
            echo
            echo "::error::Notion schema drift detected — apply scripts/notion-schema-sync.ts (or revert local schema changes)"
            exit 1
          fi
