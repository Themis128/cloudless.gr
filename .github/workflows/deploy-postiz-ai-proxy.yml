name: Deploy postiz-ai-proxy Worker

# One-shot workflow: triggered by push to this file.
# Deploys the updated Worker (nemotron-3.5-lightning + thinking path).
# Worker secrets (NVIDIA_API_KEY, PROXY_TOKEN) are already set from the
# previous deploy — wrangler deploy does not reset them.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-postiz-ai-proxy.yml
      - workers/postiz-ai-proxy/**
  # Manual escape hatch — needed when the push trigger doesn't fire
  # or when secrets.CLOUDFLARE_API_TOKEN needs a Workers Scripts:Edit
  # scope bump first (see ensure-cloudflare-ci-token.yml).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Prefer the Workers-scoped deploy token; fall back to the shared CI token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Deploy postiz-ai-proxy Worker
        run: |
          pnpm wrangler deploy --config workers/postiz-ai-proxy/wrangler.jsonc --minify
          echo "✓ postiz-ai-proxy deployed"

      - name: Smoke-test /v1/models (both models present)
        run: |
          RESULT=$(curl -sf https://postiz-ai-proxy.baltzakis-themis.workers.dev/v1/models)
          echo "$RESULT"
          echo "$RESULT" | grep -q "nemotron-3-super-120b" \
            && echo "✓ model present" \
            || (echo "✗ model missing" && exit 1)

      - name: Report result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const outcome = '${{ job.status }}';
            const emoji = outcome === 'success' ? '✅' : '❌';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 382,
                body: `${emoji} **deploy-postiz-ai-proxy** ${outcome}\n\nWorker updated: Postiz captions → \`meta/llama-3.3-70b-instruct\`, chatbot \`?thinking=1\` → \`nvidia/nemotron-3.5-lightning-30b-a3b\` (reasoning stripped before returning).`
              });
            } catch (err) {
              core.warning(`issue comment skipped: ${err.message || err}`);
            }
