name: Deploy postiz-ai-proxy Worker

# Triggered by pushes touching the Worker, or manually.
# Worker secrets (NVIDIA_API_KEY, PROXY_TOKEN) are already set from the
# previous deploy — wrangler deploy does not reset them.
#
# Runs on the omv self-hosted runner: the repo-level CLOUDFLARE_API_TOKEN
# secret lacks Workers Scripts:Edit and Actions-secret writes are restricted,
# so the hosted path kept failing. omv holds a narrow Workers-Scripts-Write-
# only deploy token in the `cloudflare-deploy-token` k8s secret instead
# (minted 2026-09-26; the earlier full CI token stays out of this path).
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-postiz-ai-proxy.yml
      - workers/postiz-ai-proxy/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, omv, pi]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Node 22 (wrangler 4 requirement; system node is v20)
        run: echo "$HOME/.nvm/versions/node/v22.22.3/bin" >> "$GITHUB_PATH"

      - name: Load Cloudflare deploy token (k8s secret on omv)
        run: |
          TOKEN=$(sudo k3s kubectl get secret -n cloudless cloudflare-deploy-token \
            -o jsonpath='{.data.token}' | base64 -d | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::cloudflare-deploy-token secret missing or empty in ns cloudless"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy postiz-ai-proxy Worker
        run: |
          npx -y wrangler@4 deploy --config workers/postiz-ai-proxy/wrangler.jsonc --minify
          echo "✓ postiz-ai-proxy deployed"

      - name: Smoke-test /v1/models (both models present)
        run: |
          RESULT=$(curl -sf https://postiz-ai-proxy.baltzakis-themis.workers.dev/v1/models)
          echo "$RESULT"
          echo "$RESULT" | grep -q "nemotron-3-super-120b" \
            && echo "✓ model present" \
            || (echo "✗ model missing" && exit 1)

      - name: Report result
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const outcome = '${{ job.status }}';
            const emoji = outcome === 'success' ? '✅' : '❌';
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 382,
                body: `${emoji} **deploy-postiz-ai-proxy** ${outcome}\n\nWorker updated: Postiz captions → \`meta/llama-3.3-70b-instruct\`, chatbot \`?thinking=1\` → \`nvidia/nemotron-3.5-lightning-30b-a3b\` (reasoning stripped before returning).`
              });
            } catch (err) {
              core.warning(`issue comment skipped: ${err.message || err}`);
            }
