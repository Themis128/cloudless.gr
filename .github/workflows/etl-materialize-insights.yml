name: 'ETL: Materialize datalake insights'
# Reads gold aggregates (admin-datalake.json) and writes LLM insight snapshots
# under lake/snapshots/insights/*.json. Runs after aggregate materialize.

on:
  schedule:
  - cron: 50 * * * *       # hourly at :50 — after materialize-snapshots (:45)
  workflow_dispatch:
  workflow_run:
    workflows: ['ETL: Materialize datalake snapshots']
    types: [completed]

permissions:
  contents: read

jobs:
  insights:
    name: Materialize datalake insights
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC ||
      '["self-hosted","omv","build"]') }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.3.1

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Install ETL dependencies
      working-directory: scripts/etl
      run: |
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Materialize insights (gold → LLM JSON in R2)
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        CLOUDFLARE_AI_GATEWAY_ID: ${{ secrets.CLOUDFLARE_AI_GATEWAY_ID }}
        ANALYTICS_BUCKET: datalake-bucket
      run: node materialize-datalake-insights.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                text: `:x: ETL: Materialize datalake insights failed (run ${context.runId})`
              })
            }).catch(() => {});
          }
