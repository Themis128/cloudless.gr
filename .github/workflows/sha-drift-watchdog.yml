name: SHA drift watchdog

# Re-triggers the drift detector every 15 min while drift persists.
# When the last drift run is passing, this is a no-op (~10s per tick).
# Stops self-triggering automatically once the detector passes.

on:
  schedule:
  - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  recheck:
    name: recheck-if-drifted
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Re-trigger drift detector if last run failed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check conclusion of most recent completed drift run
        conclusion=$(gh run list \
          --repo "${{ github.repository }}" \
          --workflow sha-drift-detector.yml \
          --status completed \
          --limit 1 \
          --json conclusion \
          --jq '.[0].conclusion // "none"')

        echo "Last drift detector conclusion: $conclusion"

        if [ "$conclusion" != "success" ] && [ "$conclusion" != "none" ]; then
          # Skip if a drift run is already in progress (concurrency group would cancel it)
          in_progress=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow sha-drift-detector.yml \
            --status in_progress \
            --limit 1 \
            --json databaseId \
            --jq 'length')

          if [ "$in_progress" -gt 0 ]; then
            echo "Drift detector already running — skipping trigger."
          else
            echo "Drift detected — triggering re-check."
            gh workflow run sha-drift-detector.yml \
              --repo "${{ github.repository }}"
          fi
        else
          echo "No drift — watchdog idle."
        fi
