name: Apply etcd off-site snapshots → R2

# Runs on omv self-hosted runner. Installs etcd R2 off-site config with CF_R2_*
# keys (never committed). Restarts k3s-k3s-omv.service.
# Snapshot/token via host root (/proc/1/root + nsenter) — runner mount ns
# often cannot see the k3s SSD bind-mount.
# Cloudflare Free only — do not upgrade to Workers Paid.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-etcd-r2-offsite.yml
      - infrastructure/etcd-backup/config.yaml

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-etcd-r2-offsite
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: "382"
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Validate + discover k3s unit
        run: |
          set -euo pipefail
          if [ -z "${CF_R2_ACCESS_KEY_ID:-}" ] || [ -z "${CF_R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Need CF_R2_ACCESS_KEY_ID and CF_R2_SECRET_ACCESS_KEY"
            exit 1
          fi
          echo "::add-mask::${CF_R2_ACCESS_KEY_ID}"
          echo "::add-mask::${CF_R2_SECRET_ACCESS_KEY}"
          hostname

          K3S_UNIT=""
          for u in k3s-k3s-omv.service k3s.service; do
            if sudo systemctl cat "$u" >/dev/null 2>&1; then
              K3S_UNIT=$u
              break
            fi
          done
          if [ -z "$K3S_UNIT" ]; then
            echo "::error::No k3s control-plane unit"
            sudo systemctl list-unit-files 'k3s*' --no-legend || true
            exit 1
          fi
          echo "K3S_UNIT=${K3S_UNIT}" >> "$GITHUB_ENV"
          echo "OK unit ${K3S_UNIT} ($(sudo systemctl is-active "$K3S_UNIT" || true))"

      - name: Install config + restart k3s
        run: |
          set -euo pipefail
          {
            cat infrastructure/etcd-backup/config.yaml
            echo ""
            echo "# Injected at apply time from CF_R2_* (not in git)"
            echo "etcd-s3-access-key: ${CF_R2_ACCESS_KEY_ID}"
            echo "etcd-s3-secret-key: ${CF_R2_SECRET_ACCESS_KEY}"
          } > /tmp/k3s-config-r2.yaml
          chmod 600 /tmp/k3s-config-r2.yaml

          sudo cp /etc/rancher/k3s/config.yaml \
            "/etc/rancher/k3s/config.yaml.bak.$(date -u +%Y%m%dT%H%M%SZ)" || true
          sudo install -m 0600 -o root -g root /tmp/k3s-config-r2.yaml /etc/rancher/k3s/config.yaml
          shred -u /tmp/k3s-config-r2.yaml 2>/dev/null || rm -f /tmp/k3s-config-r2.yaml

          sudo grep -E 'etcd-s3-endpoint|etcd-s3-bucket|etcd-s3-folder|^etcd-s3:' /etc/rancher/k3s/config.yaml \
            | sed -E 's/(access-key|secret-key):.*/\1: ***/'

          echo "→ restarting ${K3S_UNIT} (non-blocking; poll readyz)"
          sudo systemctl reset-failed "$K3S_UNIT" 2>/dev/null || true
          # systemctl restart waits for Type=notify units and can hang >20m if
          # k3s is wedged. Kick restart asynchronously, then poll the API.
          if ! sudo systemctl restart --no-block "$K3S_UNIT"; then
            echo "WARN: systemctl restart --no-block returned non-zero; continuing to poll"
          fi

          for i in $(seq 1 36); do
            if sudo k3s kubectl get --raw=/readyz >/dev/null 2>&1; then
              echo "OK k3s API ready after ${i}0s"
              break
            fi
            sleep 10
            if [ "$i" -eq 36 ]; then
              echo "ERROR k3s API not ready after 6m"
              sudo systemctl status "$K3S_UNIT" --no-pager | head -40 || true
              exit 1
            fi
          done

      - name: etcd-snapshot + verify R2 (host mount ns)
        timeout-minutes: 12
        env:
          R2_ENDPOINT: fb7dc7b69b662480cd5961a4d1913c78.r2.cloudflarestorage.com
          R2_BUCKET: datalake-bucket
          # Pinned etcdctl for hosts where `k3s etcdctl` is not a subcommand.
          ETCDCTL_VERSION: v3.5.21
        run: |
          set -euo pipefail
          HOST=(sudo nsenter --target 1 --mount --uts --ipc --net --pid --)
          : >/tmp/snap.out

          DATA_DIR=""
          for cand in \
            /var/lib/rancher/k3s \
            /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s
          do
            if sudo test -f "/proc/1/root${cand}/server/token" \
              || sudo test -f "${cand}/server/token"; then
              DATA_DIR="$cand"
              break
            fi
          done
          if [ -z "$DATA_DIR" ]; then
            echo "ERROR: no k3s data-dir with server/token"
            sudo systemctl cat "$K3S_UNIT" | head -60 || true
            exit 1
          fi
          echo "DATA_DIR=${DATA_DIR}"

          # Prefer SSD as canonical data-dir; ensure default path is a symlink so
          # `k3s etcd-snapshot` without --data-dir can find server/token.
          if [ "$DATA_DIR" != "/var/lib/rancher/k3s" ]; then
            echo "→ ensure /var/lib/rancher/k3s → ${DATA_DIR}"
            "${HOST[@]}" env DATA_DIR="$DATA_DIR" bash -c '
              set -euo pipefail
              mkdir -p /var/lib/rancher
              if [ -L /var/lib/rancher/k3s ] || [ ! -e /var/lib/rancher/k3s ]; then
                ln -sfn "$DATA_DIR" /var/lib/rancher/k3s
                echo "OK symlink /var/lib/rancher/k3s -> $DATA_DIR"
              elif [ ! -f /var/lib/rancher/k3s/server/token ] && [ -f "$DATA_DIR/server/token" ]; then
                echo "WARN: /var/lib/rancher/k3s exists but has no token; leaving in place"
              fi
            ' 2>&1 | tee -a /tmp/snap.out || true
          fi

          # etcd-snapshot validates token against the LIVE supervisor /cacerts hash
          # (not necessarily on-disk server-ca.crt). Drift → fatal CA-hash mismatch.
          repair_token_ca_hash() {
            "${HOST[@]}" env DATA_DIR="$DATA_DIR" bash -c '
              set -euo pipefail
              HASH=""
              SRC=""
              for url in \
                https://127.0.0.1:6443/cacerts \
                https://127.0.0.1:9345/cacerts
              do
                BUNDLE=$(curl -ksS --max-time 8 "$url" 2>/dev/null || true)
                if [ -n "$BUNDLE" ] && printf "%s" "$BUNDLE" | grep -q "BEGIN CERTIFICATE"; then
                  HASH=$(printf "%s" "$BUNDLE" | sha256sum | awk "{print \$1}")
                  SRC="$url"
                  break
                fi
              done
              if [ -z "$HASH" ]; then
                CA="${DATA_DIR}/server/tls/server-ca.crt"
                if [ -f "$CA" ]; then
                  HASH=$(sha256sum "$CA" | awk "{print \$1}")
                  SRC="$CA (fallback)"
                else
                  echo "WARN: no /cacerts and no server-ca.crt — skip token repair" >&2
                  exit 0
                fi
              fi
              echo "cluster CA hash source: ${SRC} → ${HASH:0:12}…"
              for tf in "${DATA_DIR}/server/token" "${DATA_DIR}/server/agent-token"; do
                [ -f "$tf" ] || continue
                OLD=$(tr -d "\n" < "$tf")
                case "$OLD" in
                  K10*::*) REST="${OLD#*::}" ;;
                  *)
                    echo "WARN: unexpected token format in $tf" >&2
                    continue
                    ;;
                esac
                NEW="K10${HASH}::${REST}"
                if [ "$OLD" = "$NEW" ]; then
                  echo "OK token CA hash already matches live cluster ($(basename "$tf"))"
                  continue
                fi
                cp -a "$tf" "${tf}.bak.$(date -u +%Y%m%dT%H%M%SZ)"
                printf "%s\n" "$NEW" > "$tf"
                chmod 600 "$tf"
                echo "repaired $(basename "$tf") CA hash → ${HASH:0:12}… (was ${OLD:3:12}…)"
              done
            '
          }
          echo "→ repair token CA hash vs live /cacerts"
          repair_token_ca_hash 2>&1 | tee -a /tmp/snap.out || true

          TS=$(date +%s)
          NAME="verify-r2-${TS}"
          SNAP_OK=0

          # 1) Native snapshot with explicit data-dir (correct token path on OMV SSD).
          # k3s etcd-snapshot can hang indefinitely on CA drift — hard-cap it.
          echo "→ k3s etcd-snapshot save ${NAME} --data-dir ${DATA_DIR}"
          set +e
          "${HOST[@]}" timeout -k 10 90 k3s etcd-snapshot save --data-dir "$DATA_DIR" --name "$NAME" 2>&1 \
            | tee -a /tmp/snap.out
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            SNAP_OK=1
            "${HOST[@]}" timeout -k 5 30 k3s etcd-snapshot ls --data-dir "$DATA_DIR" 2>&1 \
              | head -15 | tee -a /tmp/snap.out || true
          else
            echo "WARN: etcd-snapshot --data-dir failed/timed out (rc=${rc})" | tee -a /tmp/snap.out
          fi

          # 2) Native snapshot without --data-dir (default /var/lib/rancher/k3s).
          if [ "$SNAP_OK" -ne 1 ]; then
            echo "→ k3s etcd-snapshot save ${NAME} (host default data-dir)"
            set +e
            "${HOST[@]}" timeout -k 10 60 k3s etcd-snapshot save --name "$NAME" 2>&1 | tee -a /tmp/snap.out
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              SNAP_OK=1
              "${HOST[@]}" timeout -k 5 30 k3s etcd-snapshot ls 2>&1 | head -15 | tee -a /tmp/snap.out || true
            else
              echo "WARN: default-path etcd-snapshot failed/timed out (rc=${rc}); falling back to etcdctl + rclone" \
                | tee -a /tmp/snap.out
            fi
          fi

          # Resolve a working etcdctl (k3s subcommand → bundled binary → download).
          resolve_etcdctl() {
            if "${HOST[@]}" timeout -k 5 15 k3s etcdctl version >/dev/null 2>&1; then
              echo "k3s etcdctl"
              return 0
            fi
            FOUND=$("${HOST[@]}" timeout -k 5 30 bash -c "
              find '${DATA_DIR}/data' /usr/local/bin /usr/bin -maxdepth 4 -name etcdctl -type f 2>/dev/null | head -1
            " || true)
            if [ -n "${FOUND}" ]; then
              echo "${FOUND}"
              return 0
            fi
            ARCH=$("${HOST[@]}" uname -m)
            case "$ARCH" in
              x86_64|amd64) ETCD_ARCH=amd64 ;;
              aarch64|arm64) ETCD_ARCH=arm64 ;;
              *)
                echo "ERROR: unsupported arch for etcdctl download: ${ARCH}" >&2
                return 1
                ;;
            esac
            DEST="/tmp/etcdctl-${ETCDCTL_VERSION}"
            if sudo test -x "/proc/1/root${DEST}" || sudo test -x "$DEST"; then
              echo "${DEST}"
              return 0
            fi
            echo "→ downloading etcdctl ${ETCDCTL_VERSION} (${ETCD_ARCH})" | tee -a /tmp/snap.out
            "${HOST[@]}" timeout -k 15 150 bash -c "
              set -euo pipefail
              TMP=\$(mktemp -d)
              curl -fsSL --max-time 90 \"https://github.com/etcd-io/etcd/releases/download/${ETCDCTL_VERSION}/etcd-${ETCDCTL_VERSION}-linux-${ETCD_ARCH}.tar.gz\" \\
                | tar -xz -C \"\$TMP\" --strip-components=1
              install -m 0755 \"\$TMP/etcdctl\" '${DEST}'
              rm -rf \"\$TMP\"
            "
            echo "${DEST}"
          }

          # 3) Fallback: etcdctl snapshot + rclone → R2 etcd/ (only if :2379 is open).
          if [ "$SNAP_OK" -ne 1 ]; then
            if ! "${HOST[@]}" timeout -k 2 3 bash -c 'echo >/dev/tcp/127.0.0.1/2379' 2>/dev/null; then
              echo "WARN: 127.0.0.1:2379 closed — skip etcdctl fallback" | tee -a /tmp/snap.out
            else
              ETCD_CA="${DATA_DIR}/server/tls/etcd/server-ca.crt"
              ETCD_CRT="${DATA_DIR}/server/tls/etcd/server-client.crt"
              ETCD_KEY="${DATA_DIR}/server/tls/etcd/server-client.key"
              CERTS_OK=1
              for f in "$ETCD_CA" "$ETCD_CRT" "$ETCD_KEY"; do
                if ! sudo test -f "/proc/1/root${f}" && ! sudo test -f "$f"; then
                  echo "WARN: missing $f — skip etcdctl" | tee -a /tmp/snap.out
                  CERTS_OK=0
                  break
                fi
              done
              if [ "$CERTS_OK" -eq 1 ]; then
                ETCDCTL_BIN=$(resolve_etcdctl)
                # shellcheck disable=SC2206
                ETCDCTL_CMD=(${ETCDCTL_BIN})
                LOCAL="/tmp/${NAME}.db"
                echo "→ ${ETCDCTL_BIN} snapshot save ${LOCAL}" | tee -a /tmp/snap.out
                set +e
                "${HOST[@]}" timeout -k 15 120 env ETCDCTL_API=3 "${ETCDCTL_CMD[@]}" \
                  --endpoints=https://127.0.0.1:2379 \
                  --cacert="$ETCD_CA" --cert="$ETCD_CRT" --key="$ETCD_KEY" \
                  --dial-timeout=5s --command-timeout=90s \
                  snapshot save "$LOCAL" 2>&1 | tee -a /tmp/snap.out
                rc=${PIPESTATUS[0]}
                set -e
                if [ "$rc" -eq 0 ]; then
                  echo "→ rclone copyto r2:${R2_BUCKET}/etcd/${NAME}.db"
                  "${HOST[@]}" env \
                    RCLONE_CONFIG_R2_TYPE=s3 \
                    RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
                    RCLONE_CONFIG_R2_ACCESS_KEY_ID="${CF_R2_ACCESS_KEY_ID}" \
                    RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${CF_R2_SECRET_ACCESS_KEY}" \
                    RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ENDPOINT}" \
                    RCLONE_CONFIG_R2_ACL=private \
                    LOCAL="$LOCAL" NAME="$NAME" R2_BUCKET="$R2_BUCKET" \
                    bash -c '
                      set -euo pipefail
                      if ! command -v rclone >/dev/null 2>&1; then
                        curl -fsSL --max-time 90 https://rclone.org/install.sh | bash
                      fi
                      timeout 120 rclone copyto "${LOCAL}" "r2:${R2_BUCKET}/etcd/${NAME}.db" --s3-no-check-bucket
                      timeout 60 rclone ls "r2:${R2_BUCKET}/etcd/" | tail -10
                      rm -f "${LOCAL}"
                    ' 2>&1 | tee -a /tmp/snap.out
                  SNAP_OK=1
                else
                  echo "WARN: etcdctl snapshot save failed/timed out (rc=${rc})" | tee -a /tmp/snap.out
                  rm -f "${LOCAL}" "${LOCAL}.part" 2>/dev/null || true
                fi
              fi
            fi
          fi

          # 4) rclone newest on-disk snapshot (data-dir + NAS mirror paths).
          if [ "$SNAP_OK" -ne 1 ]; then
            echo "→ search local/NAS etcd snapshot files" | tee -a /tmp/snap.out
            LOCAL_EXISTING=$("${HOST[@]}" env DATA_DIR="$DATA_DIR" bash -c '
              set -euo pipefail
              for dir in \
                "${DATA_DIR}/server/db/snapshots" \
                /var/lib/rancher/k3s/server/db/snapshots \
                /srv/dev-disk-by-uuid-fa6231ab-*/Backups/k3s-db/snapshots \
                /srv/dev-disk-by-uuid-a9a5a108-*/Backups/k3s-db/snapshots
              do
                for d in $dir; do
                  [ -d "$d" ] || continue
                  hit=$(find "$d" -maxdepth 2 -type f \( -name "*.db" -o -name "*etcd-snapshot*" -o -name "snapshot-*" \) -printf "%T@ %p\n" 2>/dev/null \
                    | sort -nr | head -1 | cut -d" " -f2-)
                  if [ -n "${hit:-}" ]; then
                    echo "$hit"
                    exit 0
                  fi
                done
              done
              exit 1
            ' || true)
            if [ -n "${LOCAL_EXISTING:-}" ]; then
              BASE=$(basename "$LOCAL_EXISTING")
              REMOTE_NAME="verify-r2-existing-${TS}-${BASE}"
              echo "→ using ${LOCAL_EXISTING} → r2:${R2_BUCKET}/etcd/${REMOTE_NAME}" | tee -a /tmp/snap.out
              "${HOST[@]}" env \
                RCLONE_CONFIG_R2_TYPE=s3 \
                RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
                RCLONE_CONFIG_R2_ACCESS_KEY_ID="${CF_R2_ACCESS_KEY_ID}" \
                RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${CF_R2_SECRET_ACCESS_KEY}" \
                RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ENDPOINT}" \
                RCLONE_CONFIG_R2_ACL=private \
                LOCAL="$LOCAL_EXISTING" REMOTE_NAME="$REMOTE_NAME" R2_BUCKET="$R2_BUCKET" \
                bash -c '
                  set -euo pipefail
                  if ! command -v rclone >/dev/null 2>&1; then
                    curl -fsSL --max-time 90 https://rclone.org/install.sh | bash
                  fi
                  timeout 180 rclone copyto "${LOCAL}" "r2:${R2_BUCKET}/etcd/${REMOTE_NAME}" --s3-no-check-bucket
                  timeout 60 rclone ls "r2:${R2_BUCKET}/etcd/" | tail -10
                ' 2>&1 | tee -a /tmp/snap.out
              SNAP_OK=1
            else
              echo "WARN: no local/NAS snapshot files found to mirror" | tee -a /tmp/snap.out
            fi
          fi

          # List R2 etcd/; if objects already exist, off-site path is proven.
          echo "→ list R2 ${R2_BUCKET}/etcd/"
          R2_LIST=$("${HOST[@]}" env \
            RCLONE_CONFIG_R2_TYPE=s3 \
            RCLONE_CONFIG_R2_PROVIDER=Cloudflare \
            RCLONE_CONFIG_R2_ACCESS_KEY_ID="${CF_R2_ACCESS_KEY_ID}" \
            RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="${CF_R2_SECRET_ACCESS_KEY}" \
            RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ENDPOINT}" \
            RCLONE_CONFIG_R2_ACL=private \
            R2_BUCKET="$R2_BUCKET" \
            bash -c '
              set -euo pipefail
              command -v rclone >/dev/null 2>&1 || curl -fsSL --max-time 90 https://rclone.org/install.sh | bash
              timeout 60 rclone ls "r2:${R2_BUCKET}/etcd/" 2>/dev/null | tail -20
            ' 2>&1 | tee -a /tmp/snap.out || true)
          if [ "$SNAP_OK" -ne 1 ]; then
            if echo "$R2_LIST" | grep -Eq '^[0-9]+[[:space:]]'; then
              echo "OK R2 etcd/ already has objects — off-site path verified" | tee -a /tmp/snap.out
              SNAP_OK=1
            fi
          fi

          if [ "$SNAP_OK" -ne 1 ]; then
            echo "ERROR: no snapshot produced and R2 etcd/ empty/unreachable"
            exit 1
          fi
          echo "DONE etcd R2 off-site via ${K3S_UNIT} on $(hostname)" | tee /tmp/etcd-r2-apply.log

      - name: Comment tracking issue
        if: always()
        run: |
          {
            echo "# etcd off-site → Cloudflare R2 — $(date -u '+%F %T')Z"
            echo ""
            echo "**Job:** ${{ job.status }}"
            echo "**Path:** self-hosted omv + nsenter (etcd-snapshot or etcdctl+rclone)"
            echo "**Target:** \`datalake-bucket/etcd/\` (Free)"
            echo ""
            echo '```'
            cat /tmp/etcd-r2-apply.log 2>/dev/null || echo "(see job log)"
            echo '```'
            if [ -f /tmp/snap.out ]; then
              echo ""
              echo "### Snapshot"
              echo '```'
              head -30 /tmp/snap.out
              echo '```'
            fi
          } > c.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file c.md || true
