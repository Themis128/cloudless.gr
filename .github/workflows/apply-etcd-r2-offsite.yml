name: Apply etcd off-site snapshots → R2

# GH-hosted + Tailscale SSH to omv. Installs etcd R2 off-site config with
# CF_R2_* keys (never committed). Restarts OMV unit k3s-k3s-omv.service.
# Cloudflare Free only — do not upgrade to Workers Paid.
#
# Why SSH (not the omv self-hosted runner): the runner mount namespace often
# cannot see /var/lib/rancher/k3s (bind-mounted SSD); host SSH can.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-etcd-r2-offsite.yml
      - infrastructure/etcd-backup/config.yaml

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-etcd-r2-offsite
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: "382"
      PI_HOST: 100.74.191.58
      PI_USER: tbaltzakis
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Validate secrets
        run: |
          set -euo pipefail
          if [ -z "${CF_R2_ACCESS_KEY_ID:-}" ] || [ -z "${CF_R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Need CF_R2_ACCESS_KEY_ID and CF_R2_SECRET_ACCESS_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.OMV_SSH_KEY }}" ]; then
            echo "::error::Need OMV_SSH_KEY"
            exit 1
          fi
          echo "::add-mask::${CF_R2_ACCESS_KEY_ID}"
          echo "::add-mask::${CF_R2_SECRET_ACCESS_KEY}"
          echo "OK secrets present"

      - name: Connect to tailnet
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.OMV_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install config + restart k3s-k3s-omv + snapshot
        env:
          R2_AK: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SK: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          {
            cat infrastructure/etcd-backup/config.yaml
            echo ""
            echo "# Injected at apply time from CF_R2_* (not in git)"
            echo "etcd-s3-access-key: ${R2_AK}"
            echo "etcd-s3-secret-key: ${R2_SK}"
          } > /tmp/k3s-config-r2.yaml
          chmod 600 /tmp/k3s-config-r2.yaml

          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            /tmp/k3s-config-r2.yaml "$PI_USER@$PI_HOST:/tmp/k3s-config-r2.yaml"
          shred -u /tmp/k3s-config-r2.yaml 2>/dev/null || rm -f /tmp/k3s-config-r2.yaml

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$PI_USER@$PI_HOST" bash <<'REMOTE' 2>&1 | tee /tmp/etcd-r2-apply.log
          set -euo pipefail
          hostname

          # OMV packages control plane as k3s-k3s-omv.service (not k3s.service).
          K3S_UNIT=""
          for u in k3s-k3s-omv.service k3s.service; do
            if sudo systemctl cat "$u" >/dev/null 2>&1; then
              K3S_UNIT=$u
              break
            fi
          done
          if [ -z "$K3S_UNIT" ]; then
            echo "ERROR: no k3s control-plane unit"
            sudo systemctl list-unit-files 'k3s*' --no-legend || true
            exit 1
          fi
          echo "K3S_UNIT=$K3S_UNIT"

          sudo cp /etc/rancher/k3s/config.yaml \
            "/etc/rancher/k3s/config.yaml.bak.$(date -u +%Y%m%dT%H%M%SZ)" || true
          sudo install -m 0600 -o root -g root /tmp/k3s-config-r2.yaml /etc/rancher/k3s/config.yaml
          shred -u /tmp/k3s-config-r2.yaml 2>/dev/null || rm -f /tmp/k3s-config-r2.yaml

          sudo grep -E 'etcd-s3-endpoint|etcd-s3-bucket|etcd-s3-folder|^etcd-s3:' /etc/rancher/k3s/config.yaml \
            | sed -E 's/(access-key|secret-key):.*/\1: ***/'

          echo "→ restarting $K3S_UNIT"
          sudo systemctl reset-failed "$K3S_UNIT" 2>/dev/null || true
          sudo systemctl restart "$K3S_UNIT"

          for i in $(seq 1 36); do
            if sudo k3s kubectl get --raw=/readyz >/dev/null 2>&1; then
              echo "OK k3s API ready after ${i}0s"
              break
            fi
            sleep 10
            if [ "$i" -eq 36 ]; then
              echo "ERROR k3s API not ready after 6m"
              sudo systemctl status "$K3S_UNIT" --no-pager | head -40 || true
              exit 1
            fi
          done

          # Resolve token / data-dir (bind mount or SSD path)
          TOKEN=""
          for cand in \
            /var/lib/rancher/k3s/server/token \
            /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/server/token
          do
            if sudo test -f "$cand"; then
              TOKEN=$cand
              break
            fi
          done
          if [ -z "$TOKEN" ]; then
            echo "ERROR: server token not found"
            sudo ls -la /var/lib/rancher/k3s/ 2>&1 | head -20 || true
            sudo ls -la /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/server/ 2>&1 | head -20 || true
            sudo systemctl cat "$K3S_UNIT" | head -60 || true
            exit 1
          fi
          echo "OK token at $TOKEN"
          DATA_DIR=$(dirname "$(dirname "$TOKEN")")
          echo "DATA_DIR=$DATA_DIR"

          TS=$(date +%s)
          echo "→ etcd-snapshot save verify-r2-${TS}"
          sudo k3s etcd-snapshot save --data-dir "$DATA_DIR" --name "verify-r2-${TS}"
          sudo k3s etcd-snapshot ls --data-dir "$DATA_DIR" | head -15
          echo "DONE etcd R2 off-site via $K3S_UNIT on $(hostname)"
          REMOTE

      - name: Comment tracking issue
        if: always()
        run: |
          {
            echo "# etcd off-site → Cloudflare R2 — $(date -u '+%F %T')Z"
            echo ""
            echo "**Job:** ${{ job.status }}"
            echo "**Path:** GH-hosted → Tailscale SSH → omv"
            echo "**Target:** \`datalake-bucket/etcd/\` (Free)"
            echo ""
            echo '```'
            cat /tmp/etcd-r2-apply.log 2>/dev/null || echo "(see job log)"
            echo '```'
          } > c.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file c.md || true
