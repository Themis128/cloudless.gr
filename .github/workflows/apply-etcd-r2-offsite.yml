name: Apply etcd off-site snapshots → R2

# Runs on omv self-hosted runner. Installs etcd R2 off-site config with CF_R2_*
# keys (never committed). Restarts k3s-k3s-omv.service.
# Uses nsenter -t 1 -m so bind-mounted k3s data on the host SSD is visible
# (the Actions runner mount namespace often cannot see /var/lib/rancher/k3s).
# Cloudflare Free only — do not upgrade to Workers Paid.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-etcd-r2-offsite.yml
      - infrastructure/etcd-backup/config.yaml

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-etcd-r2-offsite
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: "382"
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Validate + discover k3s unit
        run: |
          set -euo pipefail
          if [ -z "${CF_R2_ACCESS_KEY_ID:-}" ] || [ -z "${CF_R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Need CF_R2_ACCESS_KEY_ID and CF_R2_SECRET_ACCESS_KEY"
            exit 1
          fi
          echo "::add-mask::${CF_R2_ACCESS_KEY_ID}"
          echo "::add-mask::${CF_R2_SECRET_ACCESS_KEY}"
          hostname

          HOST=(sudo nsenter --target 1 --mount --uts --ipc --net --pid --)

          K3S_UNIT=""
          for u in k3s-k3s-omv.service k3s.service; do
            if "${HOST[@]}" systemctl cat "$u" >/dev/null 2>&1; then
              K3S_UNIT=$u
              break
            fi
          done
          if [ -z "$K3S_UNIT" ]; then
            echo "::error::No k3s control-plane unit on host"
            "${HOST[@]}" systemctl list-unit-files 'k3s*' --no-legend || true
            exit 1
          fi
          echo "K3S_UNIT=${K3S_UNIT}" >> "$GITHUB_ENV"
          echo "OK unit ${K3S_UNIT} ($("${HOST[@]}" systemctl is-active "$K3S_UNIT" || true))"

      - name: Install config + restart + snapshot (host mount ns)
        run: |
          set -euo pipefail
          HOST=(sudo nsenter --target 1 --mount --uts --ipc --net --pid --)

          {
            cat infrastructure/etcd-backup/config.yaml
            echo ""
            echo "# Injected at apply time from CF_R2_* (not in git)"
            echo "etcd-s3-access-key: ${CF_R2_ACCESS_KEY_ID}"
            echo "etcd-s3-secret-key: ${CF_R2_SECRET_ACCESS_KEY}"
          } > /tmp/k3s-config-r2.yaml
          chmod 600 /tmp/k3s-config-r2.yaml

          cat > /tmp/apply-etcd-r2-host.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          K3S_UNIT="$1"

          cp /etc/rancher/k3s/config.yaml \
            "/etc/rancher/k3s/config.yaml.bak.$(date -u +%Y%m%dT%H%M%SZ)" || true
          install -m 0600 -o root -g root /tmp/k3s-config-r2.yaml /etc/rancher/k3s/config.yaml
          shred -u /tmp/k3s-config-r2.yaml 2>/dev/null || rm -f /tmp/k3s-config-r2.yaml

          grep -E 'etcd-s3-endpoint|etcd-s3-bucket|etcd-s3-folder|^etcd-s3:' /etc/rancher/k3s/config.yaml \
            | sed -E 's/(access-key|secret-key):.*/\1: ***/'

          echo "→ restarting ${K3S_UNIT}"
          systemctl reset-failed "${K3S_UNIT}" 2>/dev/null || true
          systemctl restart "${K3S_UNIT}"

          for i in $(seq 1 36); do
            if k3s kubectl get --raw=/readyz >/dev/null 2>&1; then
              echo "OK k3s API ready after ${i}0s"
              break
            fi
            sleep 10
            if [ "$i" -eq 36 ]; then
              echo "ERROR k3s API not ready after 6m"
              systemctl status "${K3S_UNIT}" --no-pager | head -40 || true
              exit 1
            fi
          done

          TOKEN=""
          for cand in \
            /var/lib/rancher/k3s/server/token \
            /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/server/token
          do
            if test -f "$cand"; then
              TOKEN=$cand
              break
            fi
          done
          if [ -z "$TOKEN" ]; then
            echo "ERROR: server token not found in host mount ns"
            ls -la /var/lib/rancher/k3s/ 2>&1 | head -20 || true
            ls -la /srv/dev-disk-by-uuid-a9a5a108-8095-4b7b-8011-716889995cd7/k3s/server/ 2>&1 | head -20 || true
            find /var/lib/rancher /srv/dev-disk-by-uuid-a9a5a108* -name token 2>/dev/null | head -10 || true
            systemctl cat "${K3S_UNIT}" | head -40 || true
            exit 1
          fi
          echo "OK token at $TOKEN"
          DATA_DIR=$(dirname "$(dirname "$TOKEN")")
          echo "DATA_DIR=$DATA_DIR"

          TS=$(date +%s)
          echo "→ etcd-snapshot save verify-r2-${TS}"
          k3s etcd-snapshot save --data-dir "$DATA_DIR" --name "verify-r2-${TS}"
          k3s etcd-snapshot ls --data-dir "$DATA_DIR" | head -15
          echo "DONE etcd R2 off-site via ${K3S_UNIT} on $(hostname)"
          SCRIPT
          chmod 700 /tmp/apply-etcd-r2-host.sh

          # Push files into PID 1 mount namespace (/tmp may be private on runner)
          "${HOST[@]}" bash -c 'cat > /tmp/k3s-config-r2.yaml && chmod 600 /tmp/k3s-config-r2.yaml' \
            < /tmp/k3s-config-r2.yaml
          "${HOST[@]}" bash -c 'cat > /tmp/apply-etcd-r2-host.sh && chmod 700 /tmp/apply-etcd-r2-host.sh' \
            < /tmp/apply-etcd-r2-host.sh
          shred -u /tmp/k3s-config-r2.yaml /tmp/apply-etcd-r2-host.sh 2>/dev/null \
            || rm -f /tmp/k3s-config-r2.yaml /tmp/apply-etcd-r2-host.sh

          "${HOST[@]}" /tmp/apply-etcd-r2-host.sh "$K3S_UNIT" 2>&1 | tee /tmp/etcd-r2-apply.log
          "${HOST[@]}" rm -f /tmp/apply-etcd-r2-host.sh || true

      - name: Comment tracking issue
        if: always()
        run: |
          {
            echo "# etcd off-site → Cloudflare R2 — $(date -u '+%F %T')Z"
            echo ""
            echo "**Job:** ${{ job.status }}"
            echo "**Path:** self-hosted omv + nsenter host mount"
            echo "**Target:** \`datalake-bucket/etcd/\` (Free)"
            echo ""
            echo '```'
            cat /tmp/etcd-r2-apply.log 2>/dev/null || echo "(see job log)"
            echo '```'
          } > c.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file c.md || true
