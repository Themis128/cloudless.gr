name: Apply etcd off-site snapshots → R2

# Runs ON the omv Pi runner (no SSH hop). Installs etcd R2 off-site config
# with CF_R2_* keys. Never commits keys. Restarts k3s.service briefly.
# Cloudflare Free only — do not upgrade to Workers Paid.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-etcd-r2-offsite.yml
      - infrastructure/etcd-backup/config.yaml

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-etcd-r2-offsite
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apply:
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: "382"
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Validate R2 secrets + k3s.service
        run: |
          set -euo pipefail
          if [ -z "${CF_R2_ACCESS_KEY_ID:-}" ] || [ -z "${CF_R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Need CF_R2_ACCESS_KEY_ID and CF_R2_SECRET_ACCESS_KEY"
            exit 1
          fi
          echo "::add-mask::${CF_R2_ACCESS_KEY_ID}"
          echo "::add-mask::${CF_R2_SECRET_ACCESS_KEY}"
          echo "OK R2 secrets present"
          hostname
          # Exact unit only — never awk /^k3s/ (matches k3s-etcd-defrag, mirror, …)
          if ! sudo systemctl cat k3s.service >/dev/null 2>&1; then
            echo "::error::k3s.service not found on $(hostname)"
            sudo systemctl list-unit-files 'k3s*' --no-legend || true
            exit 1
          fi
          echo "OK k3s.service present"
          sudo systemctl is-active k3s || true
          sudo ls -la /var/lib/rancher/k3s/server/token 2>&1 | head -3 || true
          command -v k3s

      - name: Install config + restart k3s
        run: |
          set -euo pipefail
          {
            cat infrastructure/etcd-backup/config.yaml
            echo ""
            echo "# Injected at apply time from CF_R2_* (not in git)"
            echo "etcd-s3-access-key: ${CF_R2_ACCESS_KEY_ID}"
            echo "etcd-s3-secret-key: ${CF_R2_SECRET_ACCESS_KEY}"
          } > /tmp/k3s-config-r2.yaml
          chmod 600 /tmp/k3s-config-r2.yaml

          sudo cp /etc/rancher/k3s/config.yaml \
            "/etc/rancher/k3s/config.yaml.bak.$(date -u +%Y%m%dT%H%M%SZ)" || true
          sudo install -m 0600 -o root -g root /tmp/k3s-config-r2.yaml /etc/rancher/k3s/config.yaml
          shred -u /tmp/k3s-config-r2.yaml 2>/dev/null || rm -f /tmp/k3s-config-r2.yaml

          sudo grep -E 'etcd-s3-endpoint|etcd-s3-bucket|etcd-s3-folder|^etcd-s3:' /etc/rancher/k3s/config.yaml \
            | sed -E 's/(access-key|secret-key):.*/\1: ***/'

          echo "→ restarting k3s.service (not k3s-* helpers)"
          sudo systemctl reset-failed k3s 2>/dev/null || true
          sudo systemctl restart k3s

          for i in $(seq 1 36); do
            if sudo k3s kubectl get --raw=/readyz >/dev/null 2>&1; then
              echo "OK k3s API ready after ${i}0s"
              break
            fi
            sleep 10
            if [ "$i" -eq 36 ]; then
              echo "ERROR k3s API not ready after 6m"
              sudo systemctl status k3s --no-pager | head -40 || true
              sudo journalctl -u k3s -n 40 --no-pager || true
              exit 1
            fi
          done

          if ! sudo test -f /var/lib/rancher/k3s/server/token; then
            echo "::error::Missing /var/lib/rancher/k3s/server/token after restart"
            sudo ls -la /var/lib/rancher/k3s/server/ 2>&1 | head -20 || true
            sudo readlink -f /var/lib/rancher/k3s/server 2>&1 || true
            exit 1
          fi

          TS=$(date +%s)
          echo "→ etcd-snapshot save verify-r2-${TS}"
          sudo k3s etcd-snapshot save --name "verify-r2-${TS}" 2>&1 | tee /tmp/snap.out
          sudo k3s etcd-snapshot ls 2>&1 | head -15
          echo "DONE etcd R2 off-site config applied on $(hostname)" | tee /tmp/etcd-r2-apply.log

      - name: Comment tracking issue
        if: always()
        run: |
          {
            echo "# etcd off-site → Cloudflare R2 — $(date -u '+%F %T')Z"
            echo ""
            echo "**Job:** ${{ job.status }}"
            echo "**Runner:** self-hosted omv/pi"
            echo "**Target:** \`datalake-bucket/etcd/\` (Free)"
            echo ""
            echo '```'
            cat /tmp/etcd-r2-apply.log 2>/dev/null || echo "(see job log)"
            echo '```'
            if [ -f /tmp/snap.out ]; then
              echo ""
              echo "### Snapshot"
              echo '```'
              head -20 /tmp/snap.out
              echo '```'
            fi
          } > c.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file c.md || true
