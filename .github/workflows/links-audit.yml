name: Broken Links Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches: [main]
    paths:
    - '**/*.md'
    - docs/**
    - README.md
      # Self-reference only — markdown changes already match **/*.md above,
      # so editing unrelated workflows need not re-run the link checker.
    - .github/workflows/links-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel earlier in-flight runs for the same branch on a new push. The PR
  # only cares about the latest commit, so older queued runs are wasted.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Markdown Link Checker
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v6
    - name: Check links
      uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411         # v2
      with:
        args: >-
          --verbose
          --no-progress
          --accept 200,206,301,302,303,307,308,400,401,403,405,429,503
          --exclude "^https://claude\.ai/code/routines"
          --exclude "^https://hooks\.slack\.com/"
          --exclude "^https://[a-zA-Z0-9-]+\.ngrok-free\.app"
          --exclude "^https://[a-zA-Z0-9-]+\.ngrok\.io"
          --exclude "^https://abc123\."
          --exclude "^http://localhost"
          --exclude "^https://cloudless\.online"
          --exclude "^https://postiz\.cloudless\.gr"
          --exclude "\.\.\."
          --exclude "^https?://[^@]+@.*\.ingest\.sentry\.io"
          --exclude "^https?://.*\.api-us1\.com"
          --exclude "^https?://www\.linkedin\.com"
          --exclude "^https://github\.com/cloudless-gr"
          --exclude "^https://github\.com/.*/settings"
          --exclude "^https://www\.notion\.so/[0-9a-f]"
          --exclude "^https://photos\.google\.com/settings"
          --exclude "modelcontextprotocol\.io/docs/security"
          "README.md"
          "docs/**/*.md"
          ".github/**/*.md"
        fail: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
