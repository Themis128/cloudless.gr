name: Fix health-check log path (permission denied)

# The health-check cron job on omv writes to /var/log/health-check-cloudless.log
# but tbaltzakis doesn't own that file → "Permission denied".
# Fix: rewrite the script to use ~/logs/ (no sudo needed, survives reboots).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - .github/workflows/fix-health-check-log-path.yml

permissions:
  contents: read
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PI_HOST: 100.74.191.58
      PI_USER: tbaltzakis
      KUBECMD: sudo kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    steps:
    - uses: actions/checkout@v4

    - name: Connect to tailnet
      uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3         # v3.2.4
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
        tags: tag:k8s

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.OMV_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        echo "SSH key configured for $PI_USER@$PI_HOST"

    - name: Write pod manifest
      run: |
        cat > /tmp/fix-pod.yaml << 'EOF'
        apiVersion: v1
        kind: Pod
        metadata:
          name: fix-health-log
          namespace: default
        spec:
          nodeSelector:
            kubernetes.io/hostname: omv
          hostPID: true
          hostNetwork: true
          restartPolicy: Never
          volumes:
            - name: home
              hostPath:
                path: /home/tbaltzakis
            - name: scripts
              hostPath:
                path: /usr/local/bin
          containers:
            - name: w
              image: alpine:3
              securityContext:
                privileged: true
              volumeMounts:
                - name: home
                  mountPath: /host-home
                - name: scripts
                  mountPath: /host-bin
              command: [sh, -c]
              args:
                - |
                  set -e
                  SCRIPT=/host-bin/health-check-cloudless.sh
                  USERLOG=/host-home/logs/health-check-cloudless.log
                  mkdir -p /host-home/logs
                  touch "$USERLOG"
                  if [ -f "$SCRIPT" ]; then
                    if grep -q '/var/log/health-check-cloudless' "$SCRIPT"; then
                      sed -i 's|/var/log/health-check-cloudless\.log|/home/tbaltzakis/logs/health-check-cloudless.log|g' "$SCRIPT"
                      echo "PATCHED: log path updated to ~/logs/"
                    else
                      echo "INFO: script already uses correct path"
                      grep "health-check-cloudless.log" "$SCRIPT" | head -3
                    fi
                  else
                    echo "WARN: $SCRIPT not found"
                  fi
                  echo "=== Log file ===" && ls -la "$USERLOG"
                  echo "DONE"
        EOF

    - name: Fix log path on omv
      run: |
        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$PI_USER@$PI_HOST" \
          "$KUBECMD delete pod fix-health-log -n default --ignore-not-found --wait=true" 2>&1 || true

        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$PI_USER@$PI_HOST" \
          "$KUBECMD create -f -" < /tmp/fix-pod.yaml 2>&1

        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$PI_USER@$PI_HOST" \
          "$KUBECMD wait --for=jsonpath='{.status.phase}'=Succeeded pod/fix-health-log -n default --timeout=60s" 2>&1

        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$PI_USER@$PI_HOST" \
          "$KUBECMD logs -n default fix-health-log" 2>&1

        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
          "$PI_USER@$PI_HOST" \
          "$KUBECMD delete pod -n default fix-health-log --ignore-not-found" 2>&1 || true

    - name: Report result
      if: always()
      run: |
        gh issue comment 382 --repo "${{ github.repository }}" \
          --body "### Health-check log path fix — $(date -u '+%Y-%m-%dT%H:%M:%SZ')
        Patched \`/usr/local/bin/health-check-cloudless.sh\` on omv: log path moved from \`/var/log/\` to \`~/logs/\`."
