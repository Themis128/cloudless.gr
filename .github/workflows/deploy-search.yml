# Deploy Meilisearch to Pi k3s cluster
# R21a: Self-hosted search engine on omv-main
#
# This workflow applies the Meilisearch k8s manifests to the Pi cluster
# and optionally creates the required secret if missing.
#
# Prerequisites:
#   - CLOUDFLARE_API_TOKEN in SSM (for DNS record creation)
#   - MEILI_MASTER_KEY in SSM or will be generated
#
# Usage:
#   gh workflow run deploy-search.yml -f apply=true

name: Deploy Meilisearch

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply manifests to cluster'
        required: true
        type: boolean
        default: false
      create_secret:
        description: 'Generate and store master key if missing'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  KUBECONFIG: /tmp/kubeconfig

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get KUBECONFIG from SSM
        run: |
          aws ssm get-parameter --name /cloudless/production/KUBECONFIG_B64 --with-decryption --query Parameter.Value --output text | base64 -d > $KUBECONFIG
          chmod 600 $KUBECONFIG

      - name: Check cluster connectivity
        run: |
          kubectl version --short
          kubectl get nodes -o wide

      - name: Create meilisearch-master-key secret if needed
        if: ${{ github.event.inputs.create_secret == 'true' }}
        run: |
          # Check if secret exists
          SECRET_EXISTS=$(kubectl -n search get secret meilisearch-master-key 2>/dev/null && echo "exists" || echo "missing")
          if [ "$SECRET_EXISTS" == "missing" ]; then
            echo "Creating meilisearch-master-key secret..."
            MASTER_KEY=$(openssl rand -hex 32)
            kubectl create namespace search --dry-run=client -o yaml | kubectl apply -f -
            kubectl create secret generic meilisearch-master-key --namespace=search --from-literal=MEILI_MASTER_KEY="$MASTER_KEY" --dry-run=client -o yaml | kubectl apply -f -
            # Store key in SSM for backup
            aws ssm put-parameter --name /cloudless/production/MEILI_MASTER_KEY --value "$MASTER_KEY" --type SecureString --description "Meilisearch master key for R21a search service" --overwrite
            echo "Secret created and stored in SSM"
          else
            echo "Secret already exists, skipping creation"
          fi

      - name: Apply Meilisearch k8s manifests
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          kubectl apply -f k8s/search/meilisearch.yaml
          echo "Waiting for Meilisearch to be ready..."
          kubectl -n search rollout status deploy/meilisearch --timeout=120s || true

      - name: Verify Meilisearch pods
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          kubectl -n search get pods -o wide
          kubectl -n search get svc

      - name: Verify Meilisearch health
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          # Check using port-forward (works without tunnel)
          kubectl -n search port-forward svc/meilisearch-internal 7700:7700 &
          sleep 3
          curl -s http://localhost:7700/health | jq .
          pkill -f "port-forward" || true

      - name: Create DNS record for search.cloudless.gr
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          CF_TOKEN=$(aws ssm get-parameter --name /cloudless/production/CLOUDFLARE_API_TOKEN --with-decryption --query Parameter.Value --output text)
          ZONE_ID=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=cloudless.gr" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id')
          
          # Check if record exists
          EXISTS=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=search" \
            -H "Authorization: Bearer ${CF_TOKEN}" | jq -r '.result[0].id // empty')
          
          TUNNEL_HOST="e977a490-58c5-4fdb-9155-86832e3e636a.cfargotunnel.com"
          
          if [ -n "$EXISTS" ]; then
            echo "search.cloudless.gr CNAME already exists, skipping"
          else
            echo "Creating search.cloudless.gr CNAME record..."
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"search\",\"content\":\"${TUNNEL_HOST}\",\"ttl\":1,\"proxied\":true,\"comment\":\"Meilisearch R21a via cloudflare tunnel\"}" | jq .
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Meilisearch Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Applied to omv-main node" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace:** search" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** search.cloudless.gr (NodePort 30770)" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret:** meilisearch-master-key (stored in SSM for backup)" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Step:** Add Cloudflare tunnel ingress rule (see infrastructure/search/cloudflare-tunnel.yaml)" >> $GITHUB_STEP_SUMMARY