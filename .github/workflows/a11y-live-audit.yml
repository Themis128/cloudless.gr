name: A11y Live Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Runs axe-core against the LIVE site rather than the PR build. The
# existing a11y-audit.yml gates merges on source-level checks; this one
# detects regressions caused by CDN/edge config (Cloudflare HTML rewrite,
# Email Obfuscation injecting tracking, broken locale rewrite, etc.) that
# never show up in the PR build.

on:
  schedule:
    # Daily at 05:00 UTC — between Lighthouse (04:00) and security-headers (05:30).
  - cron: 0 5 * * *
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL (default https://cloudless.gr)
        default: https://cloudless.gr
      strict:
        description: Fail on any serious violation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: a11y-live-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: A11y Live Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae         # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright Chromium
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Playwright system deps (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm exec playwright install-deps chromium

    - name: Run live a11y audit
      id: audit
      env:
        BASE_URL: ${{ github.event.inputs.base_url || 'https://cloudless.gr' }}
        # Strict by default. 2026-06-13: live site has 0 serious/critical
        # color-contrast violations across all 7 audited routes — locking
        # that in so any new regression fails the daily run instead of
        # being silently logged. Flip to false in a manual dispatch only
        # when triaging a known issue.
        STRICT: ${{ github.event.inputs.strict || 'true' }}
      run: |
        set -e
        mkdir -p audit-report
        node scripts/audit/a11y-live.mjs \
          --base "$BASE_URL" \
          --json audit-report/a11y-live.json \
          --md   audit-report/a11y-live.md
        cat audit-report/a11y-live.md >> "$GITHUB_STEP_SUMMARY"

        # Strict mode: any serious|critical violation fails the job
        if [ "$STRICT" = "true" ]; then
          if ! node -e "
            const r = require('./audit-report/a11y-live.json');
            const bad = r.results.flatMap(p => p.violations.filter(v => v.impact === 'serious' || v.impact === 'critical'));
            if (bad.length) {
              console.log(bad.length);
              process.exit(1);
            }
          "; then
            echo "::error::A11y serious/critical violations found"
            exit 1
          fi
        fi

    - name: Upload a11y live report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a         # v4
      with:
        name: a11y-live-report-${{ github.run_id }}
        path: audit-report/
        retention-days: 30
        if-no-files-found: warn
