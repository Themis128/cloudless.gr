name: Wire All AI Backends

# One-shot workflow: wires all four AI backends onto cloudless-app.
#
# Priority chain after this runs:
#   1. NVIDIA proxy  — nemotron-3.5-lightning-30b-a3b + thinking
#   2. Workers AI    — @cf/meta/llama-3.1-8b-instruct (Cloudflare edge, free)
#   3. Ollama        — qwen2.5-coder:latest @ 100.121.191.7:11434 (Tailscale)
#   4. Gemini        — last resort (503 if key absent)
#
# Pre-requisite for Ollama reachability (one-time, on the WSL host):
#   $env:OLLAMA_HOST="0.0.0.0"; ollama serve
#   — or permanently via Windows env var / ollama config so it binds
#   to all interfaces (including the Tailscale 100.121.191.7 one),
#   not just 127.0.0.1.
on:
  push:
    paths:
      - .github/workflows/wire-all-ai-backends.yml

jobs:
  wire:
    runs-on: [self-hosted, omv, pi, build]
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/.kube/config"
          chmod 600 "$GITHUB_WORKSPACE/.kube/config"
          echo "KUBECONFIG=$GITHUB_WORKSPACE/.kube/config" >> "$GITHUB_ENV"

      - name: Create / update cloudless-ai-backends secret
        run: |
          # Holds credentials that must not appear in pod spec or git.
          # kubectl create --dry-run=client + apply is idempotent.
          kubectl create secret generic cloudless-ai-backends \
            -n cloudless \
            --from-literal=CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✓ cloudless-ai-backends secret created/updated"

      - name: Patch deployment — inject all AI backend env vars
        run: |
          # 1. NVIDIA proxy (proxy token inlined — not a sensitive secret,
          #    only gates a free-tier worker; repo is at 100-secret cap)
          kubectl set env deployment/cloudless-app -n cloudless \
            NVIDIA_PROXY_URL=https://postiz-ai-proxy.baltzakis-themis.workers.dev/v1 \
            NVIDIA_PROXY_TOKEN=69d8f49bc06ada482c44134ea3caae10329b2a2b1a83372db637a3b94eb8fa19

          # 2. Workers AI — CLOUDFLARE_ACCOUNT_ID is already in the pod manifest;
          #    CLOUDFLARE_API_TOKEN comes from the secret we just created/updated.
          kubectl patch deployment cloudless-app -n cloudless --type=json -p='[
            {
              "op": "add",
              "path": "/spec/template/spec/containers/0/env/-",
              "value": {
                "name": "CLOUDFLARE_API_TOKEN",
                "valueFrom": {"secretKeyRef": {"name": "cloudless-ai-backends", "key": "CLOUDFLARE_API_TOKEN"}}
              }
            }
          ]' 2>/dev/null || \
          kubectl set env deployment/cloudless-app -n cloudless \
            CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"

          # 3. Ollama — WSL host Tailscale IP; must listen on 0.0.0.0 (not 127.0.0.1)
          kubectl set env deployment/cloudless-app -n cloudless \
            OLLAMA_BASE_URL=http://100.121.191.7:11434 \
            OLLAMA_MODEL=qwen2.5-coder:latest

          # 4. Gemini — from secret; no-op if key is empty
          kubectl patch deployment cloudless-app -n cloudless --type=json -p='[
            {
              "op": "add",
              "path": "/spec/template/spec/containers/0/env/-",
              "value": {
                "name": "GEMINI_API_KEY",
                "valueFrom": {"secretKeyRef": {"name": "cloudless-ai-backends", "key": "GEMINI_API_KEY", "optional": true}}
              }
            }
          ]' 2>/dev/null || true

          echo "✓ all AI backend env vars patched"

      - name: Restart and wait for rollout
        run: |
          kubectl rollout restart deployment/cloudless-app -n cloudless
          kubectl rollout status deployment/cloudless-app -n cloudless --timeout=180s
          echo "✓ cloudless-app restarted"

      - name: Verify env vars landed in the pod
        run: |
          ENV=$(kubectl get deployment cloudless-app -n cloudless \
            -o jsonpath='{.spec.template.spec.containers[0].env[*].name}')
          echo "Env var names: $ENV"
          for VAR in NVIDIA_PROXY_URL NVIDIA_PROXY_TOKEN CLOUDFLARE_API_TOKEN OLLAMA_BASE_URL; do
            echo "$ENV" | grep -q "$VAR" \
              && echo "✓ $VAR present" \
              || echo "✗ $VAR MISSING"
          done

      - name: Smoke-test NVIDIA proxy (Worker endpoint)
        run: |
          curl -sf https://postiz-ai-proxy.baltzakis-themis.workers.dev/v1/models \
            | grep -q "nemotron-3.5-lightning" && echo "✓ NVIDIA proxy" \
            || echo "✗ NVIDIA proxy unreachable"

      - name: Smoke-test Workers AI (Cloudflare account reachable)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/fb7dc7b69b662480cd5961a4d1913c78/ai/models/search?per_page=1")
          [ "$STATUS" = "200" ] && echo "✓ Workers AI account reachable (HTTP 200)" \
            || echo "✗ Workers AI account returned HTTP $STATUS — check CLOUDFLARE_API_TOKEN scope (needs AI:Run)"

      - name: Smoke-test Ollama reachability from Pi runner
        run: |
          curl -sf --max-time 5 http://100.121.191.7:11434/api/tags \
            | grep -q "qwen2.5-coder" && echo "✓ Ollama reachable, qwen2.5-coder pulled" \
            || echo "⚠ Ollama not reachable — set OLLAMA_HOST=0.0.0.0 on WSL host and restart ollama.service"

      - name: Smoke-test Gemini (if key provided)
        run: |
          KEY="${{ secrets.GEMINI_API_KEY }}"
          if [ -z "$KEY" ]; then
            echo "⚠ GEMINI_API_KEY not in GitHub secrets — Gemini fallback disabled"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models?key=${KEY}")
          [ "$STATUS" = "200" ] && echo "✓ Gemini API key valid" \
            || echo "✗ Gemini API returned HTTP $STATUS"

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const emoji = outcome === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 382,
              body: `${emoji} **wire-all-ai-backends** ${outcome}\n\nAll four AI backends wired on cloudless-app:\n- NVIDIA proxy: \`nemotron-3.5-lightning-30b-a3b\` + thinking\n- Workers AI: \`@cf/meta/llama-3.1-8b-instruct\`\n- Ollama: \`qwen2.5-coder:latest\` @ \`100.121.191.7:11434\`\n- Gemini: last resort (optional key)\n\nSee smoke-test results above for per-backend status.`
            });
