name: Restore Keycloak (one-shot recovery)

# Brings auth.cloudless.gr back after the 2026-05-31 memory-relief change left
# Keycloak OOM-crash-looping (384Mi container under a -Xmx512m heap). Directly
# patches the keycloak Deployment to fit the heap and restarts it.
#
# Re-run trigger: 2026-06-02c — auth.cloudless.gr 503 (OIDC+JWKS), Keycloak OOM
# CrashLoop persisting; */15 ensure cron not recovering it. Direct-patch to
# 768Mi and restart; self-reports to issue #382.
# Runs on a GitHub-hosted runner and reaches the omv k3s API over Tailscale +
# KUBECONFIG_B64 — the same access path as deploy-pi.yml's rollout job. This is
# deliberately NOT pinned to the self-hosted omv runners, so the recovery still
# works when those on-prem runners are offline (which is common right after a
# cluster incident). Triggered automatically when this file lands on main (path
# filter), and re-runnable manually via the Actions UI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-keycloak.yml"

permissions:
  contents: read
  issues: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Connect to tailnet
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Restore Keycloak (patch, restart, verify)
        run: bash scripts/restore-keycloak.sh 2>&1 | tee restore.log

      - name: Post restore log to tracking issue
        if: always()
        run: |
          { echo '# Restore Keycloak run — '"$(date -u '+%Y-%m-%d %H:%M:%SZ')"; echo; echo '```'; cat restore.log 2>/dev/null || echo '(no log)'; echo '```'; } > restore-comment.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file restore-comment.md
