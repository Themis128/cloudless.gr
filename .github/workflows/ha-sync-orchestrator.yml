name: HA sync orchestrator

# Ensures Pi standby image builds stay in lockstep with successful
# production deploy SHAs. If a deploy completes for a SHA that does not
# already have a successful "build pi image" run, this workflow dispatches
# one for that exact SHA and waits for completion.

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: ha-sync-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  ensure-pi-build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Pi builds can sit queued on the self-hosted runner for 30+ min on a busy
    # day before doing ~1 min of actual work. Job timeout must cover the
    # combined Pi-build wait (max ~45 min, see below) plus the k3s-rollout
    # wait (max ~10 min).
    timeout-minutes: 60
    steps:
      - name: resolve deploy metadata
        id: meta
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          echo "url=${{ github.event.workflow_run.html_url }}" >> "$GITHUB_OUTPUT"

      - name: inspect existing pi build runs for deploy SHA
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploySha = '${{ steps.meta.outputs.sha }}';
            const { owner, repo } = context.repo;

            // Retry up to 3 times — GitHub's listWorkflowRuns occasionally
            // returns a transient 502 Server Error.
            let runs;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: 'build-pi-image.yml', per_page: 100,
                });
                break;
              } catch (e) {
                if (attempt === 3) throw e;
                core.warning(`listWorkflowRuns attempt ${attempt} failed (${e.message}), retrying…`);
                await new Promise(r => setTimeout(r, 5000 * attempt));
              }
            }

            const candidates = runs
              .filter((run) => run.head_sha === deploySha)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const success = candidates.find((run) => run.conclusion === 'success');
            const active = candidates.find((run) => run.status !== 'completed');

            core.info(`Deploy SHA: ${deploySha}`);
            core.info(`Matching runs: ${candidates.length}`);
            if (success) core.info(`Existing successful build: ${success.html_url}`);
            if (active) core.info(`Existing active build: ${active.html_url}`);

            core.setOutput('exists', success ? 'true' : 'false');
            core.setOutput('active', active ? 'true' : 'false');

      - name: dispatch pi image build for deploy SHA
        id: dispatch
        if: steps.check.outputs.exists != 'true' && steps.check.outputs.active != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploySha = '${{ steps.meta.outputs.sha }}';
            const deployBranch = '${{ steps.meta.outputs.branch }}';
            const { owner, repo } = context.repo;

            // GitHub's createWorkflowDispatch API requires ref to be a branch
            // or tag name — commit SHAs are NOT valid refs for this endpoint.
            // We dispatch at the branch (always valid) and pass the exact SHA
            // as target_sha input so build-pi-image.yml checks out the right
            // commit regardless of whether the branch has since advanced.
            const dispatchedAt = new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'build-pi-image.yml',
              ref: deployBranch,
              inputs: { target_sha: deploySha },
            });
            core.info(`Dispatched build-pi-image.yml for ${deploySha} via ref=${deployBranch}`);

            // Capture the run ID by polling for the newly-created run. The
            // dispatch API is fire-and-forget (no run ID in the response), so
            // we wait up to 30s for the run to appear, then store its ID.
            // Tracking by run ID instead of head_sha makes the wait-loop below
            // immune to rapid pushes that advance the branch before the build
            // completes (the old head_sha filter would silently miss the run).
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
            let runId = null;
            for (let i = 0; i < 10; i++) {
              await sleep(3000);
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'build-pi-image.yml',
                event: 'workflow_dispatch', per_page: 10,
              });
              const found = data.workflow_runs.find(
                r => new Date(r.created_at) >= new Date(dispatchedAt)
              );
              if (found) { runId = found.id; break; }
            }
            if (runId) {
              core.info(`Captured dispatched run ID: ${runId}`);
              core.setOutput('run_id', String(runId));
            } else {
              core.warning('Could not capture dispatched run ID — wait step will fall back to SHA filter');
              core.setOutput('run_id', '');
            }

      - name: wait for pi build completion
        if: steps.check.outputs.exists != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploySha = '${{ steps.meta.outputs.sha }}';
            let dispatchedRunId = Number('${{ steps.dispatch.outputs.run_id }}') || 0;
            const { owner, repo } = context.repo;

            // Pi builds frequently spend 20-30 min queued on the GitHub ARM
            // runner before doing ~2-3 min of actual work. 45 min covers the
            // worst-case queue without bailing on healthy builds.
            const maxAttempts = 180; // 45m at 15s intervals
            const delayMs = 15000;
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              // Prefer tracking by run ID (immune to branch-tip advances).
              // Fall back to head_sha filter when the dispatch step couldn't
              // capture the ID (e.g. the build already existed and was active).
              if (dispatchedRunId) {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: dispatchedRunId,
                });
                if (run.conclusion === 'success') {
                  core.info(`Pi build completed successfully: ${run.html_url}`);
                  return;
                }
                if (run.status !== 'completed') {
                  core.info(`Attempt ${attempt}: run ${dispatchedRunId} still ${run.status}`);
                  await sleep(delayMs);
                  continue;
                }
                if (run.conclusion === 'cancelled') {
                  // A newer push cancelled this run — clear the captured ID and
                  // fall through to the SHA-based search to find the replacement.
                  core.warning(`Pi build run ${dispatchedRunId} was cancelled (superseded by a newer push). Searching by SHA for a replacement run.`);
                  dispatchedRunId = null;
                  await sleep(delayMs);
                  continue;
                }
                core.setFailed(`Pi build run ${dispatchedRunId} ended with conclusion=${run.conclusion}. URL: ${run.html_url}`);
                return;
              }

              // Fallback: filter by head_sha (original behaviour, works when
              // the build was already active and no dispatch was needed).
              const response = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'build-pi-image.yml', per_page: 50,
              });
              const candidates = response.data.workflow_runs
                .filter(r => r.head_sha === deploySha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const success = candidates.find(r => r.conclusion === 'success');
              if (success) {
                core.info(`Pi build completed successfully: ${success.html_url}`);
                return;
              }
              const active = candidates.find(r => r.status !== 'completed');
              if (active) {
                core.info(`Attempt ${attempt}: waiting on active run ${active.id}`);
                await sleep(delayMs);
                continue;
              }
              if (candidates.length > 0) {
                const latest = candidates[0];
                if (latest.conclusion === 'cancelled') {
                  // Cancelled runs happen when a PR-triggered build is auto-cancelled
                  // on branch deletion after merge. Re-dispatch and switch to run-ID
                  // tracking so the next iterations use the faster id-based path.
                  core.warning(
                    `Pi build ${latest.id} for SHA ${deploySha} was cancelled. Re-dispatching…`
                  );
                  const deployBranch = '${{ steps.meta.outputs.branch }}';
                  const redispatchedAt = new Date().toISOString();
                  await github.rest.actions.createWorkflowDispatch({
                    owner, repo,
                    workflow_id: 'build-pi-image.yml',
                    ref: deployBranch,
                    inputs: { target_sha: deploySha },
                  });
                  await sleep(delayMs * 2);
                  for (let j = 0; j < 5; j++) {
                    const { data } = await github.rest.actions.listWorkflowRuns({
                      owner, repo,
                      workflow_id: 'build-pi-image.yml',
                      event: 'workflow_dispatch', per_page: 10,
                    });
                    const newRun = data.workflow_runs.find(
                      r => new Date(r.created_at) >= new Date(redispatchedAt)
                    );
                    if (newRun) { dispatchedRunId = newRun.id; break; }
                    await sleep(delayMs);
                  }
                  continue;
                }
                core.setFailed(`Pi build for SHA ${deploySha} ended with: ${latest.conclusion}`);
                return;
              }
              core.info(`Attempt ${attempt}: no run found yet for SHA ${deploySha}`);
              await sleep(delayMs);
            }

            core.setFailed(`Timed out waiting for successful pi build run for SHA ${deploySha}`);

      - name: wait for k3s rollout (deploy-pi.yml)
        # build-pi-image.yml only pushes to ECR; the actual kubectl rollout runs
        # in deploy-pi.yml. Wait for that too so the k3s E2E (which fires on our
        # success) always hits the fully-rolled-out image, not mid-rollout pods.
        # If the Pi runner is offline (run stuck in queued), exit gracefully —
        # AWS Lambda is the primary; Pi is standby.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploySha = '${{ steps.meta.outputs.sha }}';
            const { owner, repo } = context.repo;

            const maxAttempts = 40; // 10 min at 15s intervals
            const delayMs = 15000;
            // If the run stays queued (Pi runner offline) for this many
            // consecutive checks, exit gracefully instead of timing out.
            const maxQueuedAttempts = 12; // 3 min of consecutive "queued"
            let consecutiveQueued = 0;
            // If a run stays in_progress for too long (GitHub API sometimes
            // fails to flip status to completed even when all jobs are done),
            // check job-level status to avoid infinite wait.
            const maxInProgressMinutes = 20;
            function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'deploy-pi.yml', per_page: 20,
              });
              const candidates = data.workflow_runs
                .filter((r) => r.head_sha === deploySha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (candidates.length === 0) {
                core.info(`No deploy-pi.yml run for SHA ${deploySha} — may have been superseded. Continuing.`);
                return;
              }
              const success = candidates.find((r) => r.conclusion === 'success');
              if (success) {
                core.info(`k3s rollout complete: ${success.html_url}`);
                return;
              }
              const active = candidates.find((r) => r.status !== 'completed');
              if (active) {
                // Detect Pi runner offline: run stuck in "queued" (never starts)
                if (active.status === 'queued') {
                  consecutiveQueued++;
                  if (consecutiveQueued >= maxQueuedAttempts) {
                    core.warning(`deploy-pi.yml stuck in queued for ${consecutiveQueued} checks — Pi runner likely offline. AWS Lambda is primary; skipping.`);
                    return;
                  }
                } else {
                  consecutiveQueued = 0;
                }

                // Detect stale in_progress: GitHub API sometimes leaves status
                // as in_progress even after all jobs completed (seen in run
                // 27819333237). If the run has been in_progress too long, check
                // job-level conclusions to break out of the loop.
                if (active.status === 'in_progress') {
                  const runAgeMin = (Date.now() - new Date(active.created_at).getTime()) / 60000;
                  if (runAgeMin > maxInProgressMinutes) {
                    core.warning(`deploy-pi.yml run ${active.id} in_progress for ${Math.round(runAgeMin)} min — checking job-level status`);
                    const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                      owner, repo, run_id: active.id,
                    });
                    const allJobsDone = jobs.jobs.length > 0 && jobs.jobs.every(j => j.status === 'completed');
                    if (allJobsDone) {
                      const anySuccess = jobs.jobs.some(j => j.conclusion === 'success' && j.name.includes('Rollout'));
                      if (anySuccess) {
                        core.info(`k3s rollout job succeeded (stale run status). Continuing.`);
                        return;
                      }
                      // All jobs done but rollout didn't succeed — build likely failed
                      core.warning(`deploy-pi.yml all jobs completed but rollout did not succeed (build likely failed). AWS Lambda is primary; skipping Pi rollout.`);
                      return;
                    }
                  }
                }

                core.info(`[${attempt}] waiting on deploy-pi rollout (${active.status}): ${active.html_url}`);
                await sleep(delayMs);
                continue;
              }
              // Completed but not succeeded.
              const conclusion = candidates[0].conclusion;
              // `cancelled` is benign here: deploy-pi.yml uses
              // `concurrency: cancel-in-progress` so a newer push to `main`
              // supersedes its older sibling. The HA sync run for the newer
              // commit will catch up — this older run has nothing useful to do
              // and would be a false-failure if we hard-failed. Mirrors the
              // same handling used for `build-pi-image.yml` above (where we
              // already treat cancellation as "superseded → continue").
              if (conclusion === 'cancelled') {
                core.warning(`deploy-pi.yml for ${deploySha} was cancelled (superseded by a newer push). Skipping; the newer commit's HA sync will handle it. URL: ${candidates[0].html_url}`);
                return;
              }
              // Build failures on the Pi are non-critical — AWS Lambda is the
              // primary and Pi is standby. A Docker build failure (OOM, cache
              // corruption, transient arm64 issue) should not block the HA sync
              // from reporting success for the production deploy.
              if (conclusion === 'failure') {
                core.warning(`deploy-pi.yml for ${deploySha} failed (likely Docker build issue on Pi). AWS Lambda is primary; skipping. URL: ${candidates[0].html_url}`);
                return;
              }
              // Anything else (action_required, timed_out) — warn and skip.
              core.warning(`deploy-pi.yml for ${deploySha} ended with: ${conclusion}. AWS Lambda is primary; skipping. URL: ${candidates[0].html_url}`);
              return;
            }
            core.setFailed(`Timed out waiting for deploy-pi.yml for SHA ${deploySha}`);

      - name: summary
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "Pi build already existed for deploy SHA ${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.active }}" = "true" ]; then
            echo "Pi build was already running for deploy SHA ${{ steps.meta.outputs.sha }}; orchestrator waited for completion" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pi build was missing and has now been orchestrated for deploy SHA ${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Deploy run: ${{ steps.meta.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
