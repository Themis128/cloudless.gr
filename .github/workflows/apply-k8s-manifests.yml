name: Apply k8s Manifests

# Purpose: Apply k8s manifests for the Pi standby cluster via Tailscale tunnel.
# Trigger: push to main on k8s/** paths, manual dispatch.
# Paging: posts result to issue #382.
on:
  push:
    branches: [main]
    paths:
      - "k8s/**"
  workflow_dispatch:

permissions:
  id-token: write  # OIDC for Tailscale auth
  contents: read
  issues: write

concurrency:
  group: k8s-manifests
  cancel-in-progress: true

jobs:
  apply:
    name: Apply k8s manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Connect to tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply k8s manifests
        run: |
          echo "=== Applying k8s manifests ==="
          kubectl apply -f k8s/cloudless-app-optimized.yaml --validate=false
          kubectl apply -f k8s/ingressroute-manage.yaml --validate=false
          echo "=== Done ==="

      - name: Verify NetworkPolicy
        run: |
          echo "=== NetworkPolicy status ==="
          kubectl get networkpolicy -n cloudless
          echo "=== NetworkPolicy details ==="
          kubectl describe networkpolicy cloudless-app-network-policy -n cloudless

      - name: Verify IngressRoute
        run: |
          echo "=== IngressRoute status ==="
          kubectl get ingressroute -n cloudless
          echo "=== IngressRoute details ==="
          kubectl describe ingressroute cloudless-manager -n cloudless

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 382 --body "### k8s manifests applied

          **Changes:**
          - NetworkPolicy: Fixed to allow traffic from all namespaces (was blocking Traefik)
          - IngressRoute: Fixed certResolver to \`letsencrypt-cloudflare\`
          - Removed non-existent \`secure-headers\` middleware

          **Verify:**
          - https://manage.cloudless.gr/api/health"