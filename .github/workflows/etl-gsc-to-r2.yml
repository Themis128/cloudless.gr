name: 'ETL: GSC to R2'
# Google Search Console keywords → R2. Feeds admin datalake top_keywords + gsc-weekly snapshot.

on:
  schedule:
  - cron: 10 6 * * *       # daily 06:10 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-gsc-to-r2
  cancel-in-progress: false

jobs:
  etl:
    name: Run GSC → R2 sync
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: scripts/etl
      run: |
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Run GSC-to-R2 sync
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        # Preferred (SO #74131595): base64(entire service-account JSON)
        GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        # Fallback: split email + PEM (often corrupted in GH secrets)
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node gsc-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: GSC to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: GSC to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }
