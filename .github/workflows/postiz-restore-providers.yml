name: Postiz — restore provider OAuth secrets (AWS SSM retired)

# Previously rebuilt postiz-providers from AWS SSM.
# Use GitHub Secrets + kubectl patch (same pattern as sync-campaign-ads).
# AWS SSM is retired — Cloudflare Free / Pi secrets only.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Ignored — workflow retired
        required: false
        default: ''

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: SSM Postiz restore retired
        run: |
          echo "::error::postiz-restore-providers no longer reads AWS SSM. Patch the postiz-providers k8s Secret from GitHub Secrets (LINKEDIN_*/META_*/X_*/TIKTOK_*/POSTIZ_*). Do not re-enable AWS OIDC for this."
          exit 1
