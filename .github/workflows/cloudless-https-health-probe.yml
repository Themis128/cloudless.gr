name: cloudless.gr HTTPS health probe

# Probes live HTTPS paths:
#   PRIMARY  — www.cloudless.gr (Cloudflare → Workers / CDN)
#   APEX     — cloudless.gr (warn-only if DNS missing)
#   STANDBY  — pi-origin.cloudless.gr (Tunnel → Pi/k3s)

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudless-https-health-probe.yml"
  workflow_dispatch:
    inputs:
      skip_tls_floor:
        description: "Skip TLS 1.0/1.1 floor check (set to 'true' to bypass)"
        required: false
        default: "false"

permissions:
  contents: read

env:
  MIN_DAYS_REMAINING: 14
  SKIP_TLS_FLOOR: ${{ inputs.skip_tls_floor || 'false' }}

jobs:
  probe-primary:
    name: Probe PRIMARY (www.cloudless.gr)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_HOST: "www.cloudless.gr"
    steps:
      - name: TLS + /api/health
        run: |
          set -euo pipefail
          HOST="${PROBE_HOST}"

          echo "→ TCP/443 ${HOST}"
          if ! timeout 10 bash -c "exec 3<>/dev/tcp/${HOST}/443" 2>/dev/null; then
            echo "::error::${HOST}:443 not reachable"
            exit 1
          fi

          echo "→ TLS handshake"
          set +e
          timeout 20 openssl s_client -connect "${HOST}:443" -servername "${HOST}" \
            -showcerts -verify_return_error </dev/null >/tmp/openssl.out 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::TLS handshake failed"; cat /tmp/openssl.out >&2; exit 1
          fi

          if [ "${SKIP_TLS_FLOOR}" != "true" ]; then
            if timeout 10 openssl s_client -tls1 -connect "${HOST}:443" -servername "${HOST}" </dev/null >/dev/null 2>&1; then
              echo "::error::TLS 1.0 unexpectedly accepted"; exit 1
            fi
            if timeout 10 openssl s_client -tls1_1 -connect "${HOST}:443" -servername "${HOST}" </dev/null >/dev/null 2>&1; then
              echo "::error::TLS 1.1 unexpectedly accepted"; exit 1
            fi
            if ! timeout 10 openssl s_client -tls1_2 -connect "${HOST}:443" -servername "${HOST}" </dev/null >/dev/null 2>&1; then
              echo "::error::TLS 1.2 failed"; exit 1
            fi
          fi

          leaf=$(awk '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/' /tmp/openssl.out | awk '/-----BEGIN/{i++} i==1')
          not_after=$(echo "$leaf" | openssl x509 -noout -enddate | cut -d= -f2)
          days_left=$(( ($(date -d "$not_after" +%s) - $(date +%s)) / 86400 ))
          echo "→ cert days left: ${days_left}"
          if [ "$days_left" -lt "${MIN_DAYS_REMAINING}" ]; then
            echo "::error::Cert expires in ${days_left} days"; exit 1
          fi

          echo "→ GET https://${HOST}/api/health"
          code=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
            -H "User-Agent: cloudless-https-health-probe" \
            -o /tmp/body -w "%{http_code}" "https://${HOST}/api/health" || true)
          body="$(cat /tmp/body 2>/dev/null || true)"
          echo "HTTP ${code}: $(head -c 200 <<<"$body")"
          if [ "$code" = "403" ]; then
            # Free Bot Fight often blocks GH IPs on custom domains — validate via workers.dev.
            echo "::warning::${HOST} returned 403 (Bot Fight). Falling back to workers.dev body check."
            code=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
              -H "User-Agent: cloudless-https-health-probe" \
              -o /tmp/body -w "%{http_code}" \
              "https://cloudless2.baltzakis-themis.workers.dev/api/health" || true)
            body="$(cat /tmp/body 2>/dev/null || true)"
            echo "workers.dev HTTP ${code}: $(head -c 200 <<<"$body")"
          fi
          if [ "$code" != "200" ]; then
            echo "::error::health returned ${code} (expect 200; 503 means edge up but Pi origin down)"
            exit 1
          fi
          status=$(python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" <<<"$body" 2>/dev/null || echo "")
          if [ "$status" != "ok" ]; then
            echo "::error::health JSON status='${status}' (expected 'ok') — origin likely degraded"
            exit 1
          fi
          echo "✓ health ok"

          {
            echo "## PRIMARY — ${HOST}"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Cert days | ${days_left} |"
            echo "| /api/health | ${code} |"
          } >> "$GITHUB_STEP_SUMMARY"

  probe-apex:
    name: Probe APEX (cloudless.gr) — warn if DNS missing
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check apex DNS + health
        run: |
          set -euo pipefail
          HOST=cloudless.gr
          if ! getent hosts "$HOST" >/dev/null 2>&1 && ! dig +short "$HOST" A @1.1.1.1 | grep -q .; then
            echo "::warning::Apex ${HOST} has no A/AAAA DNS — Worker custom domain / DNS record missing. www works."
            exit 0
          fi
          code=$(curl -sS --max-time 20 -o /tmp/body -w "%{http_code}" "https://${HOST}/api/health" || true)
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::Apex health returned ${code}"
          fi

  probe-standby:
    name: Probe STANDBY (pi-origin.cloudless.gr)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROBE_HOST: "pi-origin.cloudless.gr"
    steps:
      - name: TLS + /api/health
        run: |
          set -euo pipefail
          HOST="${PROBE_HOST}"
          if ! timeout 15 bash -c "exec 3<>/dev/tcp/${HOST}/443" 2>/dev/null; then
            echo "::error::${HOST}:443 not reachable — Tunnel or Pi/k3s offline"
            exit 1
          fi
          code=$(curl -sS --max-time 30 --retry 2 --retry-delay 10 \
            -o /tmp/body -w "%{http_code}" "https://${HOST}/api/health" || true)
          body="$(cat /tmp/body 2>/dev/null || true)"
          echo "HTTP ${code}: ${body}"
          if [ "$code" != "200" ]; then
            echo "::error::Standby health returned ${code} (Pi serving path broken)"
            exit 1
          fi
          status=$(python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" <<<"$body" 2>/dev/null || echo "")
          if [ -n "$status" ] && [ "$status" != "ok" ]; then
            echo "::error::Standby health JSON status='${status}' (expected 'ok')"
            exit 1
          fi
          echo "✓ standby health ok"
