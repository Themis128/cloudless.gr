name: Bundle Size PR Comment

on:
  pull_request:
    branches: [main]
    paths:
    - src/**
    - package.json
    - pnpm-lock.yaml
    - next.config.ts

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bundle-size-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm

      # Cache Next.js build output between runs. Mirrors deploy.yml.
    - name: Restore Next.js build cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae         # v5.0.5
      with:
        path: .next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
          hashFiles('src/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          nextjs-${{ runner.os }}-

    - run: pnpm install --frozen-lockfile

    - name: Build and capture bundle stats
      run: |
        pnpm next build
        # Extract route sizes from .next/routes-manifest and build output
        node -e "
          const fs = require('fs');
          const path = require('path');
          const buildDir = '.next';

          // Parse build-manifest for JS bundle sizes
          const manifest = JSON.parse(fs.readFileSync(path.join(buildDir, 'build-manifest.json'), 'utf8'));
          const pages = Object.keys(manifest.pages);

          let report = '## Bundle Size Report\n\n';
          report += '| Route | JS Chunks |\n|-------|----------|\n';

          for (const page of pages.sort()) {
            const chunks = manifest.pages[page] || [];
            const totalKB = chunks.reduce((sum, chunk) => {
              const filePath = path.join(buildDir, chunk);
              if (fs.existsSync(filePath)) {
                return sum + fs.statSync(filePath).size;
              }
              return sum;
            }, 0);
            report += '| ' + page + ' | ' + (totalKB / 1024).toFixed(1) + ' KB |\n';
          }

          fs.writeFileSync('/tmp/bundle-report.md', report);
        "

    - name: Comment on PR
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        path: /tmp/bundle-report.md
