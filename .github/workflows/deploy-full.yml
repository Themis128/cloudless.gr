name: Deploy to Cloudflare Workers + k3s

# Unified deployment workflow for Cloudflare Workers and k3s (Pi cluster)
# Builds Next.js, deploys Worker, builds arm64 image, and rolls out to k3s.
# No AWS dependencies for the Cloudflare path.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "__tests__/**"
      - "public/**"
      - "*.json"
      - "*.ts"
      - "Dockerfile"
      - ".dockerignore"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-full.yml"
  workflow_dispatch:

concurrency:
  group: deploy-full
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

env:
  NODE_VERSION: 22

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      - name: Resolve SHA
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint check
        run: pnpm lint

  build-assets:
    name: Build Next.js Assets
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Next.js
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
          NEXT_PUBLIC_STAGE: production
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w

  deploy-worker:
    name: Deploy to Cloudflare Workers
    needs: [build-and-validate, build-assets]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deploy to Workers (Primary)
        run: pnpm cf:deploy:free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
          NEXT_PUBLIC_STAGE: production
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: baltzakisthemiscom
          SENTRY_PROJECT: cloudless-gr
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: prod
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: prod

  build-pi-image:
    name: Build Pi Image (GHCR)
    needs: build-and-validate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image_tag: ${{ steps.normalize.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
        with:
          buildkitd-config-inline: |
            [grpc]
              keepalive = 3600
            [worker.oci]
              max-parallelism = 2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry path (lowercase)
        id: normalize
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"  # Bash: ${var,,} lowercases
          SHA="${{ needs.build-and-validate.outputs.short_sha }}"
          echo "image_tag=${OWNER}/cloudless-pi-app:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.normalize.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: false
          provenance: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://cloudless.gr
            NEXT_PUBLIC_STAGE=production
            NEXT_PUBLIC_AUTH_PROVIDER=d1
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
            APP_VERSION=${{ github.sha }}

  rollout-k3s:
    name: Rollout to k3s (Pi)
    needs: [build-pi-image, deploy-worker]
    if: always() && (needs.deploy-worker.result == 'success' || needs.build-pi-image.result == 'success')
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4.3.1

      - name: Connect to tailnet
        continue-on-error: true
        uses: tailscale/github-action@v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Diagnose k3s API reachability
        run: |
          set +e
          kubectl get --raw /healthz --request-timeout=10s
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::kubectl could not reach k3s API — Pi runner may be offline"
            echo "Cloudflare Workers is primary; skipping k3s rollout"
            exit 0
          fi
          echo "/healthz ok — k3s API is reachable"

      - name: Set image and rollout
        run: |
          kubectl set image deployment/cloudless \
            cloudless=ghcr.io/${{ needs.build-pi-image.outputs.image_tag }} \
            -n cloudless || {
              echo "::warning::Failed to set image — Pi deployment may be stale"
              exit 0
            }
          kubectl rollout status deployment/cloudless -n cloudless --timeout=600s || {
            echo "::warning::Rollout timed out — check Pi cluster manually"
            exit 0
          }

  notify:
    name: Notify Slack
    needs: [deploy-worker, rollout-k3s]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack — deploy result
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          STATUS=":white_check_mark: Deploy Succeeded"
          if [ "${{ needs.deploy-worker.result }}" != "success" ] || [ "${{ needs.rollout-k3s.result }}" != "success" ]; then
            STATUS=":x: Deploy Partially Failed"
          fi
          curl -s --max-time 10 -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"${STATUS} — \\`${GITHUB_SHA::7}\`\",
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"${STATUS}\", \"emoji\": true}},
                {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Stage:* \`production\`\\n*Commit:* \\`${GITHUB_SHA::7}\\`\\n*Actor:* ${{ github.actor }}\\n*Cloudflare:* ${{ needs.deploy-worker.result }}\\n*k3s:* ${{ needs.rollout-k3s.result }}\"}},
                {\"type\": \"context\", \"elements\": [{\"type\": \"mrkdwn\", \"text\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>\"]}
              ]
            }"