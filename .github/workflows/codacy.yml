name: Codacy Security Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/codacy.yml
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/codacy.yml
  workflow_dispatch:
  schedule:
    - cron: 29 15 * * 4 # Every Thursday at 15:29 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codacy-security-scan:
    name: Codacy Security Scan (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The action's `tool` input maps to a single `--tool` flag — a
        # comma-separated list is rejected by the CLI ("not supported"),
        # which silently produced no SARIF and no code-scanning upload.
        # trivy is excluded: standalone it fails with "no patterns configured"
        # because pattern selection only comes from the Codacy remote project
        # config, and this workflow has no CODACY_PROJECT_TOKEN.
        tool: [opengrep, lizard]
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run Codacy Analysis CLI
        id: codacy
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        continue-on-error: true # exit 13 = OOM/timeout on runner; non-blocking
        with:
          verbose: true
          output: results-${{ matrix.tool }}.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          tool: ${{ matrix.tool }}

      - name: Validate SARIF before upload
        id: validate
        run: |
          if [ -f results-${{ matrix.tool }}.sarif ] && python3 -c "import json,sys; json.load(open('results-${{ matrix.tool }}.sarif'))" 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "SARIF file missing or invalid — skipping upload"
          fi

      # Codacy emits multi-run SARIF (one run per sub-tool/language). GitHub
      # rejects a single file whose runs share a category, so split into one
      # document per run and upload each via the REST API with a distinct
      # tool_name — keeps "X (reported by Codacy)" labeling per sub-tool.
      - name: Split SARIF runs and upload
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # On pull_request events github.ref is refs/pull/N/merge, but we
          # upload the head SHA — pair it with the head branch ref instead.
          REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, subprocess, sys

          path = "results-${{ matrix.tool }}.sarif"
          sarif = json.load(open(path))
          runs = sarif.get("runs") or []
          if not runs:
              print("SARIF has no runs — nothing to upload")
              sys.exit(0)

          seen = {}
          for i, run in enumerate(runs):
              driver = (run.get("tool", {}).get("driver") or {}).get("name") or f"run{i}"
              seen[driver] = seen.get(driver, 0) + 1
              suffix = f"-{seen[driver]}" if seen[driver] > 1 else ""
              doc = {k: v for k, v in sarif.items() if k != "runs"}
              doc["runs"] = [run]
              blob = base64.b64encode(gzip.compress(json.dumps(doc).encode())).decode()
              body = {
                  "commit_sha": os.environ["COMMIT_SHA"],
                  "ref": os.environ["REF"],
                  "sarif": blob,
                  "tool_name": f"Codacy {driver}{suffix}",
              }
              r = subprocess.run(
                  ["gh", "api", "repos/{owner}/{repo}/code-scanning/sarifs",
                   "-X", "POST", "--input", "-"],
                  input=json.dumps(body), text=True, capture_output=True,
              )
              print(f"run[{i}] {driver}: {r.stdout.strip() or r.stderr.strip()}")
              if r.returncode:
                  sys.exit(1)
          PY
