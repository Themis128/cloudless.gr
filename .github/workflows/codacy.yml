name: Codacy Security Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/codacy.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/codacy.yml"
  workflow_dispatch:
  schedule:
    - cron: "29 15 * * 4" # Every Thursday at 15:29 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Run Codacy Analysis CLI
        id: codacy
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        continue-on-error: true  # exit 13 = OOM/timeout on runner; non-blocking
        with:
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          tool: "opengrep,trivy,lizard"

      - name: Validate SARIF before upload
        id: validate
        run: |
          if [ -f results.sarif ] && python3 -c "import json,sys; json.load(open('results.sarif'))" 2>/dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "SARIF file missing or invalid — skipping upload"
          fi

      - name: Upload SARIF results
        if: steps.validate.outputs.valid == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
