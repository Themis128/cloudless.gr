name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "wrangler.pages.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build and Deploy to Pages
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    env:
      NEXT_PUBLIC_AUTH_PROVIDER: d1
      NEXT_PUBLIC_SITE_URL: https://cloudless.gr
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Cloudflare API token from SSM
        id: fetch-cf-token
        run: |
          set -uo pipefail
          CF="$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption \
            --query Parameter.Value \
            --output text 2>/dev/null || echo '')"
          if [ -z "$CF" ]; then
            echo "::warning::No Cloudflare token in SSM — skipping migrations"
            echo "skip_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$CF"
            {
              echo "CLOUDFLARE_API_TOKEN<<EOF"
              echo "$CF"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "skip_migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:ci
        continue-on-error: true

      - name: Apply database migrations (info only - applied by deploy-cloudflare.yml)
        run: |
          echo "Migrations are applied by deploy-cloudflare.yml workflow"
          echo "Skipping migration step to avoid API token requirement"
        continue-on-error: true

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: fb7dc7b69b662480cd5961a4d1913c78
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          command: pages deploy --project-name cloudless-gr-pages
          wranglerVersion: "4.20.0"
          workingDirectory: .

      - name: Health check
        run: |
          sleep 15
          curl -sf https://cloudless.gr/api/health || exit 1
          curl -sf https://cloudless.gr/api/auth/session || exit 1
          echo "✅ Pages deployment health check passed"

      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              target_url: "https://cloudless.gr",
              context: "Cloudflare Pages",
              description: "Deployed to Pages"
            });