name: build pi image (RETIRED — use deploy-pi.yml)

# ECR builds are retired. Live path: deploy-pi.yml → R2 standalone + Cloudflare Workflow.
# Cloudflare Free only — do not re-enable ECR / AWS_DEPLOY_ROLE_ARN for images.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-image-retired
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: ECR path retired
        run: |
          echo "::error::build-pi-image (ECR) is retired. Use .github/workflows/deploy-pi.yml (R2 + pi-deploy-orchestrator). No Workers Paid / no AWS image registry."
          exit 1
