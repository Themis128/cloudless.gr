name: Fix cloudless-app rollout (quota-safe strategy, one-shot)

# One-shot: patches the live cloudless-app Deployment to
# rollingUpdate.maxSurge=0 / maxUnavailable=1 so rollouts replace pods
# in place instead of surging.
#
# Why: cloudless-quota caps the namespace at limits.memory=1536Mi and each
# pod reserves 768Mi — two running pods already consume the full quota, so
# every maxSurge=1 rollout deadlocks with ReplicaSet FailedCreate
# "exceeded quota: cloudless-quota" (observed 2026-09-23). The patch frees
# an old pod first, the pending new pod is then admitted, and the stuck
# rollout completes on its own — no restart needed. The spec change
# persists in etcd, so pi-release-pull.sh `rollout restart` deploys keep
# working. Repo manifest updated in k8s/cloudless-app-hostpath.yaml.
#
# Runs via Tailscale + SSH to the omv control-plane (same pattern as
# etcd-defrag-now.yml). Requires secrets: TS_CLIENT_ID, TS_CLIENT_SECRET,
# OMV_SSH_KEY. Posts the transcript to tracking issue #382.

on:
  push:
    branches: [main]
    paths:
    - .github/workflows/k3s-fix-rollout-quota.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fix-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PI_HOST: 100.74.191.58
      PI_USER: tbaltzakis
    steps:
    - name: Connect to tailnet
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888         # v4.1.3
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
        tags: tag:k8s
        ping: 100.74.191.58

    - name: Wait for tailnet path to omv
      run: bash scripts/ci/tailscale-wait.sh 100.74.191.58 22

    - name: Install SSH key
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.OMV_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Patch strategy and unstick rollout
      run: |
        ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
          "$PI_USER@$PI_HOST" bash <<'REMOTE' 2>&1 | tee fix.log
        set -e
        K="sudo k3s kubectl -n cloudless"

        echo "=== BEFORE: deployment + quota ==="
        $K get deploy cloudless-app -o jsonpath='replicas={.spec.replicas} strategy={.spec.strategy}' || true
        echo
        $K get quota cloudless-quota -o jsonpath='used={.status.used} hard={.status.hard}' || true
        echo
        $K get rs -l app=cloudless-app -o wide || true
        $K get pods -l app=cloudless-app -o wide || true

        echo ""
        echo "=== patch strategy: maxSurge=0 maxUnavailable=1 ==="
        $K patch deployment cloudless-app --type=merge -p \
          '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}'

        echo ""
        echo "=== wait for rollout (quota frees as old pod terminates) ==="
        $K rollout status deployment/cloudless-app --timeout=300s

        echo ""
        echo "=== AFTER ==="
        $K get deploy cloudless-app -o jsonpath='replicas={.spec.replicas} strategy={.spec.strategy} available={.status.availableReplicas}'
        echo
        $K get pods -l app=cloudless-app -o wide
        curl -sS --max-time 8 http://127.0.0.1:30300/api/health || true
        REMOTE

    - name: Post result to tracking issue
      if: always()
      run: |
        {
          echo "# cloudless-app rollout quota fix — $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          echo ""
          echo '```'
          cat fix.log 2>/dev/null || echo "(no log)"
          echo '```'
        } | gh issue comment 382 --repo "$GITHUB_REPOSITORY" --body-file -
