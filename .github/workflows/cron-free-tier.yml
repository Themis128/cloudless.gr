name: Daily Analytics Rollup (Free Tier)

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for backfill (YYYY-MM-DD, defaults to yesterday)'
        required: false
        default: ''

jobs:
  analytics-rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: Run GSC sync to generate parquet
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          pnpm gsc:sync
          # Upload results to R2
          npx wrangler r2 object put cloudless-analytics/lake/gsc-snapshot.parquet --file ./out/gsc-snapshot.parquet

  session-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: Cleanup expired sessions from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Call admin endpoint to trigger cleanup
          curl -X POST https://cloudless.gr/api/admin/cleanup-sessions

  # Optional: Weekly full sync with additional reports
  weekly-full-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule === '0 1 * * 1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install --frozen-lockfile

      - name: Run full analytics sync
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          pnpm gsc:sync --full
          # Upload all parquet files to R2
          npx wrangler r2 object put cloudless-analytics/lake/gsc-performance.parquet --file ./out/gsc-performance.parquet
          npx wrangler r2 object put cloudless-analytics/lake/gsc-keywords.parquet --file ./out/gsc-keywords.parquet
          npx wrangler r2 object put cloudless-analytics/lake/gsc-pages.parquet --file ./out/gsc-pages.parquet