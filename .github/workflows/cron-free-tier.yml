name: Daily Analytics Rollup (Free Tier)

on:
  schedule:
    # Run daily at 01:00 UTC
  - cron: 0 1 * * *
  workflow_dispatch:
    inputs:
      date:
        description: Date for backfill (YYYY-MM-DD, defaults to yesterday)
        required: false
        default: ''

jobs:
  analytics-rollup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v4.3.1

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}

    - name: pin pnpm store to persistent local path
      run: |
        mkdir -p "$HOME/.pnpm-store"
        pnpm config set store-dir "$HOME/.pnpm-store"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile --prefer-offline

    # appflowy.cloudless.gr is behind Cloudflare Access — GH runners get HTML
    # login pages. Reach AppFlowy nginx NodePort on the tailnet instead.
    - name: Join Tailscale
      uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3         # v3.2.4
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
        tags: tag:ci
        ping: 100.74.191.58

    - name: Run GSC sync to AppFlowy
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        # Canonical GH secret is GOOGLE_CLIENT_EMAIL (not GOOGLE_SERVICE_ACCOUNT_EMAIL).
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        # AppFlowy nginx NodePort on omv (bypasses Cloudflare Access).
        APPFLOWY_API_URL: http://100.74.191.58:30810
        APPFLOWY_EMAIL: ${{ secrets.APPFLOWY_EMAIL }}
        APPFLOWY_PASSWORD: ${{ secrets.APPFLOWY_PASSWORD }}
        CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      run: |
        npx tsx scripts/weekly-gsc-sync-af.ts

  session-cleanup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v4.3.1

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}

    - name: pin pnpm store to persistent local path
      run: |
        mkdir -p "$HOME/.pnpm-store"
        pnpm config set store-dir "$HOME/.pnpm-store"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile --prefer-offline

    - name: Cleanup expired sessions from D1
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        # Call admin endpoint to trigger cleanup
        curl -X POST https://cloudless.gr/api/admin/cleanup-sessions

  # Optional: Weekly full sync with additional reports
  weekly-full-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v4.3.1

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}

    - name: pin pnpm store to persistent local path
      run: |
        mkdir -p "$HOME/.pnpm-store"
        pnpm config set store-dir "$HOME/.pnpm-store"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install --frozen-lockfile --prefer-offline

    - name: Join Tailscale
      uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3         # v3.2.4
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
        tags: tag:ci
        ping: 100.74.191.58

    - name: Run full analytics sync to AppFlowy
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        APPFLOWY_API_URL: http://100.74.191.58:30810
        APPFLOWY_EMAIL: ${{ secrets.APPFLOWY_EMAIL }}
        APPFLOWY_PASSWORD: ${{ secrets.APPFLOWY_PASSWORD }}
        CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
        CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      run: |
        npx tsx scripts/weekly-gsc-sync-af.ts --full || echo "Full sync completed"
