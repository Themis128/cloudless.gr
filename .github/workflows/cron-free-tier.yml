name: Daily Analytics Rollup (Free Tier)

on:
  schedule:
    # Run daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for backfill (YYYY-MM-DD, defaults to yesterday)'
        required: false
        default: ''

jobs:
  analytics-rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run GSC sync to generate parquet
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          pnpm gsc:sync
          # Upload results to R2
          npx wrangler r2 object put cloudless-analytics/lake/gsc-snapshot.parquet --file ./out/gsc-snapshot.parquet

  session-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cleanup expired sessions from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Call admin endpoint to trigger cleanup
          curl -X POST https://cloudless.gr/api/admin/cleanup-sessions

  # Optional: Weekly full sync with additional reports
  weekly-full-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule === '0 1 * * 1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run full analytics sync
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          pnpm gsc:sync --full
          # Upload all parquet files to R2
          npx wrangler r2 object put cloudless-analytics/lake/gsc-performance.parquet --file ./out/gsc-performance.parquet
          npx wrangler r2 object put cloudless-analytics/lake/gsc-keywords.parquet --file ./out/gsc-keywords.parquet
          npx wrangler r2 object put cloudless-analytics/lake/gsc-pages.parquet --file ./out/gsc-pages.parquet