name: Delete Keycloak namespace from k3s

# Fires once when this file lands on main. Connects via Tailscale + KUBECONFIG_B64
# (no AWS OIDC needed). Deletes the keycloak namespace and its autoheal CronJob.
# Safe to re-run — uses --ignore-not-found.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-keycloak-ns.yml"

permissions:
  contents: read
  issues: write

jobs:
  delete-keycloak:
    name: Delete keycloak namespace from k3s
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Connect to tailnet
        continue-on-error: true
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Wait for cluster API
        run: |
          for i in 1 2 3 4 5 6; do
            if kubectl get ns cloudless >/dev/null 2>&1; then
              echo "cluster reachable (attempt $i)"; break
            fi
            echo "not reachable (attempt $i) — retry in ${i}0s"; sleep "${i}0"
          done

      - name: Delete Keycloak namespace
        run: |
          set -euo pipefail
          {
            echo "=== Deleting keycloak namespace ==="
            kubectl delete namespace keycloak --ignore-not-found --timeout=120s \
              && echo "keycloak namespace deleted" \
              || echo "keycloak namespace already gone or timed out"

            echo ""
            echo "=== Remaining namespaces ==="
            kubectl get namespaces
          } | tee delete.log

      - name: Post result to tracking issue
        if: always()
        run: |
          {
            echo "# Keycloak namespace deletion — $(date -u '+%F %T')Z"
            echo ""
            echo "**Job:** ${{ job.status }}"
            echo ""
            echo '```'
            cat delete.log 2>/dev/null || echo '(no log)'
            echo '```'
          } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md
