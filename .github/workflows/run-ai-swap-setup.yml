name: Run AI swap setup on omv

# One-shot: triggered by pushing this file to main.
# Connects to omv via Tailscale, pulls the repo, and runs setup-ai-swap.sh.
# After it completes successfully, this workflow file can be deleted.

on:
  push:
    paths: [.github/workflows/run-ai-swap-setup.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  setup-swap:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.3.1

    - name: Connect to tailnet
      uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3  # v3.2.4
      with:
        oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}

    - name: Run setup-ai-swap.sh on omv
      env:
        OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
      run: |
        set -euo pipefail

        # Write the SSH key
        echo "${OMV_SSH_KEY}" > /tmp/omv_key
        chmod 600 /tmp/omv_key

        # Copy the script to omv and run it
        scp -i /tmp/omv_key \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          infrastructure/omv/setup-ai-swap.sh \
          tbaltzakis@100.74.191.58:/tmp/setup-ai-swap.sh

        ssh -i /tmp/omv_key \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          tbaltzakis@100.74.191.58 \
          'sudo bash /tmp/setup-ai-swap.sh && rm /tmp/setup-ai-swap.sh'

    - name: Post result to issue 382
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        STATUS="${{ job.status }}"
        gh issue comment 382 \
          --body "**AI swap setup on omv:** ${STATUS} — \`sudo bash infrastructure/omv/setup-ai-swap.sh\` — run: ${{ github.run_id }}"
