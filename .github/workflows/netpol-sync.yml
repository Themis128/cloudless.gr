name: NetworkPolicy baseline sync (self-hosted)

# Applies infrastructure/network-policies/baseline.yaml to the omv k3s
# cluster. Use when a live baseline netpol has drifted from the repo
# (e.g. the n8n/espocrm tailnet ipBlock) — file is the source of truth.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Apply baseline netpols
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v4.3.1

    - name: Apply baseline policies and verify
      run: |
        set -e
        KCTL="sudo k3s kubectl"
        $KCTL apply -f infrastructure/network-policies/baseline.yaml

        echo "=== verify: n8n + espocrm ingress ipBlocks ==="
        for ns in n8n espocrm; do
          echo "--- $ns ---"
          $KCTL get netpol baseline -n "$ns" -o jsonpath='{.spec.ingress}' | grep -oE 'cidr: [0-9./]+|"cidr": ?"[0-9./]+"|[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+' | sort -u || true
        done
