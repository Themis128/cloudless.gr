name: PR Review (Agentic)

# Uses CodingAgent for structured patch proposals and GitHub Copilot integration.
# Generates review comments and auto-proposes fixes for actionable issues.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

# One review per PR branch at a time; cancel stale runs on new push
concurrency:
  group: pr-review-agentic-${{ github.event.pull_request?.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # for OIDC → AWS (to fetch ANTHROPIC_API_KEY from SSM)

jobs:
  review:
    name: Agentic PR Review
    # Failover-capable: defaults to ubuntu-latest. Flip via
    #   .github/scripts/toggle-runner.sh pi
    runs-on: ubuntu-latest
    # Skip bots, dependabot, and revert branches
    if: |
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'revert/')

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Anthropic SDK
        run: pnpm add -D @anthropic-ai/sdk --no-lockfile

      # Reuse the OIDC role already configured for deploys
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Anthropic API key from SSM
        run: |
          KEY=$(aws ssm get-parameter \
            --name /cloudless/production/ANTHROPIC_API_KEY \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build diff (src/ + root configs vs base branch)
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" \
            -- 'src/**' 'sentry.*.config.ts' 'instrumentation.ts' \
            > pr.diff
          LINES=$(wc -l < pr.diff)
          echo "Diff: $LINES lines"
          echo "diff_lines=$LINES" >> "$GITHUB_OUTPUT"
        id: diff

      - name: Run Agentic PR Review
        id: review
        env:
          PR_NUMBER: ${{ github.event.pull_request?.number || github.event.inputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request?.title || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: |
          # Run the agentic review script
          node scripts/pr-review-agentic.mjs
          echo "review_complete=true" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        if: steps.review.outputs.review_complete == 'true' && steps.diff.outputs.diff_lines > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request?.number || github.event.inputs.pr_number }}
        run: |
          # Update existing bot comment if present, otherwise create new
          gh pr comment "${{ github.event.pull_request?.number || github.event.inputs.pr_number }}" \
            --body-file review.md \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request?.number || github.event.inputs.pr_number }}" \
            --body-file review.md

  auto-fix:
    name: Auto-fix actionable issues
    needs: review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      needs.review.outputs.fixable_issues == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Summarize fixable issues
        run: |
          echo "Fixable issues detected — Copilot can address these in a follow-up"
          cat fixable_issues.txt 2>/dev/null || echo "No specific fix issues listed"