name: PR Review (Agentic)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: pr-review-agentic-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  review:
    name: Agentic PR review
    # Failover-capable: defaults to ubuntu-latest. Flip via
    #   .github/scripts/toggle-runner.sh pi
    # when GH-hosted billing is broken.
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Determine PR number
        id: pr
        run: |
          REF='${{ github.event.workflow_run.head_branch }}'
          # Parse PR number from branch like 'feature/123-something' or 'fix/456-issue'
          PR_NUM=$(echo "$REF" | grep -oE '[0-9]+' | head -1)
          if [ -z "$PR_NUM" ]; then
            # Try to get PR from commit SHA
            SHA='${{ github.event.workflow_run.head_sha }}'
            PR_DATA=$(gh api repos/${{ github.repository }}/commits/$SHA/pulls --jq '.[] | select(.state == "open") | .number')
            PR_NUM=$(echo "$PR_DATA" | head -1)
          fi
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.pr.outputs.pr_number != ''
        with:
          fetch-depth: 0

      - name: Install dependencies
        if: steps.pr.outputs.pr_number != ''
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        if: steps.pr.outputs.pr_number != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch Anthropic API key from SSM
        if: steps.pr.outputs.pr_number != ''
        run: |
          KEY=$(aws ssm get-parameter \
            --name /cloudless/production/ANTHROPIC_API_KEY \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Run agentic PR review
        if: steps.pr.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/pr-review-agentic.mjs
