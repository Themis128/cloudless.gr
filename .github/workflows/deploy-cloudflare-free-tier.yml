name: Deploy to Cloudflare Workers (Cloudflare-only)

# Replaces CloudFront/SST deployment - full migration to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    outputs:
      short_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:ci
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr

      - name: Validate secrets exist
        run: |
          [[ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]] || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      - name: Resolve SHA
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Full SHA: ${GITHUB_SHA}"
          echo "Short SHA: ${SHA}"

  build-assets:
    name: Build Assets
    needs: build-and-validate
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Extract static assets and upload to R2
        run: pnpm cf:r2:upload-static
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-worker:
    name: Deploy to Cloudflare Workers
    needs: [build-and-validate, build-assets]
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '"ubuntu-latest"') }}
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Backup database before migration
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          npx wrangler d1 export user-auth-db --output ./backup_${TIMESTAMP}.sql 2>/dev/null || echo "Backup skipped (new database or no tables yet)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        id: aws
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Resolve Cloudflare account ID
        id: cf_account
        run: |
          # Prefer SSM value, fallback to hardcoded (legacy for migration)
          ACCOUNT_ID=$(aws ssm get-parameter \
            --name "/cloudless/production/CLOUDFLARE_ACCOUNT_ID" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$ACCOUNT_ID" ] || [ "$ACCOUNT_ID" = "None" ]; then
            ACCOUNT_ID="fb7dc7b69b6624280cd5961a4d1913c78"
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy to Workers (Production)
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf_account.outputs.account_id }}
          command: deploy --config wrangler-cloudflare-free.json --env=production
          wranglerVersion: "4.15.0"
          workingDirectory: .

      - name: Health check
        run: |
          sleep 10
          curl -sf https://cloudless.gr/api/health || exit 1
          echo "✅ Production health check passed"

      - name: Verify D1 auth post-deploy
        run: |
          set -uo pipefail
          # Check that the D1 auth endpoint responds (requires SESSION_SECRET to be set)
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' https://cloudless.gr/api/auth/session || echo "000")
          if [[ "$HTTP_CODE" =~ ^(200|401|503)$ ]]; then
            echo "✅ D1 auth endpoint responding (HTTP $HTTP_CODE - 200=user, 401=no session, 503=D1 not configured)"
          else
            echo "::warning::D1 auth endpoint returned HTTP $HTTP_CODE"
          fi

      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://cloudless.gr',
              context: 'Cloudflare Workers',
              description: 'Deployed to production'
            });

      - name: Record deploy SHA to SSM
        if: steps.aws.outcome == 'success'
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/cloud-sha \
            --value "${{ github.sha }}" \
            --type String --overwrite --region us-east-1

# To set secrets for the first time, run locally:
# npx wrangler secret put SESSION_SECRET
# npx wrangler secret put STRIPE_SECRET_KEY
# npx wrangler secret put STRIPE_WEBHOOK_SECRET
# npx wrangler secret put AUTH_SECRET
# npx wrangler secret put SLACK_WEBHOOK_URL
# npx wrangler secret put SLACK_BOT_TOKEN
# npx wrangler secret put SLACK_SIGNING_SECRET
# npx wrangler secret put ANTHROPIC_API_KEY