name: Deploy to Cloudflare Workers (Free Tier)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'

jobs:
  # Deploy main Worker
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
       - uses: actions/setup-node@v4
         with:
           node-version: 22
           cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      
      # Build for Workers (standalone)
      - run: pnpm run cf:build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
      
      # Set secrets for the Worker
      - run: |
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler secret put STRIPE_SECRET_KEY --env=production
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env=production
          echo "${{ secrets.AUTH_SECRET }}" | npx wrangler secret put AUTH_SECRET --env=production
          echo "${{ secrets.SLACK_WEBHOOK_URL }}" | npx wrangler secret put SLACK_WEBHOOK_URL --env=production
          echo "${{ secrets.SLACK_BOT_TOKEN }}" | npx wrangler secret put SLACK_BOT_TOKEN --env=production
          echo "${{ secrets.SLACK_SIGNING_SECRET }}" | npx wrangler secret put SLACK_SIGNING_SECRET --env=production
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY --env=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      # Deploy to Workers
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env=production

      # Write deploy SHA to SSM for drift detection
      - name: record deploy sha
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-actions
          aws-region: us-east-1
      - name: put cloud-sha ssm param
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/cloud-sha \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

  # Migrate SSM -> Wrangler secrets weekly
  sync-secrets:
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      
      # Run secret sync script
      - run: pnpm tsx scripts/sync-ssm-to-wrangler.ts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # D1 migrations
  d1-migrate:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      
      # Apply migrations to D1
      - run: |
          for migration in migrations/*.sql; do
            npx wrangler d1 execute user-auth-db --file="$migration" --env=production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # R2 backup (daily)
  r2-backup:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: pnpm tsx scripts/r2-backup.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}