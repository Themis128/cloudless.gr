name: Deploy to Cloudflare Workers (Cloudflare-only)

# Replaces CloudFront/SST deployment - full migration to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'

jobs:
  build-and-validate:
    name: Build and Validate
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .next/cache
            ~/.pnpm-store
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      - name: Resolve SHA
        id: meta
        run: |
          SHA="${GITHUB_SHA::12}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Full SHA: ${GITHUB_SHA}"
          echo "Short SHA: ${SHA}"

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint check
        run: pnpm lint

  build-assets:
    name: Build Assets
    needs: build-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Restore build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .next/cache
            ~/.pnpm-store
          key: build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Extract static assets and upload to R2
        run: pnpm cf:r2:upload-static
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-worker:
    name: Deploy to Cloudflare Workers
    needs: [build-and-validate, build-assets]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Next.js for static export
        run: |
          rm -rf ./out
          NEXT_OUTPUT_STANDALONE=1 pnpm build

      - name: Deploy to Workers (Production)
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env=production

      - name: Configure AWS credentials (OIDC)
        id: aws
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Record deploy SHA to SSM
        if: steps.aws.outcome == 'success'
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/cloud-sha \
            --value "${{ github.sha }}" \
            --type String --overwrite --region us-east-1

  # D1 migrations (only on scheduled runs or manual dispatch)
  d1-migrate:
    name: D1 Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply migrations to D1
        run: |
          for migration in migrations/*.sql; do
            npx wrangler d1 execute user-auth-db --file="$migration" --env=production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# To set secrets for the first time, run locally:
# npx wrangler secret put SESSION_SECRET
# npx wrangler secret put STRIPE_SECRET_KEY
# npx wrangler secret put STRIPE_WEBHOOK_SECRET
# npx wrangler secret put AUTH_SECRET
# npx wrangler secret put SLACK_WEBHOOK_URL
# npx wrangler secret put SLACK_BOT_TOKEN
# npx wrangler secret put SLACK_SIGNING_SECRET
# npx wrangler secret put ANTHROPIC_API_KEY