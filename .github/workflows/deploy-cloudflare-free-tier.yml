name: Deploy to Cloudflare Workers (Cloudflare-only)
# Replaces CloudFront/SST deployment - full migration to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'

jobs:
  # Build static assets for the Worker
  build-assets:
    runs-on: ubuntu-latest
    outputs:
      assets_ready: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      # Build Next.js
      - run: pnpm cf:build
        env:
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr

      # Deploy assets to R2 (requires CLOUDFLARE_API_TOKEN)
      - run: pnpm cf:r2:upload-dir
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Deploy main Worker with both domains
  deploy-worker:
    runs-on: ubuntu-latest
    needs: build-assets
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      # Deploy to Workers (handles both cloudless.gr and www.cloudless.gr)
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --env=production

      # Write deploy SHA to SSM for drift detection
      - name: record deploy sha
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::278585680617:role/cloudless-github-actions
          aws-region: us-east-1
      - name: put cloud-sha ssm param
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/cloud-sha \
            --value "${{ github.sha }}" \
            --type String \
            --overwrite

  # D1 migrations (only on scheduled runs or manual dispatch)
  d1-migrate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}

      - name: pin pnpm store to persistent local path
        run: |
          mkdir -p "$HOME/.pnpm-store"
          pnpm config set store-dir "$HOME/.pnpm-store"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prefer-offline

      # Apply migrations to D1
      - run: |
          for migration in migrations/*.sql; do
            npx wrangler d1 execute user-auth-db --file="$migration" --env=production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# To set secrets for the first time, run locally:
# npx wrangler secret put SESSION_SECRET
# npx wrangler secret put STRIPE_SECRET_KEY
# npx wrangler secret put STRIPE_WEBHOOK_SECRET
# npx wrangler secret put AUTH_SECRET
# npx wrangler secret put SLACK_WEBHOOK_URL
# npx wrangler secret put SLACK_BOT_TOKEN
# npx wrangler secret put SLACK_SIGNING_SECRET
# npx wrangler secret put ANTHROPIC_API_KEY