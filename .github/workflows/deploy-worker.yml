name: Deploy Cloudflare Worker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - "src/index.ts"
      - "src/agents/**"
      - "wrangler.jsonc"
      - "worker-configuration.d.ts"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 22

      - name: Get Cloudflare token from SSM
        id: token
        run: |
          set -e
          TOKEN=$(aws ssm get-parameter \
            --name /cloudless/production/CLOUDFLARE_API_TOKEN \
            --with-decryption --region us-east-1 \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "None" ]; then
            echo "::error::No Cloudflare token in SSM or parameter not found"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: fb7dc7b69b662480cd5961a4d1913c78
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.value }}
        run: wrangler deploy

      - name: Verify Deployment
        run: |
          echo "Checking /api/agents/counter-agent/default/status endpoint..."
          curl -s -o /dev/null -w "%{http_code}" https://cloudless.gr/api/agents/counter-agent/default/status || true