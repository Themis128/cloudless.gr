name: 'ETL: LinkedIn Ads to R2'
# LinkedIn Ads insights → R2. Feeds admin datalake linkedin_ads.

on:
  schedule:
  - cron: 20 6 * * *       # daily 06:20 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etl-linkedin-ads-to-r2
  cancel-in-progress: false

jobs:
  etl:
    name: Run LinkedIn Ads → R2 sync
    runs-on: [self-hosted, omv, build]
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.3.1

    - name: Set up Node.js 22
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: scripts/etl
      run: |
        corepack enable || true
        corepack prepare pnpm@latest --activate || true
        pnpm install --frozen-lockfile --prod

    - name: Run LinkedIn-ads-to-R2 sync
      working-directory: scripts/etl
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_AD_ACCOUNT_ID: ${{ secrets.LINKEDIN_AD_ACCOUNT_ID }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
        CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      run: node linkedin-ads-to-r2.mjs

    - name: Notify Slack on failure
      if: failure()
      uses: actions/github-script@v9.0.0
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          if (process.env.SLACK_WEBHOOK_URL) {
            const payload = {
              text: `ETL: LinkedIn Ads to R2 failed in workflow run ${context.runId}`,
              blocks: [{
                type: "section",
                text: { type: "mrkdwn", text: ":x: ETL: LinkedIn Ads to R2 failed" }
              }]
            };
            fetch(process.env.SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            }).catch(() => {});
          }
