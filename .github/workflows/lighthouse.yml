name: Lighthouse Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Workers + k3s']
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit (default: full route sweep)'
        default: ''
      strict:
        description: 'Fail on any threshold miss (default: warn-only for root URL)'
        type: boolean
        default: false
  schedule:
    # Daily at 04:00 UTC — independent of deploys so we catch regressions on
    # the live site even between releases.
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: Performance Audit
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          dest: ~/setup-pnpm-${{ runner.name }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The omv runner is arm64 and has no system Chrome/Chromium. Reuse the
      # same Playwright-bundled Chromium that a11y-audit.yml uses; it has
      # arm64 builds from Chrome for Testing.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Locate Chromium binary
        run: |
          CHROME_BIN=$(find ~/.cache/ms-playwright -path '*chromium-*/chrome-*/chrome' -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "::error::Could not locate Playwright Chromium binary under ~/.cache/ms-playwright"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using CHROME_PATH=$CHROME_BIN"

      - name: Warm CDN cache
        run: |
          for url in \
            https://cloudless.gr/en \
            https://cloudless.gr/en/services \
            https://cloudless.gr/en/contact \
            https://cloudless.gr/en/store; do
            curl -s -o /dev/null -w "%{url_effective} → %{http_code} (%{time_total}s)\n" "$url"
            # Second hit warms the bundle in the edge / origin cache
            curl -s -o /dev/null "$url"
          done

      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: .github/lighthouserc.js
          urls: |
            ${{ github.event.inputs.url || 'https://cloudless.gr' }}
            ${{ github.event.inputs.url || 'https://cloudless.gr/en' }}
            ${{ github.event.inputs.url || 'https://cloudless.gr/en/services' }}
            ${{ github.event.inputs.url || 'https://cloudless.gr/en/contact' }}
            ${{ github.event.inputs.url || 'https://cloudless.gr/en/store' }}
          # 5 runs per URL → median absorbs single-run CI variance. TBT alone
          # has been observed to swing 11x between runs on identical infra,
          # and the homepage with charts + carousel has scored 0.61, 0.64, 0.75
          # across consecutive runs on the same SHA. 5 runs gives a stabler
          # median than 3 at ~+15% wall time.
          runs: 5
          budgetPath: .github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Surface per-route scores inline
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          STRICT: ${{ github.event.inputs.strict || 'false' }}
        run: |
          set -e
          # ── Guard: validate manifest JSON before parsing ──
          if [ -z "$MANIFEST" ]; then
            echo "::error::Lighthouse manifest output is empty"
            exit 1
          fi
          if ! echo "$MANIFEST" | jq empty 2>/dev/null; then
            echo "::error::Lighthouse manifest is not valid JSON"
            echo "Raw manifest: $MANIFEST"
            exit 1
          fi

          # Group multi-run manifest by URL and reduce to the median per metric.
          MEDIANS=$(echo "$MANIFEST" | jq '[
            group_by(.url)[]
            | {
                url: .[0].url,
                perf: ([.[].summary.performance]        | sort | .[(length / 2) | floor]),
                a11y: ([.[].summary.accessibility]      | sort | .[(length / 2) | floor]),
                bp:   ([.[].summary["best-practices"]]  | sort | .[(length / 2) | floor]),
                seo:  ([.[].summary.seo]                | sort | .[(length / 2) | floor]),
                runs: length
              }
          ]')

          # Persist the medians as a build artifact for the aggregator workflow.
          mkdir -p audit-report
          echo "$MEDIANS" > audit-report/lighthouse-medians.json
          cp -r .lighthouseci audit-report/lighthouseci || true

          {
            echo "## 🔦 Lighthouse Results (median of 5 runs)"
            echo ""
            echo "| Route | Perf | A11y | Best Practices | SEO | Runs |"
            echo "|-------|------|------|----------------|-----|------|"
          } >> "$GITHUB_STEP_SUMMARY"

          ROWS=$(echo "$MEDIANS" | jq -r '.[] |
            "| \(.url) | \((.perf * 100) | round) | \((.a11y * 100) | round) | \((.bp * 100) | round) | \((.seo * 100) | round) | \(.runs) |"
          ')
          echo "$ROWS" >> "$GITHUB_STEP_SUMMARY"
          echo "$ROWS"

          # ── Score thresholds ──
          # All pages use the same 0.65 performance floor. The home route,
          # locale roots, and /services previously had a 0.60 floor due to
          # CI variance from heavy content (animations, carousels, GSC).
          # After consistent CLS/LCP optimisation passes, all routes now
          # median well above 0.70, so the tiered threshold is removed.
          PAGE_PERF_MIN=0.65
          A11Y_MIN=0.90
          BP_MIN=0.90
          SEO_MIN=0.90
          
          FAILED=$(echo "$MEDIANS" | jq -r --argjson page "$PAGE_PERF_MIN" \
            --argjson a11y "$A11Y_MIN" --argjson bp "$BP_MIN" --argjson seo "$SEO_MIN" '
            [.[] | . as $row |
              ($row.perf < $page)
                or ($row.a11y < $a11y)
                or ($row.bp < $bp)
                or ($row.seo < $seo)
              | select(. == true) | $row.url
            ] | .[]
          ')

          FAILED_COUNT=$(echo -n "$FAILED" | grep -c '^' || true)

          if [ "${FAILED_COUNT:-0}" -gt 0 ]; then
            {
              echo ""
              echo "❌ **$FAILED_COUNT route(s) fell below score thresholds.**"
              echo ""
              echo '```'
              echo "$FAILED"
              echo '```'
              echo ""
              echo "Thresholds: Perf ≥ 65, A11y/BP/SEO ≥ 90 (median of 5 runs)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILED"
            if [ "$STRICT" = "true" ] || [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
              # Hard fail in workflow_dispatch (when strict=true) or
              # post-deploy runs (workflow_run). Scheduled runs warn-only so
              # nightly perf dips don't page the team.
              if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$STRICT" != "true" ]; then
                echo "::warning::Scheduled run: emitting warning instead of failure."
                exit 0
              fi
              exit 1
            fi
            echo "::warning::Failures detected but strict=false on a manual run — not failing."
          else
            {
              echo ""
              echo "✅ All routes passed Lighthouse score thresholds (median of 5 runs)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse report bundle
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: audit-report/
          retention-days: 30
          if-no-files-found: warn
