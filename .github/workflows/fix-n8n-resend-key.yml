name: Fix — patch RESEND_API_KEY into n8n-integrations secret

# One-shot: reads RESEND_API_KEY from the running cloudless-app pod and
# patches it into n8n-integrations so the stripe-automation workflow can
# send emails. Delete this file once n8n is confirmed working.
#
# Runs on the Pi self-hosted runner (has kubectl + the app pod is reachable).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-n8n-resend-key.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-resend-key:
    name: Patch RESEND_API_KEY into n8n-integrations
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    steps:
    - name: Read RESEND_API_KEY from cloudless-app pod and patch secret
      run: |
        APP_POD=$(sudo kubectl get pods -n cloudless -l app=cloudless-app \
          -o jsonpath='{.items[0].metadata.name}')
        echo "App pod: $APP_POD"

        RESEND_KEY=$(sudo kubectl exec -n cloudless "$APP_POD" -- \
          printenv RESEND_API_KEY 2>/dev/null || true)

        if [ -z "$RESEND_KEY" ]; then
          echo "Not in pod env, trying SSM..."
          RESEND_KEY=$(aws ssm get-parameter \
            --name /cloudless/production/RESEND_API_KEY \
            --with-decryption \
            --query Parameter.Value \
            --output text 2>/dev/null || true)
        fi

        if [ -z "$RESEND_KEY" ]; then
          echo "::error::RESEND_API_KEY not found in pod env or SSM"
          exit 1
        fi

        sudo kubectl patch secret n8n-integrations -n n8n \
          --type merge \
          -p "{\"stringData\":{\"RESEND_API_KEY\":\"$RESEND_KEY\"}}"

        echo "Secret patched. Key length: ${#RESEND_KEY} chars."

    - name: Restart n8n to pick up the new secret value
      run: |
        sudo kubectl rollout restart deployment/n8n -n n8n
        sudo kubectl rollout status deployment/n8n -n n8n --timeout=90s

    - name: Verify n8n is healthy
      run: |
        for i in $(seq 1 8); do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 5 http://127.0.0.1:30900/healthz 2>/dev/null || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "n8n healthy (attempt $i)"
            exit 0
          fi
          echo "attempt $i: HTTP $CODE — waiting…"
          sleep 10
        done
        echo "::error::n8n did not become healthy"
        exit 1
