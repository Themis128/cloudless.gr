name: Setup Pi Cloudflare Tunnel

# Creates and configures the Cloudflare Tunnel for the Pi k3s cluster.
# This tunnel exposes the Pi as pi-origin.cloudless.gr with automatic HTTPS
# at the Cloudflare edge. After this tunnel is live, the LB will route traffic
# to Pi as primary (instead of AWS CloudFront).
#
# Prerequisites (one-time setup):
#   1. Cloudflare API token with Tunnel permissions stored in SSM
#      /cloudless/production/CLOUDFLARE_API_TOKEN
#   2. CLOUDFLARE_ACCOUNT_ID in SSM /cloudless/production/
#
# This workflow:
#   1. Creates the tunnel (if it doesn't exist)
#   2. Gets the tunnel credentials token
#   3. Stores the token in SSM /cloudless/production/TUNNEL_TOKEN
#   4. Posts the tunnel ID + DNS info to issue #382

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/setup-pi-tunnel.yml"

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  setup-tunnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get Cloudflare credentials from SSM
        id: cf
        run: |
          CF_TOKEN=$(aws ssm get-parameter --name /cloudless/production/CLOUDFLARE_API_TOKEN --with-decryption --query Parameter.Value --output text)
          CF_ACCOUNT=$(aws ssm get-parameter --name /cloudless/production/CLOUDFLARE_ACCOUNT_ID --query Parameter.Value --output text)
          echo "CF_TOKEN=${CF_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "CF_ACCOUNT=${CF_ACCOUNT}" >> "$GITHUB_OUTPUT"

      - name: Install cloudflared
        run: |
          curl -L https://bin.equinox.io/c/VdrWdbjqyF/cloudflared-stable-linux-arm64.tgz | tar xz
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Create tunnel (idempotent)
        id: tunnel
        env:
          CF_TOKEN: ${{ steps.cf.outputs.CF_TOKEN }}
          CF_ACCOUNT: ${{ steps.cf.outputs.CF_ACCOUNT }}
        run: |
          # Try to get existing tunnel
          TUNNEL_ID=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/tunnel/list" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -r '.result[] | select(.name=="cloudless-pi") | .id' 2>/dev/null || true)
          
          if [ -n "$TUNNEL_ID" ]; then
            echo "tunnel_id=${TUNNEL_ID}" >> "$GITHUB_OUTPUT"
            echo "Tunnel already exists: ${TUNNEL_ID}"
          else
            # Create new tunnel
            TUNNEL_ID=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/tunnel" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"cloudless-pi"}' \
              | jq -r '.result.id')
            echo "tunnel_id=${TUNNEL_ID}" >> "$GITHUB_OUTPUT"
            echo "Created tunnel: ${TUNNEL_ID}"
          fi

      - name: Get tunnel credentials (if new) or list (if exists)
        id: credentials
        env:
          CF_TOKEN: ${{ steps.cf.outputs.CF_TOKEN }}
          CF_ACCOUNT: ${{ steps.cf.outputs.CF_ACCOUNT }}
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
        run: |
          # Check if we already have stored credentials
          STORED_TOKEN=$(aws ssm get-parameter --name /cloudless/production/TUNNEL_TOKEN --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          
          if [ -n "$STORED_TOKEN" ]; then
            echo "token_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tunnel token already stored in SSM"
          else
            # Create credentials for the tunnel
            CREDENTIALS=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/tunnel/${TUNNEL_ID}/token" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              | jq -r '.result')
            echo "token_exists=false" >> "$GITHUB_OUTPUT"
            echo "CREDENTIALS=${CREDENTIALS}" >> "$GITHUB_OUTPUT"
            echo "Created new tunnel credentials"
          fi

      - name: Store tunnel token in SSM
        if: steps.credentials.outputs.token_exists != 'true'
        run: |
          aws ssm put-parameter \
            --name /cloudless/production/TUNNEL_TOKEN \
            --value "${{ steps.credentials.outputs.CREDENTIALS }}" \
            --type SecureString \
            --description "Cloudflare Tunnel token for Pi k3s cluster (pi-origin.cloudless.gr)" \
            --overwrite

      - name: Create/update DNS record for pi-origin
        id: dns
        env:
          CF_TOKEN: ${{ steps.cf.outputs.CF_TOKEN }}
          CF_ACCOUNT: ${{ steps.cf.outputs.CF_ACCOUNT }}
          TUNNEL_ID: ${{ steps.tunnel.outputs.tunnel_id }}
        run: |
          # Get zone ID
          ZONE_ID=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones?name=cloudless.gr" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | jq -r '.result[0].id')
          
          # Check if CNAME exists
          EXISTS=$(curl -sS -X GET "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=CNAME&name=pi-origin" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | jq -r '.result[0].id // empty')
          
          TUNNEL_HOST="${TUNNEL_ID}.cfargotunnel.com"
          
          if [ -n "$EXISTS" ]; then
            # Update existing record
            curl -sS -X PUT "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${EXISTS}" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"pi-origin\",\"content\":\"${TUNNEL_HOST}\",\"ttl\":1,\"proxied\":true}"
            echo "Updated DNS record pi-origin -> ${TUNNEL_HOST}"
          else
            # Create new record
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"pi-origin\",\"content\":\"${TUNNEL_HOST}\",\"ttl\":1,\"proxied\":true}"
            echo "Created DNS record pi-origin -> ${TUNNEL_HOST}"
          fi
          
          echo "tunnel_host=${TUNNEL_HOST}" >> "$GITHUB_OUTPUT"

      - name: Post result to tracking issue
        run: |
          {
            echo "# Pi Cloudflare Tunnel — $(date -u '+%F %T')Z"
            echo ""
            echo "**Tunnel ID:** ${{ steps.tunnel.outputs.tunnel_id }}"
            echo "**Tunnel Endpoint:** ${{ steps.dns.outputs.tunnel_host }}"
            echo "**DNS:** pi-origin.cloudless.gr -> CNAME (proxied) to tunnel"
            echo "**Next Steps:**"
            echo "  1. Deploy k8s/tunnel/pi-tunnel.yaml to the Pi cluster"
            echo "  2. Verify: curl -sI https://pi-origin.cloudless.gr/api/health"
            echo "  3. Run cloudflare-lb.yml with apply=true to route traffic to Pi"
            echo ""
            echo "After deployment, update k8s/cloudless-app-optimized.yaml to use port 80 (tunnel -> service)."
          } > c.md
          gh issue comment 382 --repo "${{ github.repository }}" --body-file c.md