name: Sync GitHub Secrets → GitHub Variables

# Copies secrets that are stored as GitHub Secrets (not in SSM) to
# GitHub Variables so Claude Code cloud sessions can read them via API.
# Fires when this file is pushed to main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-secrets-to-vars.yml

permissions:
  contents: read
  actions: write    # create/update repo variables

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Sync secrets to variables
        run: |
          set -euo pipefail

          upsert_var() {
            local KEY="$1" VALUE="$2"
            local STATUS
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/actions/variables/${KEY}" \
              -d "{\"name\":\"${KEY}\",\"value\":$(echo "$VALUE" | jq -Rs .)}")

            if [ "$STATUS" = "204" ]; then
              echo "  updated: $KEY"
            else
              curl -s -o /dev/null \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.github.com/repos/${REPO}/actions/variables" \
                -d "{\"name\":\"${KEY}\",\"value\":$(echo "$VALUE" | jq -Rs .)}"
              echo "  created: $KEY"
            fi
          }

          upsert_var "NOTION_API_KEY"           "${{ secrets.NOTION_API_KEY }}"
          upsert_var "NOTION_BLOG_DB_ID"        "${{ secrets.NOTION_BLOG_DB_ID }}"
          upsert_var "NOTION_DOCS_DB_ID"        "${{ secrets.NOTION_DOCS_DB_ID }}"
          upsert_var "NOTION_SUBMISSIONS_DB_ID" "${{ secrets.NOTION_SUBMISSIONS_DB_ID }}"
          upsert_var "NOTION_GSC_REPORTS_DB_ID" "${{ secrets.NOTION_GSC_REPORTS_DB_ID }}"
          upsert_var "NEWSLETTER_SEND_SECRET"   "${{ secrets.NEWSLETTER_SEND_SECRET }}"
          upsert_var "SENTRY_AUTH_TOKEN"        "${{ secrets.SENTRY_AUTH_TOKEN }}"
          upsert_var "SLACK_WEBHOOK_URL"        "${{ secrets.SLACK_WEBHOOK_URL }}"

          echo "Done."
