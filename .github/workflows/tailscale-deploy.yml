name: Deploy Tailscale Operator
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    # Runs on the omv box — the tailnet-API path from a hosted runner
    # dies when the operator is down (exactly when this is needed).
    runs-on: [self-hosted, omv]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Check required secrets
      run: |
        CLIENT_ID="${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}"
        if [ -z "$CLIENT_ID" ]; then
          CLIENT_ID="${{ secrets.TS_CLIENT_ID }}"
        fi
        CLIENT_SECRET="${{ secrets.TAILSCALE_OAUTH_SECRET }}"
        if [ -z "$CLIENT_SECRET" ]; then
          CLIENT_SECRET="${{ secrets.TS_CLIENT_SECRET }}"
        fi
        if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
          echo "::error::Missing Tailscale OAuth credentials"
          echo "Set either TAILSCALE_OAUTH_CLIENT_ID/TAILSCALE_OAUTH_SECRET or TS_CLIENT_ID/TS_CLIENT_SECRET"
          exit 1
        fi
        echo "Using client ID: ${CLIENT_ID:0:4}..."
        echo "TS_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
        echo "TS_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV

    - name: Setup kubectl
      run: |
        sudo chmod 644 /etc/rancher/k3s/k3s.yaml 2>/dev/null || true
        kubectl cluster-info || echo "Warning: Could not reach cluster, but continuing"

    - name: Deploy Tailscale Operator (Helm)
      run: |
        echo "=== Deploying Tailscale Operator ==="
        if ! command -v helm >/dev/null; then
          echo "installing helm"
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash
        fi
        helm repo add tailscale https://pkgs.tailscale.com/helmcharts || true
        helm repo update
        # Adopt ALL tailscale CRDs installed under a different release ns —
        # helm refuses to import them otherwise (release-namespace error).
        # The list grows (connectors, proxygroups, dnsconfigs, ...), so scan
        # the CRDs rather than hardcode names.
        for crd in $(kubectl get crd -o name | grep tailscale.com); do
          kubectl annotate crd "${crd#customresourcedefinition.apiextensions.k8s.io/}" \
            meta.helm.sh/release-name=tailscale-operator \
            meta.helm.sh/release-namespace=tailscale --overwrite
          kubectl label crd "${crd#customresourcedefinition.apiextensions.k8s.io/}" \
            app.kubernetes.io/managed-by=Helm --overwrite
        done
        helm upgrade --install tailscale-operator tailscale/tailscale-operator \
          --namespace tailscale \
          --create-namespace \
          --set-string oauth.clientID="${{ env.TS_CLIENT_ID }}" \
          --set-string oauth.clientSecret="${{ env.TS_CLIENT_SECRET }}" \
          --set operatorLogLevel=info \
          --timeout 300s --wait=false

    - name: Verify deployment
      if: always()
      run: |
        echo "=== Verifying Tailscale Operator deployment ==="
        kubectl get pods -n tailscale-operator -o wide; kubectl get pods -n tailscale -o wide || echo "Could not reach cluster"
        kubectl get ProxyGroup -n tailscale-operator -o wide 2>/dev/null || echo "No ProxyGroups found"
