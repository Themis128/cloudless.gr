name: Deploy Tailscale Operator

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Namespace to deploy to'
        required: false
        default: 'tailscale-operator'
  push:
    branches: [main]
    paths:
      - 'infrastructure/tailscale/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Check required secrets
        run: |
          # Support both naming conventions: TS_* (preferred) and TAILSCALE_OAUTH_* (legacy)
          TS_CLIENT_ID="${{ secrets.TS_CLIENT_ID }}${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}"
          TS_CLIENT_SECRET="${{ secrets.TS_CLIENT_SECRET }}${{ secrets.TAILSCALE_OAUTH_SECRET }}"
          if [ -z "$TS_CLIENT_ID" ] || [ -z "$TS_CLIENT_SECRET" ]; then
            echo "::error::Tailscale OAuth credentials missing"
            echo "Need: TS_CLIENT_ID/TS_CLIENT_SECRET or TAILSCALE_OAUTH_CLIENT_ID/TAILSCALE_OAUTH_SECRET"
            exit 1
          fi
          echo "Tailscale OAuth credentials available"

      - name: Join Tailscale for cluster access
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      - name: Add Tailscale Helm repository
        run: |
          helm repo add tailscale https://pkgs.tailscale.com/helmcharts
          helm repo update

      - name: Check k3s API connectivity
        id: check
        run: |
          echo "=== Checking k3s API connectivity ==="
          if nc -zv -w3 100.74.191.58 6443 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ k3s API is reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "::warning::k3s API (100.74.191.58:6443) not reachable"
            echo "Cluster may be offline - run tailscale-reconnect-agent workflow to recover"
          fi

      - name: Create/update Tailscale OAuth secret
        if: steps.check.outputs.reachable == 'true'
        run: |
          # Use TS_CLIENT_ID env var set above (falls back to TAILSCALE_OAUTH_* if TS_* not set)
          kubectl create secret generic tailscale-operator-secrets \
            -n tailscale-operator \
            --from-literal=TS_CLIENT_ID="${{ secrets.TS_CLIENT_ID }}${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}" \
            --from-literal=TS_CLIENT_SECRET="${{ secrets.TS_CLIENT_SECRET }}${{ secrets.TAILSCALE_OAUTH_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Tailscale Operator via Helm
        if: steps.check.outputs.reachable == 'true'
        run: |
          helm upgrade --install tailscale-operator tailscale/tailscale-operator \
            --namespace tailscale-operator \
            --create-namespace \
            --set-string oauth.clientID="${{ secrets.TS_CLIENT_ID }}${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}" \
            --set-string oauth.clientSecret="${{ secrets.TS_CLIENT_SECRET }}${{ secrets.TAILSCALE_OAUTH_SECRET }}" \
            --set operatorLogLevel=info \
            --wait

      - name: Deploy ProxyClass
        if: steps.check.outputs.reachable == 'true'
        run: |
          kubectl apply -f infrastructure/tailscale/proxyclass-monitoring.yaml

      - name: Deploy ProxyGroup and Subnet Router
        if: steps.check.outputs.reachable == 'true'
        run: |
          kubectl apply -f infrastructure/tailscale/subnet-router.yaml
          kubectl apply -f infrastructure/tailscale/proxygroup-monitoring.yaml

      - name: Deploy Tailscale Ingress Class and Ingresses
        if: steps.check.outputs.reachable == 'true'
        run: |
          kubectl apply -f infrastructure/tailscale/ingress-class.yaml
          kubectl apply -f infrastructure/tailscale/ingresses.yaml

      - name: Verify deployment
        if: steps.check.outputs.reachable == 'true'
        run: |
          echo "=== Tailscale Operator Pods ==="
          kubectl get pods -n tailscale-operator -o wide

          echo ""
          echo "=== ProxyGroups ==="
          kubectl get ProxyGroup -n tailscale-operator -o wide

          echo ""
          echo "=== Tailscale Ingresses ==="
          kubectl get ingress -A -o wide | grep tailscale || echo "No tailscale ingresses found"

          echo ""
          echo "=== Tailscale Ingress Class ==="
          kubectl get ingressclass tailscale

      - name: Post status to issue
        if: always()
        run: |
          {
            echo "# Tailscale Operator Deploy - $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            git diff --stat
            echo ""
            if [ "${{ steps.check.outputs.reachable }}" == "true" ]; then
              echo "Deployed resources:"
              kubectl get pods -n tailscale-operator -o name || echo "Could not reach cluster"
            else
              echo "⚠️ k3s cluster was unreachable during deployment"
              echo ""
              echo "To recover: Run 'tailscale-reconnect-agent' workflow to restart Tailscale on Pi"
              echo "Or: Check Pi power status and restart if needed"
            fi
          } | gh issue comment 382 --repo "${{ github.repository }}" --body-file - || true
