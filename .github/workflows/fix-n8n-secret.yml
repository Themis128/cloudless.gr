name: Fix — create n8n-integrations secret

# One-shot: creates (or replaces) the n8n-integrations k8s Secret so the
# n8n pod can start. Triggered by any push that touches this file.
# Delete this file once n8n is healthy and the secret is stable.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-n8n-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-secret:
    name: Create n8n-integrations secret + restart n8n
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Join Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}
        args: --accept-routes

    - name: Configure kubectl
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Create / replace n8n-integrations secret
      env:
        ESPOCRM_API_KEY: ${{ secrets.ESPOCRM_API_KEY }}
      run: |
        # Delete if it already exists (avoids immutable-field conflicts)
        kubectl delete secret n8n-integrations -n n8n --ignore-not-found

        kubectl create secret generic n8n-integrations -n n8n \
          --from-literal=RESEND_API_KEY="" \
          --from-literal=ESPOCRM_BASE_URL="https://espocrm.cloudless.gr" \
          --from-literal=ESPOCRM_API_KEY="${ESPOCRM_API_KEY}"

        echo "Secret created:"
        kubectl get secret n8n-integrations -n n8n

    - name: Restart n8n deployment
      run: |
        kubectl rollout restart deployment/n8n -n n8n
        kubectl rollout status deployment/n8n -n n8n --timeout=120s

    - name: Report pod status
      if: always()
      run: |
        echo "=== n8n pods ==="
        kubectl get pods -n n8n
        echo "=== recent events ==="
        kubectl get events -n n8n --sort-by='.lastTimestamp' | tail -10

    - name: Comment on issue 382
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        STATUS="${{ job.status }}"
        POD=$(kubectl get pods -n n8n --no-headers 2>/dev/null | head -1 || echo "unknown")
        gh issue comment 382 \
          --repo "${{ github.repository }}" \
          --body "**fix-n8n-secret**: ${STATUS} — ${POD}"
