name: Apply Slack App Manifest (AWS SSM retired)

# Manifest apply previously rotated tokens via AWS SSM.
# Use GH secret SLACK_APP_CONFIG_TOKEN (or regenerate via Slack tooling UI)
# and apply locally — AWS path is retired (Cloudflare Free / no SSM).

on:
  workflow_dispatch:
    inputs:
      note:
        description: Ignored — workflow retired pending GH-secret token path
        required: false
        default: ''

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: SSM Slack manifest path retired
        run: |
          echo "::error::slack-manifest-apply no longer uses AWS SSM. Store a Slack app config token as a GitHub secret and apply slack-app.manifest.json with the Slack API / CLI. See skills/slack-app-builder."
          exit 1
