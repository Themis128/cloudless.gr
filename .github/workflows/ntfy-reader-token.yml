name: ntfy archive-reader token mint

# Mints a read-only ntfy user for the SocialAuto notification-archive
# collector (notify_archive_ingest) — the alert topics are ACL'd
# deny-all so the archive cannot subscribe anonymously, and the
# alert-relay publisher token is write-only by design.
#
# Self-fires once when this file lands on main; re-run manually with
# workflow_dispatch to rotate. The token is written into the dedicated
# k8s Secret `ntfy-archive-reader` in the `cloudless` namespace via a
# stdin Secret manifest (same lane as gh-secret-mirror) — never logged,
# never an artifact. Sync it to the cu130-slim .env as NTFY_READER_TOKEN
# (manual or via the Infisical harvest).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ntfy-reader-token.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.1

      - name: Connect to tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:k8s

      - name: Wait for tailnet path to omv
        run: python3 scripts/ci/tailscale-wait.py 100.74.191.58 22

      - name: Configure kubectl via omv SSH
        env:
          OMV_SSH_KEY: ${{ secrets.OMV_SSH_KEY }}
        run: scripts/ci/kubectl-via-omv-ssh.sh

      - name: Mint archive-reader user + ro grants + token
        run: |
          set -euo pipefail
          POD=$(kubectl -n ntfy get pods -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$POD"

          # Random per-run password — the collector authenticates with the
          # minted Bearer token, not the password.
          PASS=$(head -c 24 /dev/urandom | base64 | tr -d '=+/')

          # Idempotent: create the user (ignore "exists"), grant ro on the
          # alert topics, mint a labelled token.
          kubectl -n ntfy exec "$POD" -- sh -c \
            "NTFY_PASSWORD='$PASS' ntfy user add --role=user archive-reader" \
            2>&1 | grep -v "already exists" || true
          kubectl -n ntfy exec "$POD" -- ntfy access archive-reader 'cloudless-*' ro
          kubectl -n ntfy exec "$POD" -- ntfy access archive-reader 'nextcloud-*' ro
          kubectl -n ntfy exec "$POD" -- ntfy access archive-reader 'esp32-*' ro

          TOKEN_LINE=$(kubectl -n ntfy exec "$POD" -- \
            ntfy token add archive-reader --label "archive-reader $(date +%F)")
          TOKEN=$(echo "$TOKEN_LINE" | grep -oE 'tk_[A-Za-z0-9]+')
          test -n "$TOKEN"
          # Mask defensively (kubectl stderr should never echo it anyway).
          echo "::add-mask::$TOKEN"

          # Deliver into the gh-actions-mirror Secret data lane: a stdin
          # manifest keeps the value out of argv/logs; etcd encrypts at
          # rest and the weekly Infisical harvest can pick it up.
          kubectl -n cloudless apply -f - <<MANIFEST
          apiVersion: v1
          kind: Secret
          metadata:
            name: ntfy-archive-reader
            labels:
              app.kubernetes.io/managed-by: github-actions
          type: Opaque
          stringData:
            NTFY_READER_TOKEN: "$TOKEN"
          MANIFEST
          echo "token delivered to k8s Secret cloudless/ntfy-archive-reader"

          # Rotate LAST: only after the new token is stored do we revoke the
          # prior archive-reader tokens — a failure above would otherwise
          # leave the collector with no valid credential. Removal skips the
          # just-minted token and is idempotent per value.
          # Collect first, then iterate — `kubectl exec` would otherwise
          # inherit the pipe and swallow the remaining token lines on the
          # first loop iteration.
          mapfile -t OLD_TOKENS < <(
            kubectl -n ntfy exec "$POD" -- ntfy token list archive-reader \
              | { grep -oE 'tk_[A-Za-z0-9]+' || true; } \
              | { grep -v "^${TOKEN}$" || true; }
          )
          for OLD in "${OLD_TOKENS[@]}"; do
            kubectl -n ntfy exec "$POD" -- ntfy token remove archive-reader "$OLD" || true
          done
          echo "prior archive-reader tokens revoked: ${#OLD_TOKENS[@]}"
