name: Dependency Drift Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  schedule:
    # Weekly Mondays at 06:00 UTC.
  - cron: 0 6 * * 1
  workflow_dispatch:
    inputs:
      open_issue:
        description: Open / update tracking issue on completion
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: deps-drift-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Deps Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v6
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86         # v6.0.10
      with:
        dest: ~/setup-pnpm-${{ runner.name }}
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e         # v6.4.0
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile

    - name: Run drift report
      id: drift
      run: |
        set +e
        mkdir -p audit-report

        # pnpm outdated returns 1 if any package is outdated — that's expected
        pnpm outdated --format json > audit-report/outdated.raw.json 2>/dev/null
        pnpm audit --json > audit-report/audit.raw.json 2>/dev/null || true
        pnpm licenses list --json --prod > audit-report/licenses.raw.json 2>/dev/null || true

        set -e
        node scripts/audit/deps-drift.mjs \
          --outdated audit-report/outdated.raw.json \
          --audit    audit-report/audit.raw.json \
          --licenses audit-report/licenses.raw.json \
          --json     audit-report/deps-drift.json \
          --md       audit-report/deps-drift.md

        {
          cat audit-report/deps-drift.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload deps-drift report
      if: always()
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1         # v4
      with:
        name: deps-drift-report-${{ github.run_id }}
        path: audit-report/
        retention-days: 60
        if-no-files-found: warn

    - name: Update tracking issue
      if: ${{ github.event.inputs.open_issue != 'false' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        TITLE="📦 Weekly Deps Drift Report"
        BODY=$(cat audit-report/deps-drift.md)
        BODY="${BODY}

        ---
        _Auto-updated by deps-drift-audit.yml — run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
        NUM=$(gh issue list --search "$TITLE in:title" --state open --limit 1 --json number -q '.[0].number' || true)
        if [ -n "$NUM" ]; then
          gh issue edit "$NUM" --body "$BODY"
          echo "Updated existing issue #$NUM"
        else
          gh issue create --title "$TITLE" --body "$BODY" --label dependencies,audit
        fi
