name: Cluster Status Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Snapshot of the k3s cluster + node health, written as a JSON+Markdown
# report so the audits-aggregator can show it on /admin/audits alongside
# the perf/security/a11y findings. Covers:
#   - k3s cluster reachability (api server, etcd)
#   - per-node CPU/memory/disk/uptime
#   - non-Ready nodes and the reason
#   - pod summary by namespace (Running/Pending/CrashLoopBackOff)
#   - GH Actions runner inventory (self-hosted Pi fleet)
#   - Tailscale connectivity matrix
#
# Runs from a self-hosted Pi runner (has SSH + kubectl context).
# Uses [omv, pi] — not exclusive `build` (reserved for deploy-pi / build-pi-image).

on:
  schedule:
    # Every 30 min for fast incident detection.
  - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: Fail on any non-Ready node
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cluster-status-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Cluster Status
    # Self-hosted Pi runner — has kubeconfig + tailscale + SSH keys.
    runs-on: [self-hosted, omv, pi]
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd         # v6

    - name: Collect cluster + node + runner status
      id: collect
      env:
        STRICT: ${{ github.event.inputs.strict || 'false' }}
      run: |
        set -e
        mkdir -p audit-report
        bash scripts/audit/cluster-status.sh \
          --json audit-report/cluster.json \
          --md   audit-report/cluster.md
        cat audit-report/cluster.md >> "$GITHUB_STEP_SUMMARY"

        if [ "$STRICT" = "true" ]; then
          BAD=$(node -e "
            const r = require('./audit-report/cluster.json');
            const notReady = (r.nodes || []).filter(n => n.status !== 'Ready').length;
            if (notReady > 0) { console.log(notReady); process.exit(1); }
          ") || {
            echo "::error::Cluster has non-Ready nodes"
            exit 1
          }
        fi

    - name: Upload cluster status report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a         # v4
      with:
        name: cluster-status-report-${{ github.run_id }}
        path: audit-report/
        retention-days: 14
        if-no-files-found: warn
