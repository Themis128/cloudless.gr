name: Postiz crons

# Wakes the app's two Postiz cron endpoints on a schedule:
#
#   /api/cron/postiz-sync         — every 15 min (with GHA jitter, in practice
#                                   every 20-45 min). Safety net for the
#                                   webhook receiver: reconciles calendar
#                                   item status against Postiz state.
#   /api/cron/postiz-oauth-check  — hourly. Pages a Slack alert per disabled
#                                   channel (expired OAuth tokens).
#
# Auth: CRON_SECRET is read from SSM /cloudless/production/CRON_SECRET via
# the existing AWS OIDC deploy role, same pattern as platform-crons.yml.
#
# Kuma push monitors (optional dead-man's switch):
#   KUMA_PUSH_POSTIZ_SYNC   — push token for the postiz-sync monitor
#   KUMA_PUSH_POSTIZ_OAUTH  — push token for the postiz-oauth-check monitor
#
# Manual run: workflow_dispatch with a target picker (defaults to both).

on:
  schedule:
    - cron: "*/15 * * * *" # postiz-sync — every 15 min
    - cron: "5 * * * *" # postiz-oauth-check — 5 min past the hour
  workflow_dispatch:
    inputs:
      target:
        description: "Which cron endpoint(s) to trigger"
        type: choice
        default: both
        options:
          - both
          - postiz-sync
          - postiz-oauth-check

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  BASE_URL: https://cloudless.gr
  KUMA_BASE_URL: "https://kuma.cloudless.gr"

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read CRON_SECRET from SSM
        id: secret
        run: |
          SECRET=$(aws ssm get-parameter \
            --name "/cloudless/production/CRON_SECRET" \
            --with-decryption \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$SECRET" ] || [ "$SECRET" = "None" ]; then
            echo "::error::/cloudless/production/CRON_SECRET is not set in SSM — Postiz crons cannot authenticate."
            exit 1
          fi
          echo "::add-mask::$SECRET"
          echo "value=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Decide targets
        id: targets
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"
          INPUT="${{ github.event.inputs.target }}"
          RUN_SYNC="false"
          RUN_OAUTH="false"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT" in
              both)               RUN_SYNC="true"; RUN_OAUTH="true" ;;
              postiz-sync)        RUN_SYNC="true" ;;
              postiz-oauth-check) RUN_OAUTH="true" ;;
            esac
          elif [ "$SCHEDULE" = "*/15 * * * *" ]; then
            RUN_SYNC="true"
          elif [ "$SCHEDULE" = "5 * * * *" ]; then
            RUN_OAUTH="true"
          fi
          echo "sync=$RUN_SYNC" >> "$GITHUB_OUTPUT"
          echo "oauth=$RUN_OAUTH" >> "$GITHUB_OUTPUT"

      - name: Trigger postiz-sync
        if: steps.targets.outputs.sync == 'true'
        env:
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_POSTIZ_SYNC }}
        run: |
          echo "Calling $BASE_URL/api/cron/postiz-sync"
          HTTP_CODE=$(curl -s -o /tmp/postiz-sync-resp.txt -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 60 \
            -H "Authorization: Bearer ${{ steps.secret.outputs.value }}" \
            "$BASE_URL/api/cron/postiz-sync")
          RESPONSE=$(cat /tmp/postiz-sync-resp.txt 2>/dev/null || echo "")
          echo "HTTP $HTTP_CODE — $RESPONSE"
          echo "## Postiz sync (HTTP $HTTP_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP_CODE" = "200" ]; then
            [ -n "$KUMA_PUSH_TOKEN" ] && \
              curl -fsS --max-time 10 --retry 3 \
                "${KUMA_BASE_URL}/api/push/${KUMA_PUSH_TOKEN}?status=up&msg=postiz-sync+ok" \
                > /dev/null || true
          elif [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "::warning::Postiz upstream returned HTTP $HTTP_CODE — sync skipped"
            [ -n "$KUMA_PUSH_TOKEN" ] && \
              curl -fsS --max-time 10 --retry 3 \
                "${KUMA_BASE_URL}/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=postiz+unreachable+$HTTP_CODE" \
                > /dev/null || true
          else
            [ -n "$KUMA_PUSH_TOKEN" ] && \
              curl -fsS --max-time 10 --retry 3 \
                "${KUMA_BASE_URL}/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=postiz-sync+failed+$HTTP_CODE" \
                > /dev/null || true
            exit 1
          fi

      - name: Trigger postiz-oauth-check
        if: steps.targets.outputs.oauth == 'true'
        env:
          KUMA_PUSH_TOKEN: ${{ secrets.KUMA_PUSH_POSTIZ_OAUTH }}
        run: |
          echo "Calling $BASE_URL/api/cron/postiz-oauth-check"
          HTTP_CODE=$(curl -s -o /tmp/postiz-oauth-resp.txt -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 30 \
            -H "Authorization: Bearer ${{ steps.secret.outputs.value }}" \
            "$BASE_URL/api/cron/postiz-oauth-check")
          RESPONSE=$(cat /tmp/postiz-oauth-resp.txt 2>/dev/null || echo "")
          echo "HTTP $HTTP_CODE — $RESPONSE"
          echo "## Postiz OAuth check (HTTP $HTTP_CODE)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP_CODE" = "200" ]; then
            [ -n "$KUMA_PUSH_TOKEN" ] && \
              curl -fsS --max-time 10 --retry 3 \
                "${KUMA_BASE_URL}/api/push/${KUMA_PUSH_TOKEN}?status=up&msg=postiz-oauth-check+ok" \
                > /dev/null || true
          elif [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
            # Postiz unreachable / not configured — warn but don't fail CI
            echo "::warning::Postiz upstream returned HTTP $HTTP_CODE — OAuth check skipped"
            [ -n "$KUMA_PUSH_TOKEN" ] && \
              curl -fsS --max-time 10 --retry 3 \
                "${KUMA_BASE_URL}/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=postiz+unreachable+$HTTP_CODE" \
                > /dev/null || true
          else
            [ -n "$KUMA_PUSH_TOKEN" ] && \
              curl -fsS --max-time 10 --retry 3 \
                "${KUMA_BASE_URL}/api/push/${KUMA_PUSH_TOKEN}?status=down&msg=postiz-oauth-check+failed+$HTTP_CODE" \
                > /dev/null || true
            exit 1
          fi
