name: Cluster doctor (read-only diagnostics)
# triggered 2026-06-02T22:5X — repo maintenance
# re-triggered 2026-06-03 — post-deploy full-stack verification
# re-triggered 2026-06-03T00:30Z — post-k3s-restart verification (cluster recovered)
# re-triggered 2026-06-03T01:2xZ — pi unresponsive (SSH timeout × 3); checking if recovered
# re-triggered 2026-06-03 — checking stuck Pi runners (deploy pending since 10:13Z)
# re-triggered 2026-06-05 — k3s crash-looped on omv 2026-06-04; checking current state
# re-triggered 2026-06-05T06:40Z — k3s recovered via restart workflow; full pod health check
# re-triggered 2026-06-12 — DISKPRESSUREHIGH (88.59%); running alongside pi-disk-cleanup

# Read-only visibility into the omv k3s cluster from CI. Runs scripts/cluster-
# doctor.sh over Tailscale + KUBECONFIG_B64 and posts the snapshot as a comment
# on the tracking issue, so cluster state (pod health, OOM kills, events, logs)
# is visible without direct cluster access. Does NOT mutate the cluster.
#
# Trigger: workflow_dispatch, or pushing a change to this file / the doctor
# script onto main (path filter).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to post the snapshot to
        required: false
        default: "382"
  push:
    branches: [main]
    paths:
      - .github/workflows/cluster-doctor.yml
      - scripts/cluster-doctor.sh

permissions:
  contents: read
  issues: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    env:
      ISSUE: ${{ github.event.inputs.issue || '382' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.3.1

      - name: Connect to tailnet with OAuth
        id: tailscale-oauth
        continue-on-error: true
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_CLIENT_SECRET }}
          tags: tag:ci

      - name: Connect to tailnet with recovery auth key
        if: steps.tailscale-oauth.outcome == 'failure'
        uses: tailscale/github-action@0263d9e6d793eaefcf1de98ff7fde47abe6664d3 # v3.2.4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Run diagnostics
        run: bash scripts/cluster-doctor.sh | tee snapshot.md

      - name: Post snapshot to tracking issue
        if: always()
        run: |
          if [ ! -s snapshot.md ]; then
            printf '# Cluster snapshot\n\n_doctor produced no output — kubectl likely could not reach the cluster (runner/Tailscale/KUBECONFIG issue)._\n' > snapshot.md
          fi
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file snapshot.md
