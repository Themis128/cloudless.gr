name: Deploy to Cloudflare Workers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "__tests__/**"
      - "public/**"
      - "sst.config.ts"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    environment: production
    # Use Pi build runners (self-hosted, omv, build) which are always available
    # and can handle the build without QEMU overhead. Falls back to GitHub
    # hosted if Pi runners are offline.
    runs-on: ${{ fromJSON(vars.RUNNER_GENERIC || '["self-hosted", "omv", "build"]') }}
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump service worker CACHE_VERSION
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          VERSION=$(printf '%d' "0x${SHORT_SHA:0:4}")
          sed -i "s/const CACHE_VERSION = \"[^\"]*\"/const CACHE_VERSION = \"${VERSION}\"/" public/sw.js
          echo "CACHE_VERSION bumped to ${VERSION} (sha: ${SHORT_SHA})"
          grep "CACHE_VERSION" public/sw.js

      - name: Deploy to Cloudflare Workers
        run: pnpm cf:deploy:free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_AUTH_PROVIDER: d1
          NEXT_PUBLIC_SITE_URL: https://cloudless.gr
          NEXT_PUBLIC_STAGE: production
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: LXkyzmWrAYuY1C6XD6TKaqA31KB72xbUlkimE0vKI8w
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: baltzakisthemiscom
          SENTRY_PROJECT: cloudless-gr
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_ENVIRONMENT: prod
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: prod

      - name: Notify Slack — deploy result
        if: env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS=":white_check_mark: Deploy Succeeded"
          else
            STATUS=":x: Deploy Failed"
          fi
          curl -s --max-time 10 -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"${STATUS} — \`${GITHUB_SHA::7}\` by ${{ github.actor }}\",
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"${STATUS}\", \"emoji\": true}},
                {\"type\": \"section\", \"text\": {\"type\": \"mrkdwn\", \"text\": \"*Stage:* \`production\`\n*Commit:* \`${GITHUB_SHA::7}\`\n*Actor:* ${{ github.actor }}\n*URL:* <https://cloudless.gr|cloudless.gr>\"}},
                {\"type\": \"context\", \"elements\": [{\"type\": \"mrkdwn\", \"text\": \"<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>\"}]}
              ]
            }" || true
