name: Delete keycloak DNS records (auth.cloudless.gr)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  delete:
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find + delete auth.cloudless.gr records
        run: |
          set -e
          # Get the zone ID for cloudless.gr
          ZONE_ID=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=cloudless.gr" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "Zone ID: $ZONE_ID"
          # Find records for auth.cloudless.gr
          RECORDS=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=auth.cloudless.gr")
          echo "$RECORDS" | python3 -m json.tool | head -40
          # Delete each
          IDS=$(echo "$RECORDS" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for r in d.get('result', []):
              print(r['id'], r['type'], r['name'])
          ")
          echo "$IDS" | while read id type name; do
            [ -z "$id" ] && continue
            echo "Deleting $type $name ($id)"
            curl -sS -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" \
              | python3 -m json.tool | head
          done
      - name: Post result
        if: always()
        run: gh issue comment 382 --repo "${{ github.repository }}" --body "Keycloak auth.cloudless.gr DNS cleanup ran. status=${{ job.status }}"
