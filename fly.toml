# Fly.io Proxy Configuration for cloudless.gr
# Free Tier: Automatic HA Failover (Cloudflare → Pi/k3s)
#

app = "cloudless-proxy"
primary_region = "fra"

# Auto-start/stop and HTTPS settings for HA failover
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 0
force_https = true

[env]
FALLBACK_HOST = "github-omv.tail4ecae1.ts.net"
PRIMARY_HOST = "cloudless.gr"

[[services]]
  internal_port = 8080
  protocol = "tcp"

[env]
  # Backends to proxy to
  PRIMARY_HOST = "cloudless.gr"
  FALLBACK_HOST = "omv.tail8eb71.ts.net"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
