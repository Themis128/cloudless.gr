# fly.toml app configuration file generated for cloudless-proxy on 2026-07-12T03:57:30+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "cloudless-proxy"
primary_region = "fra"

# Auto-start/stop and HTTPS settings for HA failover
auto_start_machines = true
auto_stop_machines = true
min_machines_running = 0
force_https = true

[env]
FALLBACK_HOST = "omv.tail8eb71.ts.net"
PRIMARY_HOST = "cloudless.gr"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    x_forwarded_for = true
    xfp = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.checks]]
    grace_period = "10s"
    interval = "30s"
    restart_limit = 0
    timeout = "2s"
    port = 8080
    type = "http"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
