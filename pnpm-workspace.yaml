packages:
  - workers/*
  - scripts/etl


allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  workerd: true
  sharp: false
  unrs-resolver: false
  core-js-pure: true
  esbuild: true

minimumReleaseAgeExclude:
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0

overrides:
  esbuild: '>=0.28.1'
  undici: '8.10.0'
  '@hono/node-server': '2.1.0'
  # Dependabot GHSA (CVE loop-on-size-0): earliest fix 3.3.18; keep nanoid@5 untouched.
  'nanoid@^3': '3.3.18'
  # GHSA-r28c-9q8g-f849: postcss <=8.5.17 vulnerable; pin transitive via next/sentry.
  'postcss': '>=8.5.18'
  # GHSA-x9cq-mdhh-c7v8 (smol-toml quadratic parseKey), GHSA-mq3g-xx2f-4fmf (katex
  # prototype pollution), GHSA-3fj5 (sprintf-js unbounded precision via argparse@1
  # bin script only — 2.x drops sprintf-js entirely).
  'smol-toml@<=1.9.0': '1.9.0'
  'katex@<0.18.2': '0.18.2'
  'argparse@1.0.10': '2.0.1'
  # GHSA-6qxp-vccf-f47h: MCP SDK OAuth client could send credentials to a
  # server-chosen authorization endpoint. Same class for the client package.
  '@modelcontextprotocol/sdk@<1.31.0': '1.31.0'
  '@modelcontextprotocol/client@<2.2.0': '2.2.0'
  # agents@0.25.x pins these three exactly — override the literal specifiers too.
  '@modelcontextprotocol/client@2.0.0': '2.2.0'
  '@modelcontextprotocol/server@2.0.0': '2.2.0'
  'sharp@<0.35.5': '0.35.5'

peerDependencyRules:
  allowedVersions:
    # agents@0.25 pins these peers at exactly 2.0.0 (vulnerable, GHSA-6qxp-vccf-f47h)
    '@modelcontextprotocol/client': '>=2.0.0'
    '@modelcontextprotocol/server': '>=2.0.0'
