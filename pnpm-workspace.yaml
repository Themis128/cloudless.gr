packages:
  - workers/*
  - scripts/etl

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  workerd: true
  sharp: false
  unrs-resolver: false
  core-js-pure: true
  esbuild: true

minimumReleaseAgeExclude:
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0

overrides:
  esbuild: '>=0.28.1'
  undici: '8.10.0'
  '@hono/node-server': '2.1.0'
