packages:
  - workers/*
  - scripts/etl

patchedDependencies:
  vite-node@2.1.9: patches/vite-node@2.1.9.patch

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  workerd: true
  sharp: false
  unrs-resolver: false
  core-js-pure: true
  esbuild: true

minimumReleaseAgeExclude:
  - miniflare@5.20260801.1-alpha
  - wrangler@4.120.0

overrides:
  esbuild: '>=0.28.1'
  undici: '8.10.0'
  '@hono/node-server': '2.1.0'
  # Dependabot GHSA (CVE loop-on-size-0): earliest fix 3.3.18; keep nanoid@5 untouched.
  'nanoid@^3': '3.3.18'
  # GHSA-r28c-9q8g-f849: postcss <=8.5.17 vulnerable; pin transitive via next/sentry.
  'postcss': '>=8.5.18'
