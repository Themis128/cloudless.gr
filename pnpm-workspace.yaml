# pnpm workspace configuration
# Only include actual workspace packages to minimize resolution scope
packages:
  - "workers/*"

# Allow native builds only for packages that require compilation
# These match the onlyBuiltDependencies in package.json
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Disable unnecessary native builds for faster installs
sharp: false
unrs-resolver: false

# Exempt packages from minimumReleaseAge policy (allow newer releases during rebase)
# These are required for security update PRs
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.20'
  - '@ai-sdk/provider-utils@5.0.10'
  - '@cloudflare/workers-types@5.20260714.1'
  - 'ai@7.0.28'
  - 'next@16.2.10'
  - '@next/bundle-analyzer@16.2.10'
  - 'eslint-config-next@16.2.10'
  - 'vitest@4.1.10'
  - '@vitest/coverage-v8@4.1.10'
  # AWS SDK packages for PR #1296
  - '@aws-sdk/checksums@3.1000.17'
  - '@aws-sdk/client-athena@3.1087.0'
  - '@aws-sdk/client-bedrock-runtime@3.1087.0'
