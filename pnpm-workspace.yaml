# pnpm workspace configuration
# Only include actual workspace packages to minimize resolution scope
packages:
  - "workers/*"

# Allow native builds only for packages that require compilation
# These match the onlyBuiltDependencies in package.json
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Disable unnecessary native builds for faster installs
sharp: false
unrs-resolver: false

# Exempt packages from minimumReleaseAge policy (allow newer releases during rebase)
# These are required for security update PRs
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.20'
  - '@ai-sdk/provider-utils@5.0.10'
  - '@cloudflare/workers-types@5.20260714.1'
  - 'ai@7.0.28'
  - next@16.2.10 || 16.3.0-canary.89
  - '@next/bundle-analyzer@16.2.10'
  - 'eslint-config-next@16.2.10'
  - 'vitest@4.1.10'
  - '@vitest/coverage-v8@4.1.10'
  - 'typescript@7.0.2'
  # @aws-sdk/* entries exempted: repo no longer uses AWS; these recently-published
  # versions trip the minimumReleaseAge gate and block all CI installs.
  - '@aws-sdk/checksums@3.1000.17'
  - '@aws-sdk/client-athena@3.1087.0'
  - '@aws-sdk/client-bedrock-runtime@3.1087.0'
  - '@aws-sdk/client-cognito-identity-provider@3.1087.0'
  - '@aws-sdk/client-cost-explorer@3.1087.0'
  - '@aws-sdk/client-dynamodb@3.1087.0'
  - '@aws-sdk/client-iam@3.1087.0'
  - '@aws-sdk/client-s3@3.1087.0'
  - '@aws-sdk/client-sesv2@3.1087.0'
  - '@aws-sdk/client-sns@3.1087.0'
  - '@aws-sdk/client-ssm@3.1087.0'
  - '@aws-sdk/core@3.975.2'
  - '@aws-sdk/credential-provider-env@3.972.58'
  - '@aws-sdk/credential-provider-http@3.972.60'
  - '@aws-sdk/credential-provider-ini@3.973.2'
  - '@aws-sdk/credential-provider-login@3.972.64'
  - '@aws-sdk/credential-provider-node@3.972.68'
  - '@aws-sdk/credential-provider-process@3.972.58'
  - '@aws-sdk/credential-provider-sso@3.973.2'
  - '@aws-sdk/credential-provider-web-identity@3.972.64'
  # Transitive @aws-sdk sub-packages that also trip the gate
  - '@aws-sdk/dynamodb-codec@3.973.32'
  - '@aws-sdk/eventstream-handler-node@3.972.27'
  - '@aws-sdk/middleware-endpoint-discovery@3.972.24'
  - '@aws-sdk/middleware-eventstream@3.972.23'
  - '@aws-sdk/middleware-sdk-s3@3.972.63'
  - '@aws-sdk/middleware-websocket@3.972.40'
  - '@aws-sdk/nested-clients@3.997.32'
  - '@aws-sdk/signature-v4-multi-region@3.996.40'
  - '@aws-sdk/token-providers@3.1087.0'
  - '@aws-sdk/types@3.974.1'
  - '@aws-sdk/xml-builder@3.972.35'
  # openai recently published; exempt until it ages past the window
  - 'openai@6.47.0'
  - '@next/env@16.3.0-canary.89'
  - '@next/swc-darwin-arm64@16.3.0-canary.89'
  - '@next/swc-darwin-x64@16.3.0-canary.89'
  - '@next/swc-linux-arm64-gnu@16.3.0-canary.89'
  - '@next/swc-linux-arm64-musl@16.3.0-canary.89'
  - '@next/swc-linux-x64-gnu@16.3.0-canary.89'
  - '@next/swc-linux-x64-musl@16.3.0-canary.89'
  - '@next/swc-win32-arm64-msvc@16.3.0-canary.89'
  - '@next/swc-win32-x64-msvc@16.3.0-canary.89'
  - miniflare@4.20260722.0
  - wrangler@4.114.0
