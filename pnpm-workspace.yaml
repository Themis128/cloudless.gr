# pnpm workspace configuration
# Only include actual workspace packages to minimize resolution scope
packages:
  - "workers/*"

# Allow native builds only for packages that require compilation
# These match the onlyBuiltDependencies in package.json
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Disable unnecessary native builds for faster installs
sharp: false
unrs-resolver: false

# Note: overrides are now defined in .npmrc for pnpm v10+ compatibility
# See: https://pnpm.io/settings#overrides
