name = "cloudless-failover"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# ── Route ──────────────────────────────────────────────────────────────────────
# NOTE: Routes removed — the CF LB (cloudflare-lb.yml) handles failover via:
#   - AWS CloudFront: d3k7muo3c6lw6s.cloudfront.net (primary)
#   - Pi via Tunnel: pi-origin.cloudless.gr (standby)
#
# To deploy this Worker instead of using the CF LB, uncomment the routes below.
# Then run: cd workers/cloudless-failover && npx wrangler deploy
#
# routes = [
#   { pattern = "cloudless.gr/*", zone_name = "cloudless.gr" },
#   { pattern = "www.cloudless.gr/*", zone_name = "cloudless.gr" }
# ]

[vars]
# AWS CloudFront distribution — the fallback origin
AWS_FALLBACK_HOST = "d3k7muo3c6lw6s.cloudfront.net"
# Pi origin (served via Cloudflare Tunnel, not directly exposed)
PI_ORIGIN_HOST = "pi-origin.cloudless.gr"
# Timeout for Pi origin requests (milliseconds)
PI_TIMEOUT_MS = "10000"