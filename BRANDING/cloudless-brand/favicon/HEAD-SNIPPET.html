<!--
  Drop into Next.js src/app/layout.tsx <head>.
  Minimal modern favicon kit. Theme color matches cloudless.gr's live PWA color.
-->

<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><!-- 180x180 -->
<link rel="manifest" href="/site.webmanifest">

<!-- Theme color — split so OS picks the right one per system color scheme -->
<meta name="theme-color" content="#0a7785" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
