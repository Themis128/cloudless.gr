<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="hz:canvas-width" content="1500">
<meta name="hz:canvas-height" content="500">
<title>Cloudless · X header</title>
<style>
  :root{--bg-0:#0a0a0f;--bg-1:#12121a;--bg-2:#1a1a2e;--cyan:#00fff5;--cyan-dim:#0ad4ff;--ink-60:rgba(255,255,255,.6)}
  html,body{margin:0;background:#15151c;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;color:#fff;padding:24px}
  .banner{width:1500px;height:500px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,var(--bg-0) 0%,var(--bg-1) 50%,var(--bg-2) 100%);
    border-radius:18px;padding:80px 96px;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:center;gap:24px;
    box-shadow:0 24px 64px rgba(0,0,0,.5)}
  .grid{position:absolute;inset:0;background-image:
    linear-gradient(90deg,rgba(0,255,245,.04) 1px,transparent 1px),
    linear-gradient(rgba(0,255,245,.04) 1px,transparent 1px);background-size:72px 72px}
  .glow{position:absolute;top:-160px;right:-160px;width:560px;height:560px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,255,245,.20),rgba(0,255,245,0));filter:blur(60px)}
  .stripe{position:absolute;left:0;bottom:0;width:100%;height:6px;
    background:linear-gradient(90deg,var(--cyan) 0%,var(--cyan-dim) 50%,transparent 100%)}
  .row{position:relative;display:flex;align-items:center;gap:28px}
  .mark{width:96px;height:96px;border-radius:20px;background:linear-gradient(135deg,var(--cyan),var(--cyan-dim));
    display:flex;align-items:center;justify-content:center;color:#0a0a0f;font-weight:900;font-size:56px}
  .word{font-size:108px;font-weight:800;letter-spacing:-3.5px;line-height:1}
  .word em{font-style:normal;color:var(--cyan)}
  .tag{position:relative;font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;
    font-size:24px;color:var(--cyan);letter-spacing:.28em;text-transform:uppercase}
  .sub{position:relative;font-size:28px;color:var(--ink-60);max-width:1100px}
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="row">
    <div class="mark">C</div>
    <div class="word">Cloud<em>less</em></div>
  </div>
  <div class="tag">CLOUD · SERVERLESS · FINOPS</div>
  <div class="sub">We cut AWS bills 30–80% and keep them down.</div>
  <div class="stripe"></div>
</div>
</body>
</html>
