<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="hz:canvas-width" content="1080">
<meta name="hz:canvas-height" content="1920">
<title>Cloudless · Story/Reel 9:16</title>
<style>
  :root{--bg-0:#0a0a0f;--bg-1:#12121a;--bg-2:#1a1a2e;--cyan:#00fff5;--cyan-dim:#0ad4ff;--ink-60:rgba(255,255,255,.65)}
  html,body{margin:0;background:#15151c;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;color:#fff;padding:24px}
  .card{width:1080px;height:1920px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--bg-0) 0%,var(--bg-1) 55%,var(--bg-2) 100%);
    border-radius:24px;padding:120px 88px;box-sizing:border-box;
    display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 64px rgba(0,0,0,.5)}
  .grid{position:absolute;inset:0;background-image:
    linear-gradient(90deg,rgba(0,255,245,.05) 1px,transparent 1px),
    linear-gradient(rgba(0,255,245,.05) 1px,transparent 1px);background-size:72px 72px}
  .glow-t{position:absolute;top:-220px;right:-180px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,255,245,.20),rgba(0,255,245,0));filter:blur(70px)}
  .glow-b{position:absolute;bottom:-260px;left:-200px;width:820px;height:820px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(10,212,255,.14),rgba(10,212,255,0));filter:blur(70px)}
  .top{position:relative;display:flex;flex-direction:column;gap:32px;align-items:flex-start}
  .category{display:flex;align-items:center;gap:14px;font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;
    font-size:26px;color:var(--cyan);letter-spacing:.22em;text-transform:uppercase}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px var(--cyan)}
  .brand{display:flex;align-items:center;gap:18px;font-weight:800;font-size:32px;letter-spacing:-.7px}
  .brand .mark{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--cyan-dim));
    display:flex;align-items:center;justify-content:center;color:#0a0a0f;font-weight:900;font-size:32px}
  .brand .less{color:var(--cyan)}
  .title{position:relative;font-size:120px;line-height:1.02;font-weight:800;letter-spacing:-3.5px;text-wrap:balance}
  .title em{font-style:normal;color:var(--cyan)}
  .bottom{position:relative;display:flex;flex-direction:column;gap:24px;color:var(--ink-60)}
  .cta{display:inline-block;padding:28px 44px;border-radius:18px;background:var(--cyan);color:#0a0a0f;font-weight:800;font-size:36px;letter-spacing:-.5px;align-self:flex-start}
  .url{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:28px;color:var(--cyan);letter-spacing:.05em}
  .stripe{position:absolute;left:0;bottom:0;width:100%;height:10px;
    background:linear-gradient(90deg,var(--cyan) 0%,var(--cyan-dim) 50%,transparent 100%)}
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow-t"></div>
  <div class="glow-b"></div>
  <div class="top">
    <div class="brand"><div class="mark">C</div><span>Cloud<span class="less">less</span></span></div>
    <div class="category"><span class="dot"></span>FinOps</div>
  </div>
  <div class="title">5 AWS cost <em>mistakes</em><br/>that kill your<br/>cloud bill.</div>
  <div class="bottom">
    <div class="cta">Read the breakdown →</div>
    <div class="url">cloudless.gr/blog</div>
  </div>
  <div class="stripe"></div>
</div>
</body>
</html>
