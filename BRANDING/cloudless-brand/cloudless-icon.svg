<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Cloudless">
  <title>Cloudless icon</title>
  <defs>
    <linearGradient id="cl-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00fff5"/>
      <stop offset="1" stop-color="#0ad4ff"/>
    </linearGradient>
    <radialGradient id="cl-glow" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00fff5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00fff5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background plate (transparent default; remove if you want square plate) -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0a0a0f"/>

  <!-- Glow halo -->
  <circle cx="32" cy="32" r="28" fill="url(#cl-glow)"/>

  <!-- Cyan grid (very subtle) -->
  <g stroke="#00fff5" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="16" x2="64" y2="16"/>
    <line x1="0" y1="32" x2="64" y2="32"/>
    <line x1="0" y1="48" x2="64" y2="48"/>
    <line x1="16" y1="0" x2="16" y2="64"/>
    <line x1="32" y1="0" x2="32" y2="64"/>
    <line x1="48" y1="0" x2="48" y2="64"/>
  </g>

  <!-- Negative-space cloud cut from a rounded square: the "Cloudless" idea is the absence -->
  <mask id="cl-cut" maskUnits="userSpaceOnUse">
    <rect width="64" height="64" fill="white"/>
    <!-- Cloud shape carved out -->
    <path d="M20 38c-3.6 0-6.5-2.9-6.5-6.5S16.4 25 20 25c.4 0 .8.03 1.2.1A8.5 8.5 0 0 1 38 27.1a6 6 0 0 1 2 11.7H20Z" fill="black"/>
  </mask>

  <!-- Cyan mark with cloud cut-out -->
  <rect x="12" y="14" width="40" height="36" rx="8" ry="8" fill="url(#cl-grad)" mask="url(#cl-cut)"/>

  <!-- Diagonal "less" slash through the cloud -->
  <line x1="14" y1="50" x2="50" y2="14" stroke="#00fff5" stroke-width="2.5" stroke-linecap="round"/>
</svg>
