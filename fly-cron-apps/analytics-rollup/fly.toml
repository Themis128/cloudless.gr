# Fly.io Cron App: Analytics Rollup
# Replaces AWS Lambda: CronAnalyticsRollup
# Schedules via Fly.io Machines API (hourly)

app = "cloudless-cron-analytics"
primary_region = "fra"

[build]
  context = "."
  dockerfile = "Dockerfile"

[env]
  CRON_ROUTE = "/api/cron/analytics-rollup"
  SITE_URL = "https://cloudless.gr"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[experimental]
  cmd = ["node", "cron-runner.js"]